function evtToSvg(ev){
  var svg = planSvgEl(); if (!svg) return null;
  /* SVG preserveAspectRatio="xMidYMid meet" ile ortalanıp kenarlarda boşluk bırakıyor;
     doğru dönüşüm için tarayıcının kendi matrisi kullanılır. */
  try {
    var ctm = svg.getScreenCTM();
    if (ctm){
      var inv = ctm.inverse();
      var x = ev.clientX * inv.a + ev.clientY * inv.c + inv.e;
      var y = ev.clientX * inv.b + ev.clientY * inv.d + inv.f;
      if (isFinite(x) && isFinite(y)) return { x:x, y:y };
    }
  } catch(e){}
  /* yedek: en-boy oranını elle çöz */
  var r = svg.getBoundingClientRect();
  var vb = svg.viewBox.baseVal;
  if (!r.width || !r.height || !vb.width || !vb.height) return null;
  var sc = Math.min(r.width/vb.width, r.height/vb.height);
  var ox = r.left + (r.width  - vb.width*sc)/2;
  var oy = r.top  + (r.height - vb.height*sc)/2;
  return { x:(ev.clientX - ox)/sc, y:(ev.clientY - oy)/sc };
}
function redrawPlan(){
  var box = document.getElementById("planbox");
  if (box) box.innerHTML = planSvg(DERIVED || derive());
}
document.addEventListener("mousedown", function(ev){
  if (UI.view !== "ciz" || ev.button !== 0 || CMD) return;
  var inBox = ev.target.closest && ev.target.closest("#planbox");
  if (!inBox) return;
  var h = ev.target.closest("[data-drag]");
  var pt = evtToSvg(ev); if (!pt) return;
  var m = pxToM(pt.x, pt.y);

  if (!h || UI.lineMode){
    if (UI.lineMode){
      var from0 = LPATH ? LPATH.pts[LPATH.pts.length-1] : null;
      var sp0 = osnap(m.x, m.y, ev.shiftKey, null, from0);
      if (from0 && !isObjSnap(sp0.type)){
        var cc = constrainDir(from0, m.x, m.y, ev.shiftKey);
        sp0.x = cc.x; sp0.y = cc.y;
        if (!UI.ortho && !UI.polar){
          sp0.x = Math.round(sp0.x/UI.raster)*UI.raster;
          sp0.y = Math.round(sp0.y/UI.raster)*UI.raster;
        }
        sp0.type = null; SNAPG = [];
      }
      if (!LPATH) lineStart(sp0); else lineAddPoint(sp0);
      render(); ev.preventDefault(); return;
    }
    /* boşlukta: seçim dikdörtgeni */
    if (!ev.shiftKey) selClear();
    MARQ = { x1:pt.x, y1:pt.y, x2:pt.x, y2:pt.y, add:ev.shiftKey };
    render(); ev.preventDefault(); return;
  }

  var id = h.getAttribute("data-id"), mode = h.getAttribute("data-drag");

  if (ev.shiftKey && (mode === "move" || mode === "axis")){
    selToggle(id); render(); ev.preventDefault(); return;
  }
  if (!selHas(id)) selSet1(id);

  if (mode === "axis"){
    var ap = axisParts(id);
    DDRAG = { mode:"axis", axis:ap, id:id,
              startPos: axisPos(ap.dir)[ap.i],
              m0:{ x:m.x, y:m.y }, moved:false };
    render(); ev.preventDefault(); return;
  }

  var e = elById(id); if (!e) return;
  var G = gridM();
  /* çoklu taşıma: seçilen her şeyin başlangıcını sakla */
  if (mode === "move" && selList().length > 1){
    var grp = [], axs = [];
    selList().forEach(function(sid){
      if (isAxisId(sid)){
        var a2 = axisParts(sid);
        axs.push({ dir:a2.dir, i:a2.i, pos:axisPos(a2.dir)[a2.i] });
        return;
      }
      var ee = elById(sid); if (!ee) return;
      var ff = freeze(ee.list, ee.row, G); if (!ff) return;
      grp.push({ row:ee.row, start:JSON.parse(JSON.stringify(ff)) });
    });
    DDRAG = { mode:"group", group:grp, axes:axs, m0:{ x:m.x, y:m.y }, moved:false };
    render(); ev.preventDefault(); return;
  }

  if (!freeze(e.list, e.row, G)) return;
  DDRAG = { id:id, mode:mode, list:e.list, row:e.row,

/* klavye: ok tuşları, Delete, Esc */
document.addEventListener("keydown", function(ev){
  var tgL = (ev.target.tagName||"").toLowerCase();

      if (ev.key === "m" || ev.key === "M"){ cmdStart("move");   ev.preventDefault(); return; }
      if (ev.key === "c" || ev.key === "C"){ cmdStart("copy");   ev.preventDefault(); return; }
      if (ev.key === "r" || ev.key === "R"){ rotateQuick(ev.shiftKey ? -90 : 90); ev.preventDefault(); return; }
    }
  }
  if (CMD && !inInput) return;

  if (UI.view === "ciz" && UI.lineMode && !inInput){
    if (ev.key === "Escape"){ lineEnd(); UI.lineMode = false; render(); ev.preventDefault(); return; }
    if (ev.key === "Enter"){ lineEnd(); ev.preventDefault(); return; }
    if (ev.key === "Backspace"){ lineUndo(); ev.preventDefault(); return; }
    if (ev.key === "c" || ev.key === "C"){ lineClose(); ev.preventDefault(); return; }
  }
  if (!inInput){
    if (ev.key === "F8"){ UI.ortho = !UI.ortho; if (UI.ortho) UI.polar = false;
      flash(UI.ortho ? "ORTHO açık" : "ORTHO kapalı"); render(); ev.preventDefault(); return; }
    if (ev.key === "F10"){ UI.polar = !UI.polar; if (UI.polar) UI.ortho = false;
      flash(UI.polar ? "Kutupsal izleme açık · "+(UI.polarStep||15)+"°" : "Kutupsal izleme kapalı"); render(); ev.preventDefault(); return; }
    if (ev.key === "F3"){ ensureSnapUI(); UI.osnapOn = !UI.osnapOn;
      flash(UI.osnapOn ? "Nesne kenetleme açık" : "Nesne kenetleme kapalı"); render(); ev.preventDefault(); return; }
    if ((ev.key === "l" || ev.key === "L") && UI.view === "ciz" && !ev.ctrlKey && !ev.metaKey){
      UI.lineMode = !UI.lineMode; if (!UI.lineMode) lineEnd(); else selClear();
      render(); ev.preventDefault(); return; }
  }
  var tg0 = (ev.target.tagName||"").toLowerCase();
  if (tg0 === "input" || tg0 === "select" || tg0 === "textarea") { /* yazarken kısayol yok */ }
  else if ((ev.key === "r" || ev.key === "R") && !ev.ctrlKey && !ev.metaKey){
    var ids = selList().filter(function(x){ return !isAxisId(x); });
    var nrot = 0;
    ids.forEach(function(sid){
      var ee = elById(sid);
      if (ee && ee.list === "furniture"){ rotateFurn(ee.row); nrot++; }
    });
    if (nrot){ snap("Döndürüldü: "+nrot+" parça"); render(); ev.preventDefault(); return; }
  }
  else if (ev.key === "Escape" && UI.furnSel){ UI.furnSel = null; render(); return; }
  else if ((ev.key === "Delete" || ev.key === "Backspace") && UI.view === "mimari" && UI.tool === "mobilya"){
    var idsD = selList().filter(function(x){ return !isAxisId(x); });
    var nd = 0;
    idsD.forEach(function(sid){
      for (var i=P.furniture.length-1;i>=0;i--) if (P.furniture[i].id === sid){ P.furniture.splice(i,1); nd++; }
    });
    if (nd){ UI.selSet = []; UI.sel = null; snap("Silindi: "+nd+" parça"); render(); ev.preventDefault(); return; }
  }
  if (UI.view !== "ciz") return;
  var tag = (ev.target.tagName||"").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (ev.key === "Escape"){ selClear(); render(); return; }
  if ((ev.key === "a" || ev.key === "A") && (ev.ctrlKey || ev.metaKey)){
    UI.selSet = [];
    if (LASTG) for (var id0 in LASTG.items) if (drawLayerOn(LASTG.items[id0].list)) UI.selSet.push(id0);
    UI.sel = null; snap("Tümü seçildi"); render(); ev.preventDefault(); return;
  }
  if (!selList().length) return;
  if (ev.key === "Delete" || ev.key === "Backspace"){
    var n = deleteSelection(); snap("Silindi: "+n+" öğe"); render(); ev.preventDefault(); return;
  }
  if ((ev.key === "d" || ev.key === "D") && (ev.ctrlKey || ev.metaKey)){
    var nc = copySelection(UI.raster*10, UI.raster*10);
    snap("Kopyalandı: "+nc+" öğe"); render(); ev.preventDefault(); return;
  }
  var dx = 0, dy = 0, st2 = UI.raster * (ev.shiftKey ? 10 : 1);
  if (ev.key === "ArrowLeft") dx = -st2;
  else if (ev.key === "ArrowRight") dx = st2;
  else if (ev.key === "ArrowUp") dy = -st2;
  else if (ev.key === "ArrowDown") dy = st2;
  else return;
  var nm2 = moveSelection(dx, dy);
  snap("Kaydırıldı: "+nm2+" öğe"); render(); ev.preventDefault();
});

/* ============================================================
   KOMUT FARESİ + SAĞ TIK  — plan üstünde her sekmede geçerli
   ============================================================ */
function hitElId(ev){
  if (!ev.target.closest) return null;
  /* Çiz sekmesinde tutamaklar zaten kesin — doğrudan onları kullan */
  var hd = ev.target.closest("[data-drag],[data-mdrag]");
  if (hd) return hd.getAttribute("data-id");
  /* diğer sekmelerde üst üste binen şeffaf katmanlar yanlış elemanı döndürebiliyor:
     mesafe hesabı imlecin gerçekten neyin üstünde olduğunu söyler */
  var pt = evtToSvg(ev);
  if (pt && LASTG){
    var pk = pickAt(pt.x, pt.y);
    if (pk) return pk;
  }
  var h = ev.target.closest("[data-el]");
  if (h) return h.getAttribute("data-el");
  return null;
}
/* etkin aracın elemanı önce gelsin; küçük elemanlar büyüklerin önünde */
var PICKPRIO = { columns:1, doors:1, windows:1, furniture:2, openings:2, stairs:2,
                 shearwalls:2, beams:3, walls:3, lines:3, balconies:4, foundations:5, slabs:6 };
var TOOLLIST = { duvar:"walls", kapi:"doors", pencere:"windows", dosemeler:"slabs",
                 yirtik:"openings", merdiven:"stairs", balkon:"balconies", mobilya:"furniture",
                 kolon:"columns", kiris:"beams", perde:"shearwalls", temel:"foundations",
                 parapet:"parapets" };
function pickPrio(list){
  var cur = TOOLLIST[curTool()];
  if (cur && list === cur) return 0;
  return PICKPRIO[list] || 4;
}
/* piksel koordinatında en yakın elemanı bul (12 px tolerans) */
function pickAt(px, py){
  if (!LASTG) return null;
  var it = LASTG.items, best = null, bd = 1e9;
  for (var id in it){
    var e = it[id]; if (!e) continue;
    if (UI.view === "ciz" && !drawLayerOn(e.list)) continue;
    var g = e.g, dd = null;
    if (e.k === "ln"){
      var vx = g.x2-g.x1, vy = g.y2-g.y1, L2 = vx*vx+vy*vy;
      var t = L2 > 0 ? Math.max(0, Math.min(1, ((px-g.x1)*vx + (py-g.y1)*vy)/L2)) : 0;
      dd = Math.sqrt(Math.pow(px-(g.x1+vx*t),2) + Math.pow(py-(g.y1+vy*t),2));
    } else if (e.k === "rc"){
      var dx = Math.max(g.x-px, 0, px-(g.x+g.w));
      var dy = Math.max(g.y-py, 0, py-(g.y+g.h));
      dd = Math.sqrt(dx*dx+dy*dy);
      if (dd === 0) dd = 11.5;          /* içeriden seçim — çizgiler önce gelsin */
    } else {
      var cx = (g.x !== undefined ? g.x : g.x1), cy = (g.y !== undefined ? g.y : g.y1);
      dd = Math.sqrt(Math.pow(px-cx,2) + Math.pow(py-cy,2));
    }
    if (dd === null || dd > 12) continue;
    var sc = dd + pickPrio(e.list) * 2.5;
    if (sc < bd){ bd = sc; best = id; }
  }
  return best;
}
/* komut noktası: nesne kenetleme + ORTHO/kutupsal kısıt */
function cmdPoint(ev){
  var pt = evtToSvg(ev); if (!pt || !LASTG) return null;
  var m = pxToM(pt.x, pt.y);
  var from = (CMD && CMD.step === 1) ? CMD.base : null;
  var sp = osnap(m.x, m.y, ev.shiftKey, null, from);
  if (from && !isObjSnap(sp.type)){
    var cc = constrainDir(from, m.x, m.y, ev.shiftKey);
    sp.x = cc.x; sp.y = cc.y;
    if (!UI.ortho && !UI.polar){
      sp.x = Math.round(sp.x/UI.raster)*UI.raster;
      sp.y = Math.round(sp.y/UI.raster)*UI.raster;
    }
    sp.type = null; SNAPG = [];
  }
  return sp;
}
document.addEventListener("mousedown", function(ev){
  if (!CMD || ev.button !== 0) return;
  if (!ev.target.closest || !ev.target.closest("#planbox")) return;
  var sp = cmdPoint(ev); if (!sp) return;
  ev.preventDefault(); ev.stopPropagation();
  if (CMD.step === 0){ CMD.base = { x:sp.x, y:sp.y }; CMD.cur = { x:sp.x, y:sp.y }; CMD.step = 1; render(); return; }
  cmdFinish({ x:sp.x, y:sp.y });
}, true);

/* ---- 3D fare: sürükle (döndür/kaydır), tekerlek (zoom) ---- */
function box3(){ return document.getElementById("view3d"); }
function redraw3D(){ var b = box3(); if (b) b.innerHTML = render3D(derive()); }
function sync3D(){
  var V = UI.v3d, b = box3(); if (!b) return;
  [["az",V.az.toFixed(0)+"°"],["el",V.el.toFixed(0)+"°"],["zoom",fmt(V.zoom,2)+"×"]].forEach(function(p){
    var el = document.querySelector('[data-v3="'+p[0]+'"]');

var DRAG = null;
document.addEventListener("mousedown", function(ev){
  var b = box3();
  if (!b || !b.contains(ev.target) || ev.button === 2) return;
  var wantPan = (UI.v3d.mode === "pan");
  if (ev.shiftKey || ev.button === 1) wantPan = !wantPan;
  DRAG = { x:ev.clientX, y:ev.clientY, pan:wantPan,
           az:UI.v3d.az, el:UI.v3d.el, px:UI.v3d.px, py:UI.v3d.py,
           k: 980 / Math.max(1, b.clientWidth) };
  b.classList.add("dragging");
  ev.preventDefault();
});
document.addEventListener("mousemove", function(ev){
  if (!DRAG) return;
  var dx = ev.clientX - DRAG.x, dy = ev.clientY - DRAG.y;
  if (DRAG.pan){
    UI.v3d.px = DRAG.px + dx * DRAG.k;
    UI.v3d.py = DRAG.py + dy * DRAG.k;
  } else {
    var a = (DRAG.az + dx * 0.45) % 360; if (a < 0) a += 360;
    UI.v3d.az = a;
    UI.v3d.el = Math.max(2, Math.min(88, DRAG.el + dy * 0.30));

document.addEventListener("mouseup", function(){

document.addEventListener("wheel", function(ev){
  var b = box3();
  if (!b || !b.contains(ev.target)) return;
  ev.preventDefault();
  var r = b.getBoundingClientRect();
  var k = 980 / Math.max(1, b.clientWidth);
  var vx = (ev.clientX - r.left) * k, vy = (ev.clientY - r.top) * k;
  var f = Math.exp(-ev.deltaY * 0.0014);
  var nz = Math.max(0.15, Math.min(6, UI.v3d.zoom * f));
  f = nz / UI.v3d.zoom;
  UI.v3d.px = (vx - (vx - (490 + UI.v3d.px)) * f) - 490;
  UI.v3d.py = (vy - (vy - (400 + UI.v3d.py)) * f) - 400;
  UI.v3d.zoom = nz;
  redraw3D(); sync3D();
}, { passive:false });

  if (el.getAttribute("data-trenn")) {
    P.finishes.trennwand = Math.max(0, pnum(el.value, P.finishes.trennwand));
    snap("Trennwandzuschlag = "+fmt(P.finishes.trennwand,2)); render(); return;
  }
  if (el.getAttribute("data-laddsel")) {
    if (!el.value) return;
    var sfA = curSurf(); if (!sfA) return;
    var nl = mkLayer(el.value); sfA.layers.push(nl);
    UI.selLayer = nl.id; snap("Katman eklendi: "+nl.name); render(); return;
  }
  if ((a = el.getAttribute("data-lmat")) !== null && a !== null) {
    var sfM = curSurf(); var iM = parseInt(a,10);
    if (sfM && sfM.layers[iM]){
      var mm = matByName(el.value);
      if (mm){ var old = sfM.layers[iM];
        sfM.layers[iM] = { id:old.id, name:mm[0], type:mm[1], t:mm[2], lam:mm[3], rho:mm[4], price:mm[5] };
        snap("Malzeme: "+mm[0]); }
    }
    render(); return;
  }
  if ((a = el.getAttribute("data-lt")) !== null && a !== null) {
    var sfT = curSurf(); var iT = parseInt(a,10);
    if (sfT && sfT.layers[iT]){ sfT.layers[iT].t = Math.max(0.0001, pnum(el.value, sfT.layers[iT].t*1000)/1000);
      snap(sfT.layers[iT].name+" kalınlık = "+fmt(sfT.layers[iT].t*1000,1)+" mm"); }
    render(); return;
  }
  if ((a = el.getAttribute("data-llam")) !== null && a !== null) {
    var sfL = curSurf(); var iL = parseInt(a,10);
    if (sfL && sfL.layers[iL]){ sfL.layers[iL].lam = Math.max(0.001, pnum(el.value, sfL.layers[iL].lam)); snap("λ güncellendi"); }
    render(); return;
  }
  if ((a = el.getAttribute("data-lrho")) !== null && a !== null) {
    var sfR = curSurf(); var iR = parseInt(a,10);
    if (sfR && sfR.layers[iR]){ sfR.layers[iR].rho = Math.max(1, pnum(el.value, sfR.layers[iR].rho)); snap("ρ güncellendi"); }
    render(); return;
  }
  if ((a = el.getAttribute("data-lprice")) !== null && a !== null) {
    var sfP = curSurf(); var iP = parseInt(a,10);
    if (sfP && sfP.layers[iP]){ sfP.layers[iP].price = Math.max(0, pnum(el.value, sfP.layers[iP].price)); snap("Birim fiyat güncellendi"); }
    render(); return;
  }
  if ((a = el.getAttribute("data-dlayer"))) {
    if (!UI.drawFilter) UI.drawFilter = {};
    UI.drawFilter[a] = el.checked; render(); return;
  }
  if (el.getAttribute("data-axpos")) {
    var L2 = selList(); if (!L2.length || !isAxisId(L2[0])) return;
    var ap2 = axisParts(L2[0]);
    setAxisPos(ap2.dir, ap2.i, pnum(el.value, axisPos(ap2.dir)[ap2.i]));
    snap("Aks konumu güncellendi"); render(); return;
  }
  if ((a = el.getAttribute("data-free"))) {
    var L3 = selList(); var ef = (L3.length === 1 && !isAxisId(L3[0])) ? elById(L3[0]) : null; if (!ef) return;
    var ff = freeze(ef.list, ef.row, gridM()); if (!ff) return;
    ff[a] = pnum(el.value, ff[a]);
    if (a === "w" || a === "h") syncRect(ef.list, ef.row);
    snap(ef.row.name + " · " + a + " = " + fmt(ff[a], 3)); render(); return;
  }
  if ((a = el.getAttribute("data-des"))) {
    var fixu = el.getAttribute("data-fixu");
    var cur = P.design[a];
    if (fixu === "mm") P.design[a] = Math.max(.004, pnum(el.value, cur*1000)/1000);
    else P.design[a] = Math.max(.001, fromDisp(pnum(el.value, toDisp(cur,P.units.sec)), P.units.sec));
    snap("Kesit "+a+" güncellendi"); render(); return;
  }
  if ((a = el.getAttribute("data-tie"))) {
    var ti = parseInt(el.getAttribute("data-i"),10), tr = P.foundations[ti];
    if (tr){ tr[a] = Math.max(.05, pnum(el.value, (a==="b"?25:40))/100); snap(tr.name+" kesiti güncellendi"); render(); }
    return;
  }
  if (el.getAttribute("data-linelabels") !== null){ UI.lineLabels = el.checked; render(); return; }
  if (el.getAttribute("data-polarstep")){ UI.polarStep = parseFloat(el.value); UI.polar = true; render(); return; }
  if (el.getAttribute("data-weldtol")){ UI.weldTol = parseFloat(el.value); render(); return; }
  if ((a = el.getAttribute("data-linef"))) {
    var li2 = parseInt(el.getAttribute("data-i"),10), lr2 = P.lines[li2];
    if (lr2 && lr2.free){
      var v2 = pnum(el.value, 0);
      if (a === "len"){
        var dx2 = lr2.free.x2-lr2.free.x1, dy2 = lr2.free.y2-lr2.free.y1;
        var l0 = Math.sqrt(dx2*dx2+dy2*dy2) || 1;
        lr2.free.x2 = lr2.free.x1 + dx2/l0*Math.max(.01,v2);
        lr2.free.y2 = lr2.free.y1 + dy2/l0*Math.max(.01,v2);
      } else lr2.free[a] = v2;
      snap(lr2.name+" güncellendi"); render();
    }
    return;
  }
  if ((a = el.getAttribute("data-furnf"))) {
    var fi2 = parseInt(el.getAttribute("data-i"),10), rw = P.furniture[fi2];
    if (rw && rw.free){
      var vv = pnum(el.value, 0);
      if (a === "w"){ rw.free.w = Math.max(.05, vv/100); rw.w = rw.free.w; }
      else if (a === "h"){ rw.free.h = Math.max(.05, vv/100); rw.d = rw.free.h; }
      else if (a === "hh"){ rw.h = Math.max(.01, vv/100); }
      else if (a === "clr"){ rw.clr = Math.max(0, vv/100); }
      else if (a === "x"){ rw.free.x = vv; }
      else if (a === "y"){ rw.free.y = vv; }
      snap(rw.name+" güncellendi"); render();
    }
    return;
  }
  if (el.getAttribute("data-furnclear") !== null){ UI.furnClear = el.checked; render(); return; }
  if ((a = el.getAttribute("data-krng"))) {
    var kl = el.getAttribute("data-klist"), kii = parseInt(el.getAttribute("data-ki"),10);
    var krow = P[kl] && P[kl][kii];
    if (krow){
      var kvv = Math.max(0, Math.min(parseInt(el.value,10)||0, nKat()-1));
      if (a === "from"){ krow.from = kvv; if (stTo(krow) < kvv) krow.to = kvv; }
      else { krow.to = kvv; if (stFrom(krow) > kvv) krow.from = kvv; }
      snap(krow.name+" · katlar: "+stLabel(krow));
      render();
    }
    return;
  }
  if ((a = el.getAttribute("data-drain"))) {
    ensureDrain();
    var dt = el.getAttribute("data-dt");
    if (dt === "chk") P.drain[a] = el.checked;
    else if (dt === "sel") P.drain[a] = (a === "dn") ? parseInt(el.value,10) : el.value;
    else if (dt === "mm") P.drain[a] = Math.max(0, pnum(el.value, P.drain[a]*1000)/1000);
    else if (dt === "cm") P.drain[a] = Math.max(0, pnum(el.value, P.drain[a]*100)/100);
    else P.drain[a] = pnum(el.value, P.drain[a]);
    if (a === "seal"){
      var sdf = sealDef(P.drain.seal), rq = sdf[3][P.drain.wclass];
      if (rq !== undefined && P.drain.seal !== "wu") P.drain.sealT = Math.max(P.drain.sealT, rq/1000);
    }
    snap("Drenaj/yalıtım: "+a); render(); return;
  }
  if ((a = el.getAttribute("data-obj"))) {
    var k = el.getAttribute("data-k"), raw = el.getAttribute("data-raw")==="1";
    var old = P[a][k];
    P[a][k] = raw ? pnum(el.value, old) : Math.max(.01, fromDisp(pnum(el.value, toDisp(old,P.units.plan)), P.units.plan));
    snap(TYPES[P.type].short+" · "+k+" = "+fmt(P[a][k],2)); render(); return;
  }
  if ((a = el.getAttribute("data-schdur"))) {
    ensureSched();
    var vD = pnum(el.value, NaN);
    if (!P.schedule.over[a]) P.schedule.over[a] = {};
    if (isFinite(vD) && vD > 0) P.schedule.over[a].dur = Math.round(vD);
    else delete P.schedule.over[a].dur;
    snap("Süre · "+a+" = "+fmt(vD,0)+" gün"); render(); return;
  }
  if ((a = el.getAttribute("data-schcrew"))) {
    ensureSched();
    var vC2 = Math.max(1, Math.round(pnum(el.value, 1)));
    if (!P.schedule.over[a]) P.schedule.over[a] = {};
    P.schedule.over[a].crew = vC2;
    delete P.schedule.over[a].dur;
    snap("Ekip · "+a+" = "+vC2+" kişi"); render(); return;
  }
  if ((a = el.getAttribute("data-aufw"))) {
    ensureSched();
    P.schedule.aufw[a] = Math.max(0, pnum(el.value, AUFWDEF[a]));
    snap("Aufwandswert · "+a+" = "+fmt(P.schedule.aufw[a],3)); render(); return;
  }
  if ((a = el.getAttribute("data-schset"))) {
    ensureSched();
    var vS2 = pnum(el.value, pnum(P.schedule[a],1));
    P.schedule[a] = (a === "days") ? Math.max(1, Math.min(7, Math.round(vS2)))
                  : (a === "tga") ? Math.max(0, Math.min(1, vS2)) : Math.max(1, Math.min(24, vS2));
    snap("Takvim · "+a); render(); return;
  }
  if (el.getAttribute("data-schstart")) {
    ensureSched();
    if (el.value) P.schedule.start = el.value;
    snap("Başlangıç tarihi: "+P.schedule.start); render(); return;
  }
  if ((a = el.getAttribute("data-solv"))) {
    ensureSolver();
    P.solver[a] = !!el.checked; SOLVECACHE = null;
    snap("Çözücü · "+a+" = "+(el.checked?"açık":"kapalı")); render(); return;
  }
  if (el.getAttribute("data-solvbase")) {
    ensureSolver();
    P.solver.base = el.value; SOLVECACHE = null;
    snap("Kolon ayağı: "+(el.value==="einspann"?"ankastre":"mafsallı")); render(); return;
  }
  if ((a = el.getAttribute("data-ep"))) {
    ensureCost();
    var vEP = pnum(el.value, NaN);
    if (isFinite(vEP) && vEP >= 0) P.costs.prices[a] = vEP;
    snap("Birim fiyat · Poz. "+a+" = "+fmt(vEP,2)+" €"); render(); return;
  }
  if ((a = el.getAttribute("data-cost"))) {
    ensureCost();
    var vC = pnum(el.value, pnum(P.costs[a],0));
    if (a === "region") vC = Math.max(0.5, Math.min(2.0, vC));
    else if (a === "index") vC = Math.max(50, vC);
    else vC = Math.max(0, vC);
    P.costs[a] = vC; snap("Maliyet parametresi · "+a+" = "+fmt(vC,2)); render(); return;
  }
  if ((a = el.getAttribute("data-rebar"))) {
    ensureCost();
    P.costs.rebar[a] = Math.max(0, pnum(el.value, pnum(P.costs.rebar[a],100)));
    snap("Donatı oranı · "+a+" = "+fmt(P.costs.rebar[a],0)+" kg/m³"); render(); return;
  }
  if ((a = el.getAttribute("data-poson"))) {
    ensureCost();
    P.costs.off[a] = !el.checked;
    snap((el.checked ? "Pozisyon açıldı: " : "Pozisyon kapatıldı: ")+a); render(); return;
  }
  if ((a = el.getAttribute("data-list"))) {
    var li = parseInt(el.getAttribute("data-i"),10), key = el.getAttribute("data-k"), ty = el.getAttribute("data-type");
    var row = P[a][li]; if (!row) return;
    if (ty === "len"){
      var uu = P.units[el.getAttribute("data-u")];
      row[key] = Math.max(0, fromDisp(pnum(el.value, toDisp(row[key],uu)), uu));
    } else if (ty === "int"){
      row[key] = Math.max(0, Math.round(pnum(el.value, row[key])));
    } else if (ty === "num"){
      row[key] = pnum(el.value, row[key]);
    } else if (key === "braced"){
      row.braced = (el.value === "1");
    } else {
      row[key] = el.value;
    }
    snap((row.name||a)+" · "+key+" güncellendi"); render(); return;
  }
});

function addRow(listKey){
  var n = P[listKey].length + 1;
  var row;
  switch(listKey){
    case "walls":   row = mkWall("x", 0, 0, 0.24); break;
    case "columns": row = { id:uid("s"), name:"S-"+n, form:"rect", b:0.30, h:0.30, d:0.30, mat:P.design.beton, ax:0, ay:0, from:0, to:Math.max(0,P.storeys.length-1) }; break;
    case "beams":   row = { id:uid("b"), name:"B-"+n, b:0.30, h:0.50, dir:"x", line:0, seg:0, L:5.00, mat:P.design.beton, sys:"durchlauf" }; break;
    case "slabs":   row = { id:uid("p"), name:"D-"+n, t:0.20, kind:"zweiachsig", mat:P.design.beton, cx:0, cy:0 }; break;
    case "doors":   row = { id:uid("t"), name:"T-"+n, w:0.885, h:2.010, dir:"x", line:0, seg:0 }; break;
    case "windows": row = { id:uid("f"), name:"F-"+n, w:1.260, h:1.380, par:0.90, dir:"x", line:0, seg:0 }; break;
    case "openings": row = { id:uid("o"), name:"DB-"+n, cx:0, cy:0, ox:0.5, oy:0.5, w:1.20, l:1.00, kind:"schacht" }; break;
    case "stairs":  row = { id:uid("m"), name:"TR-"+n, type:UI.stairType||"gegenlaeufig", cx:0, cy:0, w:1.20, riser:0.175, tread:0.28, rot:0, mat:P.design.beton }; break;
    case "balconies": row = { id:uid("k"), name:"BK-"+n, dir:"x", line:0, seg:0, type:UI.balkType||"auskragend", depth:1.50, w:3.00, t:0.18, rail:1.00, mat:P.design.beton }; break;
    case "foundations": row = { id:uid("g"), name:"F-"+n, kind:UI.foundType||"einzel", ax:0, ay:0, a:1.50, b:1.50, d:0.50, t:P.soil.tGr, nPiles:4, pileD:0.40, pileL:8.00, mat:P.design.beton }; break;
    case "shearwalls": row = withSt({ id:uid("p"), name:"PD-"+n, dir:"x", line:0, seg:0, t:pnum(UI.perdeT,0.20), mat:P.design.beton, braced:true }); break;
    case "parapets": var pt = parTypeDef(UI.parKind||"attika");
      row = withSt({ id:uid("a"), name:"PR-"+n, dir:"x", line:0, seg:0, kind:pt[0], h:pt[3], t:pt[4], mat:P.design.beton }); break;
    default: return;
  }
  P[listKey].push(row);
  snap("Eklendi: "+row.name);
  render();
}

function action(a){
  if (a === "closeovl"){ UI.showVers = false; render(); return; }
  if (a === "clearhist"){
    if (!confirm("Tüm sürüm geçmişi silinsin mi? Geçerli proje korunur.")) return;
    HIST = []; HPOS = -1; snap("Geçmiş temizlendi"); render(); return;
  }
  if (a === "emptyproj"){
    if (!confirm("Tamamen boş bir proje açılsın mı?\n\nSadece 10 × 10 m aks ağı ve tek kat gelir; duvar, döşeme, kolon, kapı — hiçbiri olmaz. Geçerli model sürüm geçmişinde kalır.")) return;
    P = emptyProject();
    ensureFinishes(); ensureMat(); ensureDrain(); ensureFurn(); ensureLines(); ensureDoorKind(); ensureSeismic(); ensureKat();
    UI.view = "mimari"; UI.tool = "aks"; UI.kat = 0; UI.katMode = "tum";
    UI.selSet = []; UI.sel = null; UI.furnSel = null; UI.lineMode = false;
    snap("Boş proje"); render(); return;
  }
  if (a === "newproj"){
    if (!confirm("Yeni boş proje açılsın mı? Geçerli model sürüm geçmişinde kalır.")) return;
    P = defaultProject(P.type); ensureFinishes(); snap("Yeni proje"); render(); return;
  }
  if (a === "resetdim"){
    var f = defaultProject(P.type);
    P.grid = f.grid; P.walls = f.walls; P.storeys = f.storeys;
    P.doors = f.doors; P.windows = f.windows; P.slabs = f.slabs;
    P.columns = f.columns; P.beams = f.beams;
    P.openings = f.openings; P.stairs = f.stairs; P.foundations = f.foundations;
    P.balconies = f.balconies; P.roof = f.roof;
    snap("Ölçüler sıfırlandı"); render(); return;
  }
  if (a === "csvkosten"){
    var csv = costCSV();
    var cb = new Blob([csv], {type:"text/csv;charset=utf-8"});
    var cu = URL.createObjectURL(cb);
    var cl = document.createElement("a");
    var cn = (P.meta.name || "tragwerkplan").replace(/[^\wäöüÄÖÜß-]+/g,"_");
    cl.href = cu; cl.download = cn + "_Kostenschaetzung.csv";
    document.body.appendChild(cl); cl.click(); document.body.removeChild(cl);
    setTimeout(function(){ URL.revokeObjectURL(cu); }, 1000);
    flash("CSV indirildi — Excel'de noktalı virgül ayracıyla açılır");
    return;
  }
  if (a === "csvtermin"){
    var tcsv = terminCSV();
    var tb = new Blob([tcsv], {type:"text/csv;charset=utf-8"});
    var tu = URL.createObjectURL(tb);
    var ta = document.createElement("a");
    var tn = (P.meta.name || "tragwerkplan").replace(/[^\wäöüÄÖÜß-]+/g,"_");
    ta.href = tu; ta.download = tn + "_Bauzeitenplan.csv";
    document.body.appendChild(ta); ta.click(); document.body.removeChild(ta);
    setTimeout(function(){ URL.revokeObjectURL(tu); }, 1000);
    flash("Termin planı CSV indirildi");
    return;
  }
  if (a === "printtermin"){
    var pte = document.getElementById("printAll");
    if (pte){ pte.innerHTML = terminSheet(); window.print(); }
    return;
  }
  if (a === "resetsched"){
    ensureSched();
    if (!confirm("Elle girilen bütün süre ve ekip değerleri silinsin mi?")) return;
    P.schedule.over = {}; snap("Termin planı sıfırlandı"); render(); return;
  }
  if (a === "dxfplan"){   exportDxf("plan");   return; }
  if (a === "dxfkalip"){  exportDxf("kalip");  return; }
  if (a === "dxfkesit"){  exportDxf("kesit");  return; }
  if (a === "dxfdonati"){ exportDxf("donati"); return; }
  if (a === "printdonati"){
    var pde = document.getElementById("printAll");
    if (pde){ pde.innerHTML = donatiSheet(); window.print(); }
    return;
  }
  if (a === "csvstahl"){
    var scsv = stahlCSV();
    var sb = new Blob([scsv], {type:"text/csv;charset=utf-8"});
    var su = URL.createObjectURL(sb);
    var sl2 = document.createElement("a");
    var sn = (P.meta.name || "tragwerkplan").replace(/[^\wäöüÄÖÜß-]+/g,"_");
    sl2.href = su; sl2.download = sn + "_Stahlliste.csv";
    document.body.appendChild(sl2); sl2.click(); document.body.removeChild(sl2);
    setTimeout(function(){ URL.revokeObjectURL(su); }, 1000);
    flash("Çelik listesi CSV indirildi");
    return;
  }
  if (a === "printschal"){
    var pse = document.getElementById("printAll");
    if (pse){ pse.innerHTML = schalSheet(); window.print(); }
    return;
  }
  if (a === "printkosten"){
    var pe = document.getElementById("printAll");
    if (pe){ pe.innerHTML = costSheet(); window.print(); }
    return;
  }
  if (a === "resetprices"){
    ensureCost();
    if (!confirm("Elle girdiğin bütün birim fiyatlar silinip katalog değerlerine dönülsün mü?")) return;
    P.costs.prices = {}; snap("Birim fiyatlar katalogdan geri yüklendi"); render(); return;
  }
  if (a === "export"){
    var blob = new Blob([JSON.stringify({ project:P, history:HIST }, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    var nm = (P.meta.name || "tragwerkplan").replace(/[^\wäöüÄÖÜß-]+/g,"_");
    link.href = url; link.download = nm + "_v" + (HPOS+1) + ".json";
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    return;
  }
  if (a === "import"){
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = function(){
      var file = inp.files && inp.files[0]; if (!file) return;
      var rd = new FileReader();
      rd.onload = function(){
        try {
          var o = JSON.parse(rd.result);
          if (o.project){ P = o.project; if (o.history && o.history.length){ HIST = o.history; HPOS = HIST.length-1; } }
          else { P = o; }
          snap("JSON içe aktarıldı: "+file.name);
          render();
        } catch(e){ alert("Dosya okunamadı: " + e.message); }
      };
      rd.readAsText(file);
    };
    inp.click();
    return;
  }
  if (a === "print"){ buildPrintAll(); setTimeout(function(){ window.print(); }, 60); return; }
  if (a === "copyerr"){
    var ta = document.getElementById("errtxt");
    if (ta){ ta.select(); try { document.execCommand("copy"); flash("Rapor panoya kopyalandı"); }
             catch(e){ flash("Kopyalanamadı — metni elle seçip kopyala"); } }
    return;
  }
  if (a === "undolast"){
    if (HPOS > 0){ restore(HPOS-1); flash("Son değişiklik geri alındı"); }
    else flash("Geri alınacak değişiklik yok");
    return;
  }
  if (a === "hardreset"){
    if (!confirm("Tarayıcıdaki kayıt ve tüm sürüm geçmişi silinsin mi? Bu geri alınamaz.")) return;
    try { localStorage.removeItem(LSKEY); } catch(e){}
    HIST = []; HPOS = -1;
    P = defaultProject("wohn");
    UI.view = "proje"; UI.tool = "aks"; UI.stool = "kolon"; UI.rpos = "0"; UI.kat = 0; UI.katMode = "tum";
    ensureFinishes(); ensureMat(); ensureDrain(); ensureFurn(); ensureLines(); ensureDoorKind(); ensureSeismic(); ensureKat();
    snap("Sıfırlandı"); render(); return;
  }
  if (a === "selftest"){
    var mm = document.getElementById("main");
    if (mm) mm.innerHTML = selfTestHTML();
    return;
  }
}

/* ============================================================
   BAŞLAT
   ============================================================ */
if (!loadLocal()){
  P.meta.name = "";
}
ensureFinishes();
if (!HIST.length) snap("Başlangıç");
render();
</script>
</body>
</html>

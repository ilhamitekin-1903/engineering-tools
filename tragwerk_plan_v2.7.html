<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRAGWERK/PLAN v2.7</title>
<style>
:root{
  --bg:#0B1522; --panel:#0E1A2B; --panel2:#111F31; --line:#1E3348; --line2:#23506B;
  --tx:#E2E8F0; --tx2:#8CA3BC; --tx3:#6E8BA6; --tx4:#5E7C96;
  --cy:#3FB6D3; --cy2:#7FE0F5; --cyd:#12283A; --cysel:#1B3A52;
  --am:#E8A33D; --am2:#E9C286; --amd:#33210F; --amb:#7A5A1E;
  --gr:#3FBF7F; --gr2:#6ECFA0; --grd:#0F2A22; --grb:#23624A;
  --rd:#E4595F; --rd2:#F08A8F; --rdd:#33140F; --rdb:#7A2A2E;
  --vi:#7C6BD6;
  --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13px;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select{font-family:var(--mono);font-size:12px;color:var(--tx);background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:6px 8px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 2px rgba(63,182,211,.15)}
select{font-family:var(--sans)}
label{font-size:10px;color:var(--tx2)}
.app{display:flex;flex-direction:column;height:100vh}
.bar{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:1.4px}
.nav{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px}
.nav button{padding:5px 12px;border:none;border-radius:4px;font-size:11.5px;font-weight:500;background:transparent;color:var(--tx2)}
.nav button.on{font-weight:600;background:var(--cysel);color:var(--cy2)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;background:var(--cyd);border:1px solid var(--line2);border-radius:5px;font-family:var(--mono);font-size:11px;color:#9FD8EA}
.main{flex:1 1 auto;display:flex;min-height:0}
.side{flex:0 0 auto;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side.l{width:248px;border-right:1px solid var(--line)}
.side.r{width:404px;border-left:1px solid var(--line)}
.ecard{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-bottom:8px}
.ehead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ehead input{font-weight:600;font-size:12px}
.egrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.center{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:#0A1220}
.hd{padding:11px 13px 8px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.1px;color:var(--tx3)}
.scroll{overflow-y:auto;overflow-x:hidden}
#printAll{display:none}
@media print{
  @page{ size:A4 portrait; margin:14mm; }
  html,body{ background:#fff !important; height:auto !important; overflow:visible !important; }
  .app,#overlay,#tip{ display:none !important; }
  #printAll{ display:block !important; }
  #printAll .psheet{ display:block !important; width:100% !important; max-width:none !important;
    min-height:0 !important; height:auto !important; max-height:none !important;
    margin:0 !important; padding:0 0 8mm 0 !important; background:#fff !important; color:#000 !important;
    overflow:visible !important; page-break-after:always; break-after:page; }
  #printAll .psheet > div{ break-inside:avoid; }
  #printAll .psheet:last-child{ page-break-after:auto; break-after:auto; }
}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:#1E3348;border-radius:5px}
.status{height:28px;flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.ribbon{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.ribbon::-webkit-scrollbar{height:0}
.ribbon button{padding:8px 13px;border-radius:5px;font-size:11.5px;font-weight:500;background:transparent;border:1px solid transparent;color:#A8BDD1}
.ribbon button.on{font-weight:600;background:var(--cysel);border-color:#2E6688;color:var(--cy2)}
.btn{padding:8px 12px;background:var(--cyd);border:1px solid var(--line2);border-radius:5px;font-size:11.5px;color:#C8D8E8}
.btn:hover{border-color:var(--cy)}
.btn.pri{background:#1F6F8B;border-color:var(--cy);color:#EAFAFF;font-weight:600}
.btn.sm{padding:5px 9px;font-size:11px}
.btn.dg{background:var(--rdd);border-color:var(--rdb);color:var(--rd2)}
.card{margin:0 13px 11px;padding:11px;background:var(--cyd);border:1px solid var(--line2);border-radius:6px}
.kv{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0}
.kv span:first-child{color:var(--tx2)}
.kv span:last-child{font-family:var(--mono);color:#C8D8E8}
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
.tbl th{text-align:left;padding:6px 6px;color:var(--tx3);font-weight:500;font-size:9.5px;letter-spacing:.6px;background:var(--bg);position:sticky;top:0}
.tbl td{padding:3px 4px;border-bottom:1px solid #16283C}
.tbl input,.tbl select{padding:5px 6px;font-size:11px}
.tbl tr.sel td{background:#14304a}
.row{display:flex;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;flex:1 1 0;min-width:0}
.grp{padding:0 14px 12px}
.grp h4{margin:0 0 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--tx3);font-weight:600}
.unitsel{display:flex;gap:3px}
.unitsel button{padding:4px 9px;border-radius:4px;font-family:var(--mono);font-size:10.5px;background:var(--bg);border:1px solid var(--line);color:var(--tx2)}
.unitsel button.on{background:var(--cysel);border-color:#2E6688;color:var(--cy2)}
.note{margin:0 13px 11px;padding:10px 11px;border-radius:5px;font-size:11px;line-height:1.5}
.note.w{background:var(--amd);border:1px solid var(--amb);color:var(--am2)}
.note.e{background:var(--rdd);border:1px solid var(--rdb);color:var(--rd2)}
.note.i{background:var(--cyd);border:1px solid var(--line2);color:#9FD8EA}
.big{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--cy2)}
.tree div{display:flex;justify-content:space-between;padding:5px 8px;color:var(--tx2);font-size:12px;border-radius:4px}
.tree div.on{background:var(--cysel);color:var(--cy2);font-weight:600}
.tree div span:last-child{font-family:var(--mono);font-size:10px;color:var(--tx4)}
.vrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:5px;background:var(--bg);margin-bottom:4px;font-size:11px}
.vrow .t{font-family:var(--mono);font-size:10px;color:var(--tx4);width:62px;flex:0 0 auto}
.vrow .l{flex:1 1 auto;color:#C8D8E8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow.cur{background:var(--cysel)}
.ovl{position:fixed;inset:0;background:rgba(5,10,18,.72);display:flex;align-items:center;justify-content:center;z-index:50}
.ovl .box{width:660px;max-height:80vh;background:var(--panel);border:1px solid var(--line2);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.ovl .box h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}
.hide{display:none!important}
svg text{user-select:none;pointer-events:none}
.hn{fill:transparent;stroke:#3FB6D3;stroke-width:1;stroke-dasharray:2 3;opacity:.22;cursor:pointer}
.hn:hover{opacity:1;fill:rgba(63,182,211,.18);stroke-dasharray:none;stroke-width:1.6}
.hn.on{stroke:#E8A33D;opacity:.3}
.hn.on:hover{fill:rgba(228,89,95,.18);stroke:#E4595F;opacity:1}
.hs{fill:transparent;stroke:#7C6BD6;stroke-width:1;stroke-dasharray:3 4;opacity:.25;cursor:pointer}
.hs:hover{opacity:1;fill:rgba(124,107,214,.2);stroke-dasharray:none}
.hs.on{opacity:.08}
.hs.on:hover{opacity:1;fill:rgba(228,89,95,.16);stroke:#E4595F!important;stroke-dasharray:none}
.hc{fill:transparent;stroke:#7C6BD6;stroke-width:1;stroke-dasharray:4 5;opacity:.25;cursor:pointer}
.hc:hover{opacity:1;fill:rgba(124,107,214,.16);stroke-dasharray:none}
.hc.on{opacity:.1}
.hc.on:hover{opacity:1;fill:rgba(228,89,95,.14);stroke:#E4595F;stroke-dasharray:none}
.hint{display:flex;align-items:center;gap:14px;padding:7px 14px;background:var(--cyd);border-bottom:1px solid var(--line);font-size:11px;color:#9FD8EA}
.hint b{color:var(--cy2);font-weight:600}
.rng{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.rng input[type=range]{flex:1;accent-color:var(--cy);padding:0}
.rng .v{font-family:var(--mono);font-size:11px;color:#9FD8EA;width:52px;text-align:right}
.chk{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#C8D8E8;margin-bottom:6px}
.chk input{width:14px;height:14px;accent-color:var(--cy);padding:0}
#tip{position:fixed;z-index:80;pointer-events:none;max-width:320px;background:#0B1522;border:1px solid var(--line2);
  border-radius:7px;padding:9px 11px;box-shadow:0 10px 30px rgba(0,0,0,.55);display:none}
#tip .th{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
#tip .tn{font-size:12.5px;font-weight:600;color:var(--tx)}
#tip .tk{padding:1px 6px;border-radius:3px;background:var(--cyd);border:1px solid var(--line2);
  font-family:var(--mono);font-size:9px;color:#9FD8EA}
#tip .tr{display:flex;justify-content:space-between;gap:16px;font-size:11px;padding:1.5px 0}
#tip .tr span:first-child{color:var(--tx2)}
#tip .tr span:last-child{font-family:var(--mono);color:#C8D8E8;text-align:right}
#tip .tf{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--tx3)}
#ctxm{position:fixed;z-index:90;min-width:230px;max-height:86vh;overflow:auto;background:#0B1522;
  border:1px solid var(--line2);border-radius:8px;padding:5px;box-shadow:0 16px 44px rgba(0,0,0,.65);display:none;font-size:12px}
#ctxm .ch{padding:7px 9px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;gap:8px;align-items:center}
#ctxm .cn{font-weight:600;color:var(--tx);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctxm .ck{margin-left:auto;padding:1px 6px;border-radius:3px;background:var(--cyd);border:1px solid var(--line2);
  font-family:var(--mono);font-size:9px;color:#9FD8EA;white-space:nowrap}
#ctxm button{display:flex;width:100%;align-items:center;gap:9px;padding:6px 9px;background:none;border:0;border-radius:5px;
  color:#C8D8E8;font:inherit;text-align:left;cursor:pointer}
#ctxm button:hover{background:var(--cyd);color:#fff}
#ctxm button .ci{width:15px;flex:0 0 15px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--cy2)}
#ctxm button .ca{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--tx3);padding-left:10px}
#ctxm button.dg{color:#E5888D}
#ctxm button.dg:hover{background:#3A1A1E;color:#FFC2C5}
#ctxm button.on .ci{color:var(--gr2)}
#ctxm .sep{height:1px;background:var(--line);margin:4px 2px}
#ctxm .gl{padding:6px 9px 3px;font-family:var(--mono);font-size:9px;letter-spacing:1.1px;color:var(--tx3)}
.cmdb{fill:#E8A33D;stroke:#0A1220;stroke-width:1.4}
.cmdr{stroke:#E8A33D;stroke-width:1.2;stroke-dasharray:6 4;pointer-events:none}
.cmdg{fill:none;stroke:#E8A33D;stroke-width:1.6;stroke-dasharray:5 3;opacity:.95;pointer-events:none}
.cmdax{stroke:#7C6BD6;stroke-width:1.6;stroke-dasharray:10 5;pointer-events:none}
#planbox.cmdmode{cursor:crosshair}
[data-el]{cursor:help}
.dax{stroke:#4E7492;stroke-width:12;stroke-opacity:.05;cursor:ew-resize;pointer-events:stroke}
.dax:hover{stroke-opacity:.35;stroke:#3FB6D3}
.dax.sel{stroke-opacity:.5;stroke:#E8A33D}
.daxk{fill:#0B1522;stroke:#4E7492;stroke-width:1.4;fill-opacity:0;cursor:grab}
.daxk:hover{fill-opacity:.9;stroke:#3FB6D3}
.daxk.sel{fill-opacity:.9;stroke:#E8A33D;stroke-width:2}
.marq{fill:#3FB6D3;fill-opacity:.10;stroke:#3FB6D3;stroke-width:1.2;stroke-dasharray:5 3;pointer-events:none}
.lyr{cursor:pointer}
.lyr:hover{fill-opacity:.38!important}
.ecard.lsel{border-color:#2E6688;background:#14283C}
.dh{cursor:move}
.dline{stroke-width:14;stroke-opacity:.06;stroke-linecap:round;pointer-events:stroke}
.dline:hover{stroke-opacity:.30}
.dline.sel{stroke-opacity:.45;stroke-dasharray:6 4}
.dpt{fill:transparent;stroke-width:1.5;stroke-opacity:.35;stroke-dasharray:3 3;pointer-events:all}
.dpt:hover{stroke-opacity:1;fill-opacity:.15;fill:currentColor;stroke-dasharray:none}
.dpt.sel{stroke-opacity:1;stroke-width:2;stroke-dasharray:none}
.drc{fill:none;stroke-width:9;stroke-opacity:.13;stroke-dasharray:7 6;pointer-events:stroke}
.drcf{fill-opacity:.07;stroke-width:2;stroke-opacity:.4;stroke-dasharray:7 6;pointer-events:all;cursor:move}
.drcf:hover{fill-opacity:.2;stroke-opacity:.9;stroke-dasharray:none}
.drcf.sel{fill-opacity:.26;stroke-opacity:1;stroke-width:2.4;stroke-dasharray:none}
.mh{cursor:move}
.mln{stroke-width:11;stroke-opacity:.001;pointer-events:stroke}
.mln:hover{stroke-opacity:.35}
.mrc{fill-opacity:.001;stroke-width:2;stroke-opacity:.001;pointer-events:all}
.mrc:hover{fill-opacity:.16;stroke-opacity:.9}
.mpt{fill-opacity:.001;stroke-width:2;stroke-opacity:.001;pointer-events:all}
.mpt:hover{fill-opacity:.18;stroke-opacity:.9}
.drc:hover{stroke-opacity:.5;stroke-dasharray:none}
.drc.sel{stroke-opacity:.75;stroke-dasharray:none}
.dk{fill:#0B1522;stroke:#7FE0F5;stroke-width:2;cursor:crosshair;pointer-events:all}
.dk:hover{fill:#7FE0F5}
.dk.rot{stroke:#E8A33D}
.snapg{stroke:#3FBF7F;stroke-width:1;stroke-dasharray:3 4;opacity:.75;pointer-events:none}
.osm{fill:none;stroke-width:1.8;pointer-events:none}
#planbox.linemode{cursor:crosshair}
#planbox.drawing{cursor:crosshair}
.v3box{cursor:grab;user-select:none;touch-action:none}
.v3box.pan{cursor:move}
.v3box.dragging{cursor:grabbing}
</style>
</head>
<body>
<div class="app">

  <div class="bar">
    <span class="logo">TRAGWERK<span style="color:var(--cy)">/</span>PLAN</span>
    <span id="projChip" class="chip" style="background:var(--bg);border-color:var(--line);color:#C8D8E8"></span>
    <div style="flex:1"></div>
    <nav class="nav" id="nav"></nav>
    <span class="chip"><span style="width:6px;height:6px;border-radius:50%;background:var(--gr)"></span><span id="normChip">EC + DIN NA</span></span>
    <button class="btn sm" id="btnVers">Sürümler <span id="revNo" style="font-family:var(--mono);color:var(--cy2)"></span></button>
  </div>

  <div class="main" id="main"></div>

  <div class="status">
    <span id="st1"></span><span id="st2"></span><div style="flex:1"></div><span id="st3" style="color:var(--tx2)"></span>
  </div>
</div>

<div id="overlay" class="ovl hide"></div>
<div id="tip"></div>
<div id="ctxm"></div>
<div id="printAll"></div>

<script>
"use strict";

/* ============================================================
   BİRİMLER — her uzunluk içeride METRE olarak tutulur
   ============================================================ */
var UF = { m:1, cm:0.01, mm:0.001 };
function toDisp(mv, u){ return mv / UF[u]; }
function fromDisp(dv, u){ return dv * UF[u]; }
function pnum(s, fb){
  if (typeof s === "number") return s;
  var n = parseFloat(String(s).replace(",", "."));
  return isFinite(n) ? n : fb;
}
function fmt(x, d){
  if (!isFinite(x)) return "—";
  return x.toFixed(d).replace(".", ",");
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function uid(p){ return p + "-" + Math.random().toString(36).slice(2,7); }
var AX = "ABCDEFGHIJKLMNOP";

/* ============================================================
   PROJE VERİ MODELİ
   ============================================================ */
/* --- konum adlandırma --- */
function segName(pre, dir, line, seg){
  return dir === "x" ? (pre+"-"+AX[seg]+AX[seg+1]+"-"+(line+1))
                     : (pre+"-"+(seg+1)+""+(seg+2)+"-"+AX[line]);
}
function mkWall(dir, line, seg, t){
  return { id:uid("w"), name:segName("W",dir,line,seg), dir:dir, line:line, seg:seg,
           t:t, kind:"tragend", mat:"C25/30" };
}
function perimeterWalls(gx, gy, t){
  var ws = [];
  gx.forEach(function(L,i){ ws.push(mkWall("x", 0, i, t)); ws.push(mkWall("x", gy.length, i, t)); });
  gy.forEach(function(L,i){ ws.push(mkWall("y", 0, i, t)); ws.push(mkWall("y", gx.length, i, t)); });
  return ws;
}
function allSlabs(gx, gy, t){
  var ss = [];
  gx.forEach(function(Lx,i){
    gy.forEach(function(Ly,j){
      ss.push({ id:uid("p"), name:"D-"+AX[i]+AX[i+1]+"/"+(j+1)+(j+2), t:t,
                kind:"zweiachsig", mat:"C25/30", cx:i, cy:j });
    });
  });
  return ss;
}

function defaultProject(type){
  var gx = [4.50, 5.75, 3.75], gy = [4.25, 4.25];
  var P = {
    version: "2.7",
    meta: { name:"", ort:"Freiburg im Breisgau", norm:"din", sz:"2", wz:"1",
            bauherr:"", aufst:"İlhami Tekin, Bauingenieur", pruef:"" },
    type: type || "wohn",
    units: { plan:"m", sec:"cm" },
    grid: { x:gx.slice(), y:gy.slice() },
    storeys: [ {name:"EG", h:3.10}, {name:"1. OG", h:3.10}, {name:"2. OG", h:3.10}, {name:"DG", h:3.10} ],
    walls: perimeterWalls(gx, gy, 0.24).concat([
      { id:uid("w"), name:segName("W","y",1,0), dir:"y", line:1, seg:0, t:0.115, kind:"nichttragend", mat:"Mauerwerk" },
      { id:uid("w"), name:segName("W","y",1,1), dir:"y", line:1, seg:1, t:0.115, kind:"nichttragend", mat:"Mauerwerk" }
    ]),
    columns: [
      { id:uid("s"), name:"S-B2", form:"rect", b:0.30, h:0.30, d:0.30, mat:"C25/30", ax:1, ay:1, from:0, to:3 },
      { id:uid("s"), name:"S-C2", form:"rect", b:0.30, h:0.30, d:0.30, mat:"C25/30", ax:2, ay:1, from:0, to:3 }
    ],
    beams: [
      { id:uid("b"), name:"B-AB-2", b:0.30, h:0.55, dir:"x", line:1, seg:0, L:0, mat:"C25/30", sys:"durchlauf" },
      { id:uid("b"), name:"B-BC-2", b:0.30, h:0.55, dir:"x", line:1, seg:1, L:0, mat:"C25/30", sys:"durchlauf" },
      { id:uid("b"), name:"B-CD-2", b:0.30, h:0.50, dir:"x", line:1, seg:2, L:0, mat:"C25/30", sys:"durchlauf" }
    ],
    slabs: allSlabs(gx, gy, 0.20),
    doors: [
      { id:uid("t"), name:segName("T","y",1,0), w:0.885, h:2.010, dir:"y", line:1, seg:0, mat:"Holz" }
    ],
    windows: [
      { id:uid("f"), name:segName("F","x",0,0), w:1.260, h:1.380, par:0.90, dir:"x", line:0, seg:0, mat:"Kunststoff" },
      { id:uid("f"), name:segName("F","x",0,1), w:1.760, h:1.380, par:0.90, dir:"x", line:0, seg:1, mat:"Kunststoff" },
      { id:uid("f"), name:segName("F","x",2,2), w:1.260, h:1.380, par:0.90, dir:"x", line:2, seg:2, mat:"Kunststoff" }
    ],
    openings: [],
    roof: { on:true, type:"sattel", pitch:35, over:0.60, ridge:"x", t:0.24,
            cover:"Ziegel", gk:0.85, mat:"Holz GL24h" },
    balconies: [],

                   w:w, d:dp, h:c[4]/100, sym:c[5], clr:c[6]/100, rot:0,
                   free:{ x:x - w/2, y:y - dp/2, w:w, h:dp, rot:0 } });
  P.furniture.push(r);
  return r;
}
function rotateFurn(r){
  var f = r.free; if (!f) return;
  var cx = f.x + f.w/2, cy = f.y + f.h/2;
  var t = f.w; f.w = f.h; f.h = t;
  f.x = cx - f.w/2; f.y = cy - f.h/2;
  f.rot = ((pnum(f.rot,0) + 90) % 360);
  r.rot = f.rot; r.w = f.w; r.d = f.h;
}
/* hareket alanı dikdörtgeni — elemanın önünde */
function furnClearRect(r){
  var f = r.free, c = pnum(r.clr, 0);
  if (!f || c <= 0) return null;
  var rot = ((pnum(f.rot,0) % 360) + 360) % 360;
  if (rot === 0)   return { x:f.x, y:f.y + f.h, w:f.w, h:c };
  if (rot === 90)  return { x:f.x - c, y:f.y, w:c, h:f.h };
  if (rot === 180) return { x:f.x, y:f.y - c, w:f.w, h:c };
  return { x:f.x + f.w, y:f.y, w:c, h:f.h };
}

function hex2rgb(h){
  h = String(h).replace("#","");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16)||0, parseInt(h.slice(2,4),16)||0, parseInt(h.slice(4,6),16)||0];
}
function rgb2hex(c){
  return "#"+c.map(function(v){

    return (v<16?"0":"") + v.toString(16);
  }).join("");
}

/* 3D: kameraya derinlik + yüzey normali ile ışıklandırma */
function dep3(x, y, z, o){
  var a = o.az*Math.PI/180, e = o.el*Math.PI/180;
  return (x*Math.sin(a) + y*Math.cos(a))*Math.cos(e) + z*Math.sin(e);
}
var LIGHT3 = [-0.38, -0.50, 0.78];
function lambert(pts){
  if (pts.length < 3) return 1;
  var u = [pts[1][0]-pts[0][0], pts[1][1]-pts[0][1], pts[1][2]-pts[0][2]];
  var v = [pts[2][0]-pts[0][0], pts[2][1]-pts[0][1], pts[2][2]-pts[0][2]];
  var n = [u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]];
  var L = Math.sqrt(n[0]*n[0]+n[1]*n[1]+n[2]*n[2]);
  if (L < 1e-9) return 1;
  var dp = Math.abs((n[0]*LIGHT3[0] + n[1]*LIGHT3[1] + n[2]*LIGHT3[2]) / L);
  return 0.50 + 0.50*dp;
}
/* dikdörtgenden dikdörtgen çıkar (döşeme yırtığı / merdiven boşluğu) */
function subRect(rects, h){
  var out = [];
  rects.forEach(function(r){
    var ix0 = Math.max(r.x, h.x), ix1 = Math.min(r.x+r.w, h.x+h.w);
    var iy0 = Math.max(r.y, h.y), iy1 = Math.min(r.y+r.h, h.y+h.h);
    if (ix0 >= ix1-1e-9 || iy0 >= iy1-1e-9){ out.push(r); return; }
    if (iy0 > r.y+1e-9)        out.push({x:r.x, y:r.y, w:r.w, h:iy0-r.y});
    if (r.y+r.h > iy1+1e-9)    out.push({x:r.x, y:iy1, w:r.w, h:r.y+r.h-iy1});
    if (ix0 > r.x+1e-9)        out.push({x:r.x, y:iy0, w:ix0-r.x, h:iy1-iy0});
    if (r.x+r.w > ix1+1e-9)    out.push({x:ix1, y:iy0, w:r.x+r.w-ix1, h:iy1-iy0});
  });
  return out;
}

    [["Kolon","col"],["Kiriş","beam"],["Döşeme","slab"],["Dış duvar","wallx"],["İç duvar","walli"],
     ["Kapı","door"],["Pencere","win"],["Çatı","roof"],["Balkon","balk"],["Temel","found"],["Merdiven","stair"]]
      .forEach(function(t){ put(t[0], TYPECOL[t[1]], ""); });

      var c = finishColor(sd[0]);

      (P.finishes ? P.finishes.surfaces : []).forEach(function(x){ if (x.key === sd[0]) s = x; });

  }
  function el(list, grp){

  }
  el("columns","Kolon"); el("beams","Kiriş"); el("slabs","Döşeme"); el("walls","Duvar");
  el("stairs","Merdiven"); el("foundations","Temel"); el("balconies","Balkon");
  (P.doors||[]).forEach(function(r){ put(r.mat||"Holz", matColor(r.mat||"Holz"), "Kapı"); });
  (P.windows||[]).forEach(function(r){ put(r.mat||"Kunststoff", matColor(r.mat||"Kunststoff"), "Pencere"); });
  if (P.roof && P.roof.on){
    put(P.roof.cover, coverColor(P.roof.cover), "Çatı kaplaması");
    put(P.roof.mat, matColor(P.roof.mat), "Çatı taşıyıcı");
  }
  if ((P.furniture||[]).length && UI.v3d.show.mb !== false && M === "mat"){
    var cats = {};
    P.furniture.forEach(function(fr){ cats[furnCat(fr.key)] = (cats[furnCat(fr.key)]||0)+1; });
    FURNCATS.forEach(function(c){ if (cats[c[0]]) put(c[1], c[2], "Mobilya ×"+cats[c[0]]); });
  }
  if (P.drain && UI.v3d.show.dr !== false){
    ensureDrain();
    put(sealDef(P.drain.seal)[1], "#E4595F", "Su yalıtımı");
    put(P.drain.perim, "#3FBF7F", "Perimetre yalıtımı");
    if (P.drain.on){
      put(P.drain.gravelType, "#A8BDD1", "Sızdırma tabakası");
      put("Dren borusu DN"+P.drain.dn, "#E8A33D", "Drenaj");
    }
  }
  return out;
}

/* kolon / kiriş konum yardımcıları */
function colName(ax, ay){ return "S-" + AX[ax] + (ay+1); }
function beamName(dir, line, seg){

                     : ("B-" + (seg+1) + "" + (seg+2) + "-" + AX[line]);
}
function beamL(b){
  var fl = lenOfLine(b); if (fl !== null) return fl;
  if (b.dir && P.grid[b.dir] && P.grid[b.dir][b.seg] !== undefined) return P.grid[b.dir][b.seg];
  return b.L || 0;
}
function findCol(ax, ay, k){
  for (var i=0;i<P.columns.length;i++){
    if (pnum(P.columns[i].ax,-1) === ax && pnum(P.columns[i].ay,-1) === ay && stMatch(P.columns[i], k)) return i;
  }

}
function findBeam(dir, line, seg, k){
  for (var i=0;i<P.beams.length;i++){
    var b = P.beams[i];
    if (b.dir === dir && pnum(b.line,-1) === line && pnum(b.seg,-1) === seg && stMatch(b, k)) return i;
  }

}

/* aynı segmentte duran herhangi bir elemanı bul */
function findSeg(listKey, dir, line, seg, k){
  var L = P[listKey];
  for (var i=0;i<L.length;i++){
    if (L[i].dir === dir && pnum(L[i].line,-1) === line && pnum(L[i].seg,-1) === seg && stMatch(L[i], k)) return i;
  }
  return -1;
}
function isPerimeter(dir, line){

                     : (line === 0 || line === P.grid.x.length);

/* ============================================================
   KAT ATAMASI
   Her eleman bir kat aralığında yaşar: from … to
   to = null  →  en üst kat (kat eklenince otomatik uzar)
   ============================================================ */
var STLISTS = ["walls","slabs","beams","doors","windows","openings","stairs","balconies","columns","shearwalls","parapets","furniture","lines"];
var STNAMES = { shearwalls:"Perde duvar", parapets:"Parapet", walls:"Duvar", slabs:"Döşeme", beams:"Kiriş", doors:"Kapı", windows:"Pencere",
                openings:"Yırtık", stairs:"Merdiven", balconies:"Balkon", columns:"Kolon", furniture:"Mobilya", lines:"Çizgi" };
function nKat(){ return P.storeys.length; }
function stFrom(r){ return Math.max(0, Math.min(pnum(r && r.from, 0), nKat()-1)); }
function stTo(r){
  var t = (!r || r.to === null || r.to === undefined) ? nKat()-1 : pnum(r.to, nKat()-1);
  return Math.max(stFrom(r), Math.min(t, nKat()-1));
}
function onSt(r, k){ return k >= stFrom(r) && k <= stTo(r); }
function stAllK(r){ return stFrom(r) === 0 && stTo(r) === nKat()-1; }
function katName(i){ var s = P.storeys[i]; return s ? s.name : ("Kat "+(i+1)); }
function katKot(i){ var z = 0; for (var j=0;j<i && j<P.storeys.length;j++) z += P.storeys[j].h; return z; }
function katKotTxt(i){ return i === 0 ? "±0,00" : "+"+fmt(katKot(i),2); }
function stLabel(r){
  var f = stFrom(r), t = stTo(r);
  if (stAllK(r)) return "tüm katlar";
  if (f === t) return katName(f);
  return katName(f)+" … "+katName(t);
}
function ensureKat(){
  if (UI.kat === undefined || UI.kat === null) UI.kat = 0;
  UI.kat = Math.max(0, Math.min(UI.kat, nKat()-1));
  if (UI.katMode !== "bu" && UI.katMode !== "tum") UI.katMode = "tum";
  STLISTS.forEach(function(k){
    (P[k]||[]).forEach(function(r){
      if (r.from === undefined) r.from = 0;
      if (r.to === undefined) r.to = null;
    });
  });
}
/* etkin kat süzgeci açık mı */
function katOn(){ return P.type === "wohn" && UI.katMode === "bu"; }
/* etkin katta görünen / görünmeyen satırlar */
function katVis(listKey){
  var L = P[listKey] || [];
  return katOn() ? L.filter(function(r){ return onSt(r, UI.kat); }) : L;
}
function katGhost(listKey){
  var L = P[listKey] || [];
  return katOn() ? L.filter(function(r){ return !onSt(r, UI.kat); }) : [];
}
/* bir katta kaç eleman var */
function katCount(k, listKey){
  if (listKey) return (P[listKey]||[]).filter(function(r){ return onSt(r,k); }).length;
  var n = 0;
  STLISTS.forEach(function(key){ (P[key]||[]).forEach(function(r){ if (onSt(r,k)) n++; }); });
  return n;
}
/* kat eşleşmesi: k===null → gözetme, k===undefined → etkin kat, sayı → o kat */
function stMatch(r, k){
  if (k === null) return true;
  if (k === undefined) return !katOn() || onSt(r, UI.kat);
  return onSt(r, k);
}
/* etkin kattan çıkar — tek katsa sil, uçtaysa kısalt, ortadaysa böl */
function stripK(listKey, i){
  var L = P[listKey], r = L[i], f = stFrom(r), t = stTo(r), k = UI.kat;
  if (!katOn() || (f === k && t === k)){ L.splice(i,1); return "sil"; }
  if (k === f){ r.from = k+1; return "kısalt"; }
  if (k === t){ r.to = k-1; return "kısalt"; }
  var cl = JSON.parse(JSON.stringify(r));
  cl.id = uid(listKey.charAt(0));
  r.to = k-1; cl.from = k+1; cl.to = t;
  L.push(cl); return "böl";
}
function stripTxt(act, ad){
  return ad + (act === "sil" ? " kaldırıldı" : act === "kısalt" ? " kat aralığı kısaldı" : " kat aralığı bölündü");
}
/* yeni elemanın kat aralığı */
function stNew(){ return katOn() ? { from:UI.kat, to:UI.kat } : { from:0, to:null }; }
function withSt(o){ var s = stNew(); o.from = s.from; o.to = s.to; return o; }
function addTxt(ad, o){ return ad + " eklendi: " + o.name + " · " + stLabel(o); }

/* duvar giderse üzerindeki kapı/pencere de gider */
function dropOpenings(dir, line, seg){

];

  return t;

function findStair(cx, cy, k){
  for (var i=0;i<P.stairs.length;i++){
    if (pnum(P.stairs[i].cx,-1) === cx && pnum(P.stairs[i].cy,-1) === cy && stMatch(P.stairs[i], k)) return i;

}

  if (i >= 0){ var nm = P.stairs[i].name; snap(stripTxt(stripK("stairs", i), "Merdiven "+nm)); }
  else {
    var st = withSt({ id:uid("m"), name:"TR-"+(P.stairs.length+1), type:UI.stairType || "gegenlaeufig",
                      cx:cx, cy:cy, w:1.20, riser:0.175, tread:0.28, rot:0, mat:P.design.beton });
    P.stairs.push(st); snap(addTxt("Merdiven", st)+" · "+stairLabel(st.type));
  }

function stairCalc(st){
  var h = (P.storeys[0] && P.storeys[0].h) || 3.10;
  var n = Math.max(2, Math.round(h / Math.max(st.riser, .05)));
  var rAct = h / n;
  var schritt = 2*rAct + st.tread;
  var steig = rAct / Math.max(st.tread, .01);
  return { h:h, n:n, rAct:rAct, schritt:schritt, steig:steig,
           okSchritt: (schritt >= 0.59 && schritt <= 0.65),
           okRiser: (rAct <= 0.19), okTread: (st.tread >= 0.26), okWidth: (st.w >= 1.00),
           runLen: Math.ceil(n/2) * st.tread };
}

function ensureSeismic(){
  if (P.soil.gcls === undefined) P.soil.gcls = "C";
  if (P.soil.ag   === undefined) P.soil.ag   = 0.06;   /* a_g/g — Almanya Zone 1 ≈ 0,04…0,08 */
  if (P.soil.S    === undefined) P.soil.S    = 1.25;   /* zemin büyütme katsayısı */
}
/* bir bağ kirişinin hesabı */
function tieCalc(f){
  ensureSeismic();
  var dir = f.dir, ln = pnum(f.line,0), sg = pnum(f.seg,0);
  var L = (dir === "x") ? (P.grid.x[sg]||0) : (P.grid.y[sg]||0);
  /* bağladığı iki düğümdeki kolon yükleri */
  var n1, n2;
  if (dir === "x"){ n1 = colLoad(sg, ln);   n2 = colLoad(sg+1, ln); }
  else            { n1 = colLoad(ln, sg);   n2 = colLoad(ln, sg+1); }
  var NEd = Math.max(n1, n2);
  var fk  = groundFactor(P.soil.gcls);
  var Ntie = fk * pnum(P.soil.ag,0.06) * pnum(P.soil.S,1.25) * NEd;      /* kN */
  var b = pnum(f.b, 0.25), h = pnum(f.d, 0.40);
  var hMin = Math.max(L/20, 0.30), bMin = 0.25;
  var asErf = Ntie / 43.5;                                              /* cm² · f_yd = 43,5 kN/cm² */
  var asMin = 0.01 * (b*100) * (h*100);                                 /* ρ_min = %1 */
  var asReq = Math.max(asErf, asMin);
  var nBar  = Math.max(4, Math.ceil(asReq / (Math.PI*1.4*1.4/4)));       /* Ø14 */
  return { L:L, n1:n1, n2:n2, NEd:NEd, fk:fk, Ntie:Ntie, b:b, h:h,
           hMin:hMin, bMin:bMin, okH: h >= hMin - 1e-9, okB: b >= bMin - 1e-9,
           asErf:asErf, asMin:asMin, asReq:asReq, nBar:nBar,
           ok: (h >= hMin - 1e-9) && (b >= bMin - 1e-9) };
}
function toggleTieBeam(dir, line, seg){
  var i = findFound(function(f){ return f.kind==="bag" && f.dir===dir && pnum(f.line,-1)===line && pnum(f.seg,-1)===seg; });
  if (i >= 0){ var nm = P.foundations[i].name; P.foundations.splice(i,1); snap("Bağ kirişi kaldırıldı: "+nm); render(); return; }

/* ============================================================
   PERDE DUVAR — Stahlbetonwand (EN 1992-1-1, aussteifende Wand)
   Aks bağlı segment: {dir,line,seg,t,mat,from,to} — serbest de olabilir
   ============================================================ */
function ensureShear(){
  if (!P.shearwalls) P.shearwalls = [];
  P.shearwalls.forEach(function(w){
    if (w.t === undefined) w.t = 0.20;
    if (!w.mat) w.mat = P.design.beton || "C25/30";
    if (w.braced === undefined) w.braced = true;   /* üst/alt tutulu (Deckenscheibe) */
  });
}
function shearLen(w){
  var G = gridM();
  var g = geomOf("shearwalls", w, G);
  if (!g || g.x1 === undefined) return 0;
  return Math.sqrt(Math.pow(g.x2-g.x1,2) + Math.pow(g.y2-g.y1,2));
}
/* perdenin yatay yönü: x (yatay) ya da y (düşey) — rijitlik dağıtımı için */
function shearAxis(w){
  var G = gridM(), g = geomOf("shearwalls", w, G);
  if (!g || g.x1 === undefined) return "x";
  return Math.abs(g.x2-g.x1) >= Math.abs(g.y2-g.y1) ? "x" : "y";
}
/* bir noktaya en yakın aks çizgisi ve o çizgi üzerindeki açıklık */
function nearestAxisSeg(mx, my){
  var G = gridM();
  if (G.x.length < 2 || G.y.length < 2) return null;
  function near(arr, v){
    var bi = 0, bd = 1e9;
    for (var i=0;i<arr.length;i++){ var d = Math.abs(arr[i]-v); if (d < bd){ bd = d; bi = i; } }
    return { i:bi, d:bd };
  }
  function cell(arr, v){
    for (var i=0;i<arr.length-1;i++) if (v >= arr[i] && v <= arr[i+1]) return i;
    return (v < arr[0]) ? 0 : (arr.length-2);
  }
  var nx = near(G.x, mx);          /* düşey aks çizgisi → dir "y" */
  var ny = near(G.y, my);          /* yatay aks çizgisi → dir "x" */
  if (ny.d <= nx.d) return { dir:"x", line:ny.i, seg:cell(G.x, mx), d:ny.d };
  return { dir:"y", line:nx.i, seg:cell(G.y, my), d:nx.d };
}
function findShear(dir, line, seg, k){
  ensureShear();
  for (var i=0;i<P.shearwalls.length;i++){
    var w = P.shearwalls[i];
    if (w.dir===dir && pnum(w.line,-1)===line && pnum(w.seg,-1)===seg && (k===undefined || onSt(w,k))) return i;
  }
  return -1;
}
function togglePerde(dir, line, seg){
  ensureShear();
  var i = findShear(dir, line, seg, katOn() ? UI.kat : undefined);
  if (i >= 0){ var nmP = P.shearwalls[i].name; snap(stripTxt(stripK("shearwalls", i), "Perde "+nmP)); render(); return; }
  var w = withSt({ id:uid("p"), name:segName("PD",dir,line,seg), dir:dir, line:line, seg:seg,
                   t:pnum(UI.perdeT, 0.20), mat:P.design.beton || "C25/30", braced:true });
  P.shearwalls.push(w);
  snap(addTxt("Perde duvar", w));
  render();
}
/* yapıya etkiyen yatay taban kesme kuvveti — rüzgâr ve deprem */
function baseShear(d){
  ensureSeismic();
  var H = d.Htot, W = d.W + d.extWall, D = d.D + d.extWall;
  var qw = pnum(P.loads.w, 0.50);                       /* kN/m² — cepheye dik */
  var Vwx = 1.50 * qw * H * D;                          /* X yönünde: Y cephesi yüklenir */
  var Vwy = 1.50 * qw * H * W;
  /* kütle: öz ağırlık + yarı hareketli (EN 1998-1 ψ_E ≈ 0,15…0,30) */
  var Gtot = (d.g1 + d.g2 + 0.15*P.loads.q) * d.bgfSt * d.nSt;   /* kN */
  var fk = groundFactor(P.soil.gcls);
  var Sd = 2.5 / 1.5 * pnum(P.soil.ag,0.06) * pnum(P.soil.S,1.25);   /* S_d/g, q = 1,5 (DCL) */
  var Veq = Sd * Gtot * 0.85;
  return { H:H, qw:qw, Vwx:Vwx, Vwy:Vwy, Gtot:Gtot, Sd:Sd, Veq:Veq, fk:fk,
           Vx:Math.max(Vwx, Veq), Vy:Math.max(Vwy, Veq),
           mass: Veq > Math.max(Vwx,Vwy) ? "deprem" : "rüzgâr" };
}
/* bütün perdelerin rijitlik dağılımı (I = t·l³/12, kendi doğrultusunda) */
function shearSystem(d){
  ensureShear();
  var bs = baseShear(d), gr = { x:[], y:[] }, Ix = 0, Iy = 0;
  P.shearwalls.forEach(function(w){
    var L = shearLen(w); if (L <= 0.01) return;
    var ax = shearAxis(w), t = pnum(w.t,0.20);
    var I = t * L*L*L / 12;
    if (ax === "x"){ Ix += I; gr.x.push({ w:w, L:L, I:I }); }
    else           { Iy += I; gr.y.push({ w:w, L:L, I:I }); }
  });
  return { bs:bs, gx:gr.x, gy:gr.y, Ix:Ix, Iy:Iy,
           nx:gr.x.length, ny:gr.y.length,
           ok: gr.x.length >= 2 && gr.y.length >= 2 };
}
/* tek bir perdenin boyutlandırması */
function perdeCalc(w, d, sys){
  ensureShear();
  d = d || derive();
  sys = sys || shearSystem(d);
  var L = shearLen(w), t = pnum(w.t, 0.20);
  var Ac = L * t;                                      /* m² */
  var kF = stFrom(w), kT = stTo(w);
  var hs = P.storeys[kF] ? P.storeys[kF].h : 3.00;     /* kat yüksekliği */
  var nAbove = Math.max(1, P.storeys.length - kF);     /* üstündeki kat sayısı */
  /* düşey yük — yük alanı: perdenin iki yanında yarım açıklık (basitleştirilmiş) */
  var bTrib = 0.5 * ((shearAxis(w) === "x" ? (d.D / Math.max(1,P.grid.y.length)) : (d.W / Math.max(1,P.grid.x.length))) * 2);
  var NEd = d.qd * bTrib * L * nAbove + 1.35 * 25 * t * L * hs * nAbove;   /* kN */
  /* narinlik — EN 1992-1-1 5.8.3 */
  var beta = w.braced === false ? 2.0 : 1.0;
  var l0 = beta * hs;
  var i0 = t / Math.sqrt(12);
  var lam = l0 / i0;
  var fck = FCK[w.mat] || FCK[P.design.beton] || 25;
  var fcd = 0.85 * fck / 1.5;                          /* MN/m² */
  var nRel = (NEd/1000) / (Ac * fcd);                  /* bağıl normal kuvvet */
  var lamLim = 20 * 0.7 * 1.1 * 0.7 / Math.sqrt(Math.max(nRel, 0.01));
  /* taşıma gücü — eksantriklik yaklaşımı (EN 1992-1-1 12.6.5.2 benzeri) */
  var e0 = Math.max(hs/400, 0.02);                     /* istenmeyen eğiklik + min eksantriklik */
  var etot = e0 + (lam > lamLim ? l0*l0/(10*1000*t) : 0);
  var Phi = Math.max(0, Math.min(1 - 2*etot/t, 1.14*(1 - 2*etot/t) - 0.02*l0/t));
  var NRd = Ac * fcd * Phi * 1000;                     /* kN */
  var etaN = NRd > 0 ? NEd / NRd : 9.9;
  /* yatay (düzlem içi) — rijitliğe göre pay */
  var ax = shearAxis(w);
  var Itot = (ax === "x") ? sys.Ix : sys.Iy;
  var Vtot = (ax === "x") ? sys.bs.Vx : sys.bs.Vy;
  var I = t*L*L*L/12;
  var pay = Itot > 0 ? I/Itot : 0;
  var VEd = Vtot * pay;                                /* kN */
  var MEd = VEd * sys.bs.H * 0.6;                      /* kNm — üçgen yükleme yaklaşık kol */
  /* kayma — EN 1992-1-1 6.2.2 (donatısız) */
  var dEff = 0.8 * L;
  var rho = 0.002;
  var kV = Math.min(2.0, 1 + Math.sqrt(0.2/Math.max(dEff,0.2)));
  var scp = Math.min(0.2*fcd, (NEd/1000)/Ac);
  var vRdc = (0.12*kV*Math.pow(100*rho*fck, 1/3) + 0.15*scp);          /* MN/m² */
  var VRdc = vRdc * t * dEff * 1000;                   /* kN */
  var etaV = VRdc > 0 ? VEd / VRdc : 0;
  /* düzlem içi eğilme — uç donatısı */
  var zArm = 0.8 * L;
  var asRand = Math.max(0, (MEd - NEd*L*0.25) / (zArm * 43.5));        /* cm² — kabaca */
  /* minimum donatı — EN 1992-1-1 9.6 */
  var AcCm = t*100 * L*100;                            /* cm² */
  var asV = 0.002 * AcCm;                              /* düşey toplam, iki yüze bölünür */
  var asH = Math.max(0.25*asV, 0.001*AcCm);
  return { L:L, t:t, Ac:Ac, hs:hs, nAbove:nAbove, NEd:NEd, beta:beta, l0:l0, lam:lam, lamLim:lamLim,
           fck:fck, fcd:fcd, nRel:nRel, etot:etot, Phi:Phi, NRd:NRd, etaN:etaN,
           ax:ax, pay:pay, VEd:VEd, MEd:MEd, VRdc:VRdc, etaV:etaV, asRand:asRand,
           asV:asV, asH:asH, tMin: w.braced === false ? 0.20 : 0.16,
           okT: t >= (w.braced === false ? 0.20 : 0.16) - 1e-9,
           okN: etaN <= 1.0, okV: etaV <= 1.0,
           ok: etaN <= 1.0 && etaV <= 1.0 && t >= (w.braced === false ? 0.20 : 0.16) - 1e-9 };
}

                ["mittel","Orta geçirgen (10⁻⁶…10⁻⁴) · siltli kum"],

function defaultDrain(){
  return { on:true, wclass:"W1.1-E", seal:"pmbc", sealT:0.004, sockel:0.30,
           perim:"XPS 034 · Perimeter", perimT:0.100, noppe:true, vlies:true,
           dn:100, slope:0.5, gravel:0.25, gravelType:"Filterkies 16/32",
           shaftD:0.30, outlet:"kanal", kb:0.15, sauber:0.05, gel:0.15, kel:false,
           rain:250, psi:0.30, strip:2.00, kSoil:"mittel" };
}
function ensureDrain(){
  if (!P.drain) P.drain = defaultDrain();
  var dd = defaultDrain();
  for (var k in dd) if (P.drain[k] === undefined) P.drain[k] = dd[k];
}

/* ---- hesap ---- */
function drainCalc(d){
  ensureDrain();
  var R = P.drain, W = d.W, D = d.D;
  var tGr = pnum(P.soil.tGr, 0.80);                       /* temel taban derinliği */
  var plate = 0.25;
  for (var i=0;i<P.foundations.length;i++) if (P.foundations[i].kind === "platte") plate = pnum(P.foundations[i].d, 0.25);

  /* --- geometri (kesit kotları, ±0,00 = OK ham döşeme) --- */
  var kel    = !!R.kel;                                   /* bodrum katı var mı */
  var zGel   = -pnum(R.gel, 0.15);                        /* OK zemin (arazi) */
  var zPlB   = kel ? -tGr : -plate;                       /* UK bodenplatte */
  var zPlT   = zPlB + plate;                              /* OK bodenplatte (bodrum tabanı) */
  var zSau   = zPlB - pnum(R.sauber, 0.05);               /* UK temizlik betonu */
  var zKB    = zSau - pnum(R.kb, 0.15);                   /* UK kılcal kesici tabaka */
  var zPipe  = kel ? (zKB - 0.05) : Math.min(zKB - 0.05, -tGr + 0.05);   /* dren borusu ekseni */
  var dInner = dnInner(R.dn);

  /* --- dren borusu --- */
  var offs   = 0.50;                                      /* dış yüzden mesafe */
  var Lpipe  = 2*(W + D) + 8*offs;                        /* çevre halka uzunluğu */
  var nShaft = 4;                                         /* her köşede kontrol bacası */
  var extraShaft = Math.max(0, Math.ceil(Lpipe/60) - 1);
  nShaft += extraShaft;

  /* kapasite — Manning-Strickler, delikli boru k_st = 70, %70 dolulukta */
  var kst = 70, iSl = Math.max(pnum(R.slope,0.5),0.01)/100;
  var A = Math.PI*dInner*dInner/4, Rh = dInner/4;
  var Qvoll = A * kst * Math.pow(Rh, 2/3) * Math.sqrt(iSl) * 1000;   /* l/s */
  var Qkap  = Qvoll * 0.70;

  /* gelen su — DIN 4095 yaklaşımı: çevre şerit × bemessungsregen */
  var Aein = 2*(W + D) * pnum(R.strip, 2.00);
  var Qzu  = pnum(R.rain,250) * Aein / 10000 * pnum(R.psi,0.30);     /* l/s */
  var okQ  = Qkap >= Qzu;
  var util = Qzu / Math.max(Qkap, 1e-6);

  /* --- yalıtım (Abdichtung) --- */
  var sd = sealDef(R.seal);
  var reqT = sd[3][R.wclass];                             /* mm — sınıf için asgari */
  var okClass = (reqT !== undefined);
  var isWU = (R.seal === "wu");
  var haveT = isWU ? (plate*1000) : (pnum(R.sealT,0.004)*1000);
  var okT  = okClass && (haveT >= reqT - 1e-6);
  var okSockel = pnum(R.sockel,0.30) >= 0.30;             /* DIN 18533: ≥ 30 cm OK zemin üstü */
  /* W1.1-E az geçirgen zeminde drenaj şartı */
  var needDrain = (R.wclass === "W1.1-E" && R.kSoil !== "stark");
  var okDrain = !needDrain || R.on;

  /* --- perimetre yalıtımı --- */
  var pm = perimDef(R.perim);
  var dW = d.extWall || 0.24;
  var Rsi = 0.13, lamC = 2.30;
  var Rtot = Rsi + dW/lamC + pnum(R.perimT,0.10)/pm[1];
  var U = 1/Rtot;
  var Uref = 0.35;                                        /* GEG: erdberührt */
  var okU = U <= Uref + 1e-9;
  var okDruck = pm[2] >= 300;

  /* --- metraj --- */
  var hWall  = Math.max(0.10, (zGel + pnum(R.sockel,0.30)) - (-tGr));  /* yalıtılan duvar yüksekliği */
  var Aseal  = 2*(W + D) * hWall;
  var Aperim = 2*(W + D) * Math.max(0.10, zGel - (-tGr));
  var Vgrav  = Lpipe * pnum(R.gravel,0.25) * Math.max(0.20, zGel - 0.20 - zPipe);
  var Vkb    = (W + 0.6) * (D + 0.6) * pnum(R.kb, 0.15);
  var Vsau   = (W + 0.6) * (D + 0.6) * pnum(R.sauber, 0.05);
  var Avlies = Lpipe * (2*Math.max(0.20, zGel - 0.20 - zPipe) + pnum(R.gravel,0.25)) * 1.15;

  var cost = Aseal*sd[4] + Aperim*pm[3] + Vgrav*38 + Lpipe*14 + nShaft*180 +
             (R.vlies ? Avlies*3.5 : 0) + (R.noppe ? Aperim*6.5 : 0) + Vsau*95 + Vkb*32;

  return { tGr:tGr, plate:plate, kel:kel, zGel:zGel, zPlB:zPlB, zPlT:zPlT, zSau:zSau, zKB:zKB, zPipe:zPipe,
           dInner:dInner, offs:offs, Lpipe:Lpipe, nShaft:nShaft, extraShaft:extraShaft,
           Qvoll:Qvoll, Qkap:Qkap, Qzu:Qzu, okQ:okQ, util:util, slope:pnum(R.slope,0.5),
           seal:sd, reqT:reqT, haveT:haveT, okClass:okClass, okT:okT, isWU:isWU,
           okSockel:okSockel, needDrain:needDrain, okDrain:okDrain,
           perim:pm, U:U, Uref:Uref, okU:okU, okDruck:okDruck, R:Rtot, hWall:hWall,
           Aseal:Aseal, Aperim:Aperim, Vgrav:Vgrav, Vkb:Vkb, Vsau:Vsau, Avlies:Avlies,
           cost:cost,
           nOk: [okQ, okT, okSockel, okDrain, okU].filter(function(x){return x;}).length,
           nAll: 5 };
}
/* bir aks düğümündeki yük alanı */
function tribArea(ax, ay){
  var gx = P.grid.x, gy = P.grid.y;
  var wx = ((ax>0 ? gx[ax-1] : 0) + (ax<gx.length ? gx[ax] : 0)) / 2;
  var wy = ((ay>0 ? gy[ay-1] : 0) + (ay<gy.length ? gy[ay] : 0)) / 2;
  return { wx:wx, wy:wy, A:wx*wy };
}
function colLoad(ax, ay){
  var d = DERIVED || derive();
  /* çözücü açıksa o düğümdeki kolonun gerçek normal kuvvetini kullan */
  if (typeof solverOn === "function" && solverOn() && typeof SOLVECACHE !== "undefined" && SOLVECACHE && SOLVECACHE.ok){
    var best = 0;
    P.columns.forEach(function(c){
      if (pnum(c.ax,-1) !== ax || pnum(c.ay,-1) !== ay) return;
      var r = SOLVECACHE.byCol[c.id];
      if (r && r.N > best) best = r.N;
    });
    if (best > 0) return best;
  }
  var tr = tribArea(ax, ay);
  var nSt = P.storeys.length;
  return d.qd * tr.A * nSt;         // kN, yük alanı yöntemi (yedek)
}
function wallLoad(dir, line, seg){
  var d = DERIVED || derive();
  var gx = P.grid.x, gy = P.grid.y;
  var w;
  if (dir === "x") w = ((line>0 ? gy[line-1] : 0) + (line<gy.length ? gy[line] : 0)) / 2;
  else             w = ((line>0 ? gx[line-1] : 0) + (line<gx.length ? gx[line] : 0)) / 2;
  return d.qd * w * P.storeys.length;   // kN/m
}
function findFound(pred){
  for (var i=0;i<P.foundations.length;i++) if (pred(P.foundations[i])) return i;
  return -1;
}
function toggleFoundNode(ax, ay){
  var kind = UI.foundType || "einzel";
  var i = findFound(function(f){ return f.kind!=="streifen" && f.kind!=="platte" && pnum(f.ax,-1)===ax && pnum(f.ay,-1)===ay; });
  if (i >= 0){ var nm = P.foundations[i].name; P.foundations.splice(i,1); snap("Temel kaldırıldı: "+nm); render(); return; }
  var N = colLoad(ax, ay);
  var need = Math.sqrt(Math.max(N,1) / Math.max(P.soil.sigZul,1));
  var a = Math.max(0.80, Math.ceil(need*20)/20);
  var f = { id:uid("g"), name:"F-"+AX[ax]+(ay+1), kind:kind, ax:ax, ay:ay,
            a:a, b:a, d:Math.max(0.35, Math.round(a*0.30*20)/20), t:P.soil.tGr,
            nPiles:4, pileD:0.40, pileL:8.00, mat:P.design.beton };
  P.foundations.push(f); snap("Temel eklendi: "+f.name+" ("+foundLabel(kind)+")"); render();
}
function toggleFoundStrip(dir, line, seg){
  var i = findFound(function(f){ return f.kind==="streifen" && f.dir===dir && pnum(f.line,-1)===line && pnum(f.seg,-1)===seg; });
  if (i >= 0){ var nm = P.foundations[i].name; P.foundations.splice(i,1); snap("Şerit temel kaldırıldı: "+nm); render(); return; }
  var n = wallLoad(dir, line, seg);
  var bneed = Math.max(0.50, Math.ceil((n / Math.max(P.soil.sigZul,1))*20)/20);
  var f = { id:uid("g"), name:segName("FS",dir,line,seg), kind:"streifen", dir:dir, line:line, seg:seg,
            a:bneed, b:bneed, d:Math.max(0.30, Math.round(bneed*0.5*20)/20), t:P.soil.tGr, mat:P.design.beton };
  P.foundations.push(f); snap("Şerit temel eklendi: "+f.name); render();
}
function togglePlatte(){
  var i = findFound(function(f){ return f.kind==="platte"; });
  if (i >= 0){ P.foundations.splice(i,1); snap("Radye kaldırıldı"); }
  else P.foundations.push({ id:uid("g"), name:"BP-01", kind:"platte", d:0.40, t:P.soil.tGr, mat:P.design.beton }),
       snap("Radye eklendi");
  render();
}

var LASTG = null;   // son plan çiziminin ölçek/geometri bilgisi
var MARQ = null;    // seçim dikdörtgeni (px)

/* ---------- çoklu seçim ---------- */
function selList(){ if (!UI.selSet) UI.selSet = []; return UI.selSet; }
function selHas(id){ return selList().indexOf(id) >= 0; }
function selClear(){ UI.selSet = []; UI.sel = null; }
function selSet1(id){ UI.selSet = id ? [id] : []; UI.sel = id || null; }
function selToggle(id){
  var L = selList(), i = L.indexOf(id);
  if (i >= 0) L.splice(i,1); else L.push(id);
  UI.sel = (L.length === 1) ? L[0] : null;
}
function isAxisId(id){ return typeof id === "string" && id.indexOf("ax:") === 0; }
function axisParts(id){ var p2 = id.split(":"); return { dir:p2[1], i:parseInt(p2[2],10) }; }

/* ---------- aks konumları (mutlak) ---------- */
function axisPos(dir){
  var a = [0], acc = 0;
  P.grid[dir].forEach(function(L){ acc += L; a.push(acc); });
  return a;
}
function setAxisPos(dir, i, val){
  var pos = axisPos(dir);
  var lo = (i > 0) ? pos[i-1] + 0.10 : -1e9;
  var hi = (i < pos.length-1) ? pos[i+1] - 0.10 : 1e9;
  pos[i] = Math.max(lo, Math.min(hi, val));
  if (i === 0 && pos[0] !== 0){
    /* ilk aks kaydıysa herkesi kaydır, orijini sıfırla */
    var sh = pos[0];
    for (var k=0;k<pos.length;k++) pos[k] -= sh;
    shiftFree(dir === "x" ? -sh : 0, dir === "y" ? -sh : 0);
  }
  var sp = [];
  for (var j=1;j<pos.length;j++) sp.push(Math.max(0.10, pos[j]-pos[j-1]));
  P.grid[dir] = sp;
}
function shiftFree(dx, dy){
  DRAWLISTS.forEach(function(L){
    (P[L[0]]||[]).forEach(function(r){
      if (!r.free) return;
      var f = r.free;
      if (f.x1 !== undefined){ f.x1 += dx; f.x2 += dx; f.y1 += dy; f.y2 += dy; }
      else { f.x += dx; f.y += dy; }
    });
  });
}

/* ---------- seçimi taşı / kopyala ---------- */
function moveSelection(dx, dy){
  var G = gridM(), n = 0;
  selList().forEach(function(id){
    if (isAxisId(id)){
      var ap = axisParts(id);
      var pos = axisPos(ap.dir);
      setAxisPos(ap.dir, ap.i, pos[ap.i] + (ap.dir === "x" ? dx : dy));
      n++; return;
    }
    var e = elById(id); if (!e) return;
    var f = freeze(e.list, e.row, G); if (!f) return;
    if (f.x1 !== undefined){ f.x1 += dx; f.x2 += dx; f.y1 += dy; f.y2 += dy; }
    else { f.x += dx; f.y += dy; }
    n++;
  });
  return n;
}
function copySelection(dx, dy){
  var G = gridM(), added = [];
  selList().forEach(function(id){
    if (isAxisId(id)) return;
    var e = elById(id); if (!e) return;
    freeze(e.list, e.row, G);
    var c = JSON.parse(JSON.stringify(e.row));
    c.id = uid(e.list.charAt(0));
    c.name = (e.row.name || e.list) + "′";
    var f = c.free;
    if (f){
      if (f.x1 !== undefined){ f.x1 += dx; f.x2 += dx; f.y1 += dy; f.y2 += dy; }
      else { f.x += dx; f.y += dy; }
    }
    P[e.list].push(c); added.push(c.id);
  });
  if (added.length) UI.selSet = added;
  UI.sel = (added.length === 1) ? added[0] : null;
  return added.length;
}
function deleteSelection(){
  var n = 0;
  selList().slice().forEach(function(id){
    if (isAxisId(id)){
      var ap = axisParts(id);
      if (P.grid[ap.dir].length > 1){
        var idx = Math.min(ap.i, P.grid[ap.dir].length-1);
        P.grid[ap.dir].splice(idx,1); n++;
      }
      return;
    }
    var e = elById(id); if (!e) return;
    var L = P[e.list];
    for (var i=0;i<L.length;i++) if (L[i].id === id){ L.splice(i,1); n++; break; }
  });
  selClear();
  return n;
}
/* geometrinin px kutusu — marquee testi için */
function elBBox(entry){
  var g = entry.g;
  if (entry.k === "ln") return { x1:Math.min(g.x1,g.x2), y1:Math.min(g.y1,g.y2), x2:Math.max(g.x1,g.x2), y2:Math.max(g.y1,g.y2) };
  if (entry.k === "rc") return { x1:g.x, y1:g.y, x2:g.x+g.w, y2:g.y+g.h };
  var cx = (g.x !== undefined ? g.x : g.x1), cy = (g.y !== undefined ? g.y : g.y1);
  return { x1:cx-6, y1:cy-6, x2:cx+6, y2:cy+6 };
}
function bboxIn(b, r){ return b.x1 >= r.x1 && b.x2 <= r.x2 && b.y1 >= r.y1 && b.y2 <= r.y2; }
function bboxHit(b, r){ return !(b.x2 < r.x1 || b.x1 > r.x2 || b.y2 < r.y1 || b.y1 > r.y2); }

  ["shearwalls","Perde duvar","#E05C8A"], ["parapets","Parapet","#6ECFA0"],

function drawLayerOn(list){

function drawHandles(){
  if (!LASTG) return "";
  var it = LASTG.items, out = [];
  var sel = UI.sel;
  var S = LASTG.s, X0 = LASTG.X0, Y0 = LASTG.Y0, Gm = LASTG.G;
  /* aks tutamakları (en altta) */
  var px = Gm.x.map(function(v){ return X0 + v*S; });
  var py = Gm.y.map(function(v){ return Y0 + v*S; });
  var yTop = py[0] - 70, yBot = py[py.length-1] + 46;
  var xLef = px[0] - 70, xRig = px[px.length-1] + 46;
  px.forEach(function(x, i){
    var id = "ax:x:"+i, on = selHas(id);
    out.push('<line class="dax'+(on?" sel":"")+'" x1="'+x+'" y1="'+yTop+'" x2="'+x+'" y2="'+yBot+
      '" data-drag="axis" data-id="'+id+'"><title>Aks '+AX[i]+' — sürükle</title></line>');
    out.push('<circle class="daxk'+(on?" sel":"")+'" cx="'+x+'" cy="'+(yTop+12)+'" r="13" data-drag="axis" data-id="'+id+'"/>');
  });
  py.forEach(function(y, i){
    var id = "ax:y:"+i, on = selHas(id);
    out.push('<line class="dax'+(on?" sel":"")+'" x1="'+xLef+'" y1="'+y+'" x2="'+xRig+'" y2="'+y+
      '" data-drag="axis" data-id="'+id+'"><title>Aks '+(i+1)+' — sürükle</title></line>');
    out.push('<circle class="daxk'+(on?" sel":"")+'" cx="'+(xLef+12)+'" cy="'+y+'" r="13" data-drag="axis" data-id="'+id+'"/>');
  });
  /* büyük tutamaklar altta, küçükler üstte; seçili en üstte */
  var order = Object.keys(it).sort(function(a,b){
    var sa = selHas(a) ? 1 : 0, sb = selHas(b) ? 1 : 0;
    if (sa !== sb) return sa - sb;
    var ra = { rc:0, ln:1, op:2, pt:3 }[it[a].k] || 0;
    var rb = { rc:0, ln:1, op:2, pt:3 }[it[b].k] || 0;
    return ra - rb;
  });
  for (var oi = 0; oi < order.length; oi++){
    var id = order[oi];
    var e = it[id]; if (!e) continue;
    if (!drawLayerOn(e.list)) continue;
    var col = "#7FE0F5";
    for (var i=0;i<DRAWLISTS.length;i++) if (DRAWLISTS[i][0] === e.list) col = DRAWLISTS[i][2];
    var isSel = selHas(id);
    if (e.k === "ln"){
      var g = e.g;
      out.push('<line class="dh dline'+(isSel?" sel":"")+'" style="stroke:'+col+'" x1="'+g.x1+'" y1="'+g.y1+'" x2="'+g.x2+'" y2="'+g.y2+
        '" data-drag="move" data-id="'+id+'" data-el="'+id+'"/>');
      if (isSel){
        out.push('<circle class="dk" cx="'+g.x1+'" cy="'+g.y1+'" r="6" data-drag="p1" data-id="'+id+'"/>');
        out.push('<circle class="dk" cx="'+g.x2+'" cy="'+g.y2+'" r="6" data-drag="p2" data-id="'+id+'"/>');
      }
    } else if (e.k === "pt" || e.k === "op"){
      var g2 = e.g, cx = (g2.x !== undefined ? g2.x : g2.x1), cy = (g2.y !== undefined ? g2.y : g2.y1);
      out.push('<circle class="dh dpt'+(isSel?" sel":"")+'" style="stroke:'+col+'" cx="'+cx+'" cy="'+cy+'" r="'+(e.k==="op"?9:13)+'" data-drag="move" data-id="'+id+'" data-el="'+id+'"/>');
      if (isSel && e.k === "op")
        out.push('<circle class="dk rot" cx="'+(cx+26)+'" cy="'+cy+'" r="6" data-drag="rot" data-id="'+id+'"/>');
    } else if (e.k === "rc"){
      var g3 = e.g;
      /* döşemeler tüm planı kapladığı için sadece kenardan tutulur;
         yırtık, merdiven ve balkon içinden de tutulabilir */
      var inner = (e.list !== "slabs");
      out.push('<rect class="dh '+(inner?"drcf":"drc")+(isSel?" sel":"")+'" style="stroke:'+col+(inner?(";fill:"+col):"")+
        '" x="'+g3.x+'" y="'+g3.y+'" width="'+g3.w+'" height="'+g3.h+
        '" data-drag="move" data-id="'+id+'" data-el="'+id+'"/>');
      if (isSel){
        out.push('<circle class="dk" cx="'+(g3.x+g3.w)+'" cy="'+(g3.y+g3.h)+'" r="6" data-drag="se" data-id="'+id+'"/>');
        out.push('<circle class="dk" cx="'+g3.x+'" cy="'+g3.y+'" r="6" data-drag="nw" data-id="'+id+'"/>');
      }
    }
  }
  lineRubber(out, X0, Y0, S);
  cmdRubber(out, X0, Y0, S);
  if (SNAPG.length) out.push(SNAPG.join(""));
  if (MARQ) out.push('<rect class="marq" x="'+Math.min(MARQ.x1,MARQ.x2)+'" y="'+Math.min(MARQ.y1,MARQ.y2)+
    '" width="'+Math.abs(MARQ.x2-MARQ.x1)+'" height="'+Math.abs(MARQ.y2-MARQ.y1)+'"/>');
  return '<g class="hlayer">'+out.join("")+'</g>';
}

/* piksel <-> metre */
function pxToM(px, py){
  if (!LASTG) return { x:0, y:0 };
  return { x:(px - LASTG.X0)/LASTG.s, y:(py - LASTG.Y0)/LASTG.s };
}
/* yakalama: aks çizgileri + diğer eleman uçları + raster */
function snapVal(v, cands, tolM){
  var best = null, bd = tolM;
  for (var i=0;i<cands.length;i++){
    var dd = Math.abs(cands[i]-v);
    if (dd < bd){ bd = dd; best = cands[i]; }
  }
  return best;
}
function snapPoint(mx, my, noSnap){
  SNAPG = [];
  if (noSnap) return { x:mx, y:my };
  var G = LASTG.G, s = LASTG.s, tol = 12/s;
  var skip = DDRAG ? DDRAG.id : null;
  var cx = G.x.slice(), cy = G.y.slice();
  DRAWLISTS.forEach(function(L){
    (P[L[0]]||[]).forEach(function(r){
      if (r.id === skip) return;
      var g = geomOf(L[0], r, G); if (!g) return;
      if (g.x1 !== undefined){ cx.push(g.x1, g.x2); cy.push(g.y1, g.y2); }
      else if (g.w !== undefined){ cx.push(g.x, g.x+g.w); cy.push(g.y, g.y+g.h); }
      else if (g.x !== undefined){ cx.push(g.x); cy.push(g.y); }
    });
  });
  var sx = snapVal(mx, cx, tol), sy = snapVal(my, cy, tol);
  var rx = (sx !== null) ? sx : Math.round(mx/UI.raster)*UI.raster;
  var ry = (sy !== null) ? sy : Math.round(my/UI.raster)*UI.raster;
  if (sx !== null) SNAPG.push('<line class="snapg" x1="'+(LASTG.X0+sx*s)+'" y1="60" x2="'+(LASTG.X0+sx*s)+'" y2="560"/>');
  if (sy !== null) SNAPG.push('<line class="snapg" x1="80" y1="'+(LASTG.Y0+sy*s)+'" x2="820" y2="'+(LASTG.Y0+sy*s)+'"/>');
  return { x:rx, y:ry };
}
/* ============================================================
   NESNE KENETLEME (OSNAP) — AutoCAD mantığı
   Gerçek 2B nokta yakalama: uç, orta, kesişim, merkez, dik, yakın.
   ============================================================ */
var OSNAPS = [
  ["uc",     "Uç",      "□", 1],
  ["kesisim","Kesişim", "✕", 2],
  ["orta",   "Orta",    "△", 3],
  ["merkez", "Merkez",  "○", 4],
  ["dik",    "Dik",     "⊥", 5],
  ["yakin",  "Yakın",   "⌒", 6],
  ["izgara", "Izgara",  "+", 7]
];
function osnapOn(k){
  if (!UI.osnap) UI.osnap = { uc:true, kesisim:true, orta:true, merkez:true, dik:true, yakin:false, izgara:true };
  return UI.osnap[k] !== false;
}
function ensureSnapUI(){
  if (!UI.osnap) UI.osnap = { uc:true, kesisim:true, orta:true, merkez:true, dik:true, yakin:false, izgara:true };
  if (UI.ortho === undefined) UI.ortho = false;
  if (UI.polar === undefined) UI.polar = false;
  if (UI.polarStep === undefined) UI.polarStep = 15;
  if (UI.osnapOn === undefined) UI.osnapOn = true;
}

/* plandaki bütün çizgi parçaları (yakalama için) */
function snapSegments(skipId){
  var G = LASTG.G, segs = [];
  DRAWLISTS.forEach(function(L){
    (P[L[0]]||[]).forEach(function(r){
      if (r.id === skipId) return;
      var g = geomOf(L[0], r, G); if (!g) return;
      if (g.x1 !== undefined) segs.push([g.x1,g.y1,g.x2,g.y2]);
      else if (g.w !== undefined){
        segs.push([g.x,g.y,g.x+g.w,g.y]);
        segs.push([g.x+g.w,g.y,g.x+g.w,g.y+g.h]);
        segs.push([g.x+g.w,g.y+g.h,g.x,g.y+g.h]);
        segs.push([g.x,g.y+g.h,g.x,g.y]);
      }
    });
  });
  /* aks çizgileri */
  var xm = G.x[G.x.length-1], ym = G.y[G.y.length-1];
  G.x.forEach(function(v){ segs.push([v,G.y[0],v,ym]); });
  G.y.forEach(function(v){ segs.push([G.x[0],v,xm,v]); });
  return segs;
}
function segInter(a, b){
  var x1=a[0],y1=a[1],x2=a[2],y2=a[3], x3=b[0],y3=b[1],x4=b[2],y4=b[3];
  var d = (x1-x2)*(y3-y4) - (y1-y2)*(x3-x4);
  if (Math.abs(d) < 1e-12) return null;
  var t = ((x1-x3)*(y3-y4) - (y1-y3)*(x3-x4)) / d;
  var u = ((x1-x3)*(y1-y2) - (y1-y3)*(x1-x2)) / d;
  if (t < -1e-9 || t > 1+1e-9 || u < -1e-9 || u > 1+1e-9) return null;
  return { x: x1 + t*(x2-x1), y: y1 + t*(y2-y1) };
}
function nearestOnSeg(sg, px, py){
  var dx = sg[2]-sg[0], dy = sg[3]-sg[1], L2 = dx*dx+dy*dy;
  if (L2 < 1e-12) return { x:sg[0], y:sg[1], t:0 };
  var t = ((px-sg[0])*dx + (py-sg[1])*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return { x: sg[0]+t*dx, y: sg[1]+t*dy, t:t };
}

/* ana yakalama — from: dik/izleme için çıkış noktası */
function osnap(mx, my, noSnap, skipId, from){
  ensureSnapUI();
  SNAPG = [];
  if (noSnap || !UI.osnapOn) return { x:mx, y:my, type:null };
  if (!LASTG) return { x:mx, y:my, type:null };
  var s = LASTG.s, tol = 14/s;
  var segs = snapSegments(skipId);
  var best = null;
  function cand(x, y, type, pr){
    var d = Math.sqrt(Math.pow(x-mx,2) + Math.pow(y-my,2));
    if (d > tol) return;
    if (!best || pr < best.pr || (pr === best.pr && d < best.d)) best = { x:x, y:y, type:type, pr:pr, d:d };
  }
  /* 1 — uç noktalar */
  if (osnapOn("uc")) segs.forEach(function(g){ cand(g[0],g[1],"uc",1); cand(g[2],g[3],"uc",1); });
  /* 2 — kesişimler (yalnız fareye yakın parçalar arasında) */
  if (osnapOn("kesisim")){
    var near = segs.filter(function(g){ return nearestOnSeg(g,mx,my) && Math.hypot(nearestOnSeg(g,mx,my).x-mx, nearestOnSeg(g,mx,my).y-my) < tol*3; });
    for (var i=0;i<near.length && i<40;i++)
      for (var j=i+1;j<near.length && j<40;j++){
        var ip = segInter(near[i], near[j]);
        if (ip) cand(ip.x, ip.y, "kesisim", 2);
      }
  }
  /* 3 — orta noktalar */
  if (osnapOn("orta")) segs.forEach(function(g){ cand((g[0]+g[2])/2, (g[1]+g[3])/2, "orta", 3); });
  /* 4 — daire kolon merkezleri */
  if (osnapOn("merkez")){
    (P.columns||[]).forEach(function(c){
      var g = geomOf("columns", c, LASTG.G); if (g) cand(g.x, g.y, "merkez", 4);
    });
  }
  /* 5 — dik ayak (çizim sürerken) */
  if (osnapOn("dik") && from){
    segs.forEach(function(g){
      var dx = g[2]-g[0], dy = g[3]-g[1], L2 = dx*dx+dy*dy;
      if (L2 < 1e-12) return;
      var t = ((from.x-g[0])*dx + (from.y-g[1])*dy) / L2;
      if (t < 0 || t > 1) return;
      cand(g[0]+t*dx, g[1]+t*dy, "dik", 5);
    });
  }
  /* 6 — çizgi üzerinde en yakın nokta */
  if (osnapOn("yakin")) segs.forEach(function(g){ var n = nearestOnSeg(g,mx,my); cand(n.x, n.y, "yakin", 6); });

  if (best){
    SNAPG.push(osnapMarker(best.x, best.y, best.type));
    return { x:best.x, y:best.y, type:best.type };
  }
  /* 7 — izgara */
  if (osnapOn("izgara")){
    var rx = Math.round(mx/UI.raster)*UI.raster, ry = Math.round(my/UI.raster)*UI.raster;
    return { x:rx, y:ry, type:"izgara" };
  }
  return { x:mx, y:my, type:null };
}
function osnapMarker(x, y, type){
  var px = LASTG.X0 + x*LASTG.s, py = LASTG.Y0 + y*LASTG.s, r = 7;
  var c = "#6ECFA0";
  if (type === "uc")      return '<rect class="osm" x="'+fmt2(px-r)+'" y="'+fmt2(py-r)+'" width="'+(2*r)+'" height="'+(2*r)+'" stroke="'+c+'"/>';
  if (type === "orta")    return '<polygon class="osm" points="'+fmt2(px)+','+fmt2(py-r)+' '+fmt2(px+r)+','+fmt2(py+r)+' '+fmt2(px-r)+','+fmt2(py+r)+'" stroke="'+c+'"/>';
  if (type === "kesisim") return '<g class="osm" stroke="'+c+'"><line x1="'+fmt2(px-r)+'" y1="'+fmt2(py-r)+'" x2="'+fmt2(px+r)+'" y2="'+fmt2(py+r)+'"/>'+
                                 '<line x1="'+fmt2(px+r)+'" y1="'+fmt2(py-r)+'" x2="'+fmt2(px-r)+'" y2="'+fmt2(py+r)+'"/></g>';
  if (type === "merkez")  return '<circle class="osm" cx="'+fmt2(px)+'" cy="'+fmt2(py)+'" r="'+r+'" stroke="'+c+'"/>';
  if (type === "dik")     return '<g class="osm" stroke="'+c+'"><path d="M'+fmt2(px-r)+' '+fmt2(py-r)+' L'+fmt2(px-r)+' '+fmt2(py+r)+' L'+fmt2(px+r)+' '+fmt2(py+r)+'"/>'+
                                 '<line x1="'+fmt2(px-r)+'" y1="'+fmt2(py+2)+'" x2="'+fmt2(px+2)+'" y2="'+fmt2(py+2)+'"/></g>';
  if (type === "yakin")   return '<path class="osm" d="M'+fmt2(px-r)+' '+fmt2(py+r)+' Q'+fmt2(px)+' '+fmt2(py-r)+' '+fmt2(px+r)+' '+fmt2(py+r)+'" stroke="'+c+'"/>';
  return '<g class="osm" stroke="'+c+'" opacity=".7"><line x1="'+fmt2(px-5)+'" y1="'+fmt2(py)+'" x2="'+fmt2(px+5)+'" y2="'+fmt2(py)+'"/>'+
         '<line x1="'+fmt2(px)+'" y1="'+fmt2(py-5)+'" x2="'+fmt2(px)+'" y2="'+fmt2(py+5)+'"/></g>';
}
/* gerçek nesne kenetlemesi mi — ızgara sayılmaz */
function isObjSnap(t){ return !!t && t !== "izgara"; }
function osnapLabel(t){
  for (var i=0;i<OSNAPS.length;i++) if (OSNAPS[i][0]===t) return OSNAPS[i][1];
  return "";
}
/* ortho / kutupsal açı kısıtı */
function constrainDir(from, x, y, shift){
  if (!from || shift) return { x:x, y:y, ang:null };
  var dx = x - from.x, dy = y - from.y;
  var L = Math.sqrt(dx*dx + dy*dy);
  if (L < 1e-9) return { x:x, y:y, ang:null };
  var ang = Math.atan2(dy, dx) * 180/Math.PI;
  if (UI.ortho){
    var snapA = Math.round(ang/90)*90;
    return { x: from.x + L*Math.cos(snapA*Math.PI/180), y: from.y + L*Math.sin(snapA*Math.PI/180), ang:snapA };
  }
  if (UI.polar){
    var st = UI.polarStep || 15;
    var pa = Math.round(ang/st)*st;
    if (Math.abs(((ang-pa+540)%360)-180) < st*0.45)
      return { x: from.x + L*Math.cos(pa*Math.PI/180), y: from.y + L*Math.sin(pa*Math.PI/180), ang:pa };
  }
  return { x:x, y:y, ang:ang };
}

/* ============================================================
   ZİNCİRLİ ÇİZGİ — AutoCAD LINE komutu gibi
   tıkla → nokta, tıkla → parça, Esc/Enter → bitir, C → kapat
   ============================================================ */
var LPATH = null;   /* { pts:[{x,y}], cur:{x,y}, ang:0, len:0, snap:null } */

function lineStart(pt){ LPATH = { pts:[{x:pt.x, y:pt.y}], cur:{x:pt.x, y:pt.y}, ang:0, len:0, snap:pt.type }; }
function lineAddPoint(pt){
  if (!LPATH){ lineStart(pt); return; }
  var last = LPATH.pts[LPATH.pts.length-1];
  var d = Math.hypot(pt.x-last.x, pt.y-last.y);
  if (d < 1e-4) return;
  addLine(UI.lineKind || "cizgi", last.x, last.y, pt.x, pt.y);
  LPATH.pts.push({x:pt.x, y:pt.y});
  LPATH.cur = {x:pt.x, y:pt.y};
}
function lineClose(){
  if (!LPATH || LPATH.pts.length < 3){ lineEnd(); return; }
  var a = LPATH.pts[LPATH.pts.length-1], b = LPATH.pts[0];
  if (Math.hypot(a.x-b.x, a.y-b.y) > 1e-4) addLine(UI.lineKind || "cizgi", a.x, a.y, b.x, b.y);
  snap("Çizgi zinciri kapatıldı: "+(LPATH.pts.length)+" nokta");
  LPATH = null; render();
}
function lineUndo(){
  if (!LPATH || LPATH.pts.length < 2) return;
  LPATH.pts.pop();
  if (P.lines.length) P.lines.pop();
  LPATH.cur = LPATH.pts[LPATH.pts.length-1];
  render();
}
/* panelden uzunluk/açı yazıp nokta ekle */
function lineExactPoint(){
  var le = document.getElementById("lnlen"), ae = document.getElementById("lnang");
  var L = le ? pnum(le.value, NaN) : NaN;
  var A = ae ? pnum(ae.value, NaN) : NaN;
  if (!isFinite(L) || L <= 0){ flash("Önce uzunluk yaz"); return; }
  if (!isFinite(A)) A = (UI.ortho ? 0 : 0);
  if (!LPATH){ flash("Önce plana tıklayıp başlangıç noktası koy"); return; }
  var last = LPATH.pts[LPATH.pts.length-1];
  var rad = A * Math.PI/180;
  lineAddPoint({ x: last.x + L*Math.cos(rad), y: last.y + L*Math.sin(rad), type:null });
  if (le) le.value = "";
  snap("Çizgi parçası: "+fmt(L,3)+" m · "+fmt(A,1)+"°");
  render();
}
function lineEnd(){
  if (!LPATH) return;
  var n = LPATH.pts.length - 1;
  LPATH = null; SNAPG = [];
  if (n > 0) snap("Çizgi zinciri: "+n+" parça");
  render();
}
/* lastik bant + ölçü etiketi */
function lineRubber(out, X0, Y0, S){
  if (!LPATH) return;
  var lk = lineKindDef(UI.lineKind || "cizgi");
  var last = LPATH.pts[LPATH.pts.length-1];
  var lx1 = X0 + last.x*S, ly1 = Y0 + last.y*S;
  var lx2 = X0 + LPATH.cur.x*S, ly2 = Y0 + LPATH.cur.y*S;
  /* önceki noktalar */
  LPATH.pts.forEach(function(q, i){
    out.push('<circle cx="'+fmt2(X0+q.x*S)+'" cy="'+fmt2(Y0+q.y*S)+'" r="'+(i===0?4.5:3.2)+'" fill="'+lk[2]+'" opacity=".9"/>');
  });
  out.push('<line x1="'+fmt2(lx1)+'" y1="'+fmt2(ly1)+'" x2="'+fmt2(lx2)+'" y2="'+fmt2(ly2)+
    '" stroke="'+lk[2]+'" stroke-width="'+lk[3]+'" stroke-dasharray="6 4" opacity=".9"/>');
  /* uzunluk + açı etiketi */
  var dx = LPATH.cur.x-last.x, dy = LPATH.cur.y-last.y;
  var L = Math.sqrt(dx*dx+dy*dy), A = Math.atan2(dy,dx)*180/Math.PI;
  if (A < 0) A += 360;
  var tx = lx2 + 14, ty = ly2 - 12;
  out.push('<rect x="'+fmt2(tx-4)+'" y="'+fmt2(ty-12)+'" width="118" height="32" rx="4" fill="#0A1220" fill-opacity=".9" stroke="'+lk[2]+'" stroke-width="1"/>');
  out.push('<text x="'+fmt2(tx+2)+'" y="'+fmt2(ty+1)+'" font-family="ui-monospace,monospace" font-size="11" fill="'+lk[2]+'">'+fmt(L,3)+' m</text>');
  out.push('<text x="'+fmt2(tx+2)+'" y="'+fmt2(ty+15)+'" font-family="ui-monospace,monospace" font-size="10" fill="#9FD8EA">'+fmt(A,1)+'°'+
    (UI.ortho?' · ORTHO':(UI.polar?' · KUTUP':''))+'</text>');
  /* ölçü oku */
  out.push('<circle cx="'+fmt2(lx2)+'" cy="'+fmt2(ly2)+'" r="3" fill="'+lk[2]+'"/>');
}

/* ============================================================
   UÇLARI BİRLEŞTİR — seçili çizgilerin yakın uçlarını kaynakla
   ============================================================ */
function weldEnds(tolM){
  ensureLines();
  var tol = tolM || 0.25;
  var ids = selList().filter(function(x){ return !isAxisId(x); });
  var rows = [];
  if (ids.length){
    ids.forEach(function(id){ var e = elById(id); if (e && e.list === "lines") rows.push(e.row); });
  }
  if (rows.length < 2) rows = P.lines.slice();
  if (rows.length < 2) return 0;
  /* uç noktaları topla */
  var pts = [];
  rows.forEach(function(r){
    pts.push({ r:r, k:"1", x:r.free.x1, y:r.free.y1 });
    pts.push({ r:r, k:"2", x:r.free.x2, y:r.free.y2 });
  });
  var used = [], n = 0;
  for (var i=0;i<pts.length;i++){
    if (used[i]) continue;
    var grp = [pts[i]];
    for (var j=i+1;j<pts.length;j++){
      if (used[j] || pts[j].r === pts[i].r) continue;
      if (Math.hypot(pts[j].x-pts[i].x, pts[j].y-pts[i].y) <= tol){ grp.push(pts[j]); used[j] = 1; }
    }
    if (grp.length < 2) continue;
    var ax = 0, ay = 0;
    grp.forEach(function(q){ ax += q.x; ay += q.y; });
    ax /= grp.length; ay /= grp.length;
    grp.forEach(function(q){
      if (q.k === "1"){ q.r.free.x1 = ax; q.r.free.y1 = ay; }
      else            { q.r.free.x2 = ax; q.r.free.y2 = ay; }
    });
    n += grp.length;
  }
  return n;
}


/* ============================================================
   KOMUTLAR — TAŞI / KOPYALA / DÖNDÜR / AYNALA   (AutoCAD mantığı)
   İki tıklama: taban noktası → ikinci nokta. Esc iptal eder.
   Nesne kenetlemesi, ORTHO ve kutupsal izleme burada da geçerli.
   ============================================================ */
var CMD = null;        /* {name, step, ids, base, cur} */
var CMDLOCK = 0;       /* komut bitince tıklamanın araca gitmesini engeller */
var CMDS = {
  move:   { ad:"TAŞI",    ic:"✛", ks:["taban noktasını tıkla","ikinci noktayı tıkla"] },
  copy:   { ad:"KOPYALA", ic:"⧉", ks:["taban noktasını tıkla","kopyanın yerini tıkla"] },
  rotate: { ad:"DÖNDÜR",  ic:"⟳", ks:["dönme merkezini tıkla","açıyı tıkla ya da yaz"] },
  mirror: { ad:"AYNALA",  ic:"⇄", ks:["ayna ekseninin 1. noktası","ayna ekseninin 2. noktası"] }
};
function cmdOn(){ return !!CMD; }
function selIds(){ return selList().filter(function(x){ return !isAxisId(x); }); }
/* seçimde yalnız dikdörtgen eleman mı var? (döşeme, yırtık, merdiven, balkon, mobilya) */
function selAllRect(ids){
  var any = false;
  for (var i=0;i<ids.length;i++){
    var e = elById(ids[i]); if (!e) continue;
    any = true;
    if (geomKind(e.list, e.row) !== "rc") return false;
  }
  return any;
}
function cmdStart(name){
  var ids = selIds();
  if (!ids.length){ flash("Önce bir eleman seç — sonra komutu ver"); return; }
  if (!CMDS[name]) return;
  CMD = { name:name, step:0, ids:ids, base:null, cur:null, rect:selAllRect(ids) };
  ctxClose(); SNAPG = []; render();
}
function cmdCancel(){ if (!CMD) return; CMD = null; SNAPG = []; CMDLOCK = Date.now(); render(); }
function cmdHintTxt(){
  if (!CMD) return "";
  var c = CMDS[CMD.name];
  return c.ad + " — " + c.ks[CMD.step] + (CMD.step === 0 ? "" : " · Esc iptal");
}
/* geçerli ikinci nokta için dönüşüm fonksiyonu */
function cmdFn(pt){
  var b = CMD.base;
  if (CMD.name === "rotate"){
    var a = Math.atan2(pt.y - b.y, pt.x - b.x);
    if (CMD.rect) a = Math.round(a / (Math.PI/2)) * (Math.PI/2);
    var cs = Math.cos(a), sn = Math.sin(a);
    return { fn:function(p){ var dx = p.x-b.x, dy = p.y-b.y;
               return { x:b.x + dx*cs - dy*sn, y:b.y + dx*sn + dy*cs }; },
             rot: a*180/Math.PI,
             swap: (Math.round(a/(Math.PI/2)) % 2 + 2) % 2 === 1 };
  }
  if (CMD.name === "mirror"){
    var dx0 = pt.x-b.x, dy0 = pt.y-b.y, L2 = dx0*dx0 + dy0*dy0;
    if (L2 < 1e-9) return { fn:function(p){ return { x:p.x, y:p.y }; }, rot:0, swap:false };
    return { fn:function(p){
               var t = ((p.x-b.x)*dx0 + (p.y-b.y)*dy0) / L2;
               var mx = b.x + dx0*t, my = b.y + dy0*t;
               return { x:2*mx - p.x, y:2*my - p.y }; },
             rot:0, swap:false };
  }
  var ddx = pt.x-b.x, ddy = pt.y-b.y;
  return { fn:function(p){ return { x:p.x+ddx, y:p.y+ddy }; }, rot:0, swap:false };
}
/* hedef satırlar — kopyalama komutunda önce çoğaltılır */
function cmdTargets(ids, copy){
  var G = gridM(), out = [];
  ids.forEach(function(id){
    var e = elById(id); if (!e) return;
    if (!freeze(e.list, e.row, G)) return;
    if (copy){
      var c = JSON.parse(JSON.stringify(e.row));
      c.id = uid(e.list.charAt(0));
      c.name = (e.row.name || e.list) + "′";
      P[e.list].push(c);
      out.push({ list:e.list, row:c });
    } else out.push({ list:e.list, row:e.row });
  });
  return out;
}
function applyTF(tg, fn, rotDeg, swap){
  tg.forEach(function(t){
    var f = t.row.free; if (!f) return;
    if (f.x1 !== undefined){
      var a = fn({ x:f.x1, y:f.y1 }), b = fn({ x:f.x2, y:f.y2 });
      f.x1 = a.x; f.y1 = a.y; f.x2 = b.x; f.y2 = b.y;
    } else if (f.w !== undefined){
      var c = fn({ x:f.x + f.w/2, y:f.y + f.h/2 });
      if (swap){ var sw = f.w; f.w = f.h; f.h = sw; }
      f.rot = (((pnum(f.rot,0) + (rotDeg||0)) % 360) + 360) % 360;
      f.x = c.x - f.w/2; f.y = c.y - f.h/2;
      syncRect(t.list, t.row);
      if (t.list === "furniture") t.row.rot = f.rot;
    } else {
      var p = fn({ x:f.x, y:f.y });
      f.x = p.x; f.y = p.y;
      if (rotDeg) f.rot = (((pnum(f.rot,0) + rotDeg) % 360) + 360) % 360;
    }
  });
}
function cmdFinish(pt){
  if (!CMD || !CMD.base) return;
  var tf = cmdFn(pt);
  var copy = (CMD.name === "copy");
  var tg = cmdTargets(CMD.ids, copy);
  applyTF(tg, tf.fn, tf.rot, tf.swap);
  var n = tg.length;
  if (copy){ UI.selSet = tg.map(function(t){ return t.row.id; }); UI.sel = (n===1) ? UI.selSet[0] : null; }
  var msg = { move:"Taşındı", copy:"Kopyalandı", rotate:"Döndürüldü", mirror:"Aynalandı" }[CMD.name];
  if (CMD.name === "rotate") msg += " " + fmt(tf.rot,1) + "°";
  CMD = null; SNAPG = []; CMDLOCK = Date.now();
  UI.cmdLen = ""; UI.cmdAng = "";
  snap(msg + ": " + n + " öğe");
  render();
}
/* menüden / klavyeden hızlı döndürme */
function rotateQuick(deg){
  var ids = selIds();
  if (!ids.length){ flash("Önce bir eleman seç"); return; }
  var G = gridM(), bb = null;
  ids.forEach(function(id){
    var e = elById(id); if (!e) return;
    var g = geomOf(e.list, e.row, G); if (!g) return;
    var x1, y1, x2, y2;
    if (g.x1 !== undefined){ x1=Math.min(g.x1,g.x2); x2=Math.max(g.x1,g.x2); y1=Math.min(g.y1,g.y2); y2=Math.max(g.y1,g.y2); }
    else if (g.w !== undefined){ x1=g.x; y1=g.y; x2=g.x+g.w; y2=g.y+g.h; }
    else { x1=x2=g.x; y1=y2=g.y; }
    if (!bb) bb = { x1:x1, y1:y1, x2:x2, y2:y2 };
    else { bb.x1=Math.min(bb.x1,x1); bb.y1=Math.min(bb.y1,y1); bb.x2=Math.max(bb.x2,x2); bb.y2=Math.max(bb.y2,y2); }
  });
  if (!bb){ flash("Döndürülecek geometri yok"); return; }
  var cx = (bb.x1+bb.x2)/2, cy = (bb.y1+bb.y2)/2;
  var a = deg*Math.PI/180, cs = Math.cos(a), sn = Math.sin(a);
  var tg = cmdTargets(ids, false);
  applyTF(tg, function(p){ var dx=p.x-cx, dy=p.y-cy;
            return { x:cx+dx*cs-dy*sn, y:cy+dx*sn+dy*cs }; },
          deg, ((Math.round(deg/90) % 2) + 2) % 2 === 1);
  snap("Döndürüldü " + fmt(deg,0) + "°: " + tg.length + " öğe");
  render();
}
/* komut çubuğundan tam değer */
function cmdExact(){
  if (!CMD || !CMD.base) return;
  var eL = document.getElementById("cmdlen"), eA = document.getElementById("cmdang");
  var vL = (eL && eL.value) ? eL.value : UI.cmdLen;
  var vA = (eA && eA.value) ? eA.value : UI.cmdAng;
  var L = pnum(vL, NaN);
  var A = pnum(vA, NaN);
  var b = CMD.base, pt;
  if (CMD.name === "rotate"){
    if (!isFinite(A)) { flash("Açı yaz (°)"); return; }
    pt = { x:b.x + Math.cos(A*Math.PI/180), y:b.y + Math.sin(A*Math.PI/180) };
  } else {
    if (!isFinite(L)) { flash("Uzunluk yaz"); return; }
    var aa = isFinite(A) ? A : 0;
    pt = { x:b.x + L*Math.cos(aa*Math.PI/180), y:b.y + L*Math.sin(aa*Math.PI/180) };
  }
  cmdFinish(pt);
}

  if (pre === "snap"){ ensureSnapUI(); UI.osnap[arg] = !osnapOn(arg); ctxDraw(); render(); return; }
  if (pre === "ras"){ UI.raster = parseFloat(arg); ctxClose(); flash("Raster "+fmt(UI.raster*100,1)+" cm"); return; }

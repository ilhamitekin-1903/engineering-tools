    ["Unterzüge", String(P.beams.length), P.beams.length ? fmt(P.beams[0].b*100,0)+"/"+fmt(P.beams[0].h*100,0)+" cm" : "—"],
    ["Deckenfelder", String(P.slabs.length), "d = "+fmt(d.tSlab*100,1)+" cm"],
    ["Wände tragend / nichttragend", d.nExt+" / "+d.nInn, fmt(d.extWall*100,0)+" / "+fmt(d.intWall*100,1)+" cm"],
    ["Treppen", String(P.stairs.length), P.stairs.length ? stairLabelDE(P.stairs[0].type) : "—"],
    ["Balkone", String(P.balconies.length), P.balconies.length ? balkLabelDE(P.balconies[0].type)+" "+fmt(P.balconies[0].depth,2)+" m" : "—"],
    ["Fundamente", String(P.foundations.length), P.foundations.length ? foundLabelDE(P.foundations[0].kind) : "—"],
    ["Möblierung (nicht tragend)", String((P.furniture||[]).length), "Einrichtungsplanung"]
  ], "1fr 74px 110px");
  h += rH("Statisches System");
  h += rP("Decken als "+(P.slabs[0] ? (P.slabs[0].kind==="einachsig"?"einachsig gespannte":"zweiachsig gespannte") : "zweiachsig gespannte")+
    " Platten auf Unterzügen und tragenden Wänden. Unterzüge als Durchlaufträger über die Achsen. "+
    "Vertikale Lastabtragung über tragende Außen- und Innenwände sowie Stützen in die Gründung. "+
    "Die horizontale Aussteifung erfolgt über die Deckenscheiben und die aussteifenden Wände; ein gesonderter Aussteifungsnachweis ist zu führen.");
  h += rOk("Hinweis: Schnittgrößen werden derzeit am Einfeldträger-Ersatzsystem ermittelt (Pos. 5). "+
    "Ein Durchlaufträger- bzw. Rahmennachweis ist für die Ausführungsstatik nachzureichen.", false);
  return h;
}

function rpPerde(d){
  ensureShear();
  if (!P.shearwalls.length) return "";
  var sys = shearSystem(d), bs = sys.bs;
  var rows = P.shearwalls.map(function(w){
    var c = perdeCalc(w, d, sys);
    return [esc(w.name), fmt(c.L,2), fmt(c.t*100,0), c.ax.toUpperCase(), fmt(c.NEd,0),
            fmt(c.lam,0), fmt(c.NRd,0), fmt(c.etaN,2), fmt(c.VEd,0), fmt(c.VRdc,0), fmt(c.asV/2,1)];
  });
  var bad = P.shearwalls.filter(function(w){ return !perdeCalc(w, d, sys).ok; }).length;
  return rH("6.3 Aussteifende Stahlbetonwände (EN 1992-1-1 / EN 1998-1)") +
    rP("Horizontallasten werden auf die Wandscheiben nach ihrer Biegesteifigkeit I = d·l³/12 verteilt. "+
       "Maßgebend ist "+(bs.mass === "deprem" ? "die Erdbebeneinwirkung" : "der Winddruck")+": "+
       "V<sub>Ed,x</sub> = "+fmt(bs.Vx,0)+" kN, V<sub>Ed,y</sub> = "+fmt(bs.Vy,0)+" kN bei H = "+fmt(bs.H,2)+" m.") +
    rTab(["Wand","l [m]","d [cm]","Ri.","N_Ed","λ","N_Rd","η_N","V_Ed","V_Rd,c","a_s,v"], rows,
         "1.25fr .75fr .8fr .5fr .95fr .5fr .95fr .6fr .9fr .9fr .85fr") +
    rP("Einheiten: N und V in kN, a<sub>s,v</sub> in cm² je Wandseite.") +
    rOk("Wandscheiben je Richtung: X = "+sys.nx+", Y = "+sys.ny+" (mindestens 2 je Richtung erforderlich)", sys.ok) +
    rOk("Nachweis N_Ed ≤ N_Rd und V_Ed ≤ V_Rd,c für alle Wände", bad === 0) +
    rP("Mindestbewehrung nach EN 1992-1-1, 9.6: A<sub>s,vmin</sub> = 0,002·A<sub>c</sub>, je Wandseite die Hälfte; "+
       "A<sub>s,hmin</sub> = max(0,25·A<sub>s,v</sub>; 0,001·A<sub>c</sub>). Mindestdicke der Ortbetonwand 16 cm (freistehend 20 cm).") +
    rBox("Vereinfachter Vorentwurf: Verteilung rein nach Biegesteifigkeit, ohne Torsion, ohne Rahmen-Wand-Interaktion "+
         "und ohne Nachweis der Geschossverformung. Für die prüffähige Statik ist eine Gesamtsystemberechnung erforderlich.", "warn");
}

function rp4(d){   /* Lastannahmen */
  var h = rH("Ständige Lasten (charakteristisch)");
  h += rTab(["Lastanteil","g_k","kN/m²"], [
    ["Stahlbetondecke d = "+fmt(d.tSlab*100,1)+" cm · 25 kN/m³", fmt(d.g1,2), "kN/m²"],
    ["Ausbaulast g₂"+(P.finishes && P.finishes.autoG2 ? " (aus Schichtaufbau)" : " (manuell)"), fmt(d.g2,2), "kN/m²"],
    ["Σ g_k", fmt(d.gk,2), "kN/m²"]
  ]);
  if (P.finishes && P.finishes.autoG2){
    var fb=null, dk=null;
    P.finishes.surfaces.forEach(function(s){ if(s.key==="fb") fb=s; if(s.key==="dk") dk=s; });
    h += rBox('Ausbaulast aus Schichtaufbau:<br>'+
      (fb ? 'Fußbodenaufbau '+fmt(calcSurface(fb,d).wkN,2)+' kN/m²<br>' : '')+
      (dk ? 'Deckenbekleidung '+fmt(calcSurface(dk,d).wkN,2)+' kN/m²<br>' : '')+
      'Trennwandzuschlag '+fmt(P.finishes.trennwand,2)+' kN/m² (EN 1991-1-1/NA, 6.3.1.2)<br>'+
      'Σ g₂ = <b>'+fmt(d.g2,2)+' kN/m²</b>');
  }
  h += rH("Veränderliche Lasten · DIN EN 1991-1-1/NA");
  h += rTab(["Einwirkung","q_k","kN/m²"], [
    ["Nutzlast Decke (Kat. A/B)", fmt(P.loads.q,2), "kN/m²"],
    ["Schnee s_k · Zone "+esc(P.meta.sz), fmt(P.loads.s,2), "kN/m²"],
    ["Wind q_p · Zone "+esc(P.meta.wz), fmt(P.loads.w,2), "kN/m²"],
    ["Balkon (EN 1991-1-1, Kat. A)", "4,00", "kN/m²"]
  ]);
  if (P.roof.on){
    var rc = roofCalc();
    h += rH("Dachlasten");
    h += rBox('Dachform '+roofLabelDE(P.roof.type)+' · Neigung '+fmt(rc.pitch,0)+'° · Dachfläche '+fmt(rc.area,1)+' m²<br>'+
      'Eindeckung '+esc(P.roof.cover)+' g_k = '+fmt(rc.gk,2)+' kN/m² (Schrägfläche)<br>'+
      'Formbeiwert μ₁ = '+fmt(rc.mu,2)+' (EN 1991-1-3, 5.3.3) → s = μ₁·s_k = <b>'+fmt(rc.sLoad,2)+' kN/m²</b><br>'+
      'q_d,Dach = 1,35·g + 1,50·s = <b>'+fmt(rc.qd,2)+' kN/m²</b>');
  }
  h += rH("Bemessungswert · EN 1990, Gl. 6.10");
  h += rBox('q_d = γ_G·g_k + γ_Q·q_k = 1,35 · '+fmt(d.gk,2)+' + 1,50 · '+fmt(P.loads.q,2)+
    ' = <b>'+fmt(d.qd,2)+' kN/m²</b>');
  return h;
}

function rp5(d){   /* Schnittgrößen */
  var h = rP('Ersatzsystem: Einfeldträger, Stützweite L = '+fmt(d.Lmax,2)+' m, Lasteinzugsbreite b = '+fmt(d.loadW,2)+' m.');
  h += rBox('q_d,Linie = q_d · b = '+fmt(d.qd,2)+' · '+fmt(d.loadW,2)+' = <b>'+fmt(d.qLine,2)+' kN/m</b><br>'+
    'M_Ed = q·L²/8 = '+fmt(d.qLine,2)+' · '+fmt(d.Lmax,2)+'²/8 = <b>'+fmt(d.MEd,2)+' kNm</b><br>'+
    'V_Ed = q·L/2 = '+fmt(d.qLine,2)+' · '+fmt(d.Lmax,2)+'/2 = <b>'+fmt(d.VEd,2)+' kN</b>');
  h += rTab(["Größe","Wert","Einheit"], [
    ["M_Ed", fmt(d.MEd,2), "kNm"], ["V_Ed", fmt(d.VEd,2), "kN"], ["q_d,Linie", fmt(d.qLine,2), "kN/m"]
  ]);
  h += rOk("Vorbemessung. Die Schnittgrößen stammen aus dem Einfeldträger-Ersatzsystem, nicht aus einer "+
    "Durchlaufträger- oder Rahmenberechnung. Für die prüffähige Ausführungsstatik ist ein Stabwerks- bzw. "+
    "FE-Nachweis mit Momentenumlagerung und Auflagerreaktionen zu führen.", false);
  return h;
}

function rp6(d){   /* Bemessung */
  var g = P.design;
  var h = rP('Bauteil: <b>'+esc(d.member)+'</b> · Querschnitt b/h = '+fmt(g.secB*100,0)+'/'+fmt(g.secH*100,0)+
    ' cm · Beton '+g.beton+' · Betonstahl B500B · Expositionsklasse XC1.');
  h += rH("Biegebemessung · EN 1992-1-1, 6.1");
  h += rBox('d = h − c_nom − Ø/2 = '+fmt(g.secH*100,1)+' − '+fmt(g.cnom*100,1)+' − '+fmt(g.phi*100/2,1)+' = <b>'+fmt(d.dEff*100,1)+' cm</b><br>'+
    'f_cd = 0,85 · '+d.fck+' / 1,5 = <b>'+fmt(d.fcd,2)+' N/mm²</b><br>'+
    'μ_Eds = M_Ed / (b · d² · f_cd) = <b>'+fmt(d.mu,4)+'</b><br>'+
    'ζ = <b>'+fmt(d.zeta,3)+'</b> &nbsp;(aus ω-Tafel, interpoliert)<br>'+
    'a_s,erf = M_Ed / (ζ · d · f_yd) = <b>'+fmt(d.asErf,2)+' cm²</b>');
  h += rOk('gewählt: <b>'+d.nBars+' Ø'+fmt(g.phi*1000,0)+' = '+fmt(d.asProv,2)+' cm²</b> ≥ a_s,erf = '+
    fmt(d.asErf,2)+' cm² &nbsp;·&nbsp; M_Rd = '+fmt(d.MRd,2)+' kNm &nbsp;·&nbsp; η = M_Ed/M_Rd = '+
    fmt(d.eta,2)+(d.etaOk?" ≤ 1,00 ✓":" > 1,00 ✗"), d.etaOk);
  h += rpPerde(d);
  return h;
}

function rp7(d){   /* Gründung — Baugrund, Fundamente, Abdichtung, Dränung */
  ensureDrain();
  var c = drainCalc(d), R = P.drain;
  var h = '<div style="margin-top:2px;font-family:var(--sans);font-size:10px;font-weight:600">7.1 Baugrund</div>';
  h += rP('Die Angaben zum Baugrund sind Annahmen. Ein Baugrundgutachten nach DIN EN 1997-2 / DIN 4020 ist '+
    'vor Ausführung einzuholen und diese Berechnung daran anzupassen.');
  h += rTab(["Kenngröße","Wert","Einheit"], [
    ["zulässiger Sohldruck σ_zul", fmt(P.soil.sigZul,0), "kN/m²"],
    ["Wichte γ", fmt(P.soil.gamma,1), "kN/m³"],
    ["Reibungswinkel φ'", fmt(P.soil.phi,1), "°"],
    ["Gründungstiefe (frostfrei)", fmt(P.soil.tGr,2), "m"],
    ["Durchlässigkeit", SOILPERMDE[R.kSoil] || R.kSoil, "—"]
  ], "1fr 150px 62px");
  h += rOk('Frosteinwirkungstiefe: Gründungssohle '+fmt(P.soil.tGr,2)+' m unter OK Gelände '+
    (P.soil.tGr >= 0.80 ? "≥ 0,80 m ✓" : "< 0,80 m ✗ — DIN EN 1997-1/NA fordert i.d.R. 0,80 m"), P.soil.tGr >= 0.80);

  h += '<div style="margin-top:16px;font-family:var(--sans);font-size:10px;font-weight:600">7.2 Fundamente</div>';
  if (!P.foundations.length){
    h += rP("Es sind noch keine Fundamente im Modell definiert.");
  } else {
    var rows = P.foundations.map(function(f){
      var isN = (f.kind!=="streifen" && f.kind!=="platte");
      var N = isN ? colLoad(pnum(f.ax,0), pnum(f.ay,0)) : 0;
      var n = (f.kind==="streifen") ? wallLoad(f.dir, pnum(f.line,0), pnum(f.seg,0)) : 0;
      var sig = isN ? N/Math.max(f.a*f.b,.01) : (f.kind==="streifen" ? n/Math.max(f.a,.01) : 0);
      var dim = (f.kind==="platte") ? ("d = "+fmt(f.d*100,0)+" cm")
              : (f.kind==="streifen") ? (fmt(f.a*100,0)+"/"+fmt(f.d*100,0)+" cm")
              : (fmt(f.a*100,0)+"/"+fmt(f.b*100,0)+"/"+fmt(f.d*100,0)+" cm");
      var val = (f.kind==="platte") ? "—" : fmt(sig,0);
      return [esc(f.name)+" · "+foundLabelDE(f.kind), dim, val, (f.kind==="platte") ? "—" : (sig<=P.soil.sigZul?"✓":"✗")];
    });
    h += rTab(["Pos. · Typ","Abmessung","σ [kN/m²]","NW"], rows, "1fr 118px 78px 30px");
    h += rBox('Sohldrucknachweis: σ = N_Ed / A ≤ σ_zul = '+fmt(P.soil.sigZul,0)+' kN/m²<br>'+
      'Einzelfundamente: N_Ed aus Lastflächenverfahren — N = q_d · A_Einzug · n_Geschosse<br>'+
      'Streifenfundamente: n_Ed = q_d · b_Einzug · n_Geschosse [kN/m]');
    h += rOk('Die Auflagerkräfte stammen aus dem Lasteinzugsflächenverfahren, nicht aus berechneten '+
      'Auflagerreaktionen eines Stabwerkmodells. Nachweise für Durchstanzen (EN 1992-1-1, 6.4), Grundbruch '+
      'und Setzungen (EN 1997-1) sind gesondert zu führen.', false);
  }

  h += '<div style="margin-top:16px;font-family:var(--sans);font-size:10px;font-weight:600">7.3 Abdichtung · DIN 18533</div>';
  h += rP('Wassereinwirkungsklasse <b>'+R.wclass+'</b> — '+esc(wclassDE(R.wclass))+'. '+
    (c.needDrain
      ? 'Die Einstufung setzt eine funktionsfähige Dränung nach DIN 4095 voraus (Baugrund '+
        (R.kSoil==="gering"?"gering":"mäßig")+' durchlässig).'
      : 'Der Baugrund ist stark durchlässig (k ≥ 10⁻⁴ m/s); nicht stauendes Sickerwasser.'));
  h += rTab(["Angabe","Wert","Einheit"], [
    ["Abdichtungsart", esc(c.seal[2]), "—"],
    [c.isWU ? "Bauteildicke" : "Trockenschichtdicke gewählt", c.isWU?fmt(c.haveT,0):fmt(c.haveT,1), "mm"],
    ["Mindestdicke für "+R.wclass, c.okClass ? fmt(c.reqT,1) : "nicht zulässig", c.okClass?"mm":"—"],
    ["Hochführung über OK Gelände", fmt(pnum(R.sockel,.3)*1000,0), "mm"],
    ["Abzudichtende Fläche", fmt(c.Aseal,1), "m²"],
    ["Schutzschicht", R.noppe ? "Noppenbahn" : "keine", "—"]
  ], "1fr 150px 62px");
  h += rOk((c.okClass
      ? 'Dicke '+fmt(c.haveT,1)+' mm ≥ '+fmt(c.reqT,1)+' mm '+(c.okT?"✓":"✗")
      : 'Die gewählte Abdichtungsart ist für '+R.wclass+' nicht zulässig ✗')+
    ' &nbsp;·&nbsp; Sockel '+fmt(pnum(R.sockel,.3)*1000,0)+' mm ≥ 300 mm '+(c.okSockel?"✓":"✗"),
    c.okT && c.okSockel && c.okClass);
  h += rP('Waagerechte Querschnittsabdichtung unter allen aufgehenden Wänden nach DIN 18533-3. '+
    'Die Abdichtung ist mindestens 300 mm über OK Gelände hochzuführen (Spritzwasserbereich, DIN 18533-1). '+
    'Übergänge an Durchdringungen und Bewegungsfugen sind detailliert auszubilden.');

  h += '<div style="margin-top:16px;font-family:var(--sans);font-size:10px;font-weight:600">7.4 Dränung · DIN 4095</div>';
  if (!R.on){
    h += rOk('Es ist keine Ringdränung vorgesehen.'+(c.needDrain
      ? ' Für '+R.wclass+' bei '+(R.kSoil==="gering"?"gering":"mäßig")+' durchlässigem Baugrund ist eine Dränung '+
        'nach DIN 4095 erforderlich oder die Abdichtung ist in eine höhere Wassereinwirkungsklasse einzustufen ✗'
      : ' Bei stark durchlässigem Baugrund zulässig ✓'), !c.needDrain);
  } else {
    h += rTab(["Angabe","Wert","Einheit"], [
      ["Dränrohr (Ringdränung)", "DN "+R.dn, "—"],
      ["Rohrlänge", fmt(c.Lpipe,1), "m"],
      ["Gefälle", fmt(c.slope,2), "%"],
      ["Rohrachse unter OK Rohfußboden", fmt(c.zPipe,2), "m"],
      ["Sickerschicht "+esc(R.gravelType), fmt(pnum(R.gravel,.25)*100,0), "cm"],
      ["Filtervlies", R.vlies ? "ja · GRK 3" : "nein", "—"],
      ["Kontroll-/Spülschächte", String(c.nShaft)+" · Ø "+fmt(pnum(R.shaftD,.3)*100,0)+" cm", "Stk"],
      ["Ableitung", OUTLETSDE[R.outlet] || R.outlet, "—"]
    ], "1fr 150px 62px");
    h += rBox('Zufluss: A_wirk = U_Geb · b_Streifen = '+fmt(2*(d.W+d.D),1)+' · '+fmt(pnum(R.strip,2),2)+
      ' = '+fmt(2*(d.W+d.D)*pnum(R.strip,2),1)+' m²<br>'+
      'Q_zu = r · A_wirk · ψ = '+fmt(pnum(R.rain,250),0)+' l/(s·ha) · '+fmt(2*(d.W+d.D)*pnum(R.strip,2),1)+
      ' m² / 10 000 · '+fmt(pnum(R.psi,.3),2)+' = <b>'+fmt(c.Qzu,2)+' l/s</b><br><br>'+
      'Leistungsfähigkeit (Manning-Strickler, k_st = 70, Füllgrad 0,70):<br>'+
      'A = π·d_i²/4 = '+fmt(Math.PI*c.dInner*c.dInner/4,5)+' m² · R_hy = d_i/4 = '+fmt(c.dInner/4,4)+' m<br>'+
      'Q_voll = A · k_st · R_hy^(2/3) · √i = <b>'+fmt(c.Qvoll,2)+' l/s</b><br>'+
      'Q_zul = 0,70 · Q_voll = <b>'+fmt(c.Qkap,2)+' l/s</b>');
    h += rOk('Q_zu = '+fmt(c.Qzu,2)+' l/s ≤ Q_zul = '+fmt(c.Qkap,2)+' l/s · Auslastung '+fmt(c.util*100,0)+' % '+
      (c.okQ?"✓":"✗")+' &nbsp;·&nbsp; Gefälle '+fmt(c.slope,2)+' % ≥ 0,50 % '+(c.slope>=0.5?"✓":"✗")+
      ' &nbsp;·&nbsp; Rohrachse '+fmt(c.zPipe,2)+' m < UK Bauwerk '+fmt(c.zKB,2)+' m '+(c.zPipe<c.zKB?"✓":"✗"),
      c.okQ && c.slope>=0.5 && c.zPipe<c.zKB);
    h += rP('Kontrollschächte an allen Richtungsänderungen und in Abständen ≤ 60 m (DIN 4095, 6.4). '+
      'Die Sickerschicht ist filterstabil auszubilden und vollständig mit Filtervlies zu umschließen. '+
      'Eine Noppenbahn allein ersetzt die Dränschicht nicht.');
  }

  h += '<div style="margin-top:16px;font-family:var(--sans);font-size:10px;font-weight:600">7.5 Perimeterdämmung</div>';
  h += rBox('Dämmstoff: <b>'+esc(R.perim)+'</b> · d = '+fmt(pnum(R.perimT,.1)*1000,0)+' mm · λ = '+fmt(c.perim[1],3)+' W/mK<br>'+
    'R = R_si + d_Wand/λ_Beton + d_Dämm/λ = 0,130 + '+fmt((d.extWall||0.24)/2.30,3)+' + '+
    fmt(pnum(R.perimT,.1)/c.perim[1],3)+' = <b>'+fmt(c.R,3)+' m²K/W</b><br>'+
    'U = 1/R = <b>'+fmt(c.U,3)+' W/m²K</b> · GEG-Referenzwert erdberührt '+fmt(c.Uref,2)+' W/m²K');
  h += rOk('U = '+fmt(c.U,3)+' ≤ '+fmt(c.Uref,2)+' W/m²K '+(c.okU?"✓":"✗")+
    ' &nbsp;·&nbsp; Druckfestigkeit CS(10/Y) '+c.perim[2]+' kPa ≥ 300 kPa '+(c.okDruck?"✓":"✗"), c.okU && c.okDruck);

  h += '<div style="margin-top:16px;font-family:var(--sans);font-size:10px;font-weight:600">7.6 Massen</div>';
  h += rTab(["Position","Menge","Einheit"], [
    ["Abdichtung erdberührt", fmt(c.Aseal,1), "m²"],
    ["Perimeterdämmung", fmt(c.Aperim,1), "m²"],
    ["Noppenbahn", R.noppe?fmt(c.Aperim,1):"—", R.noppe?"m²":"—"],
    ["Filtervlies", R.vlies?fmt(c.Avlies,1):"—", R.vlies?"m²":"—"],
    ["Dränrohr DN "+R.dn, R.on?fmt(c.Lpipe,1):"—", R.on?"m":"—"],
    ["Kontrollschächte", R.on?String(c.nShaft):"—", R.on?"Stk":"—"],
    ["Sickerschicht", R.on?fmt(c.Vgrav,1):"—", R.on?"m³":"—"],
    ["Kapillarbrechende Schicht", fmt(c.Vkb,1), "m³"],
    ["Sauberkeitsschicht C8/10", fmt(c.Vsau,1), "m³"]
  ]);
  return h;
}

function reportPage(key, d){
  if (key === "0") return { no:"", title:"", body:rp0(d), plain:true };
  if (key === "1") return { no:"1", title:"Allgemeines", body:rp1(d) };
  if (key === "2") return { no:"2", title:"Baustoffe", body:rp2(d) };
  if (key === "3") return { no:"3", title:"System", body:rp3(d) };
  if (key === "4") return { no:"4", title:"Lastannahmen", body:rp4(d) };
  if (key === "5") return { no:"5", title:"Schnittgrößen", body:rp5(d) };
  if (key === "7") return { no:"7", title:"Gründung, Abdichtung und Dränung", body:rp7(d) };
  return { no:"6.2", title:d.member, body:rp6(d) };
}

function reportSheet(key, d, forPrint){
  var pg = reportPage(key, d);
  var head = pg.plain ? '' :
    '<div style="display:flex;justify-content:space-between;padding-bottom:9px;border-bottom:1.5px solid #1A1A18">'+
      '<div><div style="font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.4px">STATISCHE BERECHNUNG</div>'+
      '<div style="font-family:var(--sans);font-size:9px;color:#55534D">'+esc(P.meta.name||"Unbenannt")+' · '+esc(P.meta.ort)+'</div></div>'+
      '<div style="text-align:right;font-family:var(--mono);font-size:8.5px;color:#55534D">Pos. '+pg.no+' · '+esc(pg.title)+'<br>Rev. '+(HPOS+1)+'</div></div>'+
    '<div style="margin-top:18px;font-family:var(--sans);font-size:13px;font-weight:600">'+pg.no+' '+esc(pg.title)+'</div>';
  return '<div class="psheet"'+(forPrint?'':' id="printSheet"')+
    ' style="width:580px;'+(forPrint?'min-height:780px;margin:0 auto 18px;':'height:100%;max-height:756px;')+
    'background:#FBFAF7;color:#1A1A18;padding:36px 42px;display:flex;flex-direction:column;'+
    'font-family:Georgia,\'Times New Roman\',serif;overflow:auto">'+
    head + pg.body +
    '<div style="flex:1"></div>'+
    '<div style="display:flex;justify-content:space-between;padding-top:9px;margin-top:14px;border-top:1px solid #D6D3CA;font-family:var(--mono);font-size:8px;color:#6C6A63">'+
      '<span>Aufgestellt: '+esc(P.meta.aufst)+'</span><span>TRAGWERK/PLAN v2.7 · Rev '+(HPOS+1)+
      (pg.plain?'':' · Pos. '+pg.no)+'</span></div></div>';
}

function buildPrintAll(){
  var d = DERIVED || derive();
  var el = document.getElementById("printAll");
  if (!el) return;
  el.innerHTML = RPOS.map(function(r){ return reportSheet(r[0], d, true); }).join("");
}

    '<div class="side r"><div class="scroll" style="flex:1">'+
      '<div class="hd">DECKBLATT</div><div style="padding:0 14px;display:flex;flex-direction:column;gap:9px">'+
      '<div class="fld"><label>Bauherr</label><input data-meta="bauherr" style="font-family:var(--sans)" value="'+esc(P.meta.bauherr)+'" placeholder="[BAUHERR]"></div>'+
      '<div class="fld"><label>Aufgestellt von</label><input data-meta="aufst" style="font-family:var(--sans)" value="'+esc(P.meta.aufst)+'"></div>'+
      '<div class="fld"><label>Prüfingenieur</label><input data-meta="pruef" style="font-family:var(--sans)" value="'+esc(P.meta.pruef)+'" placeholder="[PRÜFINGENIEUR]"></div>'+
      '</div>'+
      '<div class="hd" style="padding-top:12px">SAYFALAR</div><div style="padding:0 14px">'+
      RPOS.map(function(o){
        return '<div class="kv" data-rpos="'+o[0]+'" style="cursor:pointer'+(o[0]===UI.rpos?";color:var(--cy2)":"")+'">'+
          '<span>'+o[0]+' · '+o[1]+'</span><span>'+(o[0]===UI.rpos?"görünüyor":"")+'</span></div>';
      }).join("")+'</div>'+
      '<div class="note i" style="margin:12px 13px">Yazdır düğmesi <b>sekiz pozisyonun tamamını</b> tek PDF olarak çıkarır; her pozisyon ayrı sayfaya gelir.</div>'+
      '<div class="note w" style="margin:0 13px 13px">Kesme kuvvetleri tek açıklıklı kiriş eşdeğer sisteminden, temel yükleri yük alanı yönteminden geliyor. Bu rapor <b>ön tasarım</b> seviyesindedir; prüffähig ausführungsstatik için çerçeve/FE çözümü ve mesnet reaksiyonları gerekir.</div>'+
      '</div></div>';
}

function proj3(x, y, z, o){
  var a = o.az*Math.PI/180, e = o.el*Math.PI/180;
  var px = (x*Math.cos(a) - y*Math.sin(a));
  var py = (x*Math.sin(a) + y*Math.cos(a))*Math.sin(e) - z*Math.cos(e);
  return [o.cx + px*o.s, o.cy + py*o.s];
}
function poly(pts, o){
  return pts.map(function(p){ var q = proj3(p[0],p[1],p[2],o); return fmt2(q[0])+","+fmt2(q[1]); }).join(" ");
}
function fmt2(v){ return Math.round(v*10)/10; }
function seg3(p1, p2, o, stroke, sw, op){
  var a = proj3(p1[0],p1[1],p1[2],o), b = proj3(p2[0],p2[1],p2[2],o);
  return '<line x1="'+fmt2(a[0])+'" y1="'+fmt2(a[1])+'" x2="'+fmt2(b[0])+'" y2="'+fmt2(b[1])+
    '" stroke="'+stroke+'" stroke-width="'+sw+'"'+(op?' opacity="'+op+'"':'')+' stroke-linecap="round"/>';
}

function render3D(d){
  var V = UI.v3d, S = V.show;
  var CM = V.color || "mat";
  var OPA = (V.opa === undefined || V.opa === null) ? 0.92 : V.opa;
  var bg = ['<rect width="980" height="680" fill="url(#gS)"/>'];
  var F = [];
  var W = d.W, D = d.D;
  var rcx = (P.type==="wohn" && P.roof && P.roof.on) ? roofCalc().rise : 0;
  var extent = Math.max(W, D, d.Htot + rcx, 6);
  var pr = { az:V.az, el:V.el, cx:490 + V.px, cy:400 + V.py, s: (330/extent) * V.zoom };

  /* ---------- yüzey kuyruğu (derinliğe göre sıralanır) ---------- */
  function add(dp, s){ F.push([dp, s]); }
  function depOf(pts){
    var s2 = 0;
    for (var i=0;i<pts.length;i++) s2 += dep3(pts[i][0],pts[i][1],pts[i][2],pr);
    return s2/pts.length;
  }
  function face(pts, col, op, sw){
    var f = lambert(pts);
    add(depOf(pts), '<polygon points="'+poly(pts,pr)+'" fill="'+shade(col,f)+
      '" fill-opacity="'+op.toFixed(3)+'" stroke="'+tint(col,.40)+
      '" stroke-width="'+(sw||1)+'" stroke-opacity="'+Math.min(1, op*0.55+0.25).toFixed(3)+
      '" stroke-linejoin="round"/>');
  }
  function line3(p1, p2, col, sw, op){
    add(Math.max(dep3(p1[0],p1[1],p1[2],pr), dep3(p2[0],p2[1],p2[2],pr)) + 0.02,
        seg3(p1,p2,pr,col,sw,op));
  }
  function prismPoly(q, z0, z1, col, op){
    if (z1 <= z0 + 1e-6) return;
    var top = [], i;
    for (i=0;i<q.length;i++) top.push([q[i][0], q[i][1], z1]);
    face(top, col, op);
    for (i=0;i<q.length;i++){
      var p = q[i], r = q[(i+1)%q.length];
      face([[p[0],p[1],z0],[r[0],r[1],z0],[r[0],r[1],z1],[p[0],p[1],z1]], col, op);
    }
  }
  function prismRect(x, y, w, h, z0, z1, col, op){
    if (w <= 1e-4 || h <= 1e-4) return;
    prismPoly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]], z0, z1, col, op);
  }
  function prismLine(x1, y1, x2, y2, th, z0, z1, col, op){
    var dx = x2-x1, dy = y2-y1, L = Math.sqrt(dx*dx+dy*dy);
    if (L < 1e-6) return;
    var nx = -dy/L*th/2, ny = dx/L*th/2;
    prismPoly([[x1+nx,y1+ny],[x2+nx,y2+ny],[x2-nx,y2-ny],[x1-nx,y1-ny]], z0, z1, col, op);
  }

  /* ---------- renk seçimi ---------- */
  function cOf(kind, row){
    if (CM === "tip") return TYPECOL[kind] || "#3FB6D3";
    if (CM === "ince"){
      var fk = { wallx:"aw", walli:"iw", slab:"fb", roof:"da", balk:"bk" }[kind];
      var fc = fk ? finishColor(fk) : null;
      if (fc) return fc;
    }
    if (kind === "roof") return coverColor(P.roof && P.roof.cover);
    if (kind === "door") return matColor((row && row.mat) || "Holz");
    if (kind === "win")  return matColor((row && row.mat) || "Kunststoff");
    return matColor(row && row.mat);
  }

  /* ---------- kat kotları ---------- */
  var z = [0]; P.storeys.forEach(function(s){ z.push(z[z.length-1] + s.h); });
  var nShow = Math.min(P.storeys.length, V.upto);

  if (P.type === "wohn"){
    var G = { x:[0], y:[0] }, acc = 0;
    P.grid.x.forEach(function(L){ acc += L; G.x.push(acc); });
    acc = 0; P.grid.y.forEach(function(L){ acc += L; G.y.push(acc); });
    var xs = G.x, ys = G.y;
    var tSl = d.tSlab || 0.20;
    var hasFound = (S.tm !== false) && P.foundations.length > 0;

    /* zemin düzlemi + ızgara (her zaman en arkada) */
    bg.push('<polygon points="'+poly([[0,0,0],[W,0,0],[W,D,0],[0,D,0]],pr)+
      '" fill="#0E2033" fill-opacity="'+(hasFound?".34":".92")+'" stroke="#1E3348" stroke-width="1"/>');
    xs.forEach(function(x){ bg.push(seg3([x,0,0],[x,D,0],pr,"#1E3348",1)); });
    ys.forEach(function(y){ bg.push(seg3([0,y,0],[W,y,0],pr,"#1E3348",1)); });

    /* ---------- TEMELLER (±0,00 altı) ---------- */
    if (S.tm !== false){
      P.foundations.forEach(function(f){
        var col = cOf("found", f), tG = pnum(f.t, P.soil.tGr || 0.80);
        var zTop = -tG, zBot = -tG - pnum(f.d, 0.40);
        if (f.kind === "platte"){
          prismRect(-0.25, -0.25, W+0.50, D+0.50, zBot, zTop, col, OPA);
          return;
        }
        if (f.kind === "streifen"){
          var gl = geomOf("foundations", f, G); if (!gl) return;
          prismLine(gl.x1, gl.y1, gl.x2, gl.y2, pnum(f.a,0.6), zBot, zTop, col, OPA);
          return;
        }
        if (f.kind === "bag"){
          var gt2 = geomOf("foundations", f, G); if (!gt2) return;
          var hT = pnum(f.d, 0.40);
          prismLine(gt2.x1, gt2.y1, gt2.x2, gt2.y2, pnum(f.b,0.25), -0.05 - hT, -0.05, col, Math.min(1, OPA));
          return;
        }
        var gp = geomOf("foundations", f, G); if (!gp) return;
        var a = pnum(f.a,0.9), b = pnum(f.b,0.9);
        prismRect(gp.x-a/2, gp.y-b/2, a, b, zBot, zTop, col, OPA);
        if (f.kind === "koecher"){
          var kb = Math.max(0.35, a*0.45);
          prismRect(gp.x-kb/2, gp.y-kb/2, kb, kb, zTop, 0, col, OPA);
        } else {
          var sb = Math.max(0.30, a*0.34);
          prismRect(gp.x-sb/2, gp.y-sb/2, sb, sb, zTop, 0, col, OPA*0.92);
        }
        if (f.kind === "pfahl"){
          var np = Math.max(1, pnum(f.nPiles,4)), pd = pnum(f.pileD,0.40), plg = pnum(f.pileL,8);
          for (var pi=0; pi<np; pi++){
            var ang = (pi/np)*2*Math.PI + Math.PI/4;
            var qx = gp.x + Math.cos(ang)*a*0.30, qy = gp.y + Math.sin(ang)*b*0.30;
            prismRect(qx-pd/2, qy-pd/2, pd, pd, zBot-plg, zBot, col, OPA*0.85);
          }
        }
      });
    }

    /* ---------- DRENAJ + YALITIM (±0,00 altı çevre) ---------- */
    if (S.dr !== false && P.drain && P.drain.on !== undefined){
      var DC = drainCalc(d), DR = P.drain;
      var tSe = DC.isWU ? 0 : pnum(DR.sealT, .004);
      var tPe = pnum(DR.perimT, .10);
      var tNo = DR.noppe ? .010 : 0;
      var tGv = pnum(DR.gravel, .25);
      var zSealT = DC.zGel + pnum(DR.sockel, .30);
      /* dört cephe boyunca şerit kutular */
      function ring(off, th, z0, z1, col, op){
        if (th <= 1e-4 || z1 <= z0) return;
        var a0 = -off, a1 = -off - th;
        prismRect(a1, a1, W - 2*a1, th, z0, z1, col, op);                 /* güney (y=0) */
        prismRect(a1, D + off, W - 2*a1, th, z0, z1, col, op);            /* kuzey */
        prismRect(a1, -off, th, D + 2*off, z0, z1, col, op);              /* batı */
        prismRect(W + off, -off, th, D + 2*off, z0, z1, col, op);         /* doğu */
      }
      var SEALC = "#E4595F", PERC = "#3FBF7F", NOPC = "#C8D8E8", GRVC = "#8CA3BC", PIPC = "#E8A33D";
      if (CM === "tip"){ SEALC = "#E4595F"; PERC = "#3FBF7F"; }
      /* yüzey yalıtımı (Abdichtung) */
      ring(0, tSe, -DC.tGr, zSealT, SEALC, Math.min(1, OPA));
      /* perimetre yalıtımı */
      ring(tSe, tPe, -DC.tGr, DC.zGel + 0.05, PERC, OPA);
      /* noppenbahn */
      if (tNo) ring(tSe + tPe, tNo, -DC.tGr, DC.zGel, NOPC, OPA * 0.8);
      /* sızdırma tabakası (Filterkies) */
      var zGv0 = DC.zPipe - DC.dInner/2 - 0.08, zGv1 = DC.zGel - 0.20;
      ring(tSe + tPe + tNo, tGv, zGv0, zGv1, GRVC, Math.min(0.55, OPA));
      /* dren borusu — halka */
      var po = tSe + tPe + tNo + tGv*0.55, pr2 = DC.dInner/2;
      [[-po, -po, W + 2*po, 0], [-po, D + po, W + 2*po, 0], [-po, -po, 0, D + 2*po], [W + po, -po, 0, D + 2*po]]
        .forEach(function(g2){
          if (g2[2] > 0) prismRect(g2[0], g2[1]-pr2, g2[2], 2*pr2, DC.zPipe-pr2, DC.zPipe+pr2, PIPC, Math.min(1, OPA));
          else           prismRect(g2[0]-pr2, g2[1], 2*pr2, g2[3], DC.zPipe-pr2, DC.zPipe+pr2, PIPC, Math.min(1, OPA));
        });
      /* kontrol bacaları — köşelerde */
      var sd2 = pnum(DR.shaftD, .30);
      [[-po,-po],[W+po,-po],[W+po,D+po],[-po,D+po]].forEach(function(q2){
        prismRect(q2[0]-sd2/2, q2[1]-sd2/2, sd2, sd2, DC.zPipe-pr2, DC.zGel+0.02, PIPC, Math.min(0.85, OPA));
      });
      /* temel altı tabakalar */
      prismRect(-0.30, -0.30, W+0.60, D+0.60, DC.zSau, DC.zPlB, "#8CA3BC", Math.min(0.75, OPA));
      prismRect(-0.30, -0.30, W+0.60, D+0.60, DC.zKB, DC.zSau, "#6E8398", Math.min(0.6, OPA));
    }

    /* ---------- KAT KAT: duvar → kapı/pencere → merdiven → kiriş → döşeme ---------- */
    for (var k=0; k<nShow; k++){
      var z0 = z[k], z1 = z[k+1], zw = z1 - tSl;

      /* duvarlar (iç + dış, gerçek nesneler) */
      if (S.wd){
        P.walls.forEach(function(w){
          if (!onSt(w, k)) return;
          var g = geomOf("walls", w, G); if (!g) return;
          var per = isPerimeter(w.dir, pnum(w.line,0));
          prismLine(g.x1, g.y1, g.x2, g.y2, pnum(w.t,0.24), z0, zw,
                    cOf(per ? "wallx" : "walli", w), OPA);
        });
      }

      /* kapı + pencere — duvar yüzeyine gömülü panel */
      if (S.wd && S.op !== false){
        ["doors","windows"].forEach(function(lk){
          var isDoor = (lk === "doors");
          P[lk].forEach(function(op){
            if (!onSt(op, k)) return;
            var wi = findSeg("walls", op.dir, pnum(op.line,0), pnum(op.seg,0), k);
            if (wi < 0) return;
            var wl = P.walls[wi], g = geomOf("walls", wl, G); if (!g) return;
            var dx = g.x2-g.x1, dy = g.y2-g.y1, L = Math.sqrt(dx*dx+dy*dy);
            if (L < 1e-6) return;
            var ux = dx/L, uy = dy/L, nx = -uy, ny = ux;
            var cxm = (g.x1+g.x2)/2, cym = (g.y1+g.y2)/2;
            if (op.free && op.free.x !== undefined){ cxm = op.free.x; cym = op.free.y; }
            var hw = Math.min(pnum(op.w,1), L*0.96)/2;
            var zb = z0 + (isDoor ? 0.0 : pnum(op.par,0.90));
            var zt = Math.min(zb + pnum(op.h,1.38), zw - 0.04);
            if (zt <= zb + 0.02) return;
            var col = cOf(isDoor ? "door" : "win", op);
            var off = pnum(wl.t,0.24)/2 + 0.010;
            [1,-1].forEach(function(sg){
              var ax = cxm + nx*off*sg, ay = cym + ny*off*sg;
              face([[ax-ux*hw,ay-uy*hw,zb],[ax+ux*hw,ay+uy*hw,zb],
                    [ax+ux*hw,ay+uy*hw,zt],[ax-ux*hw,ay-uy*hw,zt]],
                   col, isDoor ? OPA : Math.min(0.72, OPA), 1.4);
            });
            if (!isDoor){
              var mz = (zb+zt)/2;
              line3([cxm-ux*hw+nx*off, cym-uy*hw+ny*off, mz],
                    [cxm+ux*hw+nx*off, cym+uy*hw+ny*off, mz], tint(col,.45), 1, ".8");
            }
          });
        });
      }

      /* serbest çizgiler */
      if (S.lz !== false){
        (P.lines||[]).forEach(function(lr){
          if (!onSt(lr, k) || !lr.free) return;
          var lkd = lineKindDef(lr.kind);
          line3([lr.free.x1, lr.free.y1, z0+0.02], [lr.free.x2, lr.free.y2, z0+0.02],
                lr.col || lkd[2], lkd[3], ".9");
        });
      }

      /* mobilya */
      if (S.mb !== false){
        (P.furniture||[]).forEach(function(fr){
          if (!onSt(fr, k) || !fr.free) return;
          var ff = fr.free, hh = Math.max(0.02, pnum(fr.h, 0.8));
          var fcol = (CM === "tip") ? "#C8D8E8" : furnColor(fr.key);
          prismRect(ff.x, ff.y, ff.w, ff.h, z0 + 0.01, Math.min(z0 + 0.01 + hh, zw - 0.02),
                    fcol, Math.min(0.9, OPA));
        });
      }

      /* merdivenler */
      if (S.md !== false){
        P.stairs.forEach(function(st){
          if (!onSt(st, k)) return;
          drawStair(st, z0, z1);
        });
      }

      /* perde duvarlar — kat boyu betonarme */
      if (S.pd !== false){
        (P.shearwalls||[]).forEach(function(pw){
          if (!onSt(pw, k)) return;
          var g = geomOf("shearwalls", pw, G); if (!g || g.x1 === undefined) return;
          prismLine(g.x1, g.y1, g.x2, g.y2, pnum(pw.t,0.20), z0, zw, cOf("perde", pw), OPA);
        });
      }

      /* parapetler — katın üstüne oturur */
      if (S.pr !== false){
        (P.parapets||[]).forEach(function(pr){
          if (Math.min(stTo(pr), nShow-1) !== k) return;      /* en üst katında çizilir */
          var g = geomOf("parapets", pr, G); if (!g || g.x1 === undefined) return;
          var zb = z[k+1];
          prismLine(g.x1, g.y1, g.x2, g.y2, pnum(pr.t,0.20), zb, zb + pnum(pr.h,0.50),
                    cOf("parapet", pr), OPA);
        });
      }

      /* kirişler — döşemenin altına asılı */
      if (S.rg){
        P.beams.forEach(function(bm){
          if (!onSt(bm, k)) return;
          var g = geomOf("beams", bm, G); if (!g) return;
          var hB = pnum(bm.h,0.50), bB = pnum(bm.b,0.30);
          prismLine(g.x1, g.y1, g.x2, g.y2, bB, z1-hB, zw, cOf("beam", bm), OPA);
        });
      }

      /* döşemeler — yırtıklar ve merdiven boşluğu çıkarılmış */
      if (S.dk){
        var holes = [];
        P.openings.forEach(function(op){
          if (!onSt(op, k)) return;
          var go = geomOf("openings", op, G);
          if (go && go.w) holes.push({x:go.x, y:go.y, w:go.w, h:go.h});
        });
        P.stairs.forEach(function(st){
          if (!onSt(st, k)) return;
          var gt = geomOf("stairs", st, G);
          if (gt && gt.w) holes.push({x:gt.x, y:gt.y, w:gt.w, h:gt.h});
        });
        P.slabs.forEach(function(sl){
          if (!onSt(sl, k)) return;
          var g = geomOf("slabs", sl, G); if (!g || !g.w) return;
          var parts = [{x:g.x, y:g.y, w:g.w, h:g.h}];
          holes.forEach(function(hh){ parts = subRect(parts, hh); });
          var tS = pnum(sl.t, 0.20), colS = cOf("slab", sl);
          parts.forEach(function(rp){ prismRect(rp.x, rp.y, rp.w, rp.h, z1-tS, z1, colS, OPA); });
        });
      }
    }

    /* ---------- KOLONLAR (kat aralığı kendi from/to) ---------- */
    if (S.st){
      P.columns.forEach(function(c){
        var gp = geomOf("columns", c, G); if (!gp) return;
        var f0 = stFrom(c), t0 = Math.min(nShow-1, stTo(c));
        if (t0 < f0) return;
        var q = [], i2;
        if (c.form === "circle"){
          var rr = pnum(c.d,0.30)/2;
          for (i2=0;i2<12;i2++){ var aa = i2/12*2*Math.PI; q.push([gp.x+Math.cos(aa)*rr, gp.y+Math.sin(aa)*rr]); }
        } else {
          var cb = pnum(c.b,0.30)/2, ch = pnum(c.h,0.30)/2;
          q = [[gp.x-cb,gp.y-ch],[gp.x+cb,gp.y-ch],[gp.x+cb,gp.y+ch],[gp.x-cb,gp.y+ch]];
        }
        prismPoly(q, z[f0], z[t0+1], cOf("col", c), OPA);
      });
    }

    /* ---------- BALKONLAR ---------- */
    if (S.dk){
      P.balconies.forEach(function(bk){
        var g = geomOf("balconies", bk, G); if (!g || !g.w) return;
        var col = cOf("balk", bk), tB = pnum(bk.t,0.18), rh = pnum(bk.rail,1.00);
        var ov = outwardDir(bk.dir, pnum(bk.line,0));
        for (var kb=1; kb<=nShow; kb++){
          if (!onSt(bk, kb-1)) continue;
          var zb = z[kb];
          prismRect(g.x, g.y, g.w, g.h, zb-tB, zb, col, OPA);
          /* korkuluk — dışa bakan üç kenar */
          var e = [];
          if (Math.abs(ov[1]) > 0.5){
            var yr = (ov[1] < 0) ? g.y : g.y+g.h;
            e = [[[g.x,yr],[g.x+g.w,yr]], [[g.x,g.y],[g.x,g.y+g.h]], [[g.x+g.w,g.y],[g.x+g.w,g.y+g.h]]];
          } else {
            var xr = (ov[0] < 0) ? g.x : g.x+g.w;
            e = [[[xr,g.y],[xr,g.y+g.h]], [[g.x,g.y],[g.x+g.w,g.y]], [[g.x,g.y+g.h],[g.x+g.w,g.y+g.h]]];
          }
          var rc = tint(col,.45);
          e.forEach(function(sgm){
            line3([sgm[0][0],sgm[0][1],zb],[sgm[0][0],sgm[0][1],zb+rh], rc, 1.2, ".85");
            line3([sgm[1][0],sgm[1][1],zb],[sgm[1][0],sgm[1][1],zb+rh], rc, 1.2, ".85");
            line3([sgm[0][0],sgm[0][1],zb+rh],[sgm[1][0],sgm[1][1],zb+rh], rc, 1.4, ".95");
            line3([sgm[0][0],sgm[0][1],zb+rh*0.5],[sgm[1][0],sgm[1][1],zb+rh*0.5], rc, .8, ".55");
          });
        }
      });
    }

    /* ---------- ÇATI ---------- */
    if (P.roof && P.roof.on && S.ct !== false && nShow >= P.storeys.length){
      var R3 = P.roof, rc3 = roofCalc();
      var zt3 = z[P.storeys.length];
      var ox3 = R3.over, ex0 = -ox3, ex1 = W+ox3, ey0 = -ox3, ey1 = D+ox3;
      var ridge = zt3 + rc3.rise;
      var axX = (R3.ridge === "x");
      var rCol = cOf("roof", R3);
      var sCol = matColor(R3.mat);
      function rf(pts){ face(pts, rCol, OPA, 1.2); }
      if (R3.type === "flach"){
        rf([[ex0,ey0,zt3],[ex1,ey0,zt3],[ex1,ey1,zt3],[ex0,ey1,zt3]]);
      } else if (R3.type === "pult"){
        if (axX) rf([[ex0,ey0,ridge],[ex1,ey0,ridge],[ex1,ey1,zt3],[ex0,ey1,zt3]]);
        else     rf([[ex0,ey0,ridge],[ex0,ey1,ridge],[ex1,ey1,zt3],[ex1,ey0,zt3]]);
      } else if (R3.type === "zelt"){
        var mcx = (ex0+ex1)/2, mcy = (ey0+ey1)/2;
        rf([[ex0,ey0,zt3],[ex1,ey0,zt3],[mcx,mcy,ridge]]);
        rf([[ex1,ey0,zt3],[ex1,ey1,zt3],[mcx,mcy,ridge]]);
        rf([[ex1,ey1,zt3],[ex0,ey1,zt3],[mcx,mcy,ridge]]);
        rf([[ex0,ey1,zt3],[ex0,ey0,zt3],[mcx,mcy,ridge]]);
      } else if (R3.type === "walm" || R3.type === "kruepp"){
        var ins = (axX ? (ey1-ey0) : (ex1-ex0)) / 2;
        if (R3.type === "kruepp") ins *= 0.45;
        if (axX){
          var rmy = (ey0+ey1)/2;
          rf([[ex0,ey0,zt3],[ex1,ey0,zt3],[ex1-ins,rmy,ridge],[ex0+ins,rmy,ridge]]);
          rf([[ex0,ey1,zt3],[ex1,ey1,zt3],[ex1-ins,rmy,ridge],[ex0+ins,rmy,ridge]]);
          rf([[ex0,ey0,zt3],[ex0,ey1,zt3],[ex0+ins,rmy,ridge]]);
          rf([[ex1,ey0,zt3],[ex1,ey1,zt3],[ex1-ins,rmy,ridge]]);
        } else {
          var rmx = (ex0+ex1)/2;
          rf([[ex0,ey0,zt3],[ex0,ey1,zt3],[rmx,ey1-ins,ridge],[rmx,ey0+ins,ridge]]);
          rf([[ex1,ey0,zt3],[ex1,ey1,zt3],[rmx,ey1-ins,ridge],[rmx,ey0+ins,ridge]]);
          rf([[ex0,ey0,zt3],[ex1,ey0,zt3],[rmx,ey0+ins,ridge]]);
          rf([[ex0,ey1,zt3],[ex1,ey1,zt3],[rmx,ey1-ins,ridge]]);
        }
      } else if (R3.type === "mansard"){
        var kn = zt3 + rc3.rise*0.55;
        if (axX){
          var my2 = (ey0+ey1)/2, q1 = ey0 + (my2-ey0)*0.45, q2 = ey1 - (ey1-my2)*0.45;
          rf([[ex0,ey0,zt3],[ex1,ey0,zt3],[ex1,q1,kn],[ex0,q1,kn]]);
          rf([[ex0,q1,kn],[ex1,q1,kn],[ex1,my2,ridge],[ex0,my2,ridge]]);
          rf([[ex0,ey1,zt3],[ex1,ey1,zt3],[ex1,q2,kn],[ex0,q2,kn]]);
          rf([[ex0,q2,kn],[ex1,q2,kn],[ex1,my2,ridge],[ex0,my2,ridge]]);
        } else {
          var mx2 = (ex0+ex1)/2, r1 = ex0 + (mx2-ex0)*0.45, r2 = ex1 - (ex1-mx2)*0.45;
          rf([[ex0,ey0,zt3],[ex0,ey1,zt3],[r1,ey1,kn],[r1,ey0,kn]]);
          rf([[r1,ey0,kn],[r1,ey1,kn],[mx2,ey1,ridge],[mx2,ey0,ridge]]);
          rf([[ex1,ey0,zt3],[ex1,ey1,zt3],[r2,ey1,kn],[r2,ey0,kn]]);
          rf([[r2,ey0,kn],[r2,ey1,kn],[mx2,ey1,ridge],[mx2,ey0,ridge]]);
        }
      } else {
        if (axX){
          var mry = (ey0+ey1)/2;
          rf([[ex0,ey0,zt3],[ex1,ey0,zt3],[ex1,mry,ridge],[ex0,mry,ridge]]);
          rf([[ex0,ey1,zt3],[ex1,ey1,zt3],[ex1,mry,ridge],[ex0,mry,ridge]]);
          /* mahya + aşık — taşıyıcı malzeme rengi */
          if (S.rg){
            line3([ex0,mry,ridge],[ex1,mry,ridge], sCol, 3, "1");
            line3([ex0,ey0,zt3],[ex1,ey0,zt3], sCol, 2, ".9");
            line3([ex0,ey1,zt3],[ex1,ey1,zt3], sCol, 2, ".9");
          }
        } else {
          var mrx = (ex0+ex1)/2;
          rf([[ex0,ey0,zt3],[ex0,ey1,zt3],[mrx,ey1,ridge],[mrx,ey0,ridge]]);
          rf([[ex1,ey0,zt3],[ex1,ey1,zt3],[mrx,ey1,ridge],[mrx,ey0,ridge]]);
          if (S.rg){
            line3([mrx,ey0,ridge],[mrx,ey1,ridge], sCol, 3, "1");
            line3([ex0,ey0,zt3],[ex0,ey1,zt3], sCol, 2, ".9");
            line3([ex1,ey0,zt3],[ex1,ey1,zt3], sCol, 2, ".9");
          }
        }
      }
    }

    /* ---------- merdiven çizici ---------- */
    function drawStair(st, zBase, zTop){
      var g = geomOf("stairs", st, G); if (!g || !g.w) return;
      var c = stairCalc(st);
      var hSt = zTop - zBase, n = Math.max(2, Math.round(hSt / Math.max(pnum(st.riser,.175), .05)));
      var r = hSt / n, a = pnum(st.tread, .28), b = pnum(st.w, 1.20);
      var col = cOf("stair", st);
      var srot3 = ((pnum(st.rot,0) % 360) + 360) % 360;
      var RCX = g.x + g.w/2, RCY = g.y + g.h/2;
      function RP(px, py){
        if (!srot3) return [px, py];
        var a3 = srot3 * Math.PI/180, dx3 = px - RCX, dy3 = py - RCY;
        return [RCX + dx3*Math.cos(a3) - dy3*Math.sin(a3), RCY + dx3*Math.sin(a3) + dy3*Math.cos(a3)];
      }
      var alongX = (g.w >= g.h);

      function run(ox, oy, ux, uy, i0, i1, wid){
        var px = -uy, py = ux;
        for (var i=i0; i<i1; i++){
          var s0 = (i-i0)*a, s1 = s0 + a;
          var zb = zBase + i*r, ztp = zBase + (i+1)*r;
          var A = RP(ox+ux*s0+px*wid/2, oy+uy*s0+py*wid/2);
          var B = RP(ox+ux*s1+px*wid/2, oy+uy*s1+py*wid/2);
          var C = RP(ox+ux*s1-px*wid/2, oy+uy*s1-py*wid/2);
          var E = RP(ox+ux*s0-px*wid/2, oy+uy*s0-py*wid/2);
          face([[A[0],A[1],ztp],[B[0],B[1],ztp],[C[0],C[1],ztp],[E[0],E[1],ztp]], col, OPA);
          face([[A[0],A[1],zb],[A[0],A[1],ztp],[E[0],E[1],ztp],[E[0],E[1],zb]], col, OPA);
          face([[A[0],A[1],zb],[B[0],B[1],zb],[B[0],B[1],ztp],[A[0],A[1],ztp]], col, OPA*0.9);
          face([[E[0],E[1],zb],[C[0],C[1],zb],[C[0],C[1],ztp],[E[0],E[1],ztp]], col, OPA*0.9);
        }
      }
      function podest(x, y, w2, h2, zz){
        if (!srot3){ prismRect(x, y, w2, h2, zz-0.18, zz, col, OPA); return; }
        prismPoly([RP(x,y), RP(x+w2,y), RP(x+w2,y+h2), RP(x,y+h2)], zz-0.18, zz, col, OPA);
      }

      if (st.type === "spindel"){
        var rc = Math.max(0.6, Math.min(g.w,g.h)/2 - 0.1), cx0 = g.x+g.w/2, cy0 = g.y+g.h/2;
        for (var i3=0;i3<n;i3++){
          var a0 = i3/n*2*Math.PI*1.25, a1 = (i3+1)/n*2*Math.PI*1.25;
          var zb2 = zBase+i3*r, zt2 = zBase+(i3+1)*r;
          prismPoly([[cx0+Math.cos(a0)*0.12, cy0+Math.sin(a0)*0.12],
                     [cx0+Math.cos(a0)*rc,  cy0+Math.sin(a0)*rc],
                     [cx0+Math.cos(a1)*rc,  cy0+Math.sin(a1)*rc],
                     [cx0+Math.cos(a1)*0.12,cy0+Math.sin(a1)*0.12]], zb2, zt2, col, OPA);
        }
        return;
      }
      if (st.type === "gegenlaeufig"){
        var n1 = Math.ceil(n/2), wid = Math.min(b, (alongX ? g.h : g.w)/2 - 0.05);
        var runL = n1*a;
        if (alongX){
          var y1 = g.y + wid/2, y2 = g.y + g.h - wid/2;
          run(g.x, y1, 1, 0, 0, n1, wid);
          podest(g.x+runL, g.y, Math.max(0.9, g.w-runL), g.h, zBase+n1*r);
          run(g.x+runL, y2, -1, 0, n1, n, wid);
        } else {
          var x1 = g.x + wid/2, x2 = g.x + g.w - wid/2;
          run(x1, g.y, 0, 1, 0, n1, wid);
          podest(g.x, g.y+runL, g.w, Math.max(0.9, g.h-runL), zBase+n1*r);
          run(x2, g.y+runL, 0, -1, n1, n, wid);
        }
        return;
      }
      if (st.type === "zweilaeufig" || st.type === "viertel" || st.type === "halb"){
        var nA = Math.ceil(n/2), wd2 = Math.min(b, Math.min(g.w,g.h)*0.55);
        run(g.x, g.y+wd2/2, 1, 0, 0, nA, wd2);
        podest(g.x+nA*a, g.y, Math.max(0.9,wd2), Math.max(0.9,wd2), zBase+nA*r);
        run(g.x+nA*a+wd2/2, g.y+wd2, 0, 1, nA, n, wd2);
        return;
      }
      if (st.type === "podest"){
        var nB = Math.ceil(n/2), wb = Math.min(b, (alongX ? g.h : g.w));
        if (alongX){
          run(g.x, g.y+wb/2, 1, 0, 0, nB, wb);
          podest(g.x+nB*a, g.y, 1.20, g.h, zBase+nB*r);
          run(g.x+nB*a+1.20, g.y+wb/2, 1, 0, nB, n, wb);
        } else {
          run(g.x+wb/2, g.y, 0, 1, 0, nB, wb);
          podest(g.x, g.y+nB*a, g.w, 1.20, zBase+nB*r);
          run(g.x+wb/2, g.y+nB*a+1.20, 0, 1, nB, n, wb);
        }
        return;
      }
      /* gerade */
      var wg = Math.min(b, (alongX ? g.h : g.w));
      if (alongX) run(g.x, g.y+g.h/2, 1, 0, 0, n, wg);
      else        run(g.x+g.w/2, g.y, 0, 1, 0, n, wg);
    }

    /* kat kotu etiketleri */
    for (var k4=0;k4<=nShow;k4++){
      var lp = proj3(0, D, z[k4], pr);
      bg.push('<text x="'+(lp[0]-12)+'" y="'+(lp[1]+4)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="10" fill="#5E7C96">'+
        (k4===0 ? "±0,00" : "+"+fmt(z[k4],2))+'</text>');
    }

  } else if (P.type === "halle"){
    var H = P.halle, rise = (H.span/2)*Math.tan(H.pitch*Math.PI/180);
    var nF = Math.max(2, Math.round(H.len/Math.max(H.bay,.1))+1);
    pr.s = (330/Math.max(H.span,H.len,H.eave+rise)) * V.zoom;
    var stC = (CM==="tip") ? "#3FB6D3" : matColor("S355");
    var rgC = (CM==="tip") ? "#A99AE8" : matColor("S235");
    bg.push('<polygon points="'+poly([[0,0,0],[H.span,0,0],[H.span,H.len,0],[0,H.len,0]],pr)+'" fill="#0E2033" stroke="#1E3348"/>');
    for (var i=0;i<nF;i++){
      var yy = Math.min(H.len, i*H.bay);
      prismLine(0,yy,0,yy+0.001, 0.30, 0, H.eave, stC, OPA);
      prismLine(H.span,yy,H.span,yy+0.001, 0.30, 0, H.eave, stC, OPA);
      line3([0,yy,H.eave],[H.span/2,yy,H.eave+rise],rgC,3.2,"1");
      line3([H.span/2,yy,H.eave+rise],[H.span,yy,H.eave],rgC,3.2,"1");
    }
    if (S.rg){
      for (var pf=0;pf<=4;pf++){
        var t2 = pf/4, xP = t2*H.span, zP = t2<=.5 ? H.eave + rise*(t2/.5) : H.eave + rise*((1-t2)/.5);
        line3([xP,0,zP],[xP,H.len,zP],rgC,1.8,".85");
      }
      line3([0,0,H.eave],[0,H.len,H.eave],rgC,2,"1");
      line3([H.span,0,H.eave],[H.span,H.len,H.eave],rgC,2,"1");
    }

  } else if (P.type === "bruecke"){
    var B = P.bruecke;
    pr.s = (330/Math.max(B.span, B.width*2, B.abut*3)) * V.zoom;
    var bc = (CM==="tip") ? "#3FB6D3" : matColor(P.design.beton);
    prismRect(0, 0, B.span, B.width, -B.deck, 0, bc, OPA);
    [0, B.span].forEach(function(xx){
      prismRect(xx===0 ? -0.6 : B.span, 0, 0.6, B.width, -B.deck-B.abut, -B.deck, bc, OPA*0.92);
    });
    line3([0,B.width/2,.02],[B.span,B.width/2,.02],"#7FE0F5",1.4,".7");

  } else {
    var Sw = P.stuetz, Ln = 10;
    pr.s = (330/Math.max(Sw.H*2, Ln, Sw.base*3)) * V.zoom;
    var wc = (CM==="tip") ? "#3FB6D3" : matColor(P.design.beton);
    prismRect(0, 0, Sw.base, Ln, 0, Sw.foot, wc, OPA);
    prismRect(0, 0, Sw.stem, Ln, Sw.foot, Sw.H, wc, OPA);
    bg.push('<polygon points="'+poly([[Sw.stem,0,Sw.foot],[Sw.stem,Ln,Sw.foot],[Sw.stem-2.2,Ln,Sw.H],[Sw.stem-2.2,0,Sw.H]],pr)+'" fill="#3A4A3A" fill-opacity=".45" stroke="none"/>');
  }

  /* ---------- eksen üçlüsü (modelin arkasında) ---------- */
  var org = [0,0,0];
  bg.push(seg3(org,[extent*0.16,0,0],pr,"#E4595F",1.8));
  bg.push(seg3(org,[0,extent*0.16,0],pr,"#3FBF7F",1.8));
  bg.push(seg3(org,[0,0,extent*0.16],pr,"#3FB6D3",1.8));
  var xa = proj3(extent*0.19,0,0,pr), ya = proj3(0,extent*0.19,0,pr), za = proj3(0,0,extent*0.19,pr);
  bg.push('<text x="'+fmt2(xa[0])+'" y="'+fmt2(xa[1])+'" font-family="ui-monospace,monospace" font-size="10" fill="#E4595F">x</text>');
  bg.push('<text x="'+fmt2(ya[0])+'" y="'+fmt2(ya[1])+'" font-family="ui-monospace,monospace" font-size="10" fill="#3FBF7F">y</text>');
  bg.push('<text x="'+fmt2(za[0])+'" y="'+fmt2(za[1])+'" font-family="ui-monospace,monospace" font-size="10" fill="#3FB6D3">z</text>');

  /* ---------- derinliğe göre sırala, sonra çiz ---------- */
  F.sort(function(p,q){ return p[0] - q[0]; });
  var o = bg.concat(F.map(function(p){ return p[1]; }));

  return '<svg viewBox="0 0 980 680" style="width:100%;height:100%">'+SVGDEFS+o.join("")+'</svg>';
}

var KTOOLS = [["lv","Maliyet listesi"],["mengen","Metraj dökümü"],["ozet","Özet ve karşılaştırma"]];

/* CSS yüzdesi — fmt() virgüllü ondalık verdiği için burada nokta kullanılır */
function pct(x){ return String(Math.round((isFinite(x)?x:0) * 10) / 10); }
function costBar(v, max, col){
  var w = max > 0 ? Math.max(1, Math.min(100, v/max*100)) : 0;
  return '<div style="height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:3px">'+
    '<div style="height:100%;width:'+pct(w)+'%;background:'+col+'"></div></div>';
}
var KGCOL = { "310":"#8CA3BC", "320":"#3FBF7F", "330":"#3FB6D3", "340":"#E05C8A",
              "350":"#7C6BD6", "360":"#B4553C", "390":"#E8A33D" };

function panelKosten(d, K){
  var C = P.costs;
  function fld(k, label, unit, dec){
    return '<div class="fld"><label>'+label+(unit?" ["+unit+"]":"")+'</label>'+
      '<input data-cost="'+k+'" value="'+fmt(pnum(C[k],0), dec===undefined?1:dec)+'"></div>';
  }
  function rfld(k, label){
    return '<div class="fld"><label>'+label+' [kg/m³]</label>'+
      '<input data-rebar="'+k+'" value="'+fmt(pnum(C.rebar[k],100),0)+'"></div>';
  }
  return '<div class="side r"><div class="scroll" style="flex:1">'+
    '<div class="hd">FİYAT TABANI</div><div style="padding:0 14px">'+
      '<div class="egrid">'+
        fld("index","Baupreisindex","2021=100",1)+
        fld("region","Bölge katsayısı","",2)+
      '</div>'+
      '<div class="note i" style="margin:8px 0 0">Katalog fiyatları <b>net</b> (MwSt hariç), Almanya ortalaması, '+
      '<b>Preisstand II/2026</b>. Endeksi değiştirirsen bütün katalog fiyatları ölçeklenir '+
      '(şu an ×'+fmt(K.f,3)+'). Kendi yazdığın birim fiyat olduğu gibi kalır.</div>'+
    '</div>'+

    '<div class="hd" style="padding-top:14px">DONATI ORANLARI</div><div style="padding:0 14px">'+
      '<div class="egrid">'+ rfld("found","Temel") + rfld("slab","Döşeme") + rfld("col","Kolon") +
        rfld("beam","Kiriş") + rfld("wall","Perde") + '</div>'+
      '<div class="note i" style="margin:8px 0 0">Donatı metrajı hacim × oran ile çıkar. Alışılmış değerler: '+
      'temel 70–100, döşeme 90–120, kolon 150–200, kiriş 140–180, perde 80–110 kg/m³.</div>'+
      (function(){
        var S2 = stahlListe(d);
        if (!S2.rows.length) return "";
        var est = (K.M.bewFd + K.M.bewDk + K.M.bewSt + K.M.bewUz + K.M.bewPd + (K.M.parBew||0)) * 1000;
        return '<div class="note g" style="margin:8px 0 0"><b>Donatı sekmesinin çelik listesi:</b> '+
          fmt(S2.tot,0)+' kg ('+fmt(S2.kgPerM3,0)+' kg/m³). Buradaki oranlarla tahmin: '+fmt(est,0)+' kg. '+
          'Fark '+fmt(est>0 ? (S2.tot-est)/est*100 : 0,0)+' %.</div>';
      })()+
    '</div>'+

    '<div class="hd" style="padding-top:14px">EK MALİYETLER</div><div style="padding:0 14px">'+
      '<div class="egrid">'+
        fld("tga","KG 400 tesisat","% KG300",0)+
        fld("bE","Şantiye kurulumu","%",1)+
        fld("unvor","Öngörülemeyen","%",1)+
        fld("nk","KG 700 yan maliyet","%",1)+
        fld("mwst","KDV (MwSt)","%",0)+
      '</div>'+
      '<div class="note i" style="margin:8px 0 0">KG 400 (ısıtma, sıhhi tesisat, elektrik, havalandırma) konutta '+
      'tipik olarak KG 300’ün %25–35’i kadardır. KG 700: HOAI planlama ücretleri, ruhsat, zemin etüdü, Prüfstatik.</div>'+
    '</div>'+

    '<div class="hd" style="padding-top:14px">İŞLEMLER</div><div style="padding:0 14px 16px">'+
      '<button class="btn sm pri" data-act="csvkosten" style="width:100%;margin-bottom:6px">CSV olarak dışa aktar (Excel)</button>'+
      '<button class="btn sm" data-act="printkosten" style="width:100%;margin-bottom:6px">Maliyet sayfasını yazdır / PDF</button>'+
      '<button class="btn sm" data-act="resetprices" style="width:100%">Birim fiyatları katalogdan geri yükle</button>'+
    '</div>'+
    '</div></div>';
}

      '<div style="font-family:var(--mono);font-size:9px;color:var(--tx4);margin-top:2px">'+esc(KGNAMES[g][0])+'</div></div>';

      '<div class="kv"><span>KG 400 Tesisat</span><span>'+eur(K.tga)+'</span></div>'+
      '<div class="kv" style="border-top:1px solid var(--line);margin-top:4px;padding-top:6px">'+
        '<span style="color:#C8D8E8">Bauwerkskosten</span><span style="color:var(--cy2)">'+eur(K.bauwerk)+'</span></div>'+
      '<div class="kv"><span>+ Şantiye / öngörülemeyen</span><span>'+eur(K.bE+K.unvor)+'</span></div>'+
      '<div class="kv"><span>+ KG 700 yan maliyet</span><span>'+eur(K.nk)+'</span></div>'+
      '<div class="kv"><span>Net toplam</span><span>'+eur(K.netto)+'</span></div>'+
      '<div class="kv"><span>+ KDV %'+fmt(pnum(P.costs.mwst,19),0)+'</span><span>'+eur(K.mwst)+'</span></div>'+
    '</div>'+
    '<div style="margin:12px 13px 16px;padding:12px;background:var(--cyd);border:1px solid #2E6688;border-radius:7px">'+
      '<div style="font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--tx3)">TOPLAM · BRÜT</div>'+
      '<div style="font-size:21px;font-weight:600;color:#9FD8EA;margin-top:3px">'+fmt(K.brutto,0)+' <span style="font-size:13px">€</span></div>'+
      '<div style="font-family:var(--mono);font-size:10px;color:var(--tx2);margin-top:5px">'+
        fmt(K.eBgfB,0)+' €/m² BGF · '+fmt(K.eBri,0)+' €/m³ BRI</div>'+
      '<div style="font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:2px">'+
        fmt(d.bgf,1)+' m² BGF · '+fmt(K.bri,0)+' m³ BRI</div>'+
    '</div></div></div>';
}

/* ---------- orta: LV tablosu ---------- */
function lvTable(d, K){
  var h = '';
  var gc = "58px 1fr 84px 42px 96px 104px 30px";
  Object.keys(KGNAMES).forEach(function(g){
    var rows = K.rows.filter(function(r){ return r.kg === g; });
    if (!rows.length) return;
    h += '<div style="display:flex;align-items:center;gap:9px;margin:14px 0 5px">'+
      '<span style="font-family:var(--mono);font-size:10px;letter-spacing:1px;color:'+KGCOL[g]+'">KG '+g+'</span>'+
      '<span style="font-size:12px;font-weight:600;color:var(--tx)">'+esc(KGNAMES[g][1])+'</span>'+
      '<span style="font-size:10.5px;color:var(--tx4)">'+esc(KGNAMES[g][0])+'</span>'+
      '<div style="flex:1;height:1px;background:var(--line)"></div>'+
      '<span style="font-family:var(--mono);font-size:11px;color:'+KGCOL[g]+'">'+eur(K.kg[g]||0)+'</span></div>';
    h += '<div style="display:grid;grid-template-columns:'+gc+';gap:6px;padding:0 4px 5px;'+
      'font-family:var(--mono);font-size:9px;letter-spacing:.6px;color:var(--tx4)">'+
      '<span>POZ</span><span>TANIM</span><span style="text-align:right">MİKTAR</span><span>BİRİM</span>'+
      '<span style="text-align:right">BİRİM FİYAT</span><span style="text-align:right">TUTAR</span><span></span></div>';
    rows.forEach(function(r){
      var dim = r.on ? "" : "opacity:.38;";
      h += '<div style="display:grid;grid-template-columns:'+gc+';gap:6px;align-items:center;padding:4px;'+
        'border-bottom:1px solid var(--line);'+dim+'">'+
        '<span style="font-family:var(--mono);font-size:10px;color:var(--tx3)">'+r.nr+'</span>'+
        '<span style="font-size:11.5px;color:#C8D8E8;line-height:1.35">'+esc(r.tr)+
          '<span style="display:block;font-size:9.5px;color:var(--tx4)">'+esc(r.de)+'</span></span>'+
        '<span style="font-family:var(--mono);font-size:11px;text-align:right;color:'+(r.q>0?"#9FD8EA":"var(--tx4)")+'">'+
          fmt(r.q, r.unit==="t" ? 3 : (r.unit==="Ad" ? 0 : 2))+'</span>'+
        '<span style="font-family:var(--mono);font-size:10px;color:var(--tx3)">'+r.unit+'</span>'+
        '<input data-ep="'+r.nr+'" value="'+fmt(r.ep,2)+'" style="text-align:right;font-family:var(--mono);font-size:11px;padding:3px 6px'+
          (r.own?";color:var(--am2);border-color:#5C4418":"")+'">'+
        '<span style="font-family:var(--mono);font-size:11.5px;text-align:right;color:'+(r.gp>0?"var(--tx)":"var(--tx4)")+'">'+
          fmt(r.gp,0)+'</span>'+
        '<label class="chk" style="margin:0;justify-content:center"><input type="checkbox" data-poson="'+r.nr+'"'+(r.on?" checked":"")+'></label>'+
        '</div>';
    });
  });
  return h;
}

    ["İç sıva alanı", M.putzIc, "m²", "iç duvar 2 yüz + dış duvar iç yüzü"]

  var L = [];
  L.push(q("TRAGWERK/PLAN — Kostenschätzung nach DIN 276"));

  L.push("");
  L.push([q("KG"),q("Pos"),q("Bezeichnung"),q("Tanım"),q("Menge"),q("Einheit"),q("EP netto [EUR]"),q("GP netto [EUR]"),q("aktiv")].join(sep));
  K.rows.forEach(function(r){
    L.push([q(r.kg), q(r.nr), q(r.de), q(r.tr), n(r.q, r.unit==="t"?3:2), q(r.unit), n(r.ep,2), n(r.gp,2), q(r.on?"ja":"nein")].join(sep));
  });
  L.push("");
  function sum(a,b){ L.push([q(""),q(""),q(a),q(""),q(""),q(""),q(""),n(b,2)].join(sep)); }
  sum("KG 300 Bauwerk - Baukonstruktionen", K.net300);
  sum("KG 400 Bauwerk - Technische Anlagen", K.tga);
  sum("Bauwerkskosten KG 300+400", K.bauwerk);
  sum("Baustelleneinrichtung", K.bE);
  sum("Unvorhergesehenes", K.unvor);

}

/* ============================================================
   KALIP PLANI — Schalplan
   Yalnız betonarme elemanlar, ölçülendirilmiş, pozisyon numaralı.
   ============================================================ */
var SCHTOOLS = [["plan","Kalıp planı"],["kesit","Kesit"],["liste","Pozisyon listesi"]];

/* pozisyon numaraları — her eleman türü için sıralı */
function posNr(list, i){
  var pre = { columns:"St", beams:"UZ", slabs:"D", shearwalls:"W", parapets:"AT", foundations:"F" }[list] || "P";
  return pre + "-" + (i+1);
}
/* kalıp planında gösterilecek kat */
function schKat(){
  var k = katOn() ? UI.kat : (UI.schKat === undefined ? 0 : UI.schKat);
  return Math.max(0, Math.min(k, nKat()-1));
}
/* betonarme eleman listesi — seçili katta */
function schElements(k){
  ensureShear(); ensurePar();
  var G = gridM(), out = [];
  P.columns.forEach(function(c,i){
    if (!onSt(c,k)) return;
    var g = geomOf("columns", c, G); if (!g) return;
    var A0 = (c.form==="circle") ? Math.PI*pnum(c.d,0.3)*pnum(c.d,0.3)/4 : pnum(c.b,0.3)*pnum(c.h,0.3);
    var U  = (c.form==="circle") ? Math.PI*pnum(c.d,0.3) : 2*(pnum(c.b,0.3)+pnum(c.h,0.3));
    var hh = pnum(P.storeys[k].h, 3.0);
    out.push({ list:"columns", row:c, nr:posNr("columns",i), g:g,
      mass:(c.form==="circle"?("Ø"+fmt(pnum(c.d,0.3)*100,0)):(fmt(pnum(c.b,0.3)*100,0)+"/"+fmt(pnum(c.h,0.3)*100,0))),
      vol:A0*hh, schal:U*hh, mat:c.mat });
  });
  P.beams.forEach(function(b,i){
    if (!onSt(b,k)) return;
    var g = geomOf("beams", b, G); if (!g) return;
    var L = beamL(b);
    out.push({ list:"beams", row:b, nr:posNr("beams",i), g:g,
      mass:fmt(pnum(b.b,0.3)*100,0)+"/"+fmt(pnum(b.h,0.5)*100,0),
      vol:pnum(b.b,0.3)*pnum(b.h,0.5)*L, schal:(2*pnum(b.h,0.5)+pnum(b.b,0.3))*L, mat:b.mat, L:L });
  });
  P.slabs.forEach(function(sl,i){
    if (!onSt(sl,k)) return;
    var g = geomOf("slabs", sl, G); if (!g || g.w === undefined) return;
    out.push({ list:"slabs", row:sl, nr:posNr("slabs",i), g:g,
      mass:"d = "+fmt(pnum(sl.t,0.2)*100,0), vol:pnum(sl.t,0.2)*g.w*g.h, schal:g.w*g.h, mat:sl.mat });
  });
  (P.shearwalls||[]).forEach(function(w,i){
    if (!onSt(w,k)) return;
    var g = geomOf("shearwalls", w, G); if (!g || g.x1 === undefined) return;
    var L = shearLen(w), hh = pnum(P.storeys[k].h, 3.0);
    out.push({ list:"shearwalls", row:w, nr:posNr("shearwalls",i), g:g,
      mass:"d = "+fmt(pnum(w.t,0.2)*100,0), vol:L*pnum(w.t,0.2)*hh, schal:2*L*hh, mat:w.mat, L:L });
  });
  (P.parapets||[]).forEach(function(p,i){
    if (Math.min(stTo(p), nKat()-1) !== k) return;
    var g = geomOf("parapets", p, G); if (!g || g.x1 === undefined) return;
    var L = parLen(p);
    out.push({ list:"parapets", row:p, nr:posNr("parapets",i), g:g,
      mass:"h/d = "+fmt(pnum(p.h,0.5)*100,0)+"/"+fmt(pnum(p.t,0.2)*100,0),
      vol:L*pnum(p.h,0.5)*pnum(p.t,0.2), schal:2*L*pnum(p.h,0.5), mat:p.mat, L:L });
  });
  if (k === 0){
    P.foundations.forEach(function(f,i){
      out.push({ list:"foundations", row:f, nr:posNr("foundations",i), g:null,
        mass:foundLabel(f.kind), vol:0, schal:0, mat:f.mat });
    });
  }
  return out;
}

/* ---------- kalıp planı çizimi ---------- */
function drawSchal(d){
  var k = schKat();
  var W = d.W, D = d.D;
  if (W <= 0 || D <= 0) return '<text x="400" y="300" fill="#8CA3BC" font-size="14">Aks tanımlayın</text>';
  var availW = 600, availH = 370;
  var s = Math.min(availW / W, availH / D);
  var X0 = 175 + (availW - W*s)/2, Y0 = 120 + (availH - D*s)/2;
  var G = gridM();
  function MX(v){ return X0 + v*s; }
  function MY(v){ return Y0 + v*s; }
  var xs = G.x.map(MX), ys = G.y.map(MY);
  var X9 = xs[xs.length-1], Y9 = ys[ys.length-1];
  var o = [];
  var els = schElements(k);

  /* --- döşeme alanı (açık gri) --- */
  els.filter(function(e){ return e.list === "slabs"; }).forEach(function(e){
    o.push('<rect x="'+fmt2(MX(e.g.x))+'" y="'+fmt2(MY(e.g.y))+'" width="'+fmt2(e.g.w*s)+'" height="'+fmt2(e.g.h*s)+
      '" fill="#17293A" stroke="#355A79" stroke-width=".8"/>');
    var sx = MX(e.g.x + e.g.w/2), sy = MY(e.g.y + e.g.h/2);
    o.push('<text x="'+fmt2(sx)+'" y="'+fmt2(sy-4)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="600" fill="#3FB6D3" opacity=".85">'+e.nr+'</text>');
    o.push('<text x="'+fmt2(sx)+'" y="'+fmt2(sy+9)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#2E7E9B">'+esc(e.mass)+' cm</text>');
  });
  /* --- yırtık ve merdiven boşlukları --- */
  ["openings","stairs"].forEach(function(key){
    katVis(key).forEach(function(r){
      var g = geomOf(key, r, G); if (!g || g.w === undefined) return;
      o.push('<rect x="'+fmt2(MX(g.x))+'" y="'+fmt2(MY(g.y))+'" width="'+fmt2(g.w*s)+'" height="'+fmt2(g.h*s)+
        '" fill="#0A1220" stroke="#E4595F" stroke-width="1.2"/>');
      o.push('<line x1="'+fmt2(MX(g.x))+'" y1="'+fmt2(MY(g.y))+'" x2="'+fmt2(MX(g.x+g.w))+'" y2="'+fmt2(MY(g.y+g.h))+'" stroke="#E4595F" stroke-width=".8"/>');
      o.push('<line x1="'+fmt2(MX(g.x+g.w))+'" y1="'+fmt2(MY(g.y))+'" x2="'+fmt2(MX(g.x))+'" y2="'+fmt2(MY(g.y+g.h))+'" stroke="#E4595F" stroke-width=".8"/>');
    });
  });
  /* --- aks çizgileri --- */
  o.push('<g stroke="#2E4A63" stroke-width=".9" stroke-dasharray="14 5 3 5">');
  xs.forEach(function(x){ o.push('<line x1="'+fmt2(x)+'" y1="'+fmt2(Y0-54)+'" x2="'+fmt2(x)+'" y2="'+fmt2(Y9+40)+'"/>'); });
  ys.forEach(function(y){ o.push('<line x1="'+fmt2(X0-50)+'" y1="'+fmt2(y)+'" x2="'+fmt2(X9+40)+'" y2="'+fmt2(y)+'"/>'); });
  o.push('</g><g fill="#0A1220" stroke="#4E7492" stroke-width="1.1">');
  xs.forEach(function(x){ o.push('<circle cx="'+fmt2(x)+'" cy="'+fmt2(Y0-66)+'" r="12.5"/>'); });
  ys.forEach(function(y){ o.push('<circle cx="'+fmt2(X0-62)+'" cy="'+fmt2(y)+'" r="12.5"/>'); });
  o.push('</g><g fill="#9FD8EA" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">');
  xs.forEach(function(x,i){ o.push('<text x="'+fmt2(x)+'" y="'+fmt2(Y0-62)+'">'+AX[i]+'</text>'); });
  ys.forEach(function(y,i){ o.push('<text x="'+fmt2(X0-62)+'" y="'+fmt2(y+4)+'">'+(i+1)+'</text>'); });
  o.push('</g>');

  /* --- perde duvarlar --- */
  els.filter(function(e){ return e.list === "shearwalls"; }).forEach(function(e){
    var g = e.g, tp = Math.max(5, pnum(e.row.t,0.2)*s);
    var hz = Math.abs(g.y2-g.y1) < 1e-9;
    var x = hz ? MX(Math.min(g.x1,g.x2)) : MX(g.x1)-tp/2;
    var y = hz ? MY(g.y1)-tp/2 : MY(Math.min(g.y1,g.y2));
    var w = hz ? Math.abs(g.x2-g.x1)*s : tp;
    var hgt = hz ? tp : Math.abs(g.y2-g.y1)*s;
    o.push('<rect data-el="'+e.row.id+'" x="'+fmt2(x)+'" y="'+fmt2(y)+'" width="'+fmt2(w)+'" height="'+fmt2(hgt)+
      '" fill="url(#hx)" stroke="#E05C8A" stroke-width="1.5"/>');
    var cx = hz ? (x+w/2) : (x+tp/2+10), cy = hz ? (y-7) : (y+hgt/2);
    o.push('<text x="'+fmt2(cx)+'" y="'+fmt2(cy)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" font-weight="600" fill="#F2A0BC">'+
      e.nr+' · '+e.mass+'</text>');
  });
  /* --- parapetler --- */
  els.filter(function(e){ return e.list === "parapets"; }).forEach(function(e){
    var g = e.g, tp = Math.max(4, pnum(e.row.t,0.2)*s);
    var hz = Math.abs(g.y2-g.y1) < 1e-9;
    o.push('<rect data-el="'+e.row.id+'" x="'+fmt2(hz?MX(Math.min(g.x1,g.x2)):MX(g.x1)-tp/2)+'" y="'+fmt2(hz?MY(g.y1)-tp/2:MY(Math.min(g.y1,g.y2)))+
      '" width="'+fmt2(hz?Math.abs(g.x2-g.x1)*s:tp)+'" height="'+fmt2(hz?tp:Math.abs(g.y2-g.y1)*s)+
      '" fill="#13302A" stroke="#6ECFA0" stroke-width="1.3"/>');
  });
  /* --- kirişler --- */
  els.filter(function(e){ return e.list === "beams"; }).forEach(function(e){
    var g = e.g, bw = Math.max(6, pnum(e.row.b,0.3)*s);
    var hz = Math.abs(g.y2-g.y1) < 1e-9;
    var x = hz ? MX(Math.min(g.x1,g.x2)) : MX(g.x1)-bw/2;
    var y = hz ? MY(g.y1)-bw/2 : MY(Math.min(g.y1,g.y2));
    var w = hz ? Math.abs(g.x2-g.x1)*s : bw;
    var hgt = hz ? bw : Math.abs(g.y2-g.y1)*s;
    o.push('<rect data-el="'+e.row.id+'" x="'+fmt2(x)+'" y="'+fmt2(y)+'" width="'+fmt2(w)+'" height="'+fmt2(hgt)+
      '" fill="none" stroke="#A99AE8" stroke-width="1.4" stroke-dasharray="9 4"/>');
    var mx = x+w/2, my = y+hgt/2;
    o.push('<rect x="'+fmt2(mx-30)+'" y="'+fmt2(my-9)+'" width="60" height="17" rx="2" fill="#0A1220" stroke="#6E5FA8" stroke-width=".8"/>');
    o.push('<text x="'+fmt2(mx)+'" y="'+fmt2(my+3.5)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" font-weight="600" fill="#C4B8F5">'+
      e.nr+' '+e.mass+'</text>');
  });
  /* --- kolonlar --- */
  els.filter(function(e){ return e.list === "columns"; }).forEach(function(e){
    var cx = MX(e.g.x), cy = MY(e.g.y), c = e.row;
    if (c.form === "circle"){
      o.push('<circle data-el="'+c.id+'" cx="'+fmt2(cx)+'" cy="'+fmt2(cy)+'" r="'+fmt2(Math.max(7, pnum(c.d,0.3)*s/2))+
        '" fill="url(#hx)" stroke="#E8A33D" stroke-width="1.8"/>');
    } else {
      var bw = Math.max(11, pnum(c.b,0.3)*s), bh = Math.max(11, pnum(c.h,0.3)*s);
      o.push('<rect data-el="'+c.id+'" x="'+fmt2(cx-bw/2)+'" y="'+fmt2(cy-bh/2)+'" width="'+fmt2(bw)+'" height="'+fmt2(bh)+
        '" fill="url(#hx)" stroke="#E8A33D" stroke-width="1.8"/>');
    }
    o.push('<text x="'+fmt2(cx+12)+'" y="'+fmt2(cy+19)+'" font-family="ui-monospace,monospace" font-size="9.5" font-weight="600" fill="#E9C286">'+e.nr+'</text>');
    o.push('<text x="'+fmt2(cx+12)+'" y="'+fmt2(cy+29)+'" font-family="ui-monospace,monospace" font-size="8.5" fill="#B8903F">'+e.mass+'</text>');
  });

  /* --- ölçü zincirleri --- */
  function dimH(y, a, b2, txt, col){
    o.push('<line x1="'+fmt2(a)+'" y1="'+fmt2(y)+'" x2="'+fmt2(b2)+'" y2="'+fmt2(y)+'" stroke="'+col+'" stroke-width=".9"/>');
    o.push('<line x1="'+fmt2(a)+'" y1="'+fmt2(y-4)+'" x2="'+fmt2(a)+'" y2="'+fmt2(y+4)+'" stroke="'+col+'" stroke-width="1.1"/>');
    o.push('<line x1="'+fmt2(b2)+'" y1="'+fmt2(y-4)+'" x2="'+fmt2(b2)+'" y2="'+fmt2(y+4)+'" stroke="'+col+'" stroke-width="1.1"/>');
    o.push('<text x="'+fmt2((a+b2)/2)+'" y="'+fmt2(y-6)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="'+col+'">'+txt+'</text>');
  }
  function dimV(x, a, b2, txt, col){
    o.push('<line x1="'+fmt2(x)+'" y1="'+fmt2(a)+'" x2="'+fmt2(x)+'" y2="'+fmt2(b2)+'" stroke="'+col+'" stroke-width=".9"/>');
    o.push('<line x1="'+fmt2(x-4)+'" y1="'+fmt2(a)+'" x2="'+fmt2(x+4)+'" y2="'+fmt2(a)+'" stroke="'+col+'" stroke-width="1.1"/>');
    o.push('<line x1="'+fmt2(x-4)+'" y1="'+fmt2(b2)+'" x2="'+fmt2(x+4)+'" y2="'+fmt2(b2)+'" stroke="'+col+'" stroke-width="1.1"/>');
    o.push('<text x="'+fmt2(x-6)+'" y="'+fmt2((a+b2)/2)+'" text-anchor="middle" transform="rotate(-90 '+fmt2(x-6)+' '+fmt2((a+b2)/2)+')" '+
      'font-family="ui-monospace,monospace" font-size="9.5" fill="'+col+'">'+txt+'</text>');
  }
  var yD1 = Y9 + 42, yD2 = Y9 + 70;
  P.grid.x.forEach(function(L,i){ dimH(yD1, xs[i], xs[i+1], fmt(L,2), "#9FD8EA"); });
  dimH(yD2, xs[0], X9, fmt(W,2), "#6ECFA0");
  var xD1 = X0 - 92, xD2 = X0 - 122;
  P.grid.y.forEach(function(L,i){ dimV(xD1, ys[i], ys[i+1], fmt(L,2), "#9FD8EA"); });
  dimV(xD2, ys[0], Y9, fmt(D,2), "#6ECFA0");

  /* --- başlık ve kot --- */
  var zOK = katKot(k) + (P.storeys[k] ? P.storeys[k].h : 3);
  o.push('<text x="'+fmt2(X0-120)+'" y="'+fmt2(Y0-104)+'" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#C8D8E8">'+
    'SCHALPLAN · '+esc(katName(k))+'</text>');
  o.push('<text x="'+fmt2(X0-120)+'" y="'+fmt2(Y0-90)+'" font-family="ui-monospace,monospace" font-size="9.5" fill="var(--tx3)">'+
    'Decke über '+esc(katName(k))+' · OK Rohdecke +'+fmt(zOK,2)+' m · d = '+fmt(d.tSlab*100,0)+' cm · '+esc(P.design.beton)+'</text>');
  LASTG = { s:s, X0:X0, Y0:Y0, G:G, items:{} };
  return o.join("");
}

/* ---------- kesit ---------- */
function drawSchalSchnitt(d){
  var o = [], nS = P.storeys.length;
  var W = d.W, Htot = d.Htot;
  if (W <= 0) return '<text x="400" y="300" fill="#8CA3BC" font-size="14">Aks tanımlayın</text>';
  var tGr = pnum(P.soil.tGr, 0.8);
  var totH = Htot + tGr + 1.2;
  var availW = 580, availH = 400;
  var s = Math.min(availW / W, availH / totH);
  var X0 = 180, Y0 = 110 + availH;             /* Y0 = ±0,00 kotu */
  function X(v){ return X0 + v*s; }
  function Z(v){ return Y0 - v*s; }
  var G = gridM(), xs = G.x.map(X);

  /* zemin */
  o.push('<rect x="'+fmt2(X(0)-60)+'" y="'+fmt2(Z(0))+'" width="'+fmt2(W*s+120)+'" height="'+fmt2((tGr+0.8)*s)+'" fill="#16293A" opacity=".65"/>');
  o.push('<line x1="'+fmt2(X(0)-60)+'" y1="'+fmt2(Z(0))+'" x2="'+fmt2(X(W)+60)+'" y2="'+fmt2(Z(0))+'" stroke="#6ECFA0" stroke-width="1.6"/>');

  /* temel */
  var tF = 0.4;
  o.push('<rect x="'+fmt2(X(-0.2))+'" y="'+fmt2(Z(-tGr+tF))+'" width="'+fmt2((W+0.4)*s)+'" height="'+fmt2(tF*s)+
    '" fill="url(#hx)" stroke="#3FBF7F" stroke-width="1.4"/>');
  o.push('<text x="'+fmt2(X(W)+12)+'" y="'+fmt2(Z(-tGr+tF/2)+4)+'" font-family="ui-monospace,monospace" font-size="9" fill="#6ECFA0">F · d='+fmt(tF*100,0)+'</text>');

  /* katlar */
  for (var k=0;k<nS;k++){
    var z0 = katKot(k), z1 = katKot(k+1), tS = d.tSlab;
    /* döşeme */
    o.push('<rect x="'+fmt2(X(0))+'" y="'+fmt2(Z(z1))+'" width="'+fmt2(W*s)+'" height="'+fmt2(tS*s)+
      '" fill="url(#hx)" stroke="#3FB6D3" stroke-width="1.5"/>');
    /* kirişler bu katta */
    P.beams.forEach(function(b){
      if (!onSt(b,k) || b.dir !== "x") return;
      var sg = pnum(b.seg,0);
      if (sg >= P.grid.x.length) return;
      var hB = pnum(b.h,0.5), bB = pnum(b.b,0.3);
      o.push('<rect x="'+fmt2(xs[sg])+'" y="'+fmt2(Z(z1-tS))+'" width="'+fmt2((G.x[sg+1]-G.x[sg])*s)+'" height="'+fmt2((hB-tS)*s)+
        '" fill="none" stroke="#A99AE8" stroke-width="1.2" stroke-dasharray="7 3"/>');
    });
    /* kolonlar */
    P.columns.forEach(function(c){
      if (!onSt(c,k)) return;
      var g = geomOf("columns", c, G); if (!g) return;
      var bw = (c.form==="circle"? pnum(c.d,0.3) : pnum(c.b,0.3));
      o.push('<rect x="'+fmt2(X(g.x-bw/2))+'" y="'+fmt2(Z(z1-tS))+'" width="'+fmt2(bw*s)+'" height="'+fmt2((z1-tS-z0)*s)+
        '" fill="url(#hx)" stroke="#E8A33D" stroke-width="1.3"/>');
    });
    /* kot işareti */
    o.push('<line x1="'+fmt2(X(0)-70)+'" y1="'+fmt2(Z(z1))+'" x2="'+fmt2(X(0))+'" y2="'+fmt2(Z(z1))+'" stroke="#4E7492" stroke-width=".8" stroke-dasharray="4 3"/>');
    o.push('<text x="'+fmt2(X(0)-74)+'" y="'+fmt2(Z(z1)-3)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="9.5" fill="#9FD8EA">+'+fmt(z1,2)+'</text>');
    o.push('<text x="'+fmt2(X(0)-74)+'" y="'+fmt2(Z(z1)+10)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="8.5" fill="var(--tx4)">OK '+esc(katName(k))+'</text>');
    /* kat yüksekliği ölçüsü */
    o.push('<line x1="'+fmt2(X(W)+34)+'" y1="'+fmt2(Z(z0))+'" x2="'+fmt2(X(W)+34)+'" y2="'+fmt2(Z(z1))+'" stroke="#9FD8EA" stroke-width=".9"/>');
    o.push('<text x="'+fmt2(X(W)+30)+'" y="'+fmt2((Z(z0)+Z(z1))/2)+'" text-anchor="middle" transform="rotate(-90 '+fmt2(X(W)+30)+' '+fmt2((Z(z0)+Z(z1))/2)+')" '+
      'font-family="ui-monospace,monospace" font-size="9" fill="#9FD8EA">'+fmt(z1-z0,2)+'</text>');
  }
  /* parapet */
  (P.parapets||[]).forEach(function(p){
    var zb = parBase(p);
    o.push('<rect x="'+fmt2(X(0))+'" y="'+fmt2(Z(zb + pnum(p.h,0.5)))+'" width="'+fmt2(pnum(p.t,0.2)*s)+'" height="'+fmt2(pnum(p.h,0.5)*s)+
      '" fill="#13302A" stroke="#6ECFA0" stroke-width="1.3"/>');
  });
  /* ±0,00 */
  o.push('<text x="'+fmt2(X(0)-74)+'" y="'+fmt2(Z(0)-3)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="9.5" fill="#6ECFA0">±0,00</text>');
  o.push('<text x="'+fmt2(X(0))+'" y="'+fmt2(Z(Htot)-48)+'" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#C8D8E8">SCHNITT A–A · Schalung</text>');
  o.push('<text x="'+fmt2(X(0))+'" y="'+fmt2(Z(Htot)-34)+'" font-family="ui-monospace,monospace" font-size="9.5" fill="var(--tx3)">'+
    nS+' Geschosse · H = '+fmt(Htot,2)+' m · Beton '+esc(P.design.beton)+'</text>');
  return o.join("");
}

function schalSvg(d, which){
  return '<svg viewBox="0 0 860 600" style="width:100%;height:100%;max-height:100%">'+SVGDEFS+
    (which === "kesit" ? drawSchalSchnitt(d) : drawSchal(d))+'</svg>';
}

/* ---------- pozisyon listesi ---------- */
function schalListe(d){
  var k = schKat(), els = schElements(k);
  var gc = "66px 1fr 108px 92px 84px 84px";
  var byList = {};
  els.forEach(function(e){ if (!byList[e.list]) byList[e.list] = []; byList[e.list].push(e); });
  var order = ["columns","beams","slabs","shearwalls","parapets","foundations"];
  var h = '';
  var tV = 0, tS = 0;
  order.forEach(function(L){
    var rows = byList[L]; if (!rows || !rows.length) return;
    var sv = 0, ss = 0;
    rows.forEach(function(r){ sv += r.vol; ss += r.schal; });
    tV += sv; tS += ss;
    var col = { columns:"#E8A33D", beams:"#A99AE8", slabs:"#3FB6D3", shearwalls:"#E05C8A",
                parapets:"#6ECFA0", foundations:"#3FBF7F" }[L];
    h += '<div style="display:flex;align-items:center;gap:9px;margin:14px 0 5px">'+
      '<span style="font-size:12px;font-weight:600;color:'+col+'">'+esc(STNAMES[L] || L)+'</span>'+
      '<span style="font-family:var(--mono);font-size:10px;color:var(--tx4)">'+rows.length+' poz.</span>'+
      '<div style="flex:1;height:1px;background:var(--line)"></div>'+
      '<span style="font-family:var(--mono);font-size:10.5px;color:'+col+'">'+fmt(sv,2)+' m³ · '+fmt(ss,1)+' m²</span></div>'+
      '<div style="display:grid;grid-template-columns:'+gc+';gap:6px;padding:0 4px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.6px;color:var(--tx4)">'+
      '<span>POZ</span><span>AD / KONUM</span><span>KESİT [cm]</span><span>MALZEME</span>'+
      '<span style="text-align:right">BETON m³</span><span style="text-align:right">KALIP m²</span></div>';
    rows.forEach(function(r){
      h += '<div style="display:grid;grid-template-columns:'+gc+';gap:6px;padding:4px;border-bottom:1px solid var(--line)">'+
        '<span style="font-family:var(--mono);font-size:10.5px;font-weight:600;color:'+col+'">'+r.nr+'</span>'+
        '<span style="font-size:11.5px;color:#C8D8E8">'+esc(r.row.name||"")+'</span>'+
        '<span style="font-family:var(--mono);font-size:10.5px;color:var(--tx2)">'+esc(r.mass)+'</span>'+
        '<span style="font-family:var(--mono);font-size:10px;color:var(--tx3)">'+esc(r.mat||"")+'</span>'+
        '<span style="font-family:var(--mono);font-size:10.5px;text-align:right;color:#9FD8EA">'+fmt(r.vol,3)+'</span>'+
        '<span style="font-family:var(--mono);font-size:10.5px;text-align:right;color:#9FD8EA">'+fmt(r.schal,2)+'</span></div>';
    });
  });
  if (!els.length) h += '<div class="note i" style="margin-top:14px">Bu katta betonarme eleman yok.</div>';
  else h += '<div style="display:grid;grid-template-columns:'+gc+';gap:6px;padding:9px 4px;margin-top:6px;border-top:1.5px solid var(--line2)">'+
    '<span></span><span style="font-size:12px;font-weight:600;color:var(--tx)">'+esc(katName(k))+' TOPLAM</span><span></span><span></span>'+
    '<span style="font-family:var(--mono);font-size:12px;text-align:right;color:var(--cy2)">'+fmt(tV,2)+'</span>'+
    '<span style="font-family:var(--mono);font-size:12px;text-align:right;color:var(--cy2)">'+fmt(tS,1)+'</span></div>';
  return h;
}

function schalSheet(){

    '<div style="font-family:var(--sans);font-size:9px;color:#55534D">'+esc(P.meta.name||"Unbenannt")+' · '+esc(P.meta.ort||"")+'</div></div>'+
    '<div style="text-align:right;font-family:var(--mono);font-size:8.5px;color:#55534D">Decke über '+esc(katName(k))+'<br>Rev. '+(HPOS+1)+'</div></div>'+
    '<div style="margin-top:16px;font-family:var(--sans);font-size:13px;font-weight:600">Schalplan · '+esc(katName(k))+'</div>';
  h += '<div style="margin-top:10px;background:#0A1220;border:1px solid #D6D3CA;padding:6px">'+
    '<svg viewBox="0 0 860 600" style="width:100%;height:auto">'+SVGDEFS+drawSchal(d)+'</svg></div>';
  h += rH("Positionsliste");
  var order = ["columns","beams","slabs","shearwalls","parapets"];
  var rows = [];
  order.forEach(function(L){
    els.filter(function(e){ return e.list === L; }).forEach(function(e){
      rows.push([e.nr, esc(e.row.name||""), esc(e.mass), esc(e.mat||""), fmt(e.vol,3), fmt(e.schal,2)]);
    });
  });
  h += rTab(["Pos","Bezeichnung","Querschnitt [cm]","Beton","m³","Schalung m²"], rows,
            "48px 1fr 108px 66px 52px 76px", 4);
  h += rOk("Σ "+esc(katName(k))+": Beton "+fmt(sv,2)+" m³ · Schalung "+fmt(ss,1)+" m²", true);
  h += rBox("Schalplan automatisch aus dem Modell erzeugt. Maße sind Rohbaumaße. "+
    "Aussparungen, Durchbrüche der TGA und Einbauteile sind gesondert zu prüfen und einzutragen.", "warn");
  return '<div class="psheet" style="width:580px;min-height:780px;margin:0 auto 18px;'+
    'background:#FBFAF7;color:#1A1A18;padding:36px 42px;display:flex;flex-direction:column;'+
    'font-family:Georgia,\'Times New Roman\',serif;overflow:auto">'+ h +

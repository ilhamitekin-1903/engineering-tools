  P.grid.x.forEach(function(L,i){ o.push('<text x="'+((xs[i]+xs[i+1])/2)+'" y="'+(dy+20)+'" text-anchor="middle">'+fmt(L,2)+'</text>'); });
  var dx = X9 + 72;
  o.push('<line x1="'+dx+'" y1="'+Y0+'" x2="'+dx+'" y2="'+Y9+'"/>');
  ys.forEach(function(y){ o.push('<line x1="'+(dx-6)+'" y1="'+y+'" x2="'+(dx+6)+'" y2="'+y+'"/>'); });
  P.grid.y.forEach(function(L,i){ o.push('<text x="'+(dx+14)+'" y="'+((ys[i]+ys[i+1])/2+4)+'">'+fmt(L,2)+'</text>'); });
  o.push('</g>');
  o.push('<text x="'+((X0+X9)/2)+'" y="'+(Y0-92)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6ECFA0">Außenmaß '+
    fmt(W + d.extWall, 2)+' × '+fmt(D + d.extWall, 2)+' m</text>');

  /* ================= DRENAJ HALKASI (temel / drenaj araçları) ================= */
  var _t0 = curTool();
  if ((_t0 === "temel" || _t0 === "drenaj") && P.drain && P.drain.on){
    var DCp = drainCalc(DERIVED || derive());
    var offP = (DCp.isWU ? 0 : pnum(P.drain.sealT,.004)) + pnum(P.drain.perimT,.10) +
               (P.drain.noppe ? .01 : 0) + pnum(P.drain.gravel,.25)*0.55;
    var gx0 = xs[0] - offP*s, gy0 = ys[0] - offP*s;
    var gp1x = xs[xs.length-1] + offP*s, gp1y = ys[ys.length-1] + offP*s;
    o.push('<rect x="'+fmt2(gx0)+'" y="'+fmt2(gy0)+'" width="'+fmt2(gp1x-gx0)+'" height="'+fmt2(gp1y-gy0)+
      '" fill="none" stroke="#E8A33D" stroke-width="2" stroke-dasharray="9 5" opacity=".8"><title>Dren borusu DN'+
      P.drain.dn+' · '+fmt(DCp.Lpipe,1)+' m · eğim '+fmt(DCp.slope,1)+' %</title></rect>');
    [[gx0,gy0],[gp1x,gy0],[gp1x,gp1y],[gx0,gp1y]].forEach(function(q3){
      o.push('<circle cx="'+fmt2(q3[0])+'" cy="'+fmt2(q3[1])+'" r="7" fill="#0A1220" stroke="#E8A33D" stroke-width="2">'+
        '<title>Kontrol bacası Ø'+fmt(pnum(P.drain.shaftD,.3)*100,0)+' cm</title></circle>');
    });
    o.push('<text x="'+fmt2((gx0+gp1x)/2)+'" y="'+fmt2(gy0-9)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#E8A33D">'+
      'Ringdrän DN'+P.drain.dn+' · '+fmt(DCp.Lpipe,1)+' m</text>');
  }

  /* ================= MOBİLYA YERLEŞTİRME ALANI ================= */
  if (curTool() === "mobilya" && UI.furnSel){
    o.push('<rect x="'+fmt2(X0-60)+'" y="'+fmt2(Y0-60)+'" width="'+fmt2(W*s+120)+'" height="'+fmt2(D*s+120)+
      '" fill="transparent" style="cursor:crosshair" data-furnplace="1"><title>Tıkla → '+esc(furnDef(UI.furnSel)[1])+' yerleştir</title></rect>');
  }

  /* ================= TIKLAMA KATMANI (araca göre) ================= */
  var tool = curTool();
  var nodeOn = (tool === "aks" || tool === "kolon" || tool === "kiris" || tool === "temel");
  var segMode = (tool === "duvar") ? "walls"
              : (tool === "kapi") ? "doors"
              : (tool === "pencere") ? "windows"
              : (tool === "temel") ? "found"
              : (tool === "balkon") ? "balconies"
              : (tool === "perde") ? "shearwalls"
              : (tool === "parapet") ? "parapets"
              : (tool === "kiris" || tool === "aks") ? "beams" : null;
  /* perde: tüm plan tıklanabilir — çift tıklanan noktaya en yakın aks kullanılır */
  if (tool === "perde"){
    o.push('<rect x="'+fmt2(X0-70)+'" y="'+fmt2(Y0-70)+'" width="'+fmt2(W*s+140)+'" height="'+fmt2(D*s+140)+
      '" fill="transparent" style="cursor:crosshair" data-perdeplace="1">'+
      '<title>Çift tıkla → tıkladığın noktaya en yakın aksa perde duvar ekle / kaldır</title></rect>');
  }
  var cellMode = (tool === "dosemeler") ? "slabs"
               : (tool === "yirtik") ? "openings"
               : (tool === "merdiven") ? "stairs" : null;
  var cellOn = !!cellMode;
  var COL = { beams:"#7C6BD6", walls:"#3FB6D3", doors:"#7FE0F5", windows:"#7FE0F5", found:"#3FBF7F",
              slabs:"#7C6BD6", openings:"#E4595F", stairs:"#7FE0F5", balconies:"#E8A33D",
              shearwalls:"#E05C8A", parapets:"#6ECFA0" };

  if (cellOn){
    o.push('<g>');
    for (var ci=0;ci<P.grid.x.length;ci++){
      for (var cj=0;cj<P.grid.y.length;cj++){
        var idx = cellMode === "slabs" ? findSlab(ci,cj)
                : cellMode === "openings" ? findOpening(ci,cj) : findStair(ci,cj);
        var has = idx >= 0;
        var eid = has ? P[cellMode][idx].id : "";
        var nm2 = cellMode === "slabs" ? "döşeme" : (cellMode === "openings" ? "yırtık" : "merdiven");
        o.push('<rect class="hc'+(has?" on":"")+'" style="stroke:'+COL[cellMode]+'"'+(eid?' data-el="'+eid+'"':'')+
          ' x="'+(xs[ci]+8)+'" y="'+(ys[cj]+8)+'" width="'+(xs[ci+1]-xs[ci]-16)+
          '" height="'+(ys[cj+1]-ys[cj]-16)+'" rx="4" data-cell="1" data-cx="'+ci+'" data-cy="'+cj+'"><title>'+
          (has?("Çift tıkla: "+nm2+" kaldır"):("Çift tıkla: "+nm2+" ekle"))+' · '+AX[ci]+AX[ci+1]+'/'+(cj+1)+(cj+2)+'</title></rect>');
      }
    }
    o.push('</g>');
  }

  if (segMode){
    var isFound = (segMode === "found");
    var needWall = (segMode === "doors" || segMode === "windows" || isFound);
    var perOnly = (segMode === "balconies");
    function segHas(dir, line, seg){
      if (isFound) return findFound(function(f){ return f.kind==="streifen" && f.dir===dir && pnum(f.line,-1)===line && pnum(f.seg,-1)===seg; });
      return findSeg(segMode, dir, line, seg);
    }
    o.push('<g>');
    for (var a2=0;a2<xs.length-1;a2++){
      for (var l2=0;l2<ys.length;l2++){
        var w0 = (xs[a2+1]-xs[a2])-30; if (w0 < 8) continue;
        if (needWall && findSeg("walls","x",l2,a2) < 0) continue;
        if (perOnly && !isPerimeter("x", l2)) continue;
        var oi = segHas("x", l2, a2); var on = oi >= 0;
        var oid = on ? (isFound ? P.foundations[oi].id : P[segMode][oi].id) : "";
        o.push('<rect class="hs'+(on?" on":"")+'" style="stroke:'+COL[segMode]+'"'+(oid?' data-el="'+oid+'"':'')+' x="'+(xs[a2]+15)+'" y="'+(ys[l2]-11)+
          '" width="'+w0+'" height="22" rx="3" data-seg="x" data-line="'+l2+'" data-idx="'+a2+'"><title>'+
          (on?"Çift tıkla: kaldır":"Çift tıkla: ekle")+' · '+AX[a2]+'–'+AX[a2+1]+' / aks '+(l2+1)+'</title></rect>');
      }
    }
    for (var b2=0;b2<ys.length-1;b2++){
      for (var m2=0;m2<xs.length;m2++){
        var h0 = (ys[b2+1]-ys[b2])-30; if (h0 < 8) continue;
        if (needWall && findSeg("walls","y",m2,b2) < 0) continue;
        if (perOnly && !isPerimeter("y", m2)) continue;
        var oi2 = segHas("y", m2, b2); var on2 = oi2 >= 0;
        var oid2 = on2 ? (isFound ? P.foundations[oi2].id : P[segMode][oi2].id) : "";
        o.push('<rect class="hs'+(on2?" on":"")+'" style="stroke:'+COL[segMode]+'"'+(oid2?' data-el="'+oid2+'"':'')+' x="'+(xs[m2]-11)+'" y="'+(ys[b2]+15)+
          '" width="22" height="'+h0+'" rx="3" data-seg="y" data-line="'+m2+'" data-idx="'+b2+'"><title>'+
          (on2?"Çift tıkla: kaldır":"Çift tıkla: ekle")+' · aks '+AX[m2]+' / '+(b2+1)+'–'+(b2+2)+'</title></rect>');
      }
    }
    o.push('</g>');
  }

  LASTG = { s:s, X0:X0, Y0:Y0, G:G, items:DRAWG };
  if (curTool() === "ciz") { o.push(drawHandles()); return o.join(""); }
  LASTG = { s:s, X0:X0, Y0:Y0, G:G, items:DRAWG };
  o.push(toolHandles());
  if (nodeOn){
    o.push('<g>');
    for (var i2=0;i2<xs.length;i2++){
      for (var j2=0;j2<ys.length;j2++){
        var isF = (tool === "temel");
        var idxN = isF ? findFound(function(f){ return f.kind!=="streifen" && f.kind!=="platte" && pnum(f.ax,-1)===i2 && pnum(f.ay,-1)===j2; })
                       : findCol(i2, j2);
        var hasC = idxN >= 0;
        var nid = hasC ? (isF ? P.foundations[idxN].id : P.columns[idxN].id) : "";
        var tipN = isF ? (hasC ? "Çift tıkla: temeli kaldır" : "Çift tıkla: temel ekle ("+foundLabel(UI.foundType)+")")
                       : (hasC ? "Çift tıkla: kolonu kaldır" : "Çift tıkla: kolon ekle");
        o.push('<circle class="hn'+(hasC?" on":"")+'"'+(isF?' style="stroke:#3FBF7F"':'')+(nid?' data-el="'+nid+'"':'')+
          ' cx="'+xs[i2]+'" cy="'+ys[j2]+'" r="'+(isF?19:15)+'" data-node="1" data-ax="'+i2+'" data-ay="'+j2+'"><title>'+
          tipN+' · '+AX[i2]+(j2+1)+'</title></circle>');
      }
    }
    o.push('</g>');
  }
  return o.join("");
}

/* ============================================================
   MOBİLYA — plan sembolleri
   g: piksel dikdörtgeni {x,y,w,h}, rot: 0/90/180/270
   ============================================================ */
function furnSymbol(r, g, col){
  var o = [], x = g.x, y = g.y, w = g.w, h = g.h;
  var rot = ((pnum(r.free && r.free.rot, 0) % 360) + 360) % 360;
  var sym = r.sym || (furnDef(r.key) ? furnDef(r.key)[5] : "box");
  var cx = x + w/2, cy = y + h/2;
  var lw = 1.2, ln = 'stroke="'+col+'" stroke-width="'+lw+'" fill="none"';
  function rect(a,b,c,d,extra){ return '<rect x="'+fmt2(a)+'" y="'+fmt2(b)+'" width="'+fmt2(c)+'" height="'+fmt2(d)+'" '+(extra||ln)+'/>'; }
  function line(a,b,c,d,op){ return '<line x1="'+fmt2(a)+'" y1="'+fmt2(b)+'" x2="'+fmt2(c)+'" y2="'+fmt2(d)+'" stroke="'+col+'" stroke-width="'+lw+'"'+(op?' opacity="'+op+'"':'')+'/>'; }
  function circ(a,b,rr,extra){ return '<circle cx="'+fmt2(a)+'" cy="'+fmt2(b)+'" r="'+fmt2(rr)+'" '+(extra||ln)+'/>'; }
  /* gövde */
  o.push(rect(x, y, w, h, 'fill="'+col+'" fill-opacity=".13" stroke="'+col+'" stroke-width="1.3"'));

  /* yön: rot 0 → "ön" aşağı bakar */
  function frontEdge(){                       /* ön kenarın iki ucu */
    if (rot === 0)   return [[x, y+h],[x+w, y+h]];
    if (rot === 90)  return [[x, y],[x, y+h]];
    if (rot === 180) return [[x, y],[x+w, y]];
    return [[x+w, y],[x+w, y+h]];
  }
  var fe = frontEdge();

  if (sym === "bed"){
    /* yastık tarafı = arka kenar */
    var pd = Math.min(w, h) * 0.22;
    if (rot === 0 || rot === 180){
      var py = (rot === 0) ? y : y + h - pd;
      o.push(rect(x+3, py+3, w-6, pd, 'fill="'+col+'" fill-opacity=".3" stroke="'+col+'" stroke-width="1"'));
      if (w > 34){ o.push(line(cx, py+3, cx, py+pd+3, ".6")); }
      o.push(rect(x+3, (rot===0? py+pd+5 : y+3), w-6, h-pd-8, 'fill="none" stroke="'+col+'" stroke-width=".8" opacity=".5"'));
    } else {
      var px2 = (rot === 90) ? x + w - pd : x;
      o.push(rect(px2+3, y+3, pd, h-6, 'fill="'+col+'" fill-opacity=".3" stroke="'+col+'" stroke-width="1"'));
      if (h > 34){ o.push(line(px2+3, cy, px2+pd+3, cy, ".6")); }
    }
  } else if (sym === "sofa"){
    var bk = Math.min(w, h) * 0.26;
    if (rot === 0)   { o.push(rect(x, y, w, bk, 'fill="'+col+'" fill-opacity=".26" stroke="'+col+'" stroke-width="1"'));
                       o.push(rect(x, y+bk, bk*0.7, h-bk, 'fill="'+col+'" fill-opacity=".2" stroke="none"'));
                       o.push(rect(x+w-bk*0.7, y+bk, bk*0.7, h-bk, 'fill="'+col+'" fill-opacity=".2" stroke="none"')); }
    else if (rot === 180){ o.push(rect(x, y+h-bk, w, bk, 'fill="'+col+'" fill-opacity=".26" stroke="'+col+'" stroke-width="1"')); }
    else if (rot === 90) { o.push(rect(x+w-bk, y, bk, h, 'fill="'+col+'" fill-opacity=".26" stroke="'+col+'" stroke-width="1"')); }
    else                 { o.push(rect(x, y, bk, h, 'fill="'+col+'" fill-opacity=".26" stroke="'+col+'" stroke-width="1"')); }
  } else if (sym === "corner"){
    o.push(rect(x, y, w*0.45, h, 'fill="'+col+'" fill-opacity=".2" stroke="'+col+'" stroke-width="1"'));
    o.push(rect(x, y, w, h*0.45, 'fill="'+col+'" fill-opacity=".2" stroke="'+col+'" stroke-width="1"'));
  } else if (sym === "wardrobe"){
    var nd = Math.max(2, Math.round(w / Math.max(h, 8)));
    for (var i=1;i<nd;i++) o.push(line(x + w*i/nd, y, x + w*i/nd, y+h, ".55"));
    o.push(line(fe[0][0], fe[0][1], fe[1][0], fe[1][1], "1"));
  } else if (sym === "shelf" || sym === "upper"){
    o.push(rect(x, y, w, h, 'fill="'+col+'" fill-opacity=".08" stroke="'+col+'" stroke-width="1" stroke-dasharray="'+(sym==="upper"?"4 3":"0")+'"'));
    var n2 = Math.max(2, Math.round(Math.max(w,h)/14));
    for (var j=1;j<n2;j++){
      if (w >= h) o.push(line(x + w*j/n2, y, x + w*j/n2, y+h, ".45"));
      else        o.push(line(x, y + h*j/n2, x+w, y + h*j/n2, ".45"));
    }
  } else if (sym === "table" || sym === "desk"){
    o.push(rect(x+3, y+3, w-6, h-6, 'fill="none" stroke="'+col+'" stroke-width=".8" opacity=".55"'));
  } else if (sym === "chair"){
    o.push(rect(x+1.5, y+1.5, w-3, h-3, 'fill="none" stroke="'+col+'" stroke-width=".8" opacity=".6"'));
    o.push(line(fe[0][0], fe[0][1], fe[1][0], fe[1][1], "1"));
  } else if (sym === "chairw"){
    o.push(circ(cx, cy, Math.min(w,h)*0.3, 'fill="none" stroke="'+col+'" stroke-width=".9" opacity=".6"'));
  } else if (sym === "circle"){
    o.push(circ(cx, cy, Math.min(w,h)/2 - 1, 'fill="'+col+'" fill-opacity=".16" stroke="'+col+'" stroke-width="1.2"'));
  } else if (sym === "rug"){
    o.push(rect(x, y, w, h, 'fill="'+col+'" fill-opacity=".07" stroke="'+col+'" stroke-width="1" stroke-dasharray="6 4"'));
    o.push(rect(x+4, y+4, w-8, h-8, 'fill="none" stroke="'+col+'" stroke-width=".7" opacity=".45"'));
  } else if (sym === "wc"){
    o.push('<ellipse cx="'+fmt2(cx)+'" cy="'+fmt2(cy + (rot===0?-h*0.08:rot===180?h*0.08:0))+'" rx="'+fmt2(w*0.38)+'" ry="'+fmt2(h*0.3)+'" fill="'+col+'" fill-opacity=".22" stroke="'+col+'" stroke-width="1.1"/>');
    /* rezervuar arka kenarda */
    if (rot === 0)   o.push(rect(x+1, y, w-2, h*0.2, 'fill="'+col+'" fill-opacity=".3" stroke="'+col+'" stroke-width=".9"'));
    else if (rot === 180) o.push(rect(x+1, y+h*0.8, w-2, h*0.2, 'fill="'+col+'" fill-opacity=".3" stroke="'+col+'" stroke-width=".9"'));
    else if (rot === 90)  o.push(rect(x+w*0.8, y+1, w*0.2, h-2, 'fill="'+col+'" fill-opacity=".3" stroke="'+col+'" stroke-width=".9"'));
    else                  o.push(rect(x, y+1, w*0.2, h-2, 'fill="'+col+'" fill-opacity=".3" stroke="'+col+'" stroke-width=".9"'));
  } else if (sym === "basin"){
    o.push('<ellipse cx="'+fmt2(cx)+'" cy="'+fmt2(cy)+'" rx="'+fmt2(w*0.4)+'" ry="'+fmt2(h*0.33)+'" fill="'+col+'" fill-opacity=".2" stroke="'+col+'" stroke-width="1.1"/>');
    if (w > 60){ o.push('<ellipse cx="'+fmt2(x+w*0.27)+'" cy="'+fmt2(cy)+'" rx="'+fmt2(w*0.17)+'" ry="'+fmt2(h*0.3)+'" fill="none" stroke="'+col+'" stroke-width=".9"/>');
                 o.push('<ellipse cx="'+fmt2(x+w*0.73)+'" cy="'+fmt2(cy)+'" rx="'+fmt2(w*0.17)+'" ry="'+fmt2(h*0.3)+'" fill="none" stroke="'+col+'" stroke-width=".9"/>'); }
  } else if (sym === "shower"){
    o.push(line(x, y, x+w, y+h, ".7")); o.push(line(x+w, y, x, y+h, ".7"));
    o.push(circ(cx, cy, Math.min(w,h)*0.12, 'fill="'+col+'" fill-opacity=".4" stroke="none"'));
  } else if (sym === "tub"){
    o.push('<rect x="'+fmt2(x+2)+'" y="'+fmt2(y+2)+'" width="'+fmt2(w-4)+'" height="'+fmt2(h-4)+'" rx="'+fmt2(Math.min(w,h)*0.18)+'" fill="'+col+'" fill-opacity=".16" stroke="'+col+'" stroke-width="1.1"/>');
    o.push(circ((rot===90||rot===270)? x+w*0.14 : cx, (rot===90||rot===270)? cy : y+h*0.14, Math.min(w,h)*0.07, 'fill="'+col+'" fill-opacity=".5" stroke="none"'));
  } else if (sym === "sink"){
    o.push(rect(x+2, y+2, w-4, h-4, 'fill="none" stroke="'+col+'" stroke-width=".9" opacity=".6"'));
    o.push('<rect x="'+fmt2(x+w*0.12)+'" y="'+fmt2(y+h*0.2)+'" width="'+fmt2(w*0.4)+'" height="'+fmt2(h*0.55)+'" rx="2" fill="'+col+'" fill-opacity=".25" stroke="'+col+'" stroke-width=".9"/>');
  } else if (sym === "stove"){
    var rr = Math.min(w,h)*0.17;
    o.push(circ(x+w*0.3, y+h*0.3, rr)); o.push(circ(x+w*0.7, y+h*0.3, rr));
    o.push(circ(x+w*0.3, y+h*0.7, rr)); o.push(circ(x+w*0.7, y+h*0.7, rr));
  } else if (sym === "oven"){
    o.push(rect(x+3, y+3, w-6, h-6, 'fill="none" stroke="'+col+'" stroke-width=".9" opacity=".6"'));
    o.push(line(x+3, y+h*0.3, x+w-3, y+h*0.3, ".6"));
  } else if (sym === "fridge"){
    o.push(line(x, y+h*0.35, x+w, y+h*0.35, ".7"));
    o.push(rect(x+3, y+3, w-6, h-6, 'fill="none" stroke="'+col+'" stroke-width=".8" opacity=".45"'));
  } else if (sym === "machine"){
    o.push(circ(cx, cy, Math.min(w,h)*0.3, 'fill="none" stroke="'+col+'" stroke-width="1"'));
    o.push(circ(cx, cy, Math.min(w,h)*0.17, 'fill="'+col+'" fill-opacity=".2" stroke="none"'));
  } else if (sym === "kitchen"){
    o.push(rect(x+2, y+2, w-4, h-4, 'fill="none" stroke="'+col+'" stroke-width=".8" opacity=".5"'));
    o.push(line(fe[0][0], fe[0][1], fe[1][0], fe[1][1], "1"));
  } else if (sym === "lift"){
    o.push(rect(x+4, y+4, w-8, h-8, 'fill="none" stroke="'+col+'" stroke-width=".9" opacity=".6"'));
    o.push(line(cx, y, cx, y+h, ".5"));
    o.push('<text x="'+fmt2(cx)+'" y="'+fmt2(cy+3)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="'+col+'">A</text>');
  }
  return o.join("");
}

/* mobilya katmanı — plana çizilir */
function drawFurniture(o, gmf, MXf, MYf, sf, DRAWGf){
  ensureFurn();
  katVis("furniture").forEach(function(r){
    var f = r.free; if (!f) return;
    var g = { x:MXf(f.x), y:MYf(f.y), w:f.w*sf, h:f.h*sf };
    DRAWGf[r.id] = { k:"rc", list:"furniture", g:g };
    var col = furnColor(r.key);
    /* hareket alanı */
    if (UI.furnClear){
      var cr = furnClearRect(r);
      if (cr) o.push('<rect x="'+fmt2(MXf(cr.x))+'" y="'+fmt2(MYf(cr.y))+'" width="'+fmt2(cr.w*sf)+'" height="'+fmt2(cr.h*sf)+
        '" fill="'+col+'" fill-opacity=".045" stroke="'+col+'" stroke-width=".9" stroke-dasharray="5 4" opacity=".65"/>');
    }
    o.push(furnSymbol(r, g, col));
    if (g.w > 34 && g.h > 16)
      o.push('<text x="'+fmt2(g.x+g.w/2)+'" y="'+fmt2(g.y+g.h/2+3)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="'+col+'" opacity=".85">'+
        esc(shortName(r.name))+'</text>');
  });
}
var FURNFILLER = ["kişilik","kapılı","gözlü","ankastre","sandıklı","duvara","tabure"];
function shortName(n){
  var s = String(n).replace(/\s*\(\d+\)$/,"").replace(/[()"]/g,"");
  var w = s.split(/\s+/).filter(function(x){
    if (!x) return false;
    if (x.indexOf("×") >= 0) return false;                 /* 160×200 gibi ölçüler */
    if (FURNFILLER.indexOf(x.toLowerCase()) >= 0) return false;
    return true;
  });
  var out = w.slice(0,2).join(" ");
  if (out.length > 15) out = w[0];
  return out.slice(0,15);
}

function drawHalle(){
  var H = P.halle;
  var rise = (H.span/2) * Math.tan(H.pitch*Math.PI/180);
  var s = Math.min(560/Math.max(H.span,.1), 300/Math.max(H.eave+rise,.1));
  var base = 470, mid = 430;
  var xL = mid - H.span*s/2, xR = mid + H.span*s/2;
  var eY = base - H.eave*s, rY = eY - rise*s;
  var o = ['<rect width="860" height="600" fill="url(#gS)"/>'];
  o.push('<line x1="'+(xL-60)+'" y1="'+base+'" x2="'+(xR+60)+'" y2="'+base+'" stroke="#2E4A63" stroke-width="1.5"/>');
  var fr = 'M'+xL+' '+base+' L'+xL+' '+eY+' L'+mid+' '+rY+' L'+xR+' '+eY+' L'+xR+' '+base;
  o.push('<path d="'+fr+'" fill="#3FB6D3" opacity=".06"/><path d="'+fr+'" fill="none" stroke="#3FB6D3" stroke-width="4" stroke-linejoin="round"/>');
  [xL,xR].forEach(function(x){
    o.push('<path d="M'+(x-12)+' '+base+' h24 M'+(x-8)+' '+base+' v10 M'+x+' '+base+' v10 M'+(x+8)+' '+base+' v10" fill="none" stroke="#3FBF7F" stroke-width="2.2"/>');
  });
  for (var i=0;i<=6;i++){
    var lx = xL + (xR-xL)*(i/6);
    var ly = lx<=mid ? eY + (rY-eY)*((lx-xL)/Math.max(mid-xL,1)) : rY + (eY-rY)*((lx-mid)/Math.max(xR-mid,1));
    o.push('<path d="M'+lx+' '+(ly-46)+' v34 M'+(lx-4)+' '+(ly-20)+' l4 8 4-8 Z" stroke="#E8A33D" stroke-width="1.4" fill="#E8A33D"/>');
  }
  o.push('<g stroke="#4E7492" stroke-width=".9" font-family="ui-monospace,monospace" font-size="11" fill="#9FD8EA">');
  o.push('<line x1="'+xL+'" y1="'+(base+60)+'" x2="'+xR+'" y2="'+(base+60)+'"/>');
  o.push('<text x="'+mid+'" y="'+(base+82)+'" text-anchor="middle">Spannweite '+fmt(H.span,2)+' m</text>');
  o.push('<text x="'+(xL-130)+'" y="'+((base+eY)/2)+'">Traufe '+fmt(H.eave,2)+' m</text>');
  o.push('<text x="'+mid+'" y="'+(rY-30)+'" text-anchor="middle">First +'+fmt(H.eave+rise,2)+' m</text>');
  o.push('</g>');
  var nF = Math.max(2, Math.round(H.len/Math.max(H.bay,.1))+1);
  o.push('<text x="'+mid+'" y="'+(base+116)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6ECFA0">Länge '+
    fmt(H.len,2)+' m · Binderabstand '+fmt(H.bay,2)+' m · '+nF+' Rahmen · '+fmt(H.pitch,1)+'°</text>');
  return o.join("");
}

function drawBruecke(){
  var B = P.bruecke;
  var s = Math.min(520/Math.max(B.span,.1), 150/Math.max(B.abut,.1));
  var mid = 430, dY = 300;
  var x1 = mid - B.span*s/2, x2 = mid + B.span*s/2;
  var dh = Math.max(10, B.deck*s), ah = Math.max(40, B.abut*s);
  var o = ['<rect width="860" height="600" fill="url(#gS)"/>'];
  o.push('<rect x="'+(x1-70)+'" y="'+(dY+dh)+'" width="70" height="'+ah+'" fill="url(#soil)" stroke="#5E7C96" stroke-width="1.3"/>');
  o.push('<rect x="'+x2+'" y="'+(dY+dh)+'" width="70" height="'+ah+'" fill="url(#soil)" stroke="#5E7C96" stroke-width="1.3"/>');
  o.push('<rect x="'+x1+'" y="'+dY+'" width="'+(x2-x1)+'" height="'+dh+'" fill="#12283A" stroke="#3FB6D3" stroke-width="2"/>');
  o.push('<line x1="'+x1+'" y1="'+(dY-5)+'" x2="'+x2+'" y2="'+(dY-5)+'" stroke="#7FE0F5" stroke-width="2"/>');
  for (var i=0;i<=4;i++){
    var bx = x1 + (x2-x1)*(i/4);
    o.push('<path d="M'+bx+' '+(dY-54)+' v36 M'+(bx-4)+' '+(dY-26)+' l4 8 4-8 Z" stroke="#E8A33D" stroke-width="1.4" fill="#E8A33D"/>');
  }
  o.push('<text x="'+mid+'" y="'+(dY-66)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#E9C286">LM1 · UDL 5,0 kN/m²</text>');
  var by = dY + dh + ah + 50;
  o.push('<g stroke="#4E7492" stroke-width=".9" font-family="ui-monospace,monospace" font-size="11" fill="#9FD8EA">');
  o.push('<line x1="'+x1+'" y1="'+by+'" x2="'+x2+'" y2="'+by+'"/>');
  o.push('<text x="'+mid+'" y="'+(by+22)+'" text-anchor="middle">Stützweite '+fmt(B.span,2)+' m</text></g>');
  o.push('<text x="'+mid+'" y="'+(by+56)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6ECFA0">Breite '+
    fmt(B.width,2)+' m · Platte '+fmt(B.deck,2)+' m · L/d = '+fmt(B.span/Math.max(B.deck,.01),1)+'</text>');
  return o.join("");
}

function drawStuetz(){
  var S = P.stuetz;
  var s = Math.min(300/Math.max(S.base,.1), 320/Math.max(S.H,.1));
  var x = 380, baseY = 470;
  var topY = baseY - S.H*s, footY = baseY - S.foot*s;
  var stemW = S.stem*s, baseW = S.base*s;
  var o = ['<rect width="860" height="600" fill="url(#gS)"/>'];
  o.push('<path d="M'+(x-210)+' '+topY+' H'+x+' V'+baseY+' H'+(x-210)+' Z" fill="url(#soil)" opacity=".6"/>');
  o.push('<path d="M'+x+' '+topY+' h'+stemW+' V'+footY+' H'+(x+baseW)+' V'+baseY+' H'+x+' Z" fill="#12283A" stroke="#3FB6D3" stroke-width="2" stroke-linejoin="round"/>');
  var Ka = Math.pow(Math.tan((45 - S.phiE/2)*Math.PI/180), 2);
  var ea = Ka * S.gamE * S.H;
  for (var k=1;k<=5;k++){
    var py = topY + (footY-topY)*(k/6);
    var pl = 12 + 58*((py-topY)/Math.max(footY-topY,1));
    o.push('<path d="M'+(x-pl)+' '+py+' h'+(pl-4)+' M'+(x-10)+' '+(py-4)+' l8 4-8 4 Z" stroke="#E4595F" stroke-width="1.5" fill="#E4595F"/>');
  }
  o.push('<path d="M'+x+' '+topY+' L'+(x-70)+' '+footY+' L'+x+' '+footY+'" fill="none" stroke="#E4595F" stroke-width="1.2" stroke-dasharray="4 3"/>');
  o.push('<text x="'+(x-196)+'" y="'+(footY+22)+'" font-family="ui-monospace,monospace" font-size="11" fill="#F08A8F">Ka = '+fmt(Ka,3)+' · e = '+fmt(ea,1)+' kN/m²</text>');
  o.push('<g stroke="#4E7492" stroke-width=".9" font-family="ui-monospace,monospace" font-size="11" fill="#9FD8EA">');
  o.push('<line x1="'+(x+baseW+56)+'" y1="'+topY+'" x2="'+(x+baseW+56)+'" y2="'+baseY+'"/>');
  o.push('<text x="'+(x+baseW+70)+'" y="'+((topY+baseY)/2)+'">H = '+fmt(S.H,2)+' m</text>');
  o.push('<line x1="'+x+'" y1="'+(baseY+48)+'" x2="'+(x+baseW)+'" y2="'+(baseY+48)+'"/>');
  o.push('<text x="'+(x+baseW/2)+'" y="'+(baseY+68)+'" text-anchor="middle">b = '+fmt(S.base,2)+' m</text></g>');
  o.push('<text x="'+x+'" y="'+(baseY+100)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6ECFA0">b/H = '+
    fmt(S.base/Math.max(S.H,.01),2)+' · Stiel '+fmt(S.stem,2)+' m · Fundament '+fmt(S.foot,2)+' m</text>');
  return o.join("");
}

var SVGDEFS = '<defs>'+

function planSvg(d){
  var body = P.type==="halle" ? drawHalle() : P.type==="bruecke" ? drawBruecke() : P.type==="stuetz" ? drawStuetz() : drawPlan(d);
  return '<svg viewBox="0 0 860 600" style="width:100%;height:100%;max-height:100%">'+SVGDEFS+body+'</svg>';
}

function planPanels(d){
  var tree = "";
  if (P.type==="wohn"){
    tree = katTree();
  } else if (P.type==="halle"){
    var nF = Math.max(2, Math.round(P.halle.len/Math.max(P.halle.bay,.1))+1);
    tree = '<div><span>Rahmen</span><span>'+nF+'</span></div><div><span>Spannweite</span><span>'+fmt(P.halle.span,2)+' m</span></div>';
  } else if (P.type==="bruecke"){
    tree = '<div><span>Überbau</span><span>Platte</span></div><div><span>Widerlager</span><span>2</span></div>';
  } else {
    tree = '<div><span>Stiel</span><span>'+fmt(P.stuetz.stem,2)+' m</span></div><div><span>Fundament</span><span>'+fmt(P.stuetz.foot,2)+' m</span></div>';
  }

  var bigV, bigL, bigU, bigS;
  if (P.type==="wohn"){ bigL="DIN 277 · BGF (toplam)"; bigV=fmt(d.bgf,2); bigU="m²"; bigS="kat başına "+fmt(d.bgfSt,2)+" m² · "+d.nSt+" kat"; }
  else if (P.type==="halle"){ bigL="GRUNDFLÄCHE"; bigV=fmt(P.halle.span*P.halle.len,1); bigU="m²"; bigS="Lasteinzug "+fmt(P.halle.bay,2)+" m"; }
  else if (P.type==="bruecke"){ bigL="BRÜCKENFLÄCHE"; bigV=fmt(P.bruecke.span*P.bruecke.width,1); bigU="m²"; bigS="L/d = "+fmt(P.bruecke.span/Math.max(P.bruecke.deck,.01),1); }
  else { bigL="BETONVOLUMEN (1 m)"; bigV=fmt(P.stuetz.stem*(P.stuetz.H-P.stuetz.foot)+P.stuetz.base*P.stuetz.foot,2); bigU="m³/m"; bigS="b/H = "+fmt(P.stuetz.base/Math.max(P.stuetz.H,.01),2); }

  var rc = (P.type==="wohn" && P.roof.on) ? roofCalc() : null;

  return '<div class="side l">'+
      '<div class="hd">PROJE AĞACI'+(P.type==="wohn" && katOn() ? ' <span style="color:var(--cy2)">· '+esc(katName(UI.kat))+'</span>' : '')+
      '</div><div class="tree" style="padding:0 9px">'+tree+'</div>'+
      (P.type==="wohn" ? '<div style="padding:7px 13px 0;font-size:10.5px;color:var(--tx2);line-height:1.5">'+
        (katOn() ? 'Ekleme, silme ve listeler <b>'+esc(katName(UI.kat))+'</b> katına uygulanıyor. Diğer katlar planda kesikli görünür.'
                 : 'Bir kata tıkla → işlemler sadece o katta yapılır.')+'</div>' : '')+
      '<div class="hd" style="margin-top:10px;border-top:1px solid var(--line);padding-top:11px">ÖZET</div>'+
      '<div style="padding:0 13px">'+
        '<div class="kv"><span>Dış ölçü</span><span>'+fmt(d.W+d.extWall,2)+' × '+fmt(d.D+d.extWall,2)+' m</span></div>'+
        '<div class="kv"><span>Bina yüksekliği</span><span>'+fmt(d.Htot,2)+' m</span></div>'+
        (rc ? '<div class="kv"><span>Mahya kotu</span><span>+'+fmt(d.Htot+rc.rise,2)+' m</span></div>' : '')+
        '<div class="kv"><span>Dış / iç duvar</span><span>'+fmt(d.extWall*100,1)+' / '+fmt(d.intWall*100,1)+' cm</span></div>'+
        '<div class="kv"><span>Döşeme t (ort.)</span><span>'+fmt(d.tSlab*100,1)+' cm</span></div>'+
        (P.type==="wohn" ? '<div class="kv"><span>Döşeme alanı'+(katOn()?" ("+esc(katName(UI.kat))+")":" (toplam)")+'</span><span>'+
          fmt(katOn() ? (d.areaSlabSt[UI.kat]||0) : d.areaSlabTot, 1)+' m²</span></div>' : '')+
        '<div class="kv"><span>g₁ (öz ağırlık)</span><span>'+fmt(d.g1,2)+' kN/m²</span></div>'+
        '<div class="kv"><span>Beton hacmi</span><span>'+fmt(d.volBeton,1)+' m³</span></div>'+
        (P.openings.length ? '<div class="kv"><span>Yırtık alanı</span><span>'+fmt(d.areaOpen,2)+' m²</span></div>' : '')+
        (P.balconies.length ? '<div class="kv"><span>Balkon alanı</span><span>'+fmt(P.balconies.reduce(function(a,b){return a+b.depth*b.w;},0),2)+' m²</span></div>' : '')+
        (rc ? '<div class="kv"><span>Çatı yüzeyi</span><span>'+fmt(rc.area,1)+' m²</span></div>' : '')+
        (P.foundations.length ? '<div class="kv"><span>Temel betonu</span><span>'+fmt(d.volFound,1)+' m³</span></div>' : '')+
      '</div><div style="flex:1"></div>'+
      '<div class="card"><div style="font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--tx3)">'+bigL+'</div>'+
      '<div style="display:flex;align-items:baseline;gap:6px;margin-top:4px"><span class="big">'+bigV+'</span><span style="font-size:12px;color:var(--tx2)">'+bigU+'</span></div>'+
      '<div style="font-size:10.5px;color:var(--tx2);margin-top:3px">'+bigS+'</div></div>'+
    '</div>'+
    '<div class="center">'+hintBar()+
      '<div id="planbox" class="'+(UI.view==="ciz"?("drawing"+(UI.lineMode?" linemode":"")):"")+(CMD?" cmdmode":"")+'" style="flex:1;min-height:0;padding:10px;display:flex;align-items:center;justify-content:center">'+planSvg(d)+'</div>'+
    '</div>'+
    '<div class="side r"><div class="scroll" style="flex:1">'+rightPanel()+'</div></div>';
}

function group(d, inner){
  return '<div style="flex:1;display:flex;flex-direction:column;min-height:0">'+
    (UI.view === "mimari" ? subnav(MTOOLS, "tool", UI.tool) : subnav(STOOLS, "stool", UI.stool))+
    '<div style="flex:1;display:flex;min-height:0">'+inner+'</div></div>';
}

function viewMimari(d){
  if (P.type === "wohn" && UI.tool === "ince") return viewInce(d);
  if (P.type !== "wohn"){
    return '<div style="flex:1;display:flex;flex-direction:column;min-height:0">'+
      '<div class="ribbon"><span style="font-family:var(--mono);font-size:11px;color:var(--tx3)">'+TYPES[P.type].label+
      '</span><div style="flex:1"></div><button class="btn" data-nav="m3d">3D</button>'+
      '<button class="btn" data-nav="statik">Statiğe geç →</button></div>'+
      '<div style="flex:1;display:flex;min-height:0">'+planPanels(d)+'</div></div>';
  }
  return group(d, planPanels(d));
}

    'Çizgiler yapı elemanı değildir — hesaba girmez.</div>'+
    (LPATH ? '<div style="margin-top:8px;padding:8px 10px;background:var(--cysel);border:1px solid #2E6688;border-radius:5px;font-family:var(--mono);font-size:10.5px;color:#9FD8EA">'+
      'Zincir sürüyor — '+(LPATH.pts.length-1)+' parça · sonraki noktayı tıkla</div>' : '')+
    '<div style="display:flex;gap:5px;margin-top:8px">'+

    '<div class="fld" style="flex:1"><label>Açı [°]</label><input id="lnang" data-lnexact="ang" placeholder="0 / 90 / 45"></div>'+
    '<div class="fld" style="flex:0 0 76px"><label>&nbsp;</label><button class="btn sm pri" data-lngo="1" style="width:100%">Ekle</button></div>'+
    '</div>'+
    '<div style="font-size:10.5px;color:var(--tx2);margin-top:3px">Zincir sürerken ölçü yazıp <b>Ekle</b> (veya Enter) dersen nokta tam oraya düşer.</div>'+
    '</div>'+
    '<div style="padding:11px 14px;border-bottom:1px solid var(--line)">'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'+
    '<span style="font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--tx3)">NESNE KENETLEME</span>'+
    '<div style="flex:1"></div>'+
    '<button class="btn sm'+(UI.osnapOn!==false?" pri":"")+'" data-osnapon="1" title="F3">'+(UI.osnapOn!==false?"açık":"kapalı")+'</button></div>'+
    '<div style="display:flex;gap:4px;flex-wrap:wrap">'+
    OSNAPS.map(function(o){
      var on = osnapOn(o[0]);
      return '<button class="btn sm'+(on?" pri":"")+'" data-osnap="'+o[0]+'">'+o[2]+' '+o[1]+'</button>';
    }).join("")+'</div>'+
    '<div style="display:flex;gap:5px;margin-top:8px">'+
    '<button class="btn sm'+(UI.ortho?" pri":"")+'" data-ortho="1" style="flex:1" title="F8">ORTHO</button>'+
    '<button class="btn sm'+(UI.polar?" pri":"")+'" data-polar="1" style="flex:1" title="F10">Kutupsal</button>'+
    '<select data-polarstep="1" style="flex:0 0 72px">'+
      [5,10,15,22.5,30,45,90].map(function(v){ return '<option value="'+v+'"'+((UI.polarStep||15)===v?" selected":"")+'>'+v+'°</option>'; }).join("")+
    '</select></div>'+
    '<div style="display:flex;gap:5px;margin-top:8px">'+
    '<button class="btn sm" data-weld="1" style="flex:1" title="Yakın uçları tam üst üste getirir">Uçları birleştir</button>'+
    '<select data-weldtol="1" style="flex:0 0 84px">'+
      [0.05,0.10,0.25,0.50,1.00].map(function(v){ return '<option value="'+v+'"'+((UI.weldTol||0.25)===v?" selected":"")+'>'+fmt(v*100,0)+' cm</option>'; }).join("")+
    '</select></div>'+
    (P.lines.length ? '<div style="margin-top:8px"><button class="btn sm dg" data-lineclear="1" style="width:100%">Tüm çizgileri sil ('+P.lines.length+')</button></div>' : '')+
    '</div>'+
    '<div style="padding:11px 14px;border-bottom:1px solid var(--line)">'+
    '<div style="font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--tx3);margin-bottom:7px">YAKALAMA RASTERİ</div>'+
    '<div style="display:flex;gap:5px;flex-wrap:wrap">'+
    [[0.01,"1 cm"],[0.05,"5 cm"],[0.125,"12,5 cm"],[0.25,"25 cm"]].map(function(r){
      var on = Math.abs(UI.raster - r[0]) < 1e-9;
      return '<button class="btn sm'+(on?" pri":"")+'" data-raster="'+r[0]+'">'+r[1]+'</button>';
    }).join("")+'</div>'+
    '<div style="font-size:10.5px;color:var(--tx2);margin-top:7px;line-height:1.55">'+
    'Boşlukta <b>sol tıkla sürükle</b> → dikdörtgen seçim. <b>Shift+tık</b> seçime ekler/çıkarır. '+
    'Aks çizgilerini de tutup taşıyabilirsin. <b>Shift</b> basılıyken yakalama kapalı.</div></div>';

  /* seçim özeti */

      (nAx ? '<span style="padding:3px 8px;background:var(--amd);border:1px solid var(--amb);border-radius:3px;font-family:var(--mono);font-size:10px;color:var(--am2)">Aks × '+nAx+'</span>' : '')+

      '<div style="font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--tx3);margin-bottom:7px">KAYDIR / OFFSET</div>'+

      '<div class="fld"><label>Δx [m]</label><input id="offdx" value="'+fmt(UI.offdx||0,3)+'"></div>'+

      '</div></div>';
  }

  h += '<div class="grp"><h4>KATMANLAR</h4>';
  DRAWLISTS.forEach(function(Ld){
    var n = (P[Ld[0]]||[]).length;

  });

  if (axSel){

  if (P.lines.length){

        fieldCtl("lines", i, {k:"name", type:"text"}, r.name)+
        '<span style="font-family:var(--mono);font-size:10px;color:var(--tx3);white-space:nowrap">'+fmt(lineLen(r),2)+' m</span>'+
        '<button class="btn sm dg" data-del="lines" data-i="'+i+'">×</button></div><div class="egrid">'+
        '<div class="fld" style="grid-column:span 2"><label>Tür</label>'+
        fieldCtl("lines",i,{k:"kind",type:"sel",opts:LINEKINDS.map(function(k){ return [k[0],k[1]]; })},r.kind)+'</div>'+
        '<div class="fld"><label>Açı</label><div style="padding:6px 8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:10.5px;color:#9FD8EA">'+
          fmt(Math.atan2(r.free.y2-r.free.y1, r.free.x2-r.free.x1)*180/Math.PI,1)+'°</div></div>'+
        '<div class="fld"><label>x₁ [m]</label><input data-linef="x1" data-i="'+i+'" value="'+fmt(pnum(r.free.x1,0),2)+'"></div>'+
        '<div class="fld"><label>y₁ [m]</label><input data-linef="y1" data-i="'+i+'" value="'+fmt(pnum(r.free.y1,0),2)+'"></div>'+
        '<div class="fld"><label>Uzunluk [m]</label><input data-linef="len" data-i="'+i+'" value="'+fmt(lineLen(r),3)+'"></div>'+
        '<div class="fld"><label>x₂ [m]</label><input data-linef="x2" data-i="'+i+'" value="'+fmt(pnum(r.free.x2,0),2)+'"></div>'+
        '<div class="fld"><label>y₂ [m]</label><input data-linef="y2" data-i="'+i+'" value="'+fmt(pnum(r.free.y2,0),2)+'"></div>'+
        katFld("lines", i, r)+
        '</div></div>';
    });
    h += '<div class="kv" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--line)"><span>Toplam uzunluk</span>'+
      '<span>'+fmt(P.lines.reduce(function(a,r){ return a + lineLen(r); },0),2)+' m</span></div></div>';
  }
  return h;
}

function buildupSvg(sf, d){
  var c = calcSurface(sf, d);
  var W = 840, H = 560, x0 = 150, y0 = 60, bw = 420;
  var tot = Math.max(c.thick, 0.02);
  var scale = (H - 120) / tot;
  var o = ['<rect width="'+W+'" height="'+H+'" fill="url(#gS)"/>'];
  var y = y0;
  sf.layers.forEach(function(l, i){
    var hgt = Math.max(9, l.t * scale);
    var tp = MATTYPES[l.type] || ["?", "#8CA3BC"];
    var selL = (UI.selLayer === l.id);
    o.push('<rect class="lyr'+(selL?" sel":"")+'" data-layer="'+l.id+'" x="'+x0+'" y="'+y+'" width="'+bw+'" height="'+hgt+
      '" fill="'+tp[1]+'" fill-opacity="'+(selL?0.42:0.22)+'" stroke="'+tp[1]+'" stroke-width="'+(selL?2:1)+'"/>');
    if (l.type === "izolasyon"){
      for (var k=0;k<Math.floor(bw/16);k++)
        o.push('<line x1="'+(x0+8+k*16)+'" y1="'+(y+2)+'" x2="'+(x0+16+k*16)+'" y2="'+(y+hgt-2)+'" stroke="'+tp[1]+'" stroke-width=".7" opacity=".6"/>');
    } else if (l.type === "tasiyici"){
      for (var k2=0;k2<Math.floor(bw/12);k2++)
        o.push('<line x1="'+(x0+4+k2*12)+'" y1="'+(y+hgt)+'" x2="'+(x0+4+k2*12+hgt)+'" y2="'+y+'" stroke="'+tp[1]+'" stroke-width=".6" opacity=".45"/>');
    }
    var thin = hgt < 22;
    var lx = x0 - 12, rx = x0 + bw + 12;
    if (thin){ lx -= (i%2 ? 0 : 58); rx += (i%2 ? 74 : 0); }
    o.push('<line x1="'+(thin ? (i%2 ? x0+bw+4 : x0-4) : 0)+'" y1="'+(y+hgt/2)+'" x2="'+(thin ? (i%2 ? rx-6 : lx+6) : 0)+'" y2="'+(y+hgt/2)+
      '" stroke="'+tp[1]+'" stroke-width=".7" opacity="'+(thin?".55":"0")+'"/>');
    o.push('<text x="'+lx+'" y="'+(y+hgt/2+4)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="10.5" fill="#C8D8E8">'+
      esc(l.name)+'</text>');
    o.push('<text x="'+rx+'" y="'+(y+hgt/2+(thin?4:0))+'" font-family="ui-monospace,monospace" font-size="10.5" fill="#9FD8EA">'+
      fmt(l.t*1000,1)+' mm</text>');
    if (!thin) o.push('<text x="'+rx+'" y="'+(y+hgt/2+13)+'" font-family="ui-monospace,monospace" font-size="9" fill="'+tp[1]+'">'+
      (l.type==="hava" ? "R 0,18" : (l.lam>0 ? ("λ "+fmt(l.lam,3)) : ""))+'</text>');
    y += hgt;
  });
  // toplam ölçü
  o.push('<g stroke="#4E7492" stroke-width=".9" font-family="ui-monospace,monospace" font-size="10" fill="#9FD8EA">');
  o.push('<line x1="'+(x0-84)+'" y1="'+y0+'" x2="'+(x0-84)+'" y2="'+y+'"/>');
  o.push('<line x1="'+(x0-90)+'" y1="'+y0+'" x2="'+(x0-78)+'" y2="'+y0+'"/>');
  o.push('<line x1="'+(x0-90)+'" y1="'+y+'" x2="'+(x0-78)+'" y2="'+y+'"/>');
  o.push('<text x="'+(x0-96)+'" y="'+((y0+y)/2)+'" text-anchor="end">'+fmt(c.thick*1000,0)+' mm</text></g>');
  // iç / dış
  o.push('<text x="'+(x0+bw/2)+'" y="'+(y0-16)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6ECFA0">'+
    (sf.key==="fb" ? "üst yüzey" : (sf.key==="dk" ? "oda tarafı" : "dış / üst taraf"))+'</text>');
  o.push('<text x="'+(x0+bw/2)+'" y="'+(y+24)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6ECFA0">'+
    (sf.key==="fb" ? "taşıyıcı döşeme" : (sf.key==="dk" ? "taşıyıcı döşeme" : "iç / alt taraf"))+'</text>');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:100%">'+SVGDEFS+o.join("")+'</svg>';
}

function drainDetailSvg(d){
  var c = drainCalc(d), R = P.drain;
  var dW = d.extWall || 0.24;
  var kel = c.kel;
  var bStrip = 0.60;
  for (var fi=0; fi<P.foundations.length; fi++)
    if (P.foundations[fi].kind === "streifen") bStrip = Math.max(0.40, pnum(P.foundations[fi].a, 0.60));
  if (bStrip < dW + 0.10) bStrip = dW + 0.10;
  if (kel) bStrip = dW;                                 /* bodrumda şerit temel yok — perde duvar radye üstünde */
  var tSeal = c.isWU ? 0.004 : pnum(R.sealT, 0.004);
  var tPer  = pnum(R.perimT, 0.10);
  var tNop  = R.noppe ? 0.012 : 0;
  var tGrv  = pnum(R.gravel, 0.25);

  var zTop = kel ? (c.zGel + pnum(R.sockel,0.30) + 0.30) : 0.62;
  var zBot = c.zPipe - 0.32;
  var spanV = zTop - zBot;
  var step  = (bStrip - dW)/2;                       /* temelin duvardan taşması */
  var spanH = 0.30 + dW + step + tSeal + tPer + tNop + tGrv + 0.26;
  var VH = 700, s = (VH - 76)/spanV;
  var xIn = 158, yTop = 40;
  var VW = Math.round(xIn + spanH*s + 26 + 400);
  function X(m){ return xIn + m*s; }
  function Z(m){ return yTop + (zTop - m)*s; }
  function pxy(p){ return fmt2(X(p[0]))+","+fmt2(Z(p[1])); }

  /* --- yatay kurulum --- */
  var xW0 = 0.30, xW1 = xW0 + dW;                    /* duvar iç / dış yüzü */
  var xF0 = xW0 - step, xF1 = xW1 + step;            /* şerit temel */
  var zStrip = kel ? c.zPlT : c.zPlB;                /* katmanların kademelendiği kot */
  var oSeal = 0, oPer = tSeal, oNop = tSeal + tPer, oGrv = tSeal + tPer + tNop;
  function xu(o){ return xW1 + o; }                  /* üst bölge (duvar önü) */
  function xl(o){ return xF1 + o; }                  /* alt bölge (temel önü) */
  var xEnd = xl(oGrv) + tGrv + 0.26;
  var zGrvTop = c.zGel - 0.20;
  var zGv0    = c.zPipe - c.dInner/2 - 0.07;
  var zSealTop = c.zGel + pnum(R.sockel, 0.30);

  var o = ['<rect width="'+VW+'" height="'+VH+'" fill="url(#gS)"/>'];
  o.push('<defs><pattern id="erd" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
    '<line x1="0" y1="0" x2="0" y2="13" stroke="#3A5166" stroke-width="1"/></pattern>'+
    '<pattern id="kies" width="12" height="12" patternUnits="userSpaceOnUse">'+
    '<circle cx="3" cy="3.5" r="2" fill="#A8BDD1" fill-opacity=".45"/><circle cx="9" cy="9" r="2.4" fill="#A8BDD1" fill-opacity=".38"/>'+
    '<circle cx="9.5" cy="2.5" r="1.5" fill="#A8BDD1" fill-opacity=".42"/></pattern>'+
    '<pattern id="kbp" width="10" height="10" patternUnits="userSpaceOnUse">'+
    '<circle cx="2.5" cy="2.5" r="2.2" fill="#8CA3BC" fill-opacity=".45"/><circle cx="7.5" cy="7" r="2.6" fill="#8CA3BC" fill-opacity=".38"/></pattern></defs>');

  function rect(x0,x1,z0,z1,fill,op,stroke,sw){
    if (x1<=x0 || z1<=z0) return "";
    return '<rect x="'+fmt2(X(x0))+'" y="'+fmt2(Z(z1))+'" width="'+fmt2((x1-x0)*s)+'" height="'+fmt2((z1-z0)*s)+
      '" fill="'+fill+'" fill-opacity="'+op+'" stroke="'+(stroke||"none")+'" stroke-width="'+(sw||0)+'"/>';
  }
  function polyD(pts, fill, op, stroke, sw){
    return '<polygon points="'+pts.map(pxy).join(" ")+'" fill="'+fill+'" fill-opacity="'+op+
      '" stroke="'+(stroke||"none")+'" stroke-width="'+(sw||0)+'" stroke-linejoin="round"/>';
  }
  var LBL = [];
  function lbl(z, xAt, col, t1, t2){ LBL.push([z, xAt, col, t1, t2||""]); }

  /* ---------- zemin ---------- */
  o.push(rect(0, xEnd, zBot, c.zKB, "#16293C", ".7"));
  o.push(rect(0, xEnd, zBot, c.zKB, "url(#erd)", ".6"));
  o.push(rect(xl(oGrv)+tGrv, xEnd, zBot, c.zGel, "#16293C", ".7"));
  o.push(rect(xl(oGrv)+tGrv, xEnd, zBot, c.zGel, "url(#erd)", ".75"));
  /* çakıl üstündeki örtü dolgusu */
  o.push(rect(xu(oGrv), xl(oGrv)+tGrv, Math.min(zGrvTop, zStrip), c.zGel, "#16293C", ".6"));
  o.push(rect(xu(oGrv), xl(oGrv)+tGrv, Math.min(zGrvTop, zStrip), c.zGel, "url(#erd)", ".6"));
  /* kazı şevi tarafı — dolgu bölgesi zaten çakıl */
  o.push('<line x1="'+fmt2(X(xl(oGrv)+tGrv))+'" y1="'+fmt2(Z(c.zGel))+'" x2="'+fmt2(X(xEnd))+'" y2="'+fmt2(Z(c.zGel))+
    '" stroke="#6ECFA0" stroke-width="2"/>');
  for (var gi=0; gi<7; gi++){
    var gx = X(xl(oGrv)+tGrv) + 10 + gi*((X(xEnd)-X(xl(oGrv)+tGrv)-14)/7);
    o.push('<line x1="'+fmt2(gx)+'" y1="'+fmt2(Z(c.zGel))+'" x2="'+fmt2(gx-7)+'" y2="'+fmt2(Z(c.zGel)+8)+'" stroke="#6ECFA0" stroke-width="1" opacity=".7"/>');
  }
  o.push('<text x="'+fmt2(X(xEnd))+'" y="'+fmt2(Z(c.zGel)-8)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="10.5" fill="#6ECFA0">OK Gelände '+fmt(c.zGel,2)+'</text>');

  /* ---------- iç mekân ---------- */
  o.push(rect(0, xW0, c.zPlT, zTop, "#0E2033", ".3"));
  o.push('<text x="'+fmt2(X(xW0/2))+'" y="'+fmt2(Z(c.zPlT) - 26)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#5E7C96">'+(kel?"bodrum":"içeri")+'</text>');

  /* ---------- temel altı tabakalar ---------- */
  o.push(rect(0, xF1, c.zKB, c.zSau, "url(#kbp)", "1", "#6E8398", .9));
  lbl((c.zKB+c.zSau)/2, xF1, "#8CA3BC", "Kılcal kesici tabaka", fmt(pnum(R.kb,.15)*100,0)+" cm · Rollkies 16/32");
  o.push(rect(0, xF1, c.zSau, c.zPlB, "#8CA3BC", ".32", "#8CA3BC", .9));
  lbl((c.zSau+c.zPlB)/2, xF1, "#8CA3BC", "Temizlik betonu C8/10", fmt(pnum(R.sauber,.05)*100,0)+" cm");

  /* ---------- şerit temel (bodrumsuzda) ---------- */
  var BC = matColor(P.design.beton), BS = tint(BC,.42);
  if (!kel){
    o.push(rect(xF0, xF1, -c.tGr, zStrip, BC, ".55", BS, 1.2));
    for (var hi=0; hi<6; hi++){
      var hy = Z(zStrip) + 7 + hi*((Z(-c.tGr)-Z(zStrip)-10)/6);
      o.push('<line x1="'+fmt2(X(xF0)+5)+'" y1="'+fmt2(hy)+'" x2="'+fmt2(X(xF0)+17)+'" y2="'+fmt2(hy-12)+'" stroke="#C8D8E8" stroke-width=".55" opacity=".32"/>');
    }
    lbl((-c.tGr + zStrip)/2, xF1, BC, "Şerit temel "+fmt(bStrip*100,0)+"/"+fmt((zStrip+c.tGr)*100,0)+" cm · "+P.design.beton,
        "UK "+fmt(-c.tGr,2)+" m — don derinliğinin altında");
  }

  /* ---------- bodenplatte + duvar ---------- */
  o.push(rect(0, xW1, c.zPlB, c.zPlT, BC, ".62", BS, 1.4));
  lbl((c.zPlB+c.zPlT)/2, xW1, BC, (kel?"Radye (Bodenplatte) ":"Bodenplatte ")+fmt(c.plate*100,0)+" cm · "+P.design.beton,
      kel ? ("UK "+fmt(c.zPlB,2)+" m · OK bodrum tabanı "+fmt(c.zPlT,2)) : "");
  o.push(rect(xW0, xW1, c.zPlT, zTop, BC, ".62", BS, 1.4));
  var wLabZ = (c.zPlT + zTop)/2;
  o.push('<text x="'+fmt2(X((xW0+xW1)/2))+'" y="'+fmt2(Z(wLabZ))+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#16242E" transform="rotate(-90 '+fmt2(X((xW0+xW1)/2))+' '+fmt2(Z(wLabZ))+')">'+fmt(dW*100,0)+' cm</text>');

  /* ---------- sızdırma tabakası ----------
     Sızdırma tabakasının üstü temel üst kotunun üstündeyse kademeli çokgen,
     altındaysa (bodrumsuz bina) temel yanındaki basit hendek. */
  var grvPts;
  if (zGrvTop > zStrip + 0.02){
    grvPts = [[xu(oGrv), zGrvTop],[xl(oGrv)+tGrv, zGrvTop],[xl(oGrv)+tGrv, zGv0],
              [xl(oGrv), zGv0],[xl(oGrv), zStrip],[xu(oGrv), zStrip]];
  } else {
    grvPts = [[xl(oGrv), Math.min(zGrvTop, zStrip)],[xl(oGrv)+tGrv, Math.min(zGrvTop, zStrip)],
              [xl(oGrv)+tGrv, zGv0],[xl(oGrv), zGv0]];
  }
  o.push(polyD(grvPts, "#16293C", ".9"));
  o.push(polyD(grvPts, "url(#kies)", "1", "#A8BDD1", 1.1));
  lbl((Math.min(zGrvTop, zStrip) + zGv0)/2, xl(oGrv)+tGrv, "#A8BDD1", R.gravelType, "sızdırma tabakası "+fmt(tGrv*100,0)+" cm");

  /* ---------- filtre keçesi ---------- */
  if (R.vlies){
    var vl = grvPts.map(function(q){ return [q[0], q[1]]; });
    vl[0] = [vl[0][0]-0.015, vl[0][1]+0.015];
    vl[1] = [vl[1][0]+0.015, vl[1][1]+0.015];
    vl[2] = [vl[2][0]+0.015, vl[2][1]-0.015];
    vl[3] = [vl[3][0]-0.015, vl[3][1]-0.015];
    o.push('<polyline points="'+vl.map(pxy).join(" ")+'" fill="none" stroke="#F08A8F" stroke-width="1.7" stroke-dasharray="6 3.5"/>');
    lbl(Math.min(zGrvTop, zStrip) + 0.02, xl(oGrv)+tGrv*0.5, "#F08A8F", "Filtre keçesi (Geotextil GRK 3)", "sızdırma tabakasını tamamen sarar");
  }

  /* ---------- perimetre yalıtımı (kademeli) ---------- */
  var PC = "#3FBF7F";
  o.push(rect(xu(oPer), xu(oPer)+tPer, zStrip, c.zGel + 0.05, PC, ".40", PC, 1.1));
  o.push(rect(xl(oPer), xl(oPer)+tPer, -c.tGr, zStrip, PC, ".40", PC, 1.1));
  o.push(rect(xu(oPer), xl(oPer)+tPer, zStrip - tPer, zStrip, PC, ".28", PC, .9));
  (function(){
    var n = Math.max(3, Math.floor((Z(zStrip)-Z(c.zGel+0.05))/15));
    for (var i=0;i<n;i++){
      var y = Z(c.zGel+0.05) + 6 + i*((Z(zStrip)-Z(c.zGel+0.05))-10)/n;
      o.push('<line x1="'+fmt2(X(xu(oPer))+2)+'" y1="'+fmt2(y)+'" x2="'+fmt2(X(xu(oPer)+tPer)-2)+'" y2="'+fmt2(y+8)+'" stroke="'+PC+'" stroke-width=".7" opacity=".65"/>');
    }
    var n2 = Math.max(2, Math.floor((Z(-c.tGr)-Z(zStrip))/15));
    for (var j=0;j<n2;j++){
      var y2 = Z(zStrip) + 6 + j*((Z(-c.tGr)-Z(zStrip))-10)/n2;
      o.push('<line x1="'+fmt2(X(xl(oPer))+2)+'" y1="'+fmt2(y2)+'" x2="'+fmt2(X(xl(oPer)+tPer)-2)+'" y2="'+fmt2(y2+8)+'" stroke="'+PC+'" stroke-width=".7" opacity=".65"/>');
    }
  })();
  lbl((c.zGel - c.tGr)/2, xl(oPer)+tPer, PC, R.perim+" · "+fmt(tPer*1000,0)+" mm",
      "λ "+fmt(c.perim[1],3)+" · CS(10/Y) "+c.perim[2]+" kPa · U "+fmt(c.U,3));

  /* ---------- noppenbahn ---------- */
  if (tNop){
    var npts = [[xu(oNop)+tNop/2, c.zGel],[xu(oNop)+tNop/2, zStrip],[xl(oNop)+tNop/2, zStrip],[xl(oNop)+tNop/2, -c.tGr]];
    o.push('<polyline points="'+npts.map(pxy).join(" ")+'" fill="none" stroke="#C8D8E8" stroke-width="'+Math.max(2.5,tNop*s)+'" stroke-opacity=".5"/>');
    for (var ni=0; ni<Math.max(4, Math.floor((Z(-c.tGr)-Z(c.zGel))/16)); ni++){
      var ny = Z(c.zGel) + 8 + ni*((Z(-c.tGr)-Z(c.zGel))-12)/Math.max(4, Math.floor((Z(-c.tGr)-Z(c.zGel))/16));
      var nx = ny < Z(zStrip) ? X(xu(oNop)+tNop/2) : X(xl(oNop)+tNop/2);
      o.push('<circle cx="'+fmt2(nx)+'" cy="'+fmt2(ny)+'" r="2.2" fill="none" stroke="#C8D8E8" stroke-width=".9" opacity=".8"/>');
    }
    lbl(c.zGel - 0.10, xu(oNop)+tNop, "#C8D8E8", "Noppenbahn — koruma tabakası", "tek başına drenaj yerine geçmez");
  }

  /* ---------- abdichtung (kademeli, kalın çizgi) ---------- */
  if (!c.isWU){
    var spts = [[xu(oSeal)+tSeal/2, zSealTop],[xu(oSeal)+tSeal/2, zStrip],
                [xl(oSeal)+tSeal/2, zStrip],[xl(oSeal)+tSeal/2, -c.tGr]];
    o.push('<polyline points="'+spts.map(pxy).join(" ")+'" fill="none" stroke="#E4595F" stroke-width="'+
      Math.max(3.5, tSeal*s)+'" stroke-linejoin="round" stroke-linecap="square"/>');
    /* yatay kesit yalıtımı (Querschnittsabdichtung) — duvar altında */
    o.push('<line x1="'+fmt2(X(xW0))+'" y1="'+fmt2(Z(c.zPlT+0.002))+'" x2="'+fmt2(X(xW1))+'" y2="'+fmt2(Z(c.zPlT+0.002))+
      '" stroke="#E4595F" stroke-width="3" stroke-dasharray="7 3"/>');
    lbl((zSealTop + zStrip)/2, xu(oSeal)+tSeal, "#E4595F", c.seal[1]+" · "+fmt(c.haveT,1)+" mm",
        R.wclass+" için asgari "+(c.okClass?fmt(c.reqT,1)+" mm "+(c.okT?"✓":"✗"):"uygun değil ✗"));
  } else {
    lbl(-0.20, xW1, "#E4595F", "WU-Beton (beyaz küvet)", "ayrı yüzey yalıtımı yok · d ≥ "+fmt(c.reqT,0)+" mm");
  }

  /* ---------- soket ölçüsü ---------- */
  var sx = X(xu(oGrv)) + 16;
  o.push('<g stroke="'+(c.okSockel?"#6ECFA0":"#F08A8F")+'" stroke-width="1" font-family="ui-monospace,monospace" font-size="10" fill="'+(c.okSockel?"#6ECFA0":"#F08A8F")+'">'+
    '<line x1="'+fmt2(sx)+'" y1="'+fmt2(Z(c.zGel))+'" x2="'+fmt2(sx)+'" y2="'+fmt2(Z(zSealTop))+'"/>'+
    '<line x1="'+fmt2(sx-6)+'" y1="'+fmt2(Z(c.zGel))+'" x2="'+fmt2(sx+6)+'" y2="'+fmt2(Z(c.zGel))+'"/>'+
    '<line x1="'+fmt2(sx-6)+'" y1="'+fmt2(Z(zSealTop))+'" x2="'+fmt2(sx+6)+'" y2="'+fmt2(Z(zSealTop))+'"/>'+
    '<text x="'+fmt2(sx+11)+'" y="'+fmt2((Z(c.zGel)+Z(zSealTop))/2+4)+'">'+fmt(pnum(R.sockel,.30)*100,0)+' cm '+(c.okSockel?"✓":"✗ ≥30")+'</text></g>');

  /* ---------- dren borusu ---------- */
  var pcx = X(xl(oGrv) + tGrv*0.5), pcy = Z(c.zPipe), prd = Math.max(7, c.dInner/2*s);
  o.push('<circle cx="'+fmt2(pcx)+'" cy="'+fmt2(pcy)+'" r="'+fmt2(prd)+'" fill="#0A1220" stroke="#E8A33D" stroke-width="2.6"/>');
  for (var si=0; si<9; si++){
    var sa = Math.PI + si*Math.PI/8;
    o.push('<line x1="'+fmt2(pcx+Math.cos(sa)*prd*0.66)+'" y1="'+fmt2(pcy+Math.sin(sa)*prd*0.66)+
      '" x2="'+fmt2(pcx+Math.cos(sa)*prd)+'" y2="'+fmt2(pcy+Math.sin(sa)*prd)+'" stroke="#E8A33D" stroke-width="1.5" opacity=".9"/>');
  }
  lbl(c.zPipe, xl(oGrv)+tGrv, "#E8A33D", "Dren borusu DN "+R.dn+" · eğim "+fmt(c.slope,1)+" %",
      "Q "+fmt(c.Qkap,2)+" l/s kapasite · gelen "+fmt(c.Qzu,2)+" l/s "+(c.okQ?"✓":"✗"));

  /* ---------- kot çizgileri ---------- */
  [[c.zPlT, kel ? ("OK bodrum tabanı "+fmt(c.zPlT,2)) : "±0,00 OK ham döşeme"],
   [c.zKB,"UK yapı "+fmt(c.zKB,2)],[-c.tGr,"UK temel "+fmt(-c.tGr,2)]].forEach(function(t){
    o.push('<line x1="'+fmt2(X(0)-15)+'" y1="'+fmt2(Z(t[0]))+'" x2="'+fmt2(X(xW1))+'" y2="'+fmt2(Z(t[0]))+
      '" stroke="#4E7492" stroke-width=".8" stroke-dasharray="4 4"/>');
    o.push('<text x="'+fmt2(X(0)-18)+'" y="'+fmt2(Z(t[0])+3)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="9.5" fill="#7FA8C4">'+t[1]+'</text>');
  });

  /* ---------- etiketler ---------- */
  LBL.sort(function(a,b){ return a[0] > b[0] ? -1 : 1; });
  var lx = X(xEnd) + 26, used = [], gap = 34;
  LBL.forEach(function(L){
    var yWant = Z(L[0]), y = yWant;
    used.forEach(function(u){ if (Math.abs(y-u) < gap) y = u + gap; });
    y = Math.max(30, Math.min(VH-20, y));
    used.push(y);
    o.push('<path d="M'+fmt2(X(L[1]))+' '+fmt2(yWant)+' L'+fmt2(lx-10)+' '+fmt2(y-4)+'" fill="none" stroke="'+L[2]+'" stroke-width=".9" opacity=".55"/>');
    o.push('<circle cx="'+fmt2(X(L[1]))+'" cy="'+fmt2(yWant)+'" r="2.6" fill="'+L[2]+'"/>');
    o.push('<text x="'+fmt2(lx)+'" y="'+fmt2(y)+'" font-family="ui-monospace,monospace" font-size="10.5" fill="'+L[2]+'">'+esc(L[3])+'</text>');
    if (L[4]) o.push('<text x="'+fmt2(lx)+'" y="'+fmt2(y+13)+'" font-family="ui-monospace,monospace" font-size="9.5" fill="#7FA8C4">'+esc(L[4])+'</text>');
  });

  o.push('<text x="14" y="19" font-family="ui-monospace,monospace" font-size="10.5" fill="#5E7C96">'+
    'Sockeldetail · ölçekli kesit · DIN 18533 '+R.wclass+' · DIN 4095 · '+(R.on?"çevre drenajlı":"drenajsız")+'</text>');
  return '<svg viewBox="0 0 '+VW+' '+VH+'" style="width:100%;height:100%">'+SVGDEFS+o.join("")+'</svg>';
}
/* ---------- sağ panel ---------- */
function drainFld(k, label, type, opts, dec, unit){
  var R = P.drain, v = R[k];
  var ctl;
  if (type === "sel"){
    ctl = '<select data-drain="'+k+'" data-dt="sel">'+opts.map(function(o){
      var val = (typeof o === "string") ? o : o[0], lab = (typeof o === "string") ? o : o[1];
      return '<option value="'+esc(val)+'"'+(String(v)===String(val)?" selected":"")+'>'+esc(lab)+'</option>';
    }).join("")+'</select>';
  } else if (type === "chk"){
    return '<label class="chk"><input type="checkbox" data-drain="'+k+'" data-dt="chk"'+(v?" checked":"")+'>'+label+'</label>';
  } else if (type === "mm"){
    ctl = '<input data-drain="'+k+'" data-dt="mm" value="'+fmt(v*1000, dec===undefined?1:dec)+'">';
  } else if (type === "cm"){
    ctl = '<input data-drain="'+k+'" data-dt="cm" value="'+fmt(v*100, dec===undefined?1:dec)+'">';
  } else {
    ctl = '<input data-drain="'+k+'" data-dt="num" value="'+fmt(v, dec===undefined?2:dec)+'">';
  }
  return '<div class="fld"'+(type==="sel"?' style="grid-column:span 3"':'')+'><label>'+label+(unit?" ["+unit+"]":"")+'</label>'+ctl+'</div>';
}

function panelDrenaj(d){
  var c = drainCalc(d), R = P.drain;
  function warn(ok, t){ return '<div class="note '+(ok?"i":"w")+'" style="margin:6px 0 0">'+t+'</div>'; }
  var h = '<div style="padding:11px 14px;border-bottom:1px solid var(--line)">'+
    drainFld("on", "Çevre drenajı yapılacak (DIN 4095)", "chk")+
    drainFld("kel", "Bodrum katı var (radye üstü perde duvar)", "chk")+
    '<div style="font-size:10.5px;color:var(--tx2);margin-top:6px;line-height:1.55">Drenaj, su etki sınıfını düşürür: az geçirgen zeminde drenaj varsa W1.1-E, yoksa W1.2-E veya W2 gerekir.</div></div>';

  h += '<div class="grp" style="padding-top:12px"><h4>SU ETKİSİ · DIN 18533</h4><div class="egrid">'+
    drainFld("wclass", "Su etki sınıfı", "sel", WCLASSES.map(function(w){ return [w[0], w[0]+" — "+w[1]]; }))+
    drainFld("kSoil", "Zemin geçirgenliği", "sel", SOILPERM)+
    drainFld("gel", "OK zemin (±0,00 altı)", "cm", null, 0, "cm")+
    '</div>'+
    '<div style="margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:4px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:#A8BDD1">'+
    esc(wclassDE(R.wclass))+'</div>'+
    (c.okDrain ? "" : warn(false, "Bu zeminde <b>"+R.wclass+"</b> ancak DIN 4095 drenajı varsa geçerli. Ya drenajı aç, ya sınıfı W1.2-E / W2.1-E yap."))+
    '</div>';

  h += '<div class="grp"><h4>YÜZEY YALITIMI · Abdichtung</h4><div class="egrid">'+
    drainFld("seal", "Yalıtım türü", "sel", DRAINSEALS.map(function(s){ return [s[0], s[1]]; }))+
    (c.isWU ? '' : drainFld("sealT", "Kuru kat kalınlığı", "mm", null, 1, "mm"))+
    drainFld("sockel", "Soket yüksekliği (OK zemin üstü)", "cm", null, 0, "cm")+
    '</div>'+
    drainFld("noppe", "Noppenbahn (koruma tabakası)", "chk")+
    '<div style="margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:4px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:#A8BDD1">'+
    esc(c.seal[2])+'<br>'+
    (c.okClass
      ? (R.wclass+' için asgari <span style="color:'+(c.okT?"var(--gr2)":"var(--rd2)")+'">'+fmt(c.reqT,1)+' mm</span> · seçilen '+fmt(c.haveT,1)+' mm '+(c.okT?"✓":"✗"))
      : '<span style="color:var(--rd2)">✗ Bu yalıtım türü '+R.wclass+' için uygun değil.</span>')+'</div>'+
    (c.okSockel ? "" : warn(false, "DIN 18533: yalıtım, zemin üst kotundan <b>en az 30 cm</b> yukarı çekilmeli (sıçrama suyu)."))+
    '</div>';

  h += '<div class="grp"><h4>PERİMETRE YALITIMI</h4><div class="egrid">'+
    drainFld("perim", "Malzeme", "sel", PERIMMATS.map(function(m){ return [m[0], m[0]+" · λ "+fmt(m[1],3)]; }))+
    drainFld("perimT", "Kalınlık", "mm", null, 0, "mm")+
    '</div>'+
    '<div style="margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:4px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:#A8BDD1">'+
    'R = 0,13 + '+fmt((d.extWall||0.24)/2.30,3)+' + '+fmt(pnum(R.perimT,.10)/c.perim[1],3)+' = '+fmt(c.R,3)+' m²K/W<br>'+
    'U = <span style="color:'+(c.okU?"var(--gr2)":"var(--rd2)")+'">'+fmt(c.U,3)+'</span> W/m²K · GEG referans (erdberührt) '+fmt(c.Uref,2)+' '+(c.okU?"✓":"✗")+'<br>'+
    'Basınç dayanımı CS(10/Y) '+c.perim[2]+' kPa '+(c.okDruck?'<span style="color:var(--gr2)">✓ ≥ 300</span>':'<span style="color:var(--rd2)">✗ perimetrede ≥ 300 kPa iste</span>')+'</div></div>';

  h += '<div class="grp"><h4>DRENAJ · DIN 4095</h4><div class="egrid">'+
    drainFld("dn", "Boru çapı DN", "sel", DNTABLE.map(function(t){ return [String(t[0]), "DN "+t[0]]; }))+
    drainFld("slope", "Eğim", "num", null, 2, "%")+
    drainFld("gravel", "Sızdırma tabakası", "cm", null, 0, "cm")+
    drainFld("gravelType", "Filtre malzemesi", "sel", GRAVELS.map(function(g){ return g[0]; }))+
    drainFld("outlet", "Çıkış", "sel", OUTLETS)+
    drainFld("shaftD", "Kontrol bacası Ø", "cm", null, 0, "cm")+
    '</div>'+
    drainFld("vlies", "Filtre keçesi (Geotextil) ile sarılı", "chk")+
    '<div style="margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:4px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:#A8BDD1">'+
    'Halka uzunluğu '+fmt(c.Lpipe,1)+' m · kontrol bacası '+c.nShaft+' adet'+(c.extraShaft?' (4 köşe + '+c.extraShaft+' ara, ≤ 60 m)':' (köşeler)')+'<br>'+
    'Kapasite Q = A·k_st·R^(2/3)·√i · 0,70 = <span style="color:'+(c.okQ?"var(--gr2)":"var(--rd2)")+'">'+fmt(c.Qkap,2)+' l/s</span> · gelen '+fmt(c.Qzu,2)+' l/s · doluluk '+fmt(c.util*100,0)+'% '+(c.okQ?"✓":"✗")+'<br>'+
    'Boru ekseni '+fmt(c.zPipe,2)+' m — yapı alt kotu '+fmt(c.zKB,2)+' m '+(c.zPipe < c.zKB ? '<span style="color:var(--gr2)">✓ altında</span>' : '<span style="color:var(--rd2)">✗ altına indir</span>')+'</div>'+
    (c.slope >= 0.5 ? "" : warn(false, "DIN 4095: dren borusu eğimi <b>≥ 0,5 %</b> olmalı."))+
    '</div>';

  h += '<div class="grp"><h4>TEMEL ALTI</h4><div class="egrid">'+

function viewStatik(d){
  var t = UI.stool;
  var inner;
  if (t === "kolon" || t === "kiris" || t === "temel" || t === "perde") inner = planPanels(d);
  else if (t === "drenaj") inner = viewDrenaj(d);
  else if (t === "yukler") inner = statikLoads(d);

function viewSonuc(d){
  var tabs = [["M","Moment M"],["V","Querkraft V"],["N","Normalkraft N"],["w","Verformung w"]].map(function(t){
    return '<button data-res="'+t[0]+'" class="'+(UI.resTab===t[0]?"on":"")+'" style="padding:6px 13px;border-radius:4px;border:none;font-size:12px;'+
      (UI.resTab===t[0]?'font-weight:600;background:var(--cysel);color:var(--cy2)':'background:transparent;color:var(--tx2)')+'">'+t[1]+'</button>';
  }).join("");

  // diyagram
  var totalL = d.spans.reduce(function(a,s){return a+s.L;},0) || 1;
  var sc = 560/totalL, bx = 430 - totalL*sc/2, baseY = 330;
  var o = ['<rect width="860" height="600" fill="url(#gS)"/>'];
  o.push('<line x1="'+bx+'" y1="'+baseY+'" x2="'+(bx+totalL*sc)+'" y2="'+baseY+'" stroke="#2E4A63" stroke-width="3"/>');
  var cur = bx;
  var fill = UI.resTab==="V" ? "#3B6FD4" : UI.resTab==="w" ? "#3FB6D3" : "#E8A33D";
  d.spans.forEach(function(sp){
    var wpx = sp.L*sc, M = d.qLine*sp.L*sp.L/8, V = d.qLine*sp.L/2, amp, val;
    if (UI.resTab==="M"){ amp = Math.min(120, M*.55); val = fmt(M,1)+" kNm"; }
    else if (UI.resTab==="V"){ amp = Math.min(120, V*.8); val = fmt(V,1)+" kN"; }
    else if (UI.resTab==="N"){ amp = 24; val = fmt(-d.qLine*.6,1)+" kN"; }
    else { var wmm = 5*d.qLine*Math.pow(sp.L,4)/(384*31000*(P.design.secB*Math.pow(P.design.secH,3)/12))*1000;
           amp = Math.min(110, wmm*3); val = fmt(wmm,1)+" mm"; }
    if (UI.resTab==="V"){
      o.push('<path d="M'+cur+' '+baseY+' L'+cur+' '+(baseY-amp)+' L'+(cur+wpx)+' '+(baseY+amp)+' L'+(cur+wpx)+' '+baseY+' Z" fill="'+fill+'" opacity=".28"/>');
      o.push('<path d="M'+cur+' '+(baseY-amp)+' L'+(cur+wpx)+' '+(baseY+amp)+'" fill="none" stroke="'+fill+'" stroke-width="1.7"/>');
    } else {
      var p = 'M'+cur+' '+baseY+' C'+(cur+wpx*.25)+' '+(baseY+amp*1.33)+', '+(cur+wpx*.75)+' '+(baseY+amp*1.33)+', '+(cur+wpx)+' '+baseY;
      o.push('<path d="'+p+' Z" fill="'+fill+'" opacity=".28"/><path d="'+p+'" fill="none" stroke="'+fill+'" stroke-width="1.7"/>');
    }
    o.push('<text x="'+(cur+wpx/2)+'" y="'+(baseY+amp+26)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="'+fill+'">'+val+'</text>');
    o.push('<text x="'+(cur+wpx/2)+'" y="'+(baseY-16)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9FD8EA">'+fmt(sp.L,2)+' m</text>');
    o.push('<path d="M'+(cur-10)+' '+baseY+' h20 M'+(cur-6)+' '+baseY+' v10 M'+cur+' '+baseY+' v10 M'+(cur+6)+' '+baseY+' v10" fill="none" stroke="#3FBF7F" stroke-width="2"/>');
    cur += wpx;
  });
  o.push('<path d="M'+(cur-10)+' '+baseY+' h20 M'+(cur-6)+' '+baseY+' v10 M'+cur+' '+baseY+' v10 M'+(cur+6)+' '+baseY+' v10" fill="none" stroke="#3FBF7F" stroke-width="2"/>');
  o.push('<text x="430" y="40" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#8CA3BC">q_d = '+fmt(d.qLine,2)+' kN/m</text>');

  var rows = d.spans.map(function(sp){
    var M = d.qLine*sp.L*sp.L/8, V = d.qLine*sp.L/2;
    var mx = Math.abs(sp.L-d.Lmax) < 1e-9;
    return '<tr'+(mx?' style="background:var(--amd)"':'')+'><td style="color:var(--tx2)">'+sp.n+'</td><td style="text-align:right">'+fmt(sp.L,2)+
      '</td><td style="text-align:right">'+fmt(V,1)+'</td><td style="text-align:right;color:var(--am2)">'+fmt(M,1)+'</td></tr>';
  }).join("");

  return '<div class="side l"><div class="hd">EKSTREM DEĞERLER</div><div style="padding:0 14px">'+
      [["max M_Ed", "+"+fmt(d.MEd,1), "kNm", "var(--am)"],
       ["max V_Ed", fmt(d.VEd,1), "kN", "#7FA8E8"],
       ["q_d hat yükü", fmt(d.qLine,2), "kN/m", "var(--cy2)"],
       ["Maßg. Spannweite", fmt(d.Lmax,2), "m", "#C8D8E8"]].map(function(e){
        return '<div style="padding:10px;background:var(--cyd);border:1px solid var(--line2);border-radius:5px;margin-bottom:8px">'+
          '<div style="font-size:10.5px;color:var(--tx2);margin-bottom:4px">'+e[0]+'</div>'+
          '<div style="display:flex;align-items:baseline;gap:5px"><span style="font-family:var(--mono);font-size:19px;font-weight:600;color:'+e[3]+'">'+e[1]+
          '</span><span style="font-size:11px;color:var(--tx2)">'+e[2]+'</span></div></div>';
      }).join("")+'</div><div style="flex:1"></div>'+
      '<div class="note w">Bu değerler basit kiriş formülleriyle (q·L²/8, q·L/2) hesaplanan <b>ön tahminlerdir</b>. Süreklilik, çerçeve rijitliği ve deprem etkisi dahil değildir — gerçek çözücü henüz yazılmadı.</div>'+
    '</div>'+
    '<div class="center"><div class="hint">'+tabs+'<div style="flex:1"></div>'+
      '<span style="font-family:var(--mono);font-size:11px;color:var(--tx2)">GZT 1 · 1,35·G + 1,50·Q</span></div>'+
      '<div style="flex:1;min-height:0;padding:10px;display:flex;align-items:center;justify-content:center">'+
      '<svg viewBox="0 0 860 600" style="width:100%;height:100%">'+SVGDEFS+o.join("")+'</svg></div></div>'+
    '<div class="side r"><div class="hd">AÇIKLIK BAZINDA</div><div style="padding:0 14px">'+
      '<table class="tbl"><thead><tr><th>Feld</th><th style="text-align:right">L [m]</th><th style="text-align:right">V [kN]</th><th style="text-align:right">M [kNm]</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div><div style="flex:1"></div>'+
      '<div style="padding:13px;border-top:1px solid var(--line)"><button class="btn pri" data-stool="bemessung" style="width:100%;padding:11px">Boyutlandırmaya geç →</button></div></div>';
}

function viewBemessung(d){
  var g = P.design;
  var u = P.units.sec;
  var betons = BETON.map(function(b){
    var on = g.beton===b;
    return '<button data-beton="'+b+'" style="padding:6px 10px;border-radius:4px;font-family:var(--mono);font-size:11px;'+
      (on?'background:var(--cysel);border:1px solid #2E6688;color:var(--cy2)':'background:var(--bg);border:1px solid var(--line);color:var(--tx2)')+'">'+b+'</button>';
  }).join("");

  // kesit çizimi
  var sw, sh;
  var ratio = g.secH/Math.max(g.secB,.01);
  if (ratio > 300/160){ sh = 300; sw = 300/ratio; } else { sw = 160; sh = 160*ratio; }
  var sx = 135-sw/2, sy = 190-sh/2;
  var bars = [];
  for (var i=0;i<d.nBars;i++){
    var fx = d.nBars===1 ? .5 : i/(d.nBars-1);
    bars.push('<circle cx="'+(sx+16+(sw-32)*fx)+'" cy="'+(sy+sh-16)+'" r="6.5" fill="#E8A33D"/>');
  }
  var topN = Math.max(2, Math.round(d.nBars/2));
  for (var j=0;j<topN;j++){
    var fx2 = topN===1 ? .5 : j/(topN-1);
    bars.push('<circle cx="'+(sx+16+(sw-32)*fx2)+'" cy="'+(sy+14)+'" r="5" fill="#E8A33D"/>');
  }
  var secSvg = '<svg viewBox="0 0 270 420" style="width:240px;height:380px">'+
    '<rect x="'+sx+'" y="'+sy+'" width="'+sw+'" height="'+sh+'" fill="#12283A" stroke="#3FB6D3" stroke-width="2"/>'+
    '<rect x="'+(sx+10)+'" y="'+(sy+10)+'" width="'+(sw-20)+'" height="'+(sh-20)+'" fill="none" stroke="#2E6688" stroke-width="1.4" rx="7"/>'+
    bars.join("")+

function foundLabelDE(k){ for (var i=0;i<FOUNDTYPES.length;i++) if (FOUNDTYPES[i][0]===k) return FOUNDTYPES[i][2]; return k; }
function roofLabelDE(t){ for (var i=0;i<ROOFTYPES.length;i++) if (ROOFTYPES[i][0]===t) return ROOFTYPES[i][2]; return t; }
function stairLabelDE(t){ for (var i=0;i<STAIRTYPES.length;i++) if (STAIRTYPES[i][0]===t) return STAIRTYPES[i][2]; return t; }
function balkLabelDE(t){ return { auskragend:"auskragende Platte", vorgestellt:"vorgestellt, gestützt",
  loggia:"Loggia", franz:"französischer Balkon" }[t] || t; }
var SOILPERMDE = { stark:"stark durchlässig (k ≥ 10⁻⁴ m/s) — Sand, Kies",
                   mittel:"mäßig durchlässig (10⁻⁶…10⁻⁴ m/s) — schluffiger Sand",
                   gering:"gering durchlässig (k < 10⁻⁶ m/s) — Ton, Mergel" };
var OUTLETSDE  = { kanal:"Kanalanschluss mit Rückstausicherung", sicker:"Sickerschacht",
                   vorflut:"Vorflut / offener Graben" };

var RPOS = [["0","Deckblatt"],["1","Allgemeines"],["2","Baustoffe"],["3","System"],
            ["4","Lastannahmen"],["5","Schnittgrößen"],["6","Bemessung"],["7","Gründung"]];

/* --- sayfa içi küçük yapı taşları --- */
function rH(t){ return '<div style="margin-top:15px;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.2px">'+t+'</div>'; }
function rP(t){ return '<div style="margin-top:7px;font-size:10.5px;line-height:1.55;color:#31302C">'+t+'</div>'; }
function rBox(t, col){
  var c = col || "#B0562B";
  return '<div style="margin-top:8px;padding:10px 13px;background:#F3F1EA;border-left:2.5px solid '+c+
    ';font-family:var(--mono);font-size:9.5px;line-height:1.75;color:#262521">'+t+'</div>';
}
function rOk(t, ok){
  return '<div style="margin-top:8px;padding:8px 13px;background:'+(ok?"#E9F2EA":"#F6E9E9")+';border-left:2.5px solid '+
    (ok?"#2F7A4A":"#9E3B3B")+';font-family:var(--mono);font-size:9.5px;line-height:1.7;color:'+(ok?"#1E4A2E":"#6E2626")+'">'+t+'</div>';
}
function rTab(head, rows, cols, leftN){
  var gc = cols || "1fr 96px 68px";
  var lN = (leftN === undefined) ? 1 : leftN;      /* sola yaslı ilk sütun sayısı */
  var h = '<div style="margin-top:7px;font-family:var(--mono);font-size:9.5px">'+
    '<div style="display:grid;grid-template-columns:'+gc+';padding:5px 8px;background:#EFEDE7;border-bottom:1px solid #D6D3CA;font-weight:600">'+
    head.map(function(x,i){ return '<span'+(i>=lN?' style="text-align:right"':'')+'>'+x+'</span>'; }).join("")+'</div>';
  h += rows.map(function(r){
    return '<div style="display:grid;grid-template-columns:'+gc+';padding:4.5px 8px;border-bottom:1px solid #E6E3DC">'+
      r.map(function(x,i){ return '<span'+(i>=lN?' style="text-align:right'+(i===r.length-1?';color:#55534D':'')+'"':'')+'>'+x+'</span>'; }).join("")+'</div>';
  }).join("");
  return h + '</div>';
}

    '</b> in '+esc(P.meta.ort)+'. Gebäudeart: '+esc(TYPES[P.type].label)+'.');

    h += rTab(["Kenngröße","Wert","Einheit"], [
      ["Gebäudeabmessung (Achsmaß)", fmt(d.W,2)+" × "+fmt(d.D,2), "m"],
      ["Geschosse", String(d.nSt), "—"],
      ["Gebäudehöhe (OK oberste Decke)", fmt(d.Htot,2), "m"],
      ["Bruttogrundfläche BGF (DIN 277)", fmt(d.bgf,1), "m²"],
      ["Deckenfläche gesamt (ohne Öffnungen)", fmt(d.areaSlabTot,1), "m²"],
      ["Regelgeschosshöhe", fmt(P.storeys[0].h,2), "m"],
      ["Dachform", P.roof.on ? roofLabelDE(P.roof.type)+" "+fmt(P.roof.pitch,0)+"°" : "—", "—"]
    ]);
  }
  h += rH("Zugrunde gelegte Normen");
  h += rTab(["Norm","Inhalt"], normList().map(function(n){ return [n[0], n[1]]; }), "170px 1fr");
  h += rBox('Schneelastzone <b>'+esc(P.meta.sz)+'</b> · charakteristische Schneelast s_k = <b>'+fmt(P.loads.s,2)+' kN/m²</b><br>'+

  return h;
}

function rp2(d){   /* Baustoffe */
  var g = P.design;
  var used = {};
  ["columns","beams","slabs","walls","foundations","stairs","balconies"].forEach(function(k){
    (P[k]||[]).forEach(function(r){ if (r.mat) used[r.mat] = (used[r.mat]||0)+1; });
  });
  var rows = Object.keys(used).map(function(m){ return [m, String(used[m]), "Bauteile"]; });
  var h = rH("Tragende Baustoffe");
  h += rTab(["Baustoff","Anzahl","Einheit"], rows.length ? rows : [["—","0",""]]);
  h += rBox('Beton (Bemessung): <b>'+g.beton+'</b> · f_ck = '+fmt(FCK[g.beton]||25,0)+' N/mm² · f_cd = 0,85·f_ck/1,5 = <b>'+fmt(d.fcd,2)+' N/mm²</b><br>'+
            'Betonstahl: <b>B500B</b> · f_yk = 500 N/mm² · f_yd = 435 N/mm²<br>'+
            'Expositionsklasse: <b>XC1</b> (innen, trocken) · erdberührt <b>XC2</b><br>'+
            'Betondeckung c_nom = <b>'+fmt(g.cnom*1000,0)+' mm</b> · Bewehrung Ø'+fmt(g.phi*1000,0)+' mm');
  ensureDrain();
  var dc = drainCalc(d);
  h += rH("Abdichtungs- und Dämmstoffe");
  h += rTab(["Bauteil / Stoff","Kennwert","Einheit"], [
    ["Abdichtung: "+dc.seal[2], dc.isWU ? "d ≥ "+fmt(dc.reqT,0) : fmt(dc.haveT,1)+" mm", dc.isWU?"mm":"—"],
    ["Perimeterdämmung: "+P.drain.perim, fmt(pnum(P.drain.perimT,.1)*1000,0), "mm"],
    ["λ Perimeterdämmung", fmt(dc.perim[1],3), "W/mK"],
    ["Druckfestigkeit CS(10/Y)", String(dc.perim[2]), "kPa"],
    ["Sickerschicht", P.drain.gravelType, "—"],
    ["Sauberkeitsschicht", "C8/10 · "+fmt(pnum(P.drain.sauber,.05)*100,0), "cm"]
  ]);
  if (P.finishes){
    var aw = null; P.finishes.surfaces.forEach(function(s){ if (s.key==="aw") aw = s; });
    if (aw){
      var cc = calcSurface(aw, d);
      h += rH("Außenwandaufbau (von außen nach innen)");
      h += rTab(["Schicht","d [mm]","λ"], aw.layers.map(function(l){
        return [esc(l.name), fmt(l.t*1000,1), l.lam>0?fmt(l.lam,3):"—"]; }));
      h += rBox('Gesamtdicke '+fmt(cc.thick*1000,0)+' mm · Flächengewicht '+fmt(cc.wkN,2)+' kN/m²'+
                (cc.hasU ? ' · U = <b>'+fmt(cc.U,3)+' W/m²K</b> (GEG-Referenz '+fmt(cc.ref,2)+')' : ''));
    }
  }
  return h;
}

            'Größte Stützweite L_max = <b>'+fmt(d.Lmax,2)+' m</b>');
  h += rH("Geschosse");
  h += rTab(["Geschoss","Höhe [m]","OK [m]"], (function(){

  })());
  h += rH("Bauteile je Geschoss");
  h += rTab(["Geschoss","Wände","Decken","Stützen","Riegel"], P.storeys.map(function(s,k){
    return [esc(s.name), String(katCount(k,"walls")), String(katCount(k,"slabs")),

  }), "1fr 62px 62px 62px 62px");

  }), "1fr 62px 62px 62px 62px");

    '<div style="display:flex;justify-content:space-between;padding-top:9px;margin-top:14px;border-top:1px solid #D6D3CA;font-family:var(--mono);font-size:8px;color:#6C6A63">'+
    '<span>Aufgestellt: '+esc(P.meta.aufst)+'</span><span>TRAGWERK/PLAN v2.7 · Schalplan</span></div></div>';
}


/* ============================================================
   DONATI — Bewehrung  (EN 1992-1-1 + DIN EN 1992-1-1/NA)
   Ön tasarım düzeyinde boyutlandırma ve donatı seçimi.
   ============================================================ */
var DTOOLS = [["doseme","Döşeme"],["kiris","Kiriş"],["kolon","Kolon"],
              ["perde","Perde"],["temel","Temel"],["liste","Çelik listesi"]];
var BARDIA  = [6,8,10,12,14,16,20,25,28];
var SPACING = [7.5,10,12.5,15,17.5,20,25];
var MATTEN  = [["Q188",1.88],["Q257",2.57],["Q335",3.35],["Q424",4.24],["Q524",5.24],["Q636",6.36]];
var FYD = 435000;                 /* kN/m² — B500B / 1,15 */
var FYDC = 43.5;                  /* kN/cm² */

function barKg(phi){ return 0.006165 * phi * phi; }         /* kg/m, Ø mm */
function barAcm(phi){ return Math.PI * phi * phi / 400; }   /* cm², Ø mm */
function asSp(phi, sp){ return barAcm(phi) * 100 / sp; }    /* cm²/m, sp cm */
function fctmOf(fck){ return 0.30 * Math.pow(fck, 2/3); }
function pickMesh(as){
  for (var i=0;i<MATTEN.length;i++) if (MATTEN[i][1] >= as - 1e-9) return MATTEN[i];
  return MATTEN[MATTEN.length-1];
}
/* verilen as için Ø/aralık seç — mümkünse tercih edilen çaptan başlar */
function pickSp(as, phi0, sMax){
  var out = null;
  for (var p=0;p<BARDIA.length;p++){
    var phi = BARDIA[p];
    if (phi < (phi0 || 8)) continue;
    for (var k=SPACING.length-1;k>=0;k--){
      var sp = SPACING[k];
      if (sp > sMax) continue;
      if (asSp(phi, sp) >= as - 1e-9){ out = { phi:phi, sp:sp, as:asSp(phi, sp) }; break; }
    }
    if (out) break;
  }
  if (!out) out = { phi:BARDIA[BARDIA.length-1], sp:SPACING[0], as:asSp(BARDIA[BARDIA.length-1], SPACING[0]) };
  return out;
}
/* n adet çubukla as karşıla */
function pickBars(as, phi0, nMin){
  for (var p=0;p<BARDIA.length;p++){
    var phi = BARDIA[p];
    if (phi < (phi0 || 12)) continue;
    var n = Math.max(nMin || 2, Math.ceil(as / barAcm(phi)));
    if (n <= 8) return { phi:phi, n:n, as:n*barAcm(phi) };
  }
  var ph = BARDIA[BARDIA.length-1];
  var nn = Math.max(nMin||2, Math.ceil(as / barAcm(ph)));
  return { phi:ph, n:nn, as:nn*barAcm(ph) };
}
function cnomOf(exp){ return exp === "aussen" ? 0.040 : (exp === "erd" ? 0.055 : 0.025); }

/* ---------------- DÖŞEME ---------------- */
function rebarSlab(sl, d){
  var i = pnum(sl.cx,0), j = pnum(sl.cy,0), k = stFrom(sl);
  var lx0 = P.grid.x[i] || 4.0, ly0 = P.grid.y[j] || 4.0;
  var swap = ly0 < lx0;
  var lx = Math.min(lx0, ly0), ly = Math.max(lx0, ly0);
  var e  = ly / Math.max(lx, 0.01);
  var t  = pnum(sl.t, 0.20);
  var q  = d.qd;                                         /* kN/m² tasarım */
  var oneWay = e >= 2.0;
  /* komşu döşeme var mı → süreklilik */
  var cX = (findSlab(i-1, j, k) >= 0) || (findSlab(i+1, j, k) >= 0);
  var cY = (findSlab(i, j-1, k) >= 0) || (findSlab(i, j+1, k) >= 0);
  /* yük dağıtımı — Marcus / Grashof */
  var kx = Math.pow(ly,4) / (Math.pow(lx,4) + Math.pow(ly,4));
  var qx = oneWay ? q : q * kx;
  var qy = oneWay ? 0 : q * (1 - kx);
  var mFx = qx * lx*lx / (cX ? 11 : 8);
  var mFy = oneWay ? 0 : qy * ly*ly / (cY ? 11 : 8);
  var mSx = cX ? qx * lx*lx / 9 : 0;
  var mSy = (!oneWay && cY) ? qy * ly*ly / 9 : 0;
  var cn = cnomOf("innen");
  var fck = FCK[sl.mat] || FCK[P.design.beton] || 25;
  var phi0 = 10;
  var dx = Math.max(0.03, t - cn - phi0/2000);
  var dy = Math.max(0.03, dx - phi0/1000);
  var asMin = Math.max(0.26 * fctmOf(fck)/500 * 100 * dx*100, 0.0013 * 100 * dx*100);
  function asOf(m, dd){ return Math.max(0, m / (0.9 * dd * FYD) * 1e4); }
  var asFx = Math.max(asOf(mFx, dx), asMin);
  var asFy = Math.max(asOf(mFy, dy), oneWay ? 0.20*asFx : asMin);
  var asSx = mSx > 0 ? Math.max(asOf(mSx, dx), asMin) : 0;
  var asSy = mSy > 0 ? Math.max(asOf(mSy, dy), asMin) : 0;
  var sMax = Math.min(25, 2.5 * t * 100);
  var bFx = pickSp(asFx, 8, sMax), bFy = pickSp(asFy, 8, sMax);
  var bSx = asSx > 0 ? pickSp(asSx, 8, sMax) : null;
  var bSy = asSy > 0 ? pickSp(asSy, 8, sMax) : null;
  /* sehim — l/d sınırı */
  var ld = lx / dx;
  var ldLim = (lx <= 4.3) ? 35 : (150 / lx);
  /* kayma */
  var vEd = qx * lx / 2;
  var rho = Math.min(0.02, (bFx.as/1e4) / dx);
  var kV = Math.min(2.0, 1 + Math.sqrt(0.2/Math.max(dx,0.05)));
  var vRdc = Math.max(0.035*Math.pow(kV,1.5)*Math.sqrt(fck), 0.12*kV*Math.pow(100*rho*fck,1/3)) * 1000 * dx;  /* kN/m */
  return { lx:lx, ly:ly, e:e, oneWay:oneWay, cX:cX, cY:cY, t:t, q:q, qx:qx, qy:qy, swap:swap,
           mFx:mFx, mFy:mFy, mSx:mSx, mSy:mSy, dx:dx, dy:dy, cn:cn, fck:fck,
           asFx:asFx, asFy:asFy, asSx:asSx, asSy:asSy, asMin:asMin, sMax:sMax,
           bFx:bFx, bFy:bFy, bSx:bSx, bSy:bSy,
           mesh:pickMesh(asFx), ld:ld, ldLim:ldLim, okLd: ld <= ldLim,
           vEd:vEd, vRdc:vRdc, okV: vEd <= vRdc,
           ok: (ld <= ldLim) && (vEd <= vRdc) };
}

/* ---------------- KİRİŞ ---------------- */
function beamTrib(b){
  var dir = b.dir || "x", ln = pnum(b.line,0);
  var arr = (dir === "x") ? P.grid.y : P.grid.x;
  var a = (ln-1 >= 0 && ln-1 < arr.length) ? arr[ln-1] : 0;
  var c = (ln < arr.length) ? arr[ln] : 0;
  return (a + c) / 2;
}
function rebarBeam(bm, d){
  var L = beamL(bm), bw = pnum(bm.b,0.30), hh = pnum(bm.h,0.50);
  var trib = beamTrib(bm);
  var gSelf = 1.35 * 25 * bw * Math.max(0, hh - d.tSlab);      /* kN/m */
  var q = d.qd * trib + gSelf;                                 /* kN/m */
  var sys = bm.sys || "durchlauf";
  var MF, MS, VEd, src0 = "formül";
  if (sys === "krag"){ MF = 0; MS = q*L*L/2; VEd = q*L; }
  else if (sys === "einfeld"){ MF = q*L*L/8; MS = 0; VEd = q*L/2; }
  else { MF = q*L*L/11; MS = q*L*L/9; VEd = 0.6*q*L; }
  /* gerçek çözüm varsa onu kullan */
  var sv = beamSolved(bm, d);
  if (sv && isFinite(sv.Mmax) && isFinite(sv.Mmin)){
    MF = Math.max(0, sv.Mmax);
    MS = Math.max(0, -sv.Mmin);
    VEd = Math.abs(sv.Vmax);
    src0 = "çözücü";
  }
  var fck = FCK[bm.mat] || FCK[P.design.beton] || 25;
  var fcd = 0.85*fck/1.5;
  var cn = cnomOf("innen"), phiB = 8;
  var dEff = Math.max(0.05, hh - cn - phiB/1000 - 0.008);
  function bend(M){
    if (M <= 0) return { M:0, mu:0, zeta:0.95, as:0 };
    var mu = (M/1000) / (bw * dEff*dEff * fcd);
    var zeta = 1 - 0.5*(1 - Math.sqrt(Math.max(0, 1 - 2*Math.min(mu, 0.371))));
    var as = M / (zeta * dEff * FYD) * 1e4;
    return { M:M, mu:mu, zeta:zeta, as:as };
  }
  var F = bend(MF), S = bend(MS);
  var fctm = fctmOf(fck);
  var asMin = Math.max(0.26*fctm/500*bw*100*dEff*100, 0.0013*bw*100*dEff*100);
  var asF = Math.max(F.as, asMin), asS = MS > 0 ? Math.max(S.as, asMin) : 0;
  /* tek sıraya sığan en uygun çap/adet — DIN EN 1992-1-1 8.2 çubuk aralığı */
  function fitBars(as, nMin){
    var best = null;
    for (var p=0;p<BARDIA.length;p++){
      var phi = BARDIA[p];
      if (phi < 12) continue;
      var n = Math.max(nMin, Math.ceil(as / barAcm(phi)));
      if (n > 8) continue;
      var w = 2*cn + 2*phiB/1000 + n*phi/1000 + (n-1)*Math.max(phi/1000, 0.020);
      var cand = { phi:phi, n:n, as:n*barAcm(phi), bReq:w, fits: w <= bw + 1e-9 };
      if (!best) best = cand;
      if (cand.fits) return cand;
      if (cand.bReq < best.bReq) best = cand;
    }
    if (!best){
      var ph = BARDIA[BARDIA.length-1], nn = Math.max(nMin, Math.ceil(as/barAcm(ph)));
      best = { phi:ph, n:nn, as:nn*barAcm(ph),
               bReq: 2*cn + 2*phiB/1000 + nn*ph/1000 + (nn-1)*Math.max(ph/1000,0.020), fits:false };
    }
    return best;
  }
  var barF = fitBars(asF, 2), barS = asS > 0 ? fitBars(asS, 2) : null;
  var bReq = barF.bReq;
  /* kesme */
  var z = 0.9 * dEff, cot = 1.2;
  var nu1 = 0.75;
  var VRdmax = bw * z * nu1 * fcd * 1000 / (cot + 1/cot);      /* kN */
  var aswS = VEd / (z * FYD * cot) * 1e4;                      /* cm²/m — a_sw/s = V_Ed/(z·f_yd·cot θ) */
  var rwMin = 0.16 * fctm / 500;
  var aswMin = rwMin * bw * 1e4;                               /* cm²/m */
  var aswReq = Math.max(aswS, aswMin);
  /* iki kollu etriye */
  var buPhi = 8, sBu = null;
  for (var p=0;p<BARDIA.length && !sBu;p++){
    if (BARDIA[p] < 8) continue;
    for (var k=SPACING.length-1;k>=0;k--){
      var sp = SPACING[k];
      if (sp > Math.min(0.75*dEff*100, 30)) continue;
      if (2*barAcm(BARDIA[p])*100/sp >= aswReq - 1e-9){ buPhi = BARDIA[p]; sBu = sp; break; }
    }
  }
  if (!sBu){ buPhi = 10; sBu = 10; }
  var aswProv = 2*barAcm(buPhi)*100/sBu;
  return { L:L, bw:bw, h:hh, trib:trib, q:q, gSelf:gSelf, sys:sys, dEff:dEff, cn:cn, fck:fck, fcd:fcd, src:src0,
           MF:MF, MS:MS, VEd:VEd, muF:F.mu, zetaF:F.zeta, asF:asF, asS:asS, asMin:asMin,
           barF:barF, barS:barS, bReq:bReq, okB: bReq <= bw + 1e-9,
           z:z, cot:cot, VRdmax:VRdmax, aswReq:aswReq, aswMin:aswMin, buPhi:buPhi, sBu:sBu, aswProv:aswProv,
           okV: VEd <= VRdmax, etaV: VRdmax>0 ? VEd/VRdmax : 9,
           etaM: F.mu / 0.371, okM: F.mu <= 0.371,
           ok: (VEd <= VRdmax) && (F.mu <= 0.371) && (bReq <= bw + 1e-9) };
}

/* ---- kesit taşıma gücü: dikdörtgen kesit, simetrik donatı, M–N etkileşimi ----
   Dikdörtgen gerilme bloğu (a = 0,8x), ε_cu3 = 3,5 ‰, B500B elasto-plastik.
   Donatı iki yüze eşit dağıtılmış kabul edilir (d1 = kenar mesafesi). */
function sectionNM(bw, hh, d1, fcd, As, x){
  var ecu = 0.0035, Es = 200000, fyd = 435;         /* MPa */
  var a = Math.min(0.8*x, hh);
  var Fc = a * bw * fcd * 1000;                     /* kN */
  var zc = hh/2 - a/2;                              /* ağırlık merkezinden */
  var N = Fc, M = Fc * zc;
  var lay = [[d1, As/2], [hh-d1, As/2]];            /* [derinlik m, alan cm²] */
  for (var i=0;i<2;i++){
    var yi = lay[i][0], Asi = lay[i][1] / 1e4;      /* m² */
    var eps = (x > 1e-6) ? ecu * (x - yi) / x : -0.01;
    var sig = Math.max(-fyd, Math.min(fyd, Es * eps));
    N += Asi * sig * 1000;
    M += Asi * sig * 1000 * (hh/2 - yi);
  }
  return { N:N, M:M };
}
/* verilen As için N = NEd'de taşınabilen moment */
function sectionMRd(bw, hh, d1, fcd, As, NEd){
  var pts = [], n = 160;
  for (var i=0;i<=n;i++){
    var x = hh * (0.02 + 3.0*i/n);
    pts.push(sectionNM(bw, hh, d1, fcd, As, x));
  }
  var best = -1e18;
  for (var k=0;k<pts.length-1;k++){
    var p1 = pts[k], p2 = pts[k+1];
    if ((p1.N - NEd) * (p2.N - NEd) <= 0 && Math.abs(p2.N - p1.N) > 1e-9){
      var t = (NEd - p1.N) / (p2.N - p1.N);
      best = Math.max(best, p1.M + t*(p2.M - p1.M));
    }
  }
  /* NEd eğrinin dışındaysa (çok büyük normal kuvvet) taşıma yok */
  return best;
}
/* NEd + MEd için gerekli simetrik donatı (cm²) */
function colAsReq(bw, hh, d1, fcd, NEd, MEd, asMin, asMax){
  var lo = asMin, hi = Math.max(asMax, asMin + 1);
  if (sectionMRd(bw, hh, d1, fcd, lo, NEd) >= MEd) return { as:lo, ok:true };
  if (sectionMRd(bw, hh, d1, fcd, hi, NEd) < MEd) return { as:hi, ok:false };
  for (var it=0; it<40; it++){
    var mid = (lo+hi)/2;
    if (sectionMRd(bw, hh, d1, fcd, mid, NEd) >= MEd) hi = mid; else lo = mid;
  }
  return { as:hi, ok:true };
}

/* ---------------- KOLON ---------------- */
function rebarCol(c, d){
  var isC = (c.form === "circle");
  var bw = isC ? pnum(c.d,0.30) : pnum(c.b,0.30);
  var hh = isC ? pnum(c.d,0.30) : pnum(c.h,0.30);
  var Ac = isC ? Math.PI*bw*bw/4 : bw*hh;
  var NEd = colLoad(pnum(c.ax,0), pnum(c.ay,0));
  var MEdC = 0, srcC = "yük alanı";
  var svC = colSolved(c, d);
  if (svC && svC.N > 0){ NEd = svC.N; MEdC = svC.M; srcC = "çözücü"; }
  var hSt = pnum(P.storeys[stFrom(c)] ? P.storeys[stFrom(c)].h : 3.0, 3.0);
  var fck = FCK[c.mat] || FCK[P.design.beton] || 25;
  var fcd = 0.85*fck/1.5;
  /* narinlik */
  var iR = isC ? bw/4 : Math.min(bw,hh)/Math.sqrt(12);
  var l0 = 1.0 * hSt;
  var lam = l0 / iR;
  var nRel = (NEd/1000) / (Ac * fcd);
  var lamLim = 25 / Math.sqrt(Math.max(nRel, 0.01));
  /* --- dışmerkezlikler --- */
  var d1 = 0.025 + 0.008 + 0.010;                         /* c_nom + etriye + Ø/2 */
  var dEffC = hh - d1;
  var e0 = Math.max(hh/30, 0.02);                         /* istenmeyen + minimum */
  var e1 = (NEd > 0) ? Math.abs(MEdC)/NEd : 0;            /* çerçeveden gelen */
  var e2 = 0;
  if (lam > lamLim){
    var invR = (435/200000) / (0.45 * Math.max(dEffC, 0.05));   /* 1/r — EN 1992-1-1 5.8.8 */
    e2 = invR * l0 * l0 / 10;
  }
  var eTot = e0 + e1 + e2;
  var MEdTot = NEd * eTot;                                /* kNm — ikinci mertebe dahil */
  /* minimum / maksimum donatı — EN 1992-1-1/NA 9.5.2 */
  var asMin = Math.max(0.15 * NEd / FYDC, 0.003 * Ac * 1e4);   /* cm² */
  var asMax = 0.09 * Ac * 1e4;
  /* dikdörtgen eşdeğer kesit (daire için eşit alanlı kare) */
  var bEq = isC ? Math.sqrt(Ac) : bw, hEq = isC ? Math.sqrt(Ac) : hh;
  var sol = colAsReq(bEq, hEq, d1, fcd, NEd, MEdTot, asMin, asMax);
  var asReq = sol.as;
  var nMin = isC ? 6 : 4;
  var bar = pickBars(asReq, 12, nMin);
  if (!isC && bar.n % 2 === 1) bar.n += 1;
  bar.as = bar.n * barAcm(bar.phi);
  var MRd = sectionMRd(bEq, hEq, d1, fcd, bar.as, NEd);
  var NRd = NEd > 0 ? NEd * (MRd > 0 && MEdTot > 0 ? Math.min(3, MRd/MEdTot) : 1) : 0;
  var kPhi = 1, NcRd = Ac * fcd * 1000;
  /* etriye */
  var buPhi = Math.max(6, Math.ceil(bar.phi/4));
  if (buPhi < 6) buPhi = 6;
  var sBu = Math.min(12*bar.phi/10, Math.min(bw,hh)*100, 30);  /* cm */
  sBu = Math.floor(sBu/2.5)*2.5;
  var etaC = (MRd > 0) ? (MEdTot / MRd) : (MEdTot > 0 ? 9 : 0);
  return { isC:isC, b:bw, h:hh, Ac:Ac, NEd:NEd, MEd:MEdC, src:srcC, e0:e0, e1:e1, e2:e2, eTot:eTot,
           MEdTot:MEdTot, MRd:MRd, d1:d1,
           lam:lam, lamLim:lamLim, nRel:nRel, kPhi:kPhi, NcRd:NcRd, NRd:NRd,
           asMin:asMin, asMax:asMax, asReq:asReq, bar:bar, rho: bar.as/(Ac*1e4)*100,
           buPhi:buPhi, sBu:sBu, eta: etaC, fits: sol.ok,
           okAs: bar.as <= asMax, ok: sol.ok && (bar.as <= asMax) && (etaC <= 1.0 + 1e-6) };
}

/* ---------------- TEMEL ---------------- */
function rebarFound(f, d){
  var a = pnum(f.a,1.5), b2 = pnum(f.b,1.5), hF = pnum(f.d,0.5);
  var isStrip = (f.kind === "streifen" || f.kind === "bag");
  var isPl = (f.kind === "platte");
  var NEd;
  if (isStrip) NEd = wallLoad(f.dir, pnum(f.line,0), pnum(f.seg,0));    /* kN/m */
  else if (isPl) NEd = d.qd * d.bgfSt * P.storeys.length / Math.max(1, d.W*d.D);   /* kN/m² */
  else NEd = colLoad(pnum(f.ax,0), pnum(f.ay,0));                       /* kN */
  var sig, cant, mEd;
  var colB = 0.30;
  if (isStrip){
    sig = NEd / Math.max(a, 0.1);                 /* kN/m² */
    cant = (a - pnum(d.extWall,0.24)) / 2;
    mEd = sig * cant * cant / 2;                  /* kNm/m */
  } else if (isPl){
    sig = NEd;                                    /* kN/m² */
    var Lsp = Math.max.apply(null, P.grid.x.concat(P.grid.y));
    mEd = sig * Lsp * Lsp / 11;                   /* kNm/m — sürekli plak */
    cant = 0;
  } else {
    sig = NEd / Math.max(a*b2, 0.01);
    cant = (a - colB) / 2;
    mEd = sig * cant * cant / 2;
  }
  var fck = FCK[f.mat] || FCK[P.design.beton] || 25;
  var cn = cnomOf("erd");
  var dEff = Math.max(0.05, hF - cn - 0.010);
  var as = mEd / (0.9 * dEff * FYD) * 1e4;        /* cm²/m */
  var asMin = Math.max(0.26*fctmOf(fck)/500*100*dEff*100, 0.0013*100*dEff*100);
  var asReq = Math.max(as, asMin);
  var bar = pickSp(asReq, 10, 20);
  var sigZul = pnum(P.soil.sigZul, 250);
  return { a:a, b:b2, h:hF, kind:f.kind, isStrip:isStrip, isPl:isPl, NEd:NEd, sig:sig, cant:cant,
           mEd:mEd, dEff:dEff, cn:cn, fck:fck, as:as, asMin:asMin, asReq:asReq, bar:bar,
           mesh:pickMesh(asReq), sigZul:sigZul, okSig: sig <= sigZul,
           ok: sig <= sigZul };
}

/* ---------------- ÇELİK LİSTESİ ---------------- */
function stahlListe(d){
  ensureShear(); ensurePar();
  var rows = [], tot = 0, byPhi = {};
  function add(bt, pos, phi, n, len, note){
    if (!(n > 0) || !(len > 0) || !phi) return;
    var kg = n * len * barKg(phi);
    rows.push({ bt:bt, pos:pos, phi:phi, n:Math.round(n), len:len, tot:n*len, kg:kg, note:note||"" });
    tot += kg;
    byPhi[phi] = (byPhi[phi] || 0) + kg;
  }
  var pi = 0;
  /* döşemeler */
  P.slabs.forEach(function(sl, ix){
    var c = rebarSlab(sl, d);
    var G = gridM(), i = pnum(sl.cx,0), j = pnum(sl.cy,0);
    var Lx = P.grid.x[i] || 4, Ly = P.grid.y[j] || 4;
    var nK = Math.max(1, nKatOf(sl));
    var cov = 2*c.cn;
    /* alt donatı X: Ly boyunca dağılır, boyu Lx */
    add("Döşeme "+(sl.name||posNr("slabs",ix)), ++pi, c.bFx.phi, Math.ceil(Ly*100/c.bFx.sp)*nK, Lx - cov + 0.30, "alt, x yönü Ø"+c.bFx.phi+"/"+fmt(c.bFx.sp,1));
    add("Döşeme "+(sl.name||posNr("slabs",ix)), ++pi, c.bFy.phi, Math.ceil(Lx*100/c.bFy.sp)*nK, Ly - cov + 0.30, "alt, y yönü Ø"+c.bFy.phi+"/"+fmt(c.bFy.sp,1));
    if (c.bSx) add("Döşeme "+(sl.name||posNr("slabs",ix)), ++pi, c.bSx.phi, Math.ceil(Ly*100/c.bSx.sp)*nK, 0.6*Lx, "üst, mesnet x");
    if (c.bSy) add("Döşeme "+(sl.name||posNr("slabs",ix)), ++pi, c.bSy.phi, Math.ceil(Lx*100/c.bSy.sp)*nK, 0.6*Ly, "üst, mesnet y");
  });
  /* kirişler */
  P.beams.forEach(function(bm, ix){
    var c = rebarBeam(bm, d), nK = Math.max(1, nKatOf(bm));
    add("Kiriş "+(bm.name||posNr("beams",ix)), ++pi, c.barF.phi, c.barF.n*nK, c.L + 0.60, "alt, açıklık");
    if (c.barS) add("Kiriş "+(bm.name||posNr("beams",ix)), ++pi, c.barS.phi, c.barS.n*nK, 0.6*c.L, "üst, mesnet");
    var nBu = Math.ceil(c.L*100/c.sBu) + 1;
    var uBu = 2*(c.bw + c.h) - 8*c.cn + 0.20;
    add("Kiriş "+(bm.name||posNr("beams",ix)), ++pi, c.buPhi, nBu*nK, uBu, "etriye Ø"+c.buPhi+"/"+fmt(c.sBu,1));
  });
  /* kolonlar */
  P.columns.forEach(function(c0, ix){
    var c = rebarCol(c0, d);
    var nSt = Math.max(1, nKatOf(c0));
    var Htot = 0;
    for (var k=stFrom(c0); k<=Math.min(stTo(c0), nKat()-1); k++) Htot += P.storeys[k].h;
    add("Kolon "+(c0.name||posNr("columns",ix)), ++pi, c.bar.phi, c.bar.n, Htot + 0.80, "boyuna");
    var nBu2 = Math.ceil(Htot*100/c.sBu) + 1;
    var uBu2 = c.isC ? Math.PI*(c.b - 2*0.025) + 0.20 : 2*(c.b + c.h) - 8*0.025 + 0.20;
    add("Kolon "+(c0.name||posNr("columns",ix)), ++pi, c.buPhi, nBu2, uBu2, "etriye Ø"+c.buPhi+"/"+fmt(c.sBu,1));
  });
  /* perdeler */
  (P.shearwalls||[]).forEach(function(w, ix){
    var c = perdeCalc(w, d);
    var Hw = hKatOf(w), L = shearLen(w);
    if (!(L > 0)) return;
    var sv = pickSp(c.asV/2, 10, 20), sh = pickSp(c.asH/2, 8, 25);
    add("Perde "+(w.name||posNr("shearwalls",ix)), ++pi, sv.phi, Math.ceil(L*100/sv.sp)*2, Hw + 0.60, "düşey, iki yüz Ø"+sv.phi+"/"+fmt(sv.sp,1));
    add("Perde "+(w.name||posNr("shearwalls",ix)), ++pi, sh.phi, Math.ceil(Hw*100/sh.sp)*2, L + 0.40, "yatay, iki yüz Ø"+sh.phi+"/"+fmt(sh.sp,1));
  });
  /* parapetler */
  (P.parapets||[]).forEach(function(p, ix){
    var c = parCalc(p);
    if (!(c.L > 0)) return;
    var spP = pickSp(c.asReq, 8, 20);
    add("Parapet "+(p.name||posNr("parapets",ix)), ++pi, spP.phi, Math.ceil(c.L*100/spP.sp)*2, c.h + 0.50, "düşey, iki yüz");
    add("Parapet "+(p.name||posNr("parapets",ix)), ++pi, 8, Math.ceil(c.h*100/20)*2, c.L + 0.40, "yatay Ø8/20");
  });
  /* temeller */
  P.foundations.forEach(function(f, ix){
    var c = rebarFound(f, d);
    if (f.kind === "platte"){
      var nx = Math.ceil(d.D*100/c.bar.sp), ny = Math.ceil(d.W*100/c.bar.sp);
      add("Temel "+(f.name||posNr("foundations",ix)), ++pi, c.bar.phi, nx*2, d.W + 0.30, "plak alt+üst, x");
      add("Temel "+(f.name||posNr("foundations",ix)), ++pi, c.bar.phi, ny*2, d.D + 0.30, "plak alt+üst, y");
    } else if (c.isStrip){
      var Ls = (f.dir === "x" ? (P.grid.x[pnum(f.seg,0)]||0) : (P.grid.y[pnum(f.seg,0)]||0));
      add("Temel "+(f.name||posNr("foundations",ix)), ++pi, c.bar.phi, Math.ceil(Ls*100/c.bar.sp), c.a + 0.20, "enine");
      add("Temel "+(f.name||posNr("foundations",ix)), ++pi, 12, 4, Ls + 0.40, "boyuna Ø12");
    } else {
      add("Temel "+(f.name||posNr("foundations",ix)), ++pi, c.bar.phi, Math.ceil(c.b*100/c.bar.sp), c.a + 0.20, "alt ağ, x");
      add("Temel "+(f.name||posNr("foundations",ix)), ++pi, c.bar.phi, Math.ceil(c.a*100/c.bar.sp), c.b + 0.20, "alt ağ, y");
    }
  });
  var phis = Object.keys(byPhi).map(function(x){ return parseInt(x,10); }).sort(function(a,b){ return a-b; });
  return { rows:rows, tot:tot, byPhi:byPhi, phis:phis,
           kgPerM3: d.volBeton > 0 ? tot/d.volBeton : 0 };
}


/* ============================================================
   DONATI PLANI — çizimler ve görünüm
   ============================================================ */
function donElements(){
  ensureShear(); ensurePar();
  var t = UI.dTool || "doseme";
  if (t === "doseme") return P.slabs.map(function(r,i){ return { list:"slabs", row:r, nr:posNr("slabs",i) }; });
  if (t === "kiris")  return P.beams.map(function(r,i){ return { list:"beams", row:r, nr:posNr("beams",i) }; });
  if (t === "kolon")  return P.columns.map(function(r,i){ return { list:"columns", row:r, nr:posNr("columns",i) }; });
  if (t === "perde")  return (P.shearwalls||[]).map(function(r,i){ return { list:"shearwalls", row:r, nr:posNr("shearwalls",i) }; });
  if (t === "temel")  return P.foundations.map(function(r,i){ return { list:"foundations", row:r, nr:posNr("foundations",i) }; });
  return [];
}
function donSel(){
  var els = donElements();
  if (!els.length) return null;
  var hit = null;
  els.forEach(function(e){ if (e.row.id === UI.dSel) hit = e; });
  if (!hit){ hit = els[0]; UI.dSel = hit.row.id; }
  return hit;
}

/* ---------- KOLON donatı çizimi ---------- */
function drawRebarCol(c0, d){
  var c = rebarCol(c0, d), o = [];
  var Htot = 0;
  for (var k=stFrom(c0); k<=Math.min(stTo(c0), nKat()-1); k++) Htot += P.storeys[k].h;
  var s = Math.min(300/Math.max(Htot,1), 110/Math.max(c.b,0.2));
  var X0 = 180, Y0 = 110, W = Math.max(34, c.b*s), H = Htot*s;
  title2(o, 60, 44, "BEWEHRUNG · "+esc(c0.name||"Stütze"),
    (c.isC?("Ø"+fmt(c.b*100,0)):(fmt(c.b*100,0)+"/"+fmt(c.h*100,0)))+" cm · H = "+fmt(Htot,2)+" m · "+esc(c0.mat||P.design.beton)+
    " · N_Ed = "+fmt(c.NEd,0)+" kN");
  o.push('<rect x="'+fmt2(X0)+'" y="'+fmt2(Y0)+'" width="'+fmt2(W)+'" height="'+fmt2(H)+'" fill="url(#hx)" stroke="#E8A33D" stroke-width="1.6"/>');
  /* boyuna çubuklar */
  [X0+9, X0+W-9].forEach(function(bx){
    o.push('<line x1="'+fmt2(bx)+'" y1="'+fmt2(Y0+5)+'" x2="'+fmt2(bx)+'" y2="'+fmt2(Y0+H-5)+'" stroke="#E8A33D" stroke-width="2.4"/>');
  });
  /* etriyeler */
  var nB = Math.min(30, Math.max(5, Math.round(Htot*100/c.sBu)));
  for (var i2=0;i2<nB;i2++){
    var yy = Y0 + 8 + (H-16)*i2/(nB-1);
    o.push('<rect x="'+fmt2(X0+5)+'" y="'+fmt2(yy-2)+'" width="'+fmt2(W-10)+'" height="4" fill="none" stroke="#6ECFA0" stroke-width="1.1"/>');
  }
  barLabel(o, X0+W+16, Y0+34, c.bar.n+" Ø"+c.bar.phi+" ("+fmt(c.bar.as,2)+" cm²)", "#E8A33D");
  barLabel(o, X0+W+16, Y0+58, "Bü Ø"+c.buPhi+"/"+fmt(c.sBu,1)+" cm", "#6ECFA0");
  barLabel(o, X0+W+16, Y0+82, "ρ = "+fmt(c.rho,2)+" %", "#9FD8EA");
  dimLine(o, X0-26, Y0, X0-26, Y0+H, fmt(Htot,2)+" m", "#9FD8EA");

  /* enkesit */
  var QS = Math.max(90, Math.min(150, c.b*s*2.2));
  var QX = 430, QY = 150;
  title2(o, QX, QY-28, "QUERSCHNITT", (c.isC?("Ø"+fmt(c.b*100,0)):(fmt(c.b*100,0)+"/"+fmt(c.h*100,0)))+" cm");
  var QH = c.isC ? QS : QS * (c.h/c.b);
  if (c.isC){
    o.push('<circle cx="'+fmt2(QX+QS/2)+'" cy="'+fmt2(QY+QS/2)+'" r="'+fmt2(QS/2)+'" fill="url(#hx)" stroke="#E8A33D" stroke-width="1.8"/>');
    o.push('<circle cx="'+fmt2(QX+QS/2)+'" cy="'+fmt2(QY+QS/2)+'" r="'+fmt2(QS/2-9)+'" fill="none" stroke="#6ECFA0" stroke-width="1.4"/>');
    for (var n2=0;n2<c.bar.n;n2++){
      var ang = n2/c.bar.n*2*Math.PI - Math.PI/2;
      o.push('<circle cx="'+fmt2(QX+QS/2+Math.cos(ang)*(QS/2-14))+'" cy="'+fmt2(QY+QS/2+Math.sin(ang)*(QS/2-14))+'" r="4" fill="#E8A33D"/>');
    }
  } else {
    o.push('<rect x="'+fmt2(QX)+'" y="'+fmt2(QY)+'" width="'+fmt2(QS)+'" height="'+fmt2(QH)+'" fill="url(#hx)" stroke="#E8A33D" stroke-width="1.8"/>');
    o.push('<rect x="'+fmt2(QX+8)+'" y="'+fmt2(QY+8)+'" width="'+fmt2(QS-16)+'" height="'+fmt2(QH-16)+'" fill="none" stroke="#6ECFA0" stroke-width="1.4" rx="3"/>');
    var per = c.bar.n, side = Math.max(2, Math.ceil(per/4)+1);
    var pts = [];
    for (var a2=0;a2<side;a2++) pts.push([QX+13+(QS-26)*a2/(side-1), QY+13]);
    for (var b3=1;b3<side;b3++) pts.push([QX+QS-13, QY+13+(QH-26)*b3/(side-1)]);
    for (var c3=side-2;c3>=0;c3--) pts.push([QX+13+(QS-26)*c3/(side-1), QY+QH-13]);
    for (var d3=side-2;d3>=1;d3--) pts.push([QX+13, QY+13+(QH-26)*d3/(side-1)]);
    pts.slice(0, per).forEach(function(p3){
      o.push('<circle cx="'+fmt2(p3[0])+'" cy="'+fmt2(p3[1])+'" r="4" fill="#E8A33D"/>');
    });
  }
  return o.join("");
}

/* ---------- PERDE donatı çizimi ---------- */
function drawRebarWall(w, d){
  var c = perdeCalc(w, d), o = [];
  var Hw = hKatOf(w), L = c.L;
  if (!(L > 0)) return '<text x="400" y="300" fill="#8CA3BC" font-size="14">Perde uzunluğu sıfır</text>';
  var s = Math.min(400/L, 220/Math.max(Hw,1));
  var X0 = 150, Y0 = 110, W = L*s, H = Hw*s;
  var sv = pickSp(c.asV/2, 10, 20), sh = pickSp(c.asH/2, 8, 25);
  title2(o, 60, 44, "BEWEHRUNG · "+esc(w.name||"Wandscheibe"),
    "l = "+fmt(L,2)+" m · d = "+fmt(c.t*100,0)+" cm · H = "+fmt(Hw,2)+" m · "+esc(w.mat||P.design.beton));
  o.push('<rect x="'+fmt2(X0)+'" y="'+fmt2(Y0)+'" width="'+fmt2(W)+'" height="'+fmt2(H)+'" fill="url(#hx)" stroke="#E05C8A" stroke-width="1.6"/>');
  var nv = Math.min(24, Math.max(4, Math.round(L*100/sv.sp)));
  for (var i2=0;i2<nv;i2++){
    var xx = X0 + 9 + (W-18)*i2/(nv-1);
    o.push('<line x1="'+fmt2(xx)+'" y1="'+fmt2(Y0+6)+'" x2="'+fmt2(xx)+'" y2="'+fmt2(Y0+H-6)+'" stroke="#E8A33D" stroke-width="1.5"/>');
  }
  var nh = Math.min(18, Math.max(3, Math.round(Hw*100/sh.sp)));
  for (var j2=0;j2<nh;j2++){
    var yy = Y0 + 9 + (H-18)*j2/(nh-1);
    o.push('<line x1="'+fmt2(X0+6)+'" y1="'+fmt2(yy)+'" x2="'+fmt2(X0+W-6)+'" y2="'+fmt2(yy)+'" stroke="#7FE0F5" stroke-width="1.1" opacity=".85"/>');
  }
  /* uç (Rand) donatısı */
  [X0+14, X0+W-14].forEach(function(bx){
    o.push('<rect x="'+fmt2(bx-9)+'" y="'+fmt2(Y0+6)+'" width="18" height="'+fmt2(H-12)+'" fill="none" stroke="#6ECFA0" stroke-width="1.4" stroke-dasharray="6 3"/>');
  });
  barLabel(o, X0+W+14, Y0+28, "düşey Ø"+sv.phi+"/"+fmt(sv.sp,1)+" (iki yüz)", "#E8A33D");
  barLabel(o, X0+W+14, Y0+52, "yatay Ø"+sh.phi+"/"+fmt(sh.sp,1)+" (iki yüz)", "#7FE0F5");
  barLabel(o, X0+W+14, Y0+76, "uç: "+fmt(c.asRand,1)+" cm²", "#6ECFA0");
  dimLine(o, X0, Y0+H+34, X0+W, Y0+H+34, fmt(L,2)+" m", "#9FD8EA");
  dimLine(o, X0-26, Y0, X0-26, Y0+H, fmt(Hw,2)+" m", "#9FD8EA");
  /* yatay kesit */
  var SX = 150, SY = Y0+H+80, SW = Math.min(420, W), SH = Math.max(22, c.t*s*2.2);
  title2(o, 60, SY-20, "HORIZONTALSCHNITT", "d = "+fmt(c.t*100,0)+" cm");
  o.push('<rect x="'+fmt2(SX)+'" y="'+fmt2(SY)+'" width="'+fmt2(SW)+'" height="'+fmt2(SH)+'" fill="url(#hx)" stroke="#E05C8A" stroke-width="1.5"/>');
  var np = Math.min(20, Math.max(4, Math.round(SW/24)));
  for (var p4=0;p4<np;p4++){
    var px = SX + 12 + (SW-24)*p4/(np-1);
    o.push('<circle cx="'+fmt2(px)+'" cy="'+fmt2(SY+5)+'" r="2.8" fill="#E8A33D"/>');
    o.push('<circle cx="'+fmt2(px)+'" cy="'+fmt2(SY+SH-5)+'" r="2.8" fill="#E8A33D"/>');
  }
  return o.join("");
}

/* ---------- TEMEL donatı çizimi ---------- */
function drawRebarFound(f, d){
  var c = rebarFound(f, d), o = [];
  var aW = c.isPl ? d.W : c.a, bD = c.isPl ? d.D : c.b;
  var s = Math.min(330/Math.max(aW,0.5), 150/Math.max(c.h,0.2));
  var sp = Math.min(300/Math.max(aW,0.5), 200/Math.max(bD,0.5));
  var X0 = 150, Y0 = 120, W = aW*s, H = c.h*s;
  title2(o, 60, 44, "BEWEHRUNG · "+esc(f.name||"Fundament"),
    esc(foundLabel(f.kind))+" · "+fmt(aW,2)+" × "+fmt(bD,2)+" m · d = "+fmt(c.h*100,0)+" cm · σ = "+fmt(c.sig,0)+" kN/m²");
  /* kesit */
  o.push('<text x="60" y="88" font-family="ui-monospace,monospace" font-size="10" fill="#6E8BA6">SCHNITT</text>');
  o.push('<rect x="'+fmt2(X0)+'" y="'+fmt2(Y0)+'" width="'+fmt2(W)+'" height="'+fmt2(H)+'" fill="url(#hx)" stroke="#3FBF7F" stroke-width="1.6"/>');
  /* alt ağ */
  var yB = Y0 + H - 8;
  o.push('<path d="M'+fmt2(X0+8)+' '+fmt2(yB-14)+' L'+fmt2(X0+8)+' '+fmt2(yB)+' L'+fmt2(X0+W-8)+' '+fmt2(yB)+' L'+fmt2(X0+W-8)+' '+fmt2(yB-14)+
    '" fill="none" stroke="#E8A33D" stroke-width="2.2"/>');
  var nb2 = Math.min(18, Math.max(4, Math.round(W/22)));
  for (var i3=0;i3<nb2;i3++)
    o.push('<circle cx="'+fmt2(X0+10+(W-20)*i3/(nb2-1))+'" cy="'+fmt2(yB)+'" r="3" fill="#7FE0F5"/>');
  if (c.isPl){
    var yT = Y0 + 8;
    o.push('<line x1="'+fmt2(X0+8)+'" y1="'+fmt2(yT)+'" x2="'+fmt2(X0+W-8)+'" y2="'+fmt2(yT)+'" stroke="#E05C8A" stroke-width="2"/>');
  }
  /* zemin basıncı */
  for (var k3=0;k3<8;k3++){
    var px2 = X0 + 10 + (W-20)*k3/7;
    o.push('<line x1="'+fmt2(px2)+'" y1="'+fmt2(Y0+H+6)+'" x2="'+fmt2(px2)+'" y2="'+fmt2(Y0+H+22)+'" stroke="#6ECFA0" stroke-width="1"/>');
    o.push('<path d="M'+fmt2(px2)+' '+fmt2(Y0+H+6)+' L'+fmt2(px2-3)+' '+fmt2(Y0+H+12)+' L'+fmt2(px2+3)+' '+fmt2(Y0+H+12)+' Z" fill="#6ECFA0"/>');
  }
  o.push('<text x="'+fmt2(X0+W/2)+'" y="'+fmt2(Y0+H+34)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#6ECFA0">σ = '+fmt(c.sig,0)+' kN/m² ≤ σ_zul '+fmt(c.sigZul,0)+'</text>');
  var lbY = Y0 + 10;
  barLabel(o, X0+W+16, lbY, "alt ağ Ø"+c.bar.phi+"/"+fmt(c.bar.sp,1)+" ("+fmt(c.bar.as,2)+" cm²/m)", "#E8A33D");
  if (c.isPl) barLabel(o, X0+W+16, lbY+24, "üst ağ Ø"+c.bar.phi+"/"+fmt(c.bar.sp,1), "#E05C8A");
  barLabel(o, X0+W+16, lbY+(c.isPl?48:24), "≈ "+c.mesh[0], "#6ECFA0");
  dimLine(o, X0, Y0-18, X0+W, Y0-18, fmt(aW,2)+" m", "#9FD8EA");
  dimLine(o, X0-26, Y0, X0-26, Y0+H, fmt(c.h*100,0)+" cm", "#9FD8EA");

  /* plan */
  var PX = 150, PY = Y0+H+70, PW = aW*sp, PH = bD*sp;
  o.push('<text x="60" y="'+fmt2(PY-12)+'" font-family="ui-monospace,monospace" font-size="10" fill="#6E8BA6">GRUNDRISS</text>');
  o.push('<rect x="'+fmt2(PX)+'" y="'+fmt2(PY)+'" width="'+fmt2(PW)+'" height="'+fmt2(PH)+'" fill="#13263A" stroke="#3FBF7F" stroke-width="1.5"/>');
  var gx = Math.min(16, Math.max(3, Math.round(PW/20))), gy = Math.min(16, Math.max(3, Math.round(PH/20)));
  for (var a4=0;a4<gx;a4++)
    o.push('<line x1="'+fmt2(PX+8+(PW-16)*a4/(gx-1))+'" y1="'+fmt2(PY+6)+'" x2="'+fmt2(PX+8+(PW-16)*a4/(gx-1))+'" y2="'+fmt2(PY+PH-6)+'" stroke="#7FE0F5" stroke-width="1" opacity=".8"/>');
  for (var b4=0;b4<gy;b4++)
    o.push('<line x1="'+fmt2(PX+6)+'" y1="'+fmt2(PY+8+(PH-16)*b4/(gy-1))+'" x2="'+fmt2(PX+PW-6)+'" y2="'+fmt2(PY+8+(PH-16)*b4/(gy-1))+'" stroke="#E8A33D" stroke-width="1.2"/>');
  if (!c.isStrip && !c.isPl){
    o.push('<rect x="'+fmt2(PX+PW/2-13)+'" y="'+fmt2(PY+PH/2-13)+'" width="26" height="26" fill="none" stroke="#E8A33D" stroke-width="1.6" stroke-dasharray="5 3"/>');
  }
  dimLine(o, PX, PY+PH+28, PX+PW, PY+PH+28, fmt(aW,2)+" m", "#9FD8EA");
  return o.join("");
}

function donSvg(d){
  var sel = donSel();
  var body;
  if (!sel) body = '<text x="300" y="280" fill="#8CA3BC" font-size="14">Bu türde eleman yok</text>';
  else if (sel.list === "slabs")      body = drawRebarSlab(sel.row, d);
  else if (sel.list === "beams")      body = drawRebarBeam(sel.row, d);
  else if (sel.list === "columns")    body = drawRebarCol(sel.row, d);
  else if (sel.list === "shearwalls") body = drawRebarWall(sel.row, d);
  else                                body = drawRebarFound(sel.row, d);
  return '<svg viewBox="0 0 860 600" style="width:100%;height:100%;max-height:100%">'+SVGDEFS+body+'</svg>';
}

/* ---------- CSV ve yazdırma ---------- */
function stahlCSV(){
  var d = DERIVED || derive(), S = stahlListe(d);
  var sep = ";", nl = "\r\n";
  function q(x){ return '"'+String(x).replace(/"/g,'""')+'"'; }
  var L = [];
  L.push(q("TRAGWERK/PLAN — Stahlliste / Çelik listesi"));
  L.push(q("Projekt")+sep+q(P.meta.name || "Unbenannt")+sep+q(P.meta.ort||""));
  L.push(q("Betonstahl")+sep+q("B500B")+sep+q("Rev. "+(HPOS+1)));
  L.push("");
  L.push([q("Pos"),q("Bauteil"),q("Bemerkung"),q("d [mm]"),q("Anzahl"),q("Länge [m]"),q("Gesamt [m]"),q("Gewicht [kg]")].join(sep));
  S.rows.forEach(function(r){
    L.push([q(r.pos), q(r.bt), q(r.note), r.phi, r.n, fmt(r.len,2), fmt(r.tot,1), fmt(r.kg,1)].join(sep));
  });
  L.push("");
  S.phis.forEach(function(p){
    L.push([q(""),q("Σ Ø"+p),q(""),p,q(""),q(""),fmt(S.byPhi[p]/barKg(p),1),fmt(S.byPhi[p],1)].join(sep));
  });
  L.push([q(""),q("GESAMT"),q(""),q(""),q(""),q(""),q(""),fmt(S.tot,1)].join(sep));
  L.push([q(""),q("kg/m³ Beton"),q(""),q(""),q(""),q(""),q(""),fmt(S.kgPerM3,1)].join(sep));
  return "﻿" + L.join(nl);
}

/* ============================================================
   ÇÖZÜCÜ GÖRÜNÜMÜ — çerçeve, diyagramlar, reaksiyonlar
   ============================================================ */
function frameList(){
  var out = [];
  ["x","y"].forEach(function(dir){
    var lines = {};
    P.beams.forEach(function(b){ if ((b.dir||"x") === dir) lines[pnum(b.line,0)] = true; });
    Object.keys(lines).map(function(x){ return parseInt(x,10); }).sort(function(a,b){ return a-b; })
      .forEach(function(line){
        out.push({ dir:dir, line:line,
          ad: (dir === "x" ? ("Aks " + (line+1) + " · X çerçevesi") : ("Aks " + AX[line] + " · Y çerçevesi")) });
      });
  });
  return out;
}
function curFrame(){
  var L = frameList();
  if (!L.length) return null;
  var hit = null;
  L.forEach(function(f){ if (f.dir+"-"+f.line === UI.frSel) hit = f; });
  if (!hit){ hit = L[0]; UI.frSel = hit.dir+"-"+hit.line; }
  return hit;
}
function drawFrame(d){
  ensureSolver();
  var sel = curFrame();
  if (!sel) return '<text x="300" y="280" fill="#8CA3BC" font-size="14">Önce kiriş tanımla — çerçeve kirişlerden kurulur</text>';
  var R = frameSolve(sel.dir, sel.line, d);
  if (!R || R.fail) return '<text x="260" y="280" fill="#E4595F" font-size="14">Bu çerçeve çözülemedi — mesnet eksik (mekanizma)</text>';
  var fr = R.fr, o = [];
  var xs = fr.pos, zs = fr.lev;
  var W = xs[xs.length-1] - xs[0], H = zs[zs.length-1];
  if (W <= 0 || H <= 0) return '<text x="300" y="280" fill="#8CA3BC" font-size="14">Geometri yok</text>';
  var mode = UI.frMode || "M";
  var s = Math.min(330/W, 250/H);
  var X0 = 150, Y0 = 132 + H*s;
  function X(v){ return X0 + (v - xs[0])*s; }
  function Z(v){ return Y0 - v*s; }

  /* --- sistem --- */
  fr.members.forEach(function(m, mi){
    var ni = fr.nodes[m.i], nj = fr.nodes[m.j];
    var col = m.kind === "beam" ? "#A99AE8" : (m.kind === "wall" ? "#E05C8A" : "#E8A33D");
    o.push('<line x1="'+fmt2(X(ni.x))+'" y1="'+fmt2(Z(ni.z))+'" x2="'+fmt2(X(nj.x))+'" y2="'+fmt2(Z(nj.z))+
      '" stroke="'+col+'" stroke-width="'+(m.kind==="beam"?3:3.5)+'" stroke-linecap="round"/>');
  });
  /* düğümler */
  var shown = {};
  fr.members.forEach(function(m){
    [m.i, m.j].forEach(function(nd){
      if (shown[nd]) return; shown[nd] = 1;
      var nn = fr.nodes[nd];
      o.push('<circle cx="'+fmt2(X(nn.x))+'" cy="'+fmt2(Z(nn.z))+'" r="3" fill="#0A1220" stroke="#8CA3BC" stroke-width="1.2"/>');
    });
  });
  /* mesnetler */
  for (var nd0 in fr.supports){
    var sp = fr.supports[nd0], nn0 = fr.nodes[nd0];
    var px = X(nn0.x), pz = Z(nn0.z);
    if (sp.ry) o.push('<rect x="'+fmt2(px-11)+'" y="'+fmt2(pz)+'" width="22" height="7" fill="#6ECFA0"/>');
    else if (sp.ux) o.push('<path d="M'+fmt2(px)+' '+fmt2(pz)+' L'+fmt2(px-8)+' '+fmt2(pz+13)+' L'+fmt2(px+8)+' '+fmt2(pz+13)+' Z" fill="#6ECFA0"/>');
    else o.push('<path d="M'+fmt2(px)+' '+fmt2(pz)+' L'+fmt2(px-7)+' '+fmt2(pz+11)+' L'+fmt2(px+7)+' '+fmt2(pz+11)+' Z" fill="none" stroke="#6ECFA0" stroke-width="1.4"/>');
    for (var h2=0;h2<4;h2++)
      o.push('<line x1="'+fmt2(px-11+h2*7)+'" y1="'+fmt2(pz+(sp.ry?7:13))+'" x2="'+fmt2(px-16+h2*7)+'" y2="'+fmt2(pz+(sp.ry?14:20))+'" stroke="#6ECFA0" stroke-width="1"/>');
  }
  /* --- diyagram --- */
  var vmax = 0;
  R.env.forEach(function(e){
    if (!e.pts) return;
    e.pts.forEach(function(p){ vmax = Math.max(vmax, Math.abs(mode==="M"?p.M:(mode==="V"?p.V:p.N))); });
  });
  if (vmax < 1e-6) vmax = 1;
  var amp = 46 / vmax;
  var dcol = mode === "M" ? "#7FE0F5" : (mode === "V" ? "#E8A33D" : "#6ECFA0");
  var lblDone = {};        /* aynı düğümü iki kez etiketleme */
  R.env.forEach(function(e, mi){
    var m = fr.members[mi];
    if (!e.pts) return;
    var ni = fr.nodes[m.i], nj = fr.nodes[m.j];
    var dx = nj.x - ni.x, dz = nj.z - ni.z, len = Math.sqrt(dx*dx+dz*dz);
    if (len < 1e-9) return;
    var ux = dx/len, uz = dz/len, nx = -uz, nz = ux;          /* dik birim */
    var path = [], back = [];
    e.pts.forEach(function(p){
      var v = (mode==="M" ? -p.M : (mode==="V" ? p.V : p.N)) * amp;
      var bx = ni.x + ux*p.x, bz = ni.z + uz*p.x;
      path.push(fmt2(X(bx + nx*v/s))+","+fmt2(Z(bz + nz*v/s)));
      back.push(fmt2(X(bx))+","+fmt2(Z(bz)));
    });
    back.reverse();
    o.push('<polygon points="'+path.concat(back).join(" ")+'" fill="'+dcol+'" fill-opacity=".18" stroke="'+dcol+'" stroke-width="1.3"/>');
    /* uç ve en büyük değerler */
    function lbl(p, align){
      var v = (mode==="M" ? -p.M : (mode==="V" ? p.V : p.N)) * amp;
      var bx = ni.x + ux*p.x, bz = ni.z + uz*p.x;
      var tv = (mode==="M" ? p.M : (mode==="V" ? p.V : p.N));
      if (Math.abs(tv) < vmax * (m.kind === "beam" ? 0.22 : 0.55)) return;
      /* düğümde iki eleman aynı noktayı etiketlemesin */
      var kx = Math.round((bx + nx*v/s)*20) + "_" + Math.round((bz + nz*v/s)*20);
      if (lblDone[kx]) return;
      lblDone[kx] = 1;
      var shift = (align === "start") ? 4 : (align === "end" ? -4 : 0);
      o.push('<text x="'+fmt2(X(bx + nx*v/s) + shift)+'" y="'+fmt2(Z(bz + nz*v/s) + (v>0?-3:10))+
        '" text-anchor="'+(align||"middle")+'" font-family="ui-monospace,monospace" font-size="8.5" fill="'+dcol+'">'+fmt(tv,0)+'</text>');
    }
    if (m.kind === "beam"){
      lbl(e.pts[0], "start"); lbl(e.pts[e.pts.length-1], "end");
      var mx = e.pts[0], best = 0;
      e.pts.forEach(function(p,ii){ var v2 = Math.abs(mode==="M"?p.M:(mode==="V"?p.V:p.N));
        if (ii>0 && ii<e.pts.length-1 && v2 > best){ best = v2; mx = p; } });
      lbl(mx);
    } else {
      /* düşey elemanda yalnız en büyük uç — kalabalık olmasın */
      var p0 = e.pts[0], p1 = e.pts[e.pts.length-1];
      var v0 = Math.abs(mode==="M"?p0.M:(mode==="V"?p0.V:p0.N));
      var v1 = Math.abs(mode==="M"?p1.M:(mode==="V"?p1.V:p1.N));
      lbl(v0 >= v1 ? p0 : p1, "middle");
    }
  });
  /* --- aks ve kot etiketleri --- */
  xs.forEach(function(v, i){
    o.push('<text x="'+fmt2(X(v))+'" y="'+fmt2(Y0+42)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#9FD8EA">'+
      (sel.dir === "x" ? AX[i] : String(i+1))+'</text>');
  });
  zs.forEach(function(v, i){
    if (i === 0) return;
    o.push('<text x="'+fmt2(X0-24)+'" y="'+fmt2(Z(v)+4)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="9.5" fill="#6E8BA6">+'+fmt(v,2)+'</text>');
  });
  var unit = mode === "M" ? "kNm" : "kN";
  o.push('<text x="60" y="40" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#C8D8E8">'+
    esc(sel.ad)+'</text>');
  o.push('<text x="60" y="55" font-family="ui-monospace,monospace" font-size="9.5" fill="#6E8BA6">'+
    (mode==="M"?"Moment M":(mode==="V"?"Kesme V":"Normal kuvvet N"))+' · zarf · max '+fmt(vmax,1)+' '+unit+
    ' · '+(P.solver.base==="einspann"?"ankastre taban":"mafsallı taban")+(P.solver.wind!==false?" · rüzgâr dahil":"")+'</text>');
  return o.join("");
}

/* ============================================================
   DXF DIŞA AKTARMA — AutoCAD R12 (AC1009), katmanlı, 1 birim = 1 m
   Üretilen SVG çizimi ayrıştırılır; line / rect / circle / polyline /
   polygon / path (M L Z A Q) / text desteklenir.
   ============================================================ */
var DXFLAYERS = [
  ["AKS",       "#2E4A63", 8],  ["AKS",       "#4E7492", 8],  ["AKS",       "#9FD8EA", 4],
  ["DUVAR",     "#3FB6D3", 4],  ["DUVAR",     "#5E7C96", 8],  ["DUVAR",     "#355A79", 8],
  ["KOLON",     "#E8A33D", 2],  ["KOLON",     "#E9C286", 2],  ["KOLON",     "#B8903F", 2],
  ["KIRIS",     "#A99AE8", 6],  ["KIRIS",     "#7C6BD6", 6],  ["KIRIS",     "#C4B8F5", 6],
  ["PERDE",     "#E05C8A", 1],  ["PERDE",     "#F2A0BC", 1],
  ["PARAPET",   "#6ECFA0", 3],  ["PARAPET",   "#9FE8C4", 3],
  ["TEMEL",     "#3FBF7F", 3],
  ["DOSEME",    "#17293A", 5],  ["DOSEME",    "#13263A", 5],
  ["BOSLUK",    "#E4595F", 1],
  ["KAPI_PENCERE", "#7FE0F5", 4],  ["KAPI_PENCERE", "#6FD3E8", 4],
  ["MERDIVEN",  "#7C6BD6", 6],
  ["MOBILYA",   "#C8D8E8", 9],
  ["DONATI",    "#E8A33D", 2],
  ["OLCU",      "#6ECFA0", 3],
  ["YAZI",      "#C8D8E8", 7],  ["YAZI",      "#6E8BA6", 8],  ["YAZI",      "#8CA3BC", 8]
];
function dxfLayerOf(col){
  if (!col) return ["GENEL", 7];
  var c = String(col).toLowerCase();
  for (var i=0;i<DXFLAYERS.length;i++) if (DXFLAYERS[i][1].toLowerCase() === c) return [DXFLAYERS[i][0], DXFLAYERS[i][2]];
  return ["GENEL", 7];
}
function dxfLayerNames(){
  var seen = {}, out = [];
  DXFLAYERS.forEach(function(l){ if (!seen[l[0]]){ seen[l[0]] = l[2]; out.push([l[0], l[2]]); } });
  out.push(["GENEL", 7]);
  return out;
}
function DxfDoc(){
  this.ent = [];
  this.used = {};
}
DxfDoc.prototype.g = function(code, val){ this.ent.push(String(code)); this.ent.push(String(val)); };
DxfDoc.prototype.use = function(l){ this.used[l] = true; };
DxfDoc.prototype.line = function(l, x1, y1, x2, y2){
  if (!isFinite(x1) || !isFinite(y1) || !isFinite(x2) || !isFinite(y2)) return;
  this.use(l);
  this.g(0,"LINE"); this.g(8,l);
  this.g(10, x1.toFixed(4)); this.g(20, y1.toFixed(4)); this.g(30,"0.0");
  this.g(11, x2.toFixed(4)); this.g(21, y2.toFixed(4)); this.g(31,"0.0");
};
DxfDoc.prototype.circle = function(l, cx, cy, r){
  if (!isFinite(cx) || !isFinite(cy) || !(r > 0)) return;
  this.use(l);
  this.g(0,"CIRCLE"); this.g(8,l);
  this.g(10, cx.toFixed(4)); this.g(20, cy.toFixed(4)); this.g(30,"0.0"); this.g(40, r.toFixed(4));
};
DxfDoc.prototype.poly = function(l, pts, close){
  for (var i=0;i<pts.length-1;i++) this.line(l, pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1]);
  if (close && pts.length > 2) this.line(l, pts[pts.length-1][0], pts[pts.length-1][1], pts[0][0], pts[0][1]);
};
DxfDoc.prototype.text = function(l, x, y, h, txt, rot, halign){
  if (!isFinite(x) || !isFinite(y) || !(h > 0) || !txt) return;
  this.use(l);
  this.g(0,"TEXT"); this.g(8,l);
  this.g(10, x.toFixed(4)); this.g(20, y.toFixed(4)); this.g(30,"0.0");
  this.g(40, h.toFixed(4));
  this.g(1, String(txt).replace(/\s+/g," ").slice(0,240));
  this.g(50, (rot || 0).toFixed(2));
  if (halign){
    this.g(72, halign);
    this.g(11, x.toFixed(4)); this.g(21, y.toFixed(4)); this.g(31,"0.0");
  }
};
DxfDoc.prototype.build = function(){
  var L = dxfLayerNames().filter(function(x){ return true; });
  var out = [];
  function g(c,v){ out.push(String(c)); out.push(String(v)); }
  g(0,"SECTION"); g(2,"HEADER");
  g(9,"$ACADVER"); g(1,"AC1009");
  g(9,"$INSUNITS"); g(70,"6");            /* 6 = metre */
  g(0,"ENDSEC");
  g(0,"SECTION"); g(2,"TABLES");
  g(0,"TABLE"); g(2,"LAYER"); g(70, L.length);
  L.forEach(function(ly){
    g(0,"LAYER"); g(2,ly[0]); g(70,"0"); g(62,ly[1]); g(6,"CONTINUOUS");
  });
  g(0,"ENDTAB"); g(0,"ENDSEC");
  g(0,"SECTION"); g(2,"ENTITIES");
  out = out.concat(this.ent);
  g(0,"ENDSEC"); g(0,"EOF");
  return out.join("\r\n") + "\r\n";
};

/* --- yay ve eğri örnekleme --- */
function arcPoints(x0, y0, rx, ry, rot, laf, sf, x1, y1, n){
  /* SVG eliptik yay → nokta dizisi (merkez parametreleştirmesi) */
  n = n || 16;
  if (rx === 0 || ry === 0) return [[x1,y1]];
  var phi = rot * Math.PI/180, cp = Math.cos(phi), sp = Math.sin(phi);
  var dx2 = (x0-x1)/2, dy2 = (y0-y1)/2;
  var x1p = cp*dx2 + sp*dy2, y1p = -sp*dx2 + cp*dy2;
  rx = Math.abs(rx); ry = Math.abs(ry);
  var lam = x1p*x1p/(rx*rx) + y1p*y1p/(ry*ry);
  if (lam > 1){ var sq = Math.sqrt(lam); rx *= sq; ry *= sq; }
  var num = rx*rx*ry*ry - rx*rx*y1p*y1p - ry*ry*x1p*x1p;
  var den = rx*rx*y1p*y1p + ry*ry*x1p*x1p;
  var co = Math.sqrt(Math.max(0, num/den));
  if (laf === sf) co = -co;
  var cxp = co*rx*y1p/ry, cyp = -co*ry*x1p/rx;
  var cx = cp*cxp - sp*cyp + (x0+x1)/2, cy = sp*cxp + cp*cyp + (y0+y1)/2;
  function ang(ux,uy,vx,vy){
    var d0 = Math.sqrt(ux*ux+uy*uy)*Math.sqrt(vx*vx+vy*vy);
    var c0 = Math.max(-1, Math.min(1, (ux*vx+uy*vy)/d0));
    var a0 = Math.acos(c0);
    return (ux*vy - uy*vx < 0) ? -a0 : a0;
  }
  var th1 = ang(1,0,(x1p-cxp)/rx,(y1p-cyp)/ry);
  var dth = ang((x1p-cxp)/rx,(y1p-cyp)/ry,(-x1p-cxp)/rx,(-y1p-cyp)/ry);
  if (!sf && dth > 0) dth -= 2*Math.PI;
  if (sf && dth < 0) dth += 2*Math.PI;
  var pts = [];
  for (var i=1;i<=n;i++){
    var t = th1 + dth*i/n;
    pts.push([cp*rx*Math.cos(t) - sp*ry*Math.sin(t) + cx,
              sp*rx*Math.cos(t) + cp*ry*Math.sin(t) + cy]);
  }
  return pts;
}
function parsePathD(dstr){
  /* M L H V Z A Q C → çizgi parçaları (dizi dizisi) */
  var toks = String(dstr).match(/[a-zA-Z]|-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || [];
  var i = 0, cur = [0,0], start = [0,0], cmd = "", runs = [], run = [];
  function num(){ return parseFloat(toks[i++]); }
  while (i < toks.length){
    var t = toks[i];
    if (/[a-zA-Z]/.test(t)){ cmd = t; i++; }
    if (cmd === "M" || cmd === "m"){
      var x = num(), y = num();
      if (cmd === "m"){ x += cur[0]; y += cur[1]; }
      if (run.length > 1) runs.push(run);
      run = [[x,y]]; cur = [x,y]; start = [x,y];
      cmd = (cmd === "M") ? "L" : "l";
    } else if (cmd === "L" || cmd === "l"){
      var x2 = num(), y2 = num();
      if (cmd === "l"){ x2 += cur[0]; y2 += cur[1]; }
      run.push([x2,y2]); cur = [x2,y2];
    } else if (cmd === "H" || cmd === "h"){
      var x3 = num(); if (cmd === "h") x3 += cur[0];
      run.push([x3,cur[1]]); cur = [x3,cur[1]];
    } else if (cmd === "V" || cmd === "v"){
      var y3 = num(); if (cmd === "v") y3 += cur[1];
      run.push([cur[0],y3]); cur = [cur[0],y3];
    } else if (cmd === "A" || cmd === "a"){
      var rx = num(), ry = num(), ro = num(), laf = num(), sf = num(), ax = num(), ay = num();
      if (cmd === "a"){ ax += cur[0]; ay += cur[1]; }
      arcPoints(cur[0], cur[1], rx, ry, ro, laf, sf, ax, ay, 18).forEach(function(p){ run.push(p); });
      cur = [ax,ay];
    } else if (cmd === "Q" || cmd === "q"){
      var qx = num(), qy = num(), ex = num(), ey = num();
      if (cmd === "q"){ qx += cur[0]; qy += cur[1]; ex += cur[0]; ey += cur[1]; }
      for (var k=1;k<=10;k++){
        var tt = k/10, mt = 1-tt;
        run.push([mt*mt*cur[0] + 2*mt*tt*qx + tt*tt*ex, mt*mt*cur[1] + 2*mt*tt*qy + tt*tt*ey]);
      }
      cur = [ex,ey];
    } else if (cmd === "C" || cmd === "c"){
      var c1x=num(), c1y=num(), c2x=num(), c2y=num(), e2x=num(), e2y=num();
      if (cmd === "c"){ c1x+=cur[0];c1y+=cur[1];c2x+=cur[0];c2y+=cur[1];e2x+=cur[0];e2y+=cur[1]; }
      for (var k2=1;k2<=12;k2++){
        var t2 = k2/12, m2 = 1-t2;
        run.push([m2*m2*m2*cur[0]+3*m2*m2*t2*c1x+3*m2*t2*t2*c2x+t2*t2*t2*e2x,
                  m2*m2*m2*cur[1]+3*m2*m2*t2*c1y+3*m2*t2*t2*c2y+t2*t2*t2*e2y]);
      }
      cur = [e2x,e2y];
    } else if (cmd === "Z" || cmd === "z"){
      run.push([start[0],start[1]]); cur = [start[0],start[1]]; i++;
    } else { i++; }
  }
  if (run.length > 1) runs.push(run);
  return runs;
}

/* --- SVG → DXF --- */
function svgToDxf(svgStr, tr){
  /* tr: { s: px başına metre ölçeği, X0, Y0 }  → X = (x-X0)/s , Y = (Y0-y)/s */
  var doc = new DxfDoc();
  var s = tr.s, X0 = tr.X0, Y0 = tr.Y0;
  function MX(x){ return (x - X0)/s; }
  function MY(y){ return (Y0 - y)/s; }
  var dp = new DOMParser();
  var wrapped = (svgStr.indexOf("<svg") === 0) ? svgStr :
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600">'+svgStr+'</svg>';
  var dom = dp.parseFromString(wrapped, "image/svg+xml");
  var root = dom.documentElement;
  if (!root || root.nodeName === "parsererror") return doc;
  function colOf(el){
    var st = el.getAttribute("stroke");
    if ((!st || st === "none") && el.getAttribute("style")){
      var m = /stroke\s*:\s*([^;]+)/.exec(el.getAttribute("style"));
      if (m) st = m[1].trim();
    }
    if (!st || st === "none"){
      st = el.getAttribute("fill");
      if ((!st || st === "none") && el.getAttribute("style")){
        var m2 = /fill\s*:\s*([^;]+)/.exec(el.getAttribute("style"));
        if (m2) st = m2[1].trim();
      }
    }
    if (st && st.indexOf("url(") === 0) st = el.getAttribute("stroke") || "#8CA3BC";
    return st;
  }
  function rotOf(el){
    var t = el.getAttribute("transform");
    if (!t) return null;
    var m = /rotate\(\s*(-?[\d.]+)[ ,]+(-?[\d.]+)[ ,]+(-?[\d.]+)\s*\)/.exec(t);
    if (m) return { a:parseFloat(m[1]), cx:parseFloat(m[2]), cy:parseFloat(m[3]) };
    var m2 = /rotate\(\s*(-?[\d.]+)\s*\)/.exec(t);
    if (m2) return { a:parseFloat(m2[1]), cx:0, cy:0 };
    return null;
  }
  function applyRot(p, r){
    if (!r) return p;
    var a = r.a*Math.PI/180, c = Math.cos(a), sn = Math.sin(a);
    var dx = p[0]-r.cx, dy = p[1]-r.cy;
    return [r.cx + dx*c - dy*sn, r.cy + dx*sn + dy*c];
  }
  function walk(el){
    var nm = el.nodeName;
    var lay = dxfLayerOf(colOf(el))[0];
    var rot = rotOf(el);
    function P(x,y){ var q = applyRot([x,y], rot); return [MX(q[0]), MY(q[1])]; }
    if (nm === "line"){
      var a = P(+el.getAttribute("x1"), +el.getAttribute("y1"));
      var b2 = P(+el.getAttribute("x2"), +el.getAttribute("y2"));
      doc.line(lay, a[0], a[1], b2[0], b2[1]);
    } else if (nm === "rect"){
      var x = +el.getAttribute("x"), y = +el.getAttribute("y");
      var w = +el.getAttribute("width"), h = +el.getAttribute("height");
      if (isFinite(x) && isFinite(y) && w > 0 && h > 0)
        doc.poly(lay, [P(x,y), P(x+w,y), P(x+w,y+h), P(x,y+h)], true);
    } else if (nm === "circle"){
      var cx = +el.getAttribute("cx"), cy = +el.getAttribute("cy"), r = +el.getAttribute("r");
      var c0 = P(cx,cy);
      doc.circle(lay, c0[0], c0[1], r/s);
    } else if (nm === "ellipse"){
      var ex = +el.getAttribute("cx"), ey = +el.getAttribute("cy");
      var rx = +el.getAttribute("rx"), ry = +el.getAttribute("ry");
      var pts = [];
      for (var i=0;i<=24;i++){ var t = i/24*2*Math.PI;
        pts.push(P(ex + rx*Math.cos(t), ey + ry*Math.sin(t))); }
      doc.poly(lay, pts, false);
    } else if (nm === "polygon" || nm === "polyline"){
      var raw = (el.getAttribute("points")||"").trim().split(/[\s,]+/).map(parseFloat);
      var pp = [];
      for (var k=0;k+1<raw.length;k+=2) pp.push(P(raw[k], raw[k+1]));
      if (pp.length > 1) doc.poly(lay, pp, nm === "polygon");
    } else if (nm === "path"){
      parsePathD(el.getAttribute("d")||"").forEach(function(run){
        doc.poly(lay, run.map(function(p){ return P(p[0], p[1]); }), false);
      });
    } else if (nm === "text"){
      var tx = +el.getAttribute("x"), ty = +el.getAttribute("y");
      var fs = parseFloat(el.getAttribute("font-size") || "10");
      var an = el.getAttribute("text-anchor");
      var ha = (an === "middle") ? 1 : (an === "end" ? 2 : 0);
      var txt = (el.textContent||"").trim();
      var p0 = P(tx, ty);
      var lay2 = dxfLayerOf(el.getAttribute("fill"))[0];
      if (lay2 === "GENEL") lay2 = "YAZI";
      doc.text(lay2, p0[0], p0[1], fs/s*0.85, txt, rot ? -rot.a : 0, ha);
    }
    for (var c = el.firstChild; c; c = c.nextSibling)
      if (c.nodeType === 1 && c.nodeName !== "defs") walk(c);
  }
  for (var c0 = root.firstChild; c0; c0 = c0.nextSibling)
    if (c0.nodeType === 1 && c0.nodeName !== "defs") walk(c0);
  return doc;
}

var HOLCACHE = {};
function easterSun(y){
  var a = y % 19, b = Math.floor(y/100), c = y % 100;
  var d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  var g = Math.floor((b-f+1)/3), h = (19*a + b - d - g + 15) % 30;
  var i = Math.floor(c/4), k = c % 4;
  var l = (32 + 2*e + 2*i - h - k) % 7;
  var m = Math.floor((a + 11*h + 22*l)/451);
  var mo = Math.floor((h + l - 7*m + 114)/31);
  var dy = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(y, mo-1, dy);
}
function holidays(y){
  if (HOLCACHE[y]) return HOLCACHE[y];
  var H = {};
  function put(d0, ad){ H[d0.getFullYear()+"-"+d0.getMonth()+"-"+d0.getDate()] = ad; }
  function off(base, n){ var t = new Date(base.getTime()); t.setDate(t.getDate()+n); return t; }
  put(new Date(y,0,1),   "Neujahr");
  put(new Date(y,0,6),   "Heilige Drei Könige");      /* BW */
  put(new Date(y,4,1),   "Tag der Arbeit");
  put(new Date(y,9,3),   "Tag der Deutschen Einheit");
  put(new Date(y,10,1),  "Allerheiligen");            /* BW */
  put(new Date(y,11,25), "1. Weihnachtstag");
  put(new Date(y,11,26), "2. Weihnachtstag");
  var os = easterSun(y);
  put(off(os,-2), "Karfreitag");
  put(off(os, 1), "Ostermontag");
  put(off(os,39), "Christi Himmelfahrt");
  put(off(os,50), "Pfingstmontag");
  put(off(os,60), "Fronleichnam");                    /* BW */
  HOLCACHE[y] = H;
  return H;
}
function holName(d0){
  if (!P.schedule || P.schedule.feier === false) return null;

function wdDate(startISO, wd){
  var d0 = new Date(startISO + "T12:00:00");
  if (isNaN(d0.getTime())) d0 = new Date();
  var guard = 0;
  while (!isWorkDay(d0) && guard++ < 40) d0.setDate(d0.getDate()+1);
  var n = 0;
  while (n < wd){
    d0.setDate(d0.getDate()+1);
    if (isWorkDay(d0)) n++;
  }
  return d0;
}
/* iki iş günü arasındaki tatil günleri — bilgi kutusu için */
function holsBetween(startISO, wdA, wdB){
  var a = wdDate(startISO, wdA), b = wdDate(startISO, Math.max(wdA, wdB));
  var t = new Date(a.getTime()), out = [], guard = 0;
  while (t <= b && guard++ < 2000){
    var nm = holName(t);
    if (nm && t.getDay() !== 0 && t.getDay() !== 6) out.push({ d:new Date(t.getTime()), ad:nm });
    t.setDate(t.getDate()+1);
  }

}

function kwOf(d0){

/* CPM — erken/geç başlangıç, bolluk, kritik yol */
function schedCPM(T){
  var byId = {};
  T.forEach(function(t){ byId[t.id] = t; t.ES = 0; t.EF = 0; t.LS = 0; t.LF = 0; t.slack = 0; t.crit = false; });
  /* topolojik sıra — basit tekrar */
  for (var pass=0; pass<T.length+2; pass++){
    var changed = false;
    T.forEach(function(t){
      var es = 0;
      t.pred.forEach(function(p){ var q = byId[p]; if (q) es = Math.max(es, q.EF); });
      if (es !== t.ES){ t.ES = es; changed = true; }
      var ef = t.ES + t.dur;
      if (ef !== t.EF){ t.EF = ef; changed = true; }
    });
    if (!changed) break;
  }
  var end = 0;
  T.forEach(function(t){ end = Math.max(end, t.EF); });
  T.forEach(function(t){ t.LF = end; });
  for (var p2=0; p2<T.length+2; p2++){
    var ch2 = false;
    T.forEach(function(t){
      t.pred.forEach(function(pid){
        var q = byId[pid]; if (!q) return;
        var lf = t.LF - t.dur;
        if (lf < q.LF){ q.LF = lf; ch2 = true; }
      });
    });
    if (!ch2) break;
  }
  T.forEach(function(t){
    t.LS = t.LF - t.dur;
    t.slack = t.LS - t.ES;
    t.crit = Math.abs(t.slack) < 0.5;
  });
  return { tasks:T, end:end, byId:byId };
}
function schedule(d){
  ensureSched();
  var T = schedTasks(d);
  var R = schedCPM(T);
  var S = P.schedule;
  R.start = wdDate(S.start, 0);
  R.finish = wdDate(S.start, Math.max(0, R.end - 1));
  /* takvim haftası — tatiller nedeniyle iş günü/5'ten uzun olabilir */
  R.weeks = Math.max(1, Math.ceil(((R.finish - R.start) / 86400000 + 1) / 7));
  R.hours = 0; R.crit = 0;
  T.forEach(function(t){ R.hours += t.hours || 0; if (t.crit) R.crit++; });
  return R;
}

    case "proje":     html = viewProje(); break;

function render(){

  catch(e){
    LASTERR = e;
    var where = UI.view + (UI.view==="mimari" ? " › "+UI.tool : UI.view==="statik" ? " › "+UI.stool : "");

function selfTest(){
  var out = [], okN = 0, badN = 0;
  var saveP = JSON.parse(JSON.stringify(P));
  var saveUI = JSON.parse(JSON.stringify({ view:UI.view, tool:UI.tool, stool:UI.stool, rpos:UI.rpos,
    kat:UI.kat, katMode:UI.katMode, selSet:UI.selSet, sel:UI.sel, selSurf:UI.selSurf,
    stairType:UI.stairType, foundType:UI.foundType, balkType:UI.balkType,
    ktool:UI.ktool, schTool:UI.schTool, schKat:UI.schKat, dTool:UI.dTool, dSel:UI.dSel,
    tTool:UI.tTool }));
  function run(ad, fn){
    try {
      var h = fn();
      if (typeof h === "string" && h.length < 30) throw new Error("boş çıktı ("+h.length+" karakter)");
      if (h === undefined || h === null) throw new Error("sonuç yok");
      out.push({ ad:ad, ok:true }); okN++;
    } catch(e){
      out.push({ ad:ad, ok:false, msg:(e && e.message) ? e.message : String(e) }); badN++;
    }
  }
  function views(pre, withTools){
    run(pre+"Proje", function(){ return viewProje(); });
    if (withTools) MTOOLS.forEach(function(t){ UI.tool = t[0]; run(pre+"Mimari › "+t[1], function(){ return viewMimari(derive()); }); });
    else run(pre+"Mimari", function(){ return viewMimari(derive()); });
    run(pre+"Çiz", function(){ return viewCiz(derive()); });
    STOOLS.forEach(function(t){ UI.stool = t[0]; run(pre+"Statik › "+t[1], function(){ return viewStatik(derive()); }); });
    run(pre+"3D", function(){ return view3D(derive()); });
    KTOOLS.forEach(function(t){ UI.ktool = t[0]; run(pre+"Metraj › "+t[1], function(){ return viewMetraj(derive()); }); });
    SCHTOOLS.forEach(function(t){ UI.schTool = t[0];
      for (var kk=0; kk<P.storeys.length; kk++){ UI.schKat = kk;
        run(pre+"Kalıp › "+t[1]+" · "+katName(kk), function(){ return viewSchal(derive()); }); } });
    DTOOLS.forEach(function(t){ UI.dTool = t[0]; UI.dSel = null;
      run(pre+"Donatı › "+t[1], function(){ return viewDonati(derive()); });
      var els0 = donElements();
      els0.slice(0,3).forEach(function(e){ UI.dSel = e.row.id;
        run(pre+"Donatı › "+t[1]+" · "+(e.row.name||e.nr), function(){ return viewDonati(derive()); }); });
      UI.dSel = null; });
    RPOS.forEach(function(r){ UI.rpos = r[0]; run(pre+"Rapor › "+r[0]+" "+r[1], function(){ return viewRapor(derive()); }); });
  }

  try {
    /* --- 1) DOLU model: balkon, yırtık, merdiven, her tip temel, serbest geometri --- */
    P = buildFixture(); ensureFinishes(); ensureMat(); ensureDrain(); ensureFurn(); ensureLines(); ensureDoorKind(); ensureSeismic(); ensureKat(); ensureShear();
    UI.katMode = "tum"; UI.selSet = []; UI.sel = null;
    views("Dolu model · ", true);

    /* --- 2) kat süzgeci açıkken her kat --- */
    UI.katMode = "bu";
    for (var k=0; k<P.storeys.length; k++){
      UI.kat = k; UI.tool = "duvar";
      run("Kat süzgeci · "+katName(k)+" › Mimari", function(){ return viewMimari(derive()); });
      run("Kat süzgeci · "+katName(k)+" › Çiz", function(){ return viewCiz(derive()); });
      run("Kat süzgeci · "+katName(k)+" › 3D", function(){ return view3D(derive()); });
    }
    UI.katMode = "tum"; UI.kat = 0;

    /* --- 3) çatı tipleri --- */
    ROOFTYPES.forEach(function(t){
      P.roof.type = t[0]; P.roof.on = true;
      ["x","y"].forEach(function(rd){
        P.roof.ridge = rd;
        UI.tool = "cati";
        run("Çatı · "+t[1]+" ("+rd+")", function(){ return viewMimari(derive()) + view3D(derive()); });
      });
    });
    P.roof.on = false; UI.tool = "cati";
    run("Çatı · kapalı", function(){ return viewMimari(derive()) + view3D(derive()); });
    P.roof.on = true; P.roof.type = "sattel"; P.roof.ridge = "x";

    /* --- 4) merdiven tipleri --- */
    STAIRTYPES.forEach(function(t){
      P.stairs[0].type = t[0]; UI.tool = "merdiven";
      run("Merdiven · "+t[1], function(){ return viewMimari(derive()) + view3D(derive()); });
    });

    /* --- 5) balkon tipleri, dört yön --- */
    BALKTYPES.forEach(function(t){
      P.balconies.forEach(function(b){ b.type = t[0]; });
      UI.tool = "balkon";
      run("Balkon · "+t[1]+" (4 yön)", function(){ return viewMimari(derive()) + view3D(derive()); });
    });

    /* --- 6) temel tipleri --- */
    FOUNDTYPES.forEach(function(t){
      P.foundations.forEach(function(ff){ if (ff.kind!=="streifen" && ff.kind!=="platte") ff.kind = t[0]; });
      UI.stool = "temel";
      run("Temel · "+t[1], function(){ return viewStatik(derive()) + view3D(derive()); });
    });

    /* --- 7) drenaj / yalıtım birleşimleri --- */
    UI.stool = "drenaj";
    WCLASSES.forEach(function(w){
      DRAINSEALS.forEach(function(s){
        P.drain.wclass = w[0]; P.drain.seal = s[0];
        run("Drenaj · "+w[0]+" + "+s[1], function(){ return viewStatik(derive()); });
      });
    });
    [true,false].forEach(function(kel){

      run("Drenaj · "+(kel?"bodrumlu":"bodrumsuz")+(kel?"":" · drenajsız"), function(){ return viewStatik(derive()); });
    });
    P.drain = defaultDrain();

    /* --- 8) 3D renk modları ve katmanlar --- */
    ["mat","tip","ince"].forEach(function(cm){
      UI.v3d.color = cm;
      run("3D · renk "+cm, function(){ return view3D(derive()); });
    });
    UI.v3d.color = "mat";

    /* --- 9) ince işler yüzeyleri --- */

    (P.finishes ? P.finishes.surfaces : []).forEach(function(sf){
      UI.selSurf = sf.id;
      run("İnce işler › "+sf.name, function(){ return viewMimari(derive()); });
    });
    UI.tool = "aks"; UI.selSurf = null;

    /* --- mobilya kütüphanesi: her kategori + her sembol --- */
    FURNCATS.forEach(function(c){
      UI.tool = "mobilya"; UI.furnCat = c[0]; UI.furnSel = (FURNLIB[c[0]][0]||[])[0];
      run("Kütüphane › "+c[1], function(){ return viewMimari(derive()); });
    });
    UI.furnQ = "lavabo";
    run("Kütüphane › arama", function(){ return viewMimari(derive()); });
    UI.furnQ = "";
    /* çizgi aracı + kenetleme */
    (function(){
      try {
        UI.view = "ciz"; UI.lineMode = true;
        var okAll = true, msg = "";
        LPATH = null;
        lineStart({ x:1, y:1, type:null });
        lineAddPoint({ x:4, y:1, type:null });
        lineAddPoint({ x:4, y:3, type:null });
        if (P.lines.length < 2){ okAll = false; msg = "zincir parça üretmedi"; }
        lineClose();
        if (LPATH){ okAll = false; msg += " kapatma bitirmedi"; }
        UI.lineMode = false;
        if (okAll){ out.push({ad:"Çizgi zinciri (tıkla-tıkla + kapat)", ok:true}); okN++; }
        else { out.push({ad:"Çizgi zinciri", ok:false, msg:msg}); badN++; }
      } catch(e){ out.push({ad:"Çizgi zinciri", ok:false, msg:e.message}); badN++; UI.lineMode = false; LPATH = null; }
      try {
        var n0 = P.lines.length;
        P.lines.push({ id:uid("l"), name:"W1", kind:"cizgi", from:0, to:null, free:{x1:0,y1:0,x2:2,y2:0} });
        P.lines.push({ id:uid("l"), name:"W2", kind:"cizgi", from:0, to:null, free:{x1:2.08,y1:0.06,x2:4,y2:0} });
        UI.selSet = [];
        var nw2 = weldEnds(0.25);
        var a1 = P.lines[P.lines.length-2].free, a2 = P.lines[P.lines.length-1].free;
        var gap = Math.hypot(a1.x2-a2.x1, a1.y2-a2.y1);
        if (nw2 >= 2 && gap < 1e-9){ out.push({ad:"Uçları birleştir (kaynak)", ok:true}); okN++; }
        else { out.push({ad:"Uçları birleştir", ok:false, msg:"boşluk "+gap.toFixed(4)}); badN++; }
        P.lines.length = n0;
      } catch(e){ out.push({ad:"Uçları birleştir", ok:false, msg:e.message}); badN++; }
      try {
        var cc3 = constrainDir({x:0,y:0}, 3, 0.2, false);
        UI.ortho = true;
        var cO = constrainDir({x:0,y:0}, 3, 0.2, false);
        UI.ortho = false;
        if (Math.abs(cO.y) < 1e-9 && Math.abs(cO.x - Math.hypot(3,0.2)) < 1e-6){ out.push({ad:"ORTHO kısıtı", ok:true}); okN++; }
        else { out.push({ad:"ORTHO kısıtı", ok:false, msg:"y="+cO.y.toFixed(4)}); badN++; }
      } catch(e){ out.push({ad:"ORTHO kısıtı", ok:false, msg:e.message}); badN++; UI.ortho = false; }
    })();

/* tek tık yalnızca seçer — çift tıklamayı bozmamak için gecikmeli çalışır */
var CLKT = null;
function singleLater(fn){
  if (CLKT) clearTimeout(CLKT);
  CLKT = setTimeout(function(){ CLKT = null; fn(); }, 260);
}
function cancelSingle(){ if (CLKT){ clearTimeout(CLKT); CLKT = null; } }

/* planda tek tıklama: yalnız mobilya yerleştirme ve katman seçimi */
document.addEventListener("click", function(ev){
  if (!ev.target.closest) return;
  if ((CMD || Date.now() - CMDLOCK < 350) && ev.target.closest("#planbox")){
    ev.preventDefault(); ev.stopPropagation(); return;
  }
  var hl = ev.target.closest("[data-layer]");
  if (hl){ UI.selLayer = hl.getAttribute("data-layer"); render(); return; }
  var fp = ev.target.closest("[data-furnplace]");
  if (fp && UI.furnSel){
    var ptf = evtToSvg(ev);
    if (ptf){
      var mf = pxToM(ptf.x, ptf.y);
      var rf = addFurniture(UI.furnSel, mf.x, mf.y);
      if (rf){ UI.sel = rf.id; UI.selSet = [rf.id]; snap(addTxt("Mobilya", rf)); render(); }
    }
    return;
  }
}, true);

/* bir elemanın kendi aracıyla eklenip kaldırılması */
function toolToggleRow(list, row){
  var dir = row.dir, ln = pnum(row.line,0), sg = pnum(row.seg,0);
  if (list === "doors" || list === "windows") toggleOpening(list, dir, ln, sg);
  else if (list === "walls")      toggleWall(dir, ln, sg);
  else if (list === "shearwalls") togglePerde(dir, ln, sg);
  else if (list === "parapets")   togglePar(dir, ln, sg);
  else if (list === "balconies")  toggleBalcony(dir, ln, sg);
  else if (list === "beams")      toggleBeam(dir, ln, sg);
  else if (list === "openings")   toggleSlabOpening(pnum(row.cx,0), pnum(row.cy,0));
  else if (list === "stairs")     toggleStair(pnum(row.cx,0), pnum(row.cy,0));
  else if (list === "slabs")      toggleSlab(pnum(row.cx,0), pnum(row.cy,0));
  else if (list === "columns")    toggleColumn(pnum(row.ax,0), pnum(row.ay,0));
  else if (list === "furniture"){
    for (var i=P.furniture.length-1;i>=0;i--) if (P.furniture[i].id === row.id){ P.furniture.splice(i,1); break; }
    UI.selSet = []; UI.sel = null; snap("Silindi: "+row.name); render();
  }
  else return false;
  return true;
}

/* ÇİFT TIKLAMA = ekle / kaldır  (bütün yapı elemanları için) */
function planToggle(ev){
  var t = curTool();
  var hc = ev.target.closest("[data-cell]");
  if (hc){
    var cx = parseInt(hc.getAttribute("data-cx"),10), cy = parseInt(hc.getAttribute("data-cy"),10);
    if (t === "yirtik")        toggleSlabOpening(cx, cy);
    else if (t === "merdiven") toggleStair(cx, cy);
    else                       toggleSlab(cx, cy);
    return true;
  }
  var hs = ev.target.closest("[data-seg]");
  if (hs){
    var dir = hs.getAttribute("data-seg");
    var ln  = parseInt(hs.getAttribute("data-line"),10);
    var sg  = parseInt(hs.getAttribute("data-idx"),10);
    if (t === "duvar")        toggleWall(dir, ln, sg);
    else if (t === "kapi")    toggleOpening("doors", dir, ln, sg);
    else if (t === "pencere") toggleOpening("windows", dir, ln, sg);
    else if (t === "temel")   { if ((UI.foundSeg||"streifen") === "bag") toggleTieBeam(dir, ln, sg); else toggleFoundStrip(dir, ln, sg); }
    else if (t === "balkon")  toggleBalcony(dir, ln, sg);
    else if (t === "perde")   togglePerde(dir, ln, sg);
    else if (t === "parapet") togglePar(dir, ln, sg);
    else                      toggleBeam(dir, ln, sg);
    return true;
  }
  var hn = ev.target.closest("[data-node]");
  if (hn){
    var ax = parseInt(hn.getAttribute("data-ax"),10), ay = parseInt(hn.getAttribute("data-ay"),10);
    if (t === "temel") toggleFoundNode(ax, ay); else toggleColumn(ax, ay);
    return true;
  }
  /* perde: boş alana çift tıkla → en yakın aks */
  var hp = ev.target.closest("[data-perdeplace]");
  if (hp && t === "perde"){
    var pp = evtToSvg(ev); if (!pp) return false;
    var mp = pxToM(pp.x, pp.y);
    var a = nearestAxisSeg(mp.x, mp.y);
    if (!a){ flash("Önce aks tanımla"); return true; }
    togglePerde(a.dir, a.line, a.seg);
    return true;
  }
  /* mimaride eleman tutamağı: çift tıkla → kaldır */
  var hm = ev.target.closest("[data-mdrag]");
  if (hm){
    var e = elById(hm.getAttribute("data-id"));
    if (e) return toolToggleRow(e.list, e.row);
  }
  /* planda çizilmiş elemanın kendisi */
  var he = ev.target.closest("[data-el]");
  if (he){
    var e2 = elById(he.getAttribute("data-el"));
    if (e2 && TOOLLIST[t] === e2.list) return toolToggleRow(e2.list, e2.row);
  }
  return false;
}

}, true);

  }
  var e = elById(id); if (!e) return "";
  var r = e.row, L = e.list, out = [], foot = "";
  var head = '<div class="th"><span class="tn">'+esc(r.name)+'</span><span class="tk">'+e.label+'</span></div>';

  if (L === "shearwalls"){
    var pc = perdeCalc(r);
    return head +
      row("Uzunluk l", fmt(pc.L,2)+" m") +
      row("Kalınlık d", fmt(pc.t*100,0)+" cm") +
      row("Doğrultu", pc.ax.toUpperCase()) +
      row("Beton", esc(r.mat)) +
      row("Tutulma", r.braced === false ? "serbest duran" : "üst/alt tutulu") +
      row("N_Ed", fmt(pc.NEd,0)+" kN") +
      row("λ / λ_lim", fmt(pc.lam,0)+" / "+fmt(pc.lamLim,0)) +
      row("N_Rd", fmt(pc.NRd,0)+" kN  (η "+fmt(pc.etaN,2)+")") +
      row("V_Ed / V_Rd,c", fmt(pc.VEd,0)+" / "+fmt(pc.VRdc,0)+" kN") +
      row("M_Ed taban", fmt(pc.MEd,0)+" kNm") +
      row("a_s,v min", fmt(pc.asV,1)+" cm²") +
      '<div class="tf">'+stLabel(r)+' · '+(pc.ok ? "ön tasarım yeterli" : "kesit yetersiz")+'</div>';
  }
  if (L === "columns"){
    var A = r.form==="circle" ? Math.PI*r.d*r.d/4 : r.b*r.h;
    var hh = 0; for (var i=pnum(r.from,0); i<=Math.min(pnum(r.to,0), P.storeys.length-1); i++) hh += P.storeys[i].h;
    var N = colLoad(pnum(r.ax,0), pnum(r.ay,0));
    out.push(row("Kesit", r.form==="circle" ? ("Ø "+fmt(r.d*100,0)+" cm") : (fmt(r.b*100,0)+" / "+fmt(r.h*100,0)+" cm")));
    out.push(row("Alan A", fmt(A*1e4,0)+" cm²"));
    out.push(row("Konum", "aks "+AX[pnum(r.ax,0)]+(pnum(r.ay,0)+1)));
    out.push(row("Katlar", (P.storeys[pnum(r.from,0)]||{}).name+" → "+(P.storeys[pnum(r.to,0)]||{}).name));
    out.push(row("Yükseklik", fmt(hh,2)+" m"));
    out.push(row("Malzeme", r.mat));
    out.push(row("Beton hacmi", fmt(A*hh,2)+" m³"));
    out.push(row("N_Ed ≈", fmt(N,0)+" kN"));
    out.push(row("σ_c ≈", fmt(N/Math.max(A,.001)/1000,1)+" MN/m²"));
  } else if (L === "beams"){
    var Lb = beamL(r), d0 = DERIVED || derive();
    var M = d0.qLine*Lb*Lb/8, V = d0.qLine*Lb/2;
    out.push(row("Kesit b/h", fmt(r.b*100,0)+" / "+fmt(r.h*100,0)+" cm"));
    out.push(row("Açıklık L", fmt(Lb,2)+" m"));
    out.push(row("Konum", segLabel(r.dir, pnum(r.line,0), pnum(r.seg,0))));
    out.push(row("Sistem", r.sys));
    out.push(row("Malzeme", r.mat));
    out.push(row("W_y", fmt(r.b*r.h*r.h/6*1e6,0)+" cm³"));
    out.push(row("Öz ağırlık", fmt(r.b*r.h*25,2)+" kN/m"));
    out.push(row("M_Ed ≈", fmt(M,1)+" kNm"));
    out.push(row("V_Ed ≈", fmt(V,1)+" kN"));
    out.push(row("L/h", fmt(Lb/Math.max(r.h,.01),1)));
  } else if (L === "walls"){
    var per = isPerimeter(r.dir, pnum(r.line,0));
    var g = (r.dir === "x" ? P.grid.x[pnum(r.seg,0)] : P.grid.y[pnum(r.seg,0)]) || 0;
    var hS = (P.storeys[0]||{h:3.1}).h;
    out.push(row("Kalınlık", fmt(r.t*100,1)+" cm"));
    out.push(row("Uzunluk", fmt(g,2)+" m"));
    out.push(row("Konum", segLabel(r.dir, pnum(r.line,0), pnum(r.seg,0))));
    out.push(row("Tür", per ? "Dış duvar" : "İç duvar"));
    out.push(row("Taşıyıcı", r.kind === "tragend" ? "evet" : "hayır"));
    out.push(row("Malzeme", r.mat));
    out.push(row("Yüzey (1 kat)", fmt(g*hS,2)+" m²"));
    out.push(row("Hacim (1 kat)", fmt(g*hS*r.t,2)+" m³"));
    var nOp = P.doors.concat(P.windows).filter(function(x){
      return x.dir===r.dir && pnum(x.line,-1)===pnum(r.line,0) && pnum(x.seg,-1)===pnum(r.seg,0); }).length;
    out.push(row("Üzerinde boşluk", nOp ? (nOp+" adet") : "yok"));
  } else if (L === "slabs"){
    var ci = pnum(r.cx,0), cj = pnum(r.cy,0);
    var lx = P.grid.x[ci]||0, ly = P.grid.y[cj]||0;
    var op = P.openings.filter(function(x){ return pnum(x.cx,-1)===ci && pnum(x.cy,-1)===cj; });
    var aOp = op.reduce(function(a,x){ return a + x.w*x.l; }, 0);
    out.push(row("Kalınlık", fmt(r.t*100,1)+" cm"));
    out.push(row("Göz", fmt(lx,2)+" × "+fmt(ly,2)+" m"));

    out.push(row("Taşıma", r.kind));
    out.push(row("Kenar oranı", fmt(Math.max(lx,ly)/Math.max(Math.min(lx,ly),.01),2)));
    out.push(row("g₁ öz ağırlık", fmt(r.t*25,2)+" kN/m²"));
    out.push(row("Malzeme", r.mat));
    out.push(row("L/d", fmt(Math.min(lx,ly)/Math.max(r.t,.01),0)));

  } else if (L === "doors" || L === "windows"){

  } else if (L === "openings"){

    out.push(row("Offset", fmt(r.ox,2)+" / "+fmt(r.oy,2)+" m"));
    var sl = P.slabs[findSlab(pnum(r.cx,0), pnum(r.cy,0))];
    if (sl) out.push(row("Döşeme", sl.name+" · "+fmt(sl.t*100,1)+" cm"));
  } else if (L === "stairs"){
    var c = stairCalc(r);
    out.push(row("Tip", stairLabel(r.type)));
    out.push(row("Kat yüksekliği", fmt(c.h,2)+" m"));
    out.push(row("Rıht", c.n+" × "+fmt(c.rAct*100,1)+" cm"));
    out.push(row("Basamak", fmt(r.tread*100,0)+" cm"));
    out.push(row("Kol genişliği", fmt(r.w*100,0)+" cm"));
    out.push(row("Schrittmaß", fmt(c.schritt*100,1)+" cm"));
    out.push(row("Eğim s/a", fmt(c.steig,2)));
    out.push(row("Kol uzunluğu", fmt(c.runLen,2)+" m"));
    out.push(row("Malzeme", r.mat));
    foot = (c.okSchritt && c.okRiser && c.okTread && c.okWidth)
      ? "Tüm kontroller uygun" : "Uyarı: Schrittmaß / ölçü sınırları dışında";
  } else if (L === "balconies"){
    var bc = balkCalc(r);
    out.push(row("Tip", balkLabel(r.type)));
    out.push(row("Çıkma l", fmt(r.depth,2)+" m"));
    out.push(row("Genişlik", fmt(r.w,2)+" m"));
    out.push(row("Alan", fmt(bc.area,2)+" m²"));
    out.push(row("Kalınlık t", fmt(r.t*100,1)+" cm"));
    out.push(row("t_min = l/22", fmt(bc.tMin*100,1)+" cm"));
    out.push(row("Korkuluk", fmt(r.rail*100,0)+" cm"));
    out.push(row("Konum", segLabel(r.dir, pnum(r.line,0), pnum(r.seg,0))));
    out.push(row("q_d", fmt(bc.qd,2)+" kN/m²"));
    out.push(row("m_Ed konsol", fmt(bc.m,1)+" kNm/m"));
    out.push(row("v_Ed", fmt(bc.v,1)+" kN/m"));
    out.push(row("Malzeme", r.mat));
    foot = (bc.okT && bc.okRail) ? "Kalınlık ve korkuluk uygun" : "Uyarı: t < l/22 veya korkuluk < 100 cm";
  } else if (L === "foundations"){
    out.push(row("Tip", foundLabel(r.kind)));
    if (r.kind === "platte"){
      out.push(row("Kalınlık", fmt(r.d*100,0)+" cm"));
      out.push(row("Alan", fmt((DERIVED||derive()).W*(DERIVED||derive()).D,1)+" m²"));
      out.push(row("Beton", fmt(r.d*(DERIVED||derive()).W*(DERIVED||derive()).D,1)+" m³"));
    } else if (r.kind === "streifen"){
      var Ls = (r.dir==="x" ? P.grid.x[pnum(r.seg,0)] : P.grid.y[pnum(r.seg,0)]) || 0;
      var nl = wallLoad(r.dir, pnum(r.line,0), pnum(r.seg,0));
      out.push(row("Genişlik b", fmt(r.a,2)+" m"));
      out.push(row("Yükseklik d", fmt(r.d,2)+" m"));
      out.push(row("Uzunluk", fmt(Ls,2)+" m"));
      out.push(row("n_Ed ≈", fmt(nl,0)+" kN/m"));
      out.push(row("σ", fmt(nl/Math.max(r.a,.01),0)+" / "+fmt(P.soil.sigZul,0)+" kN/m²"));
      out.push(row("Beton", fmt(r.a*r.d*Ls,2)+" m³"));
      foot = (nl/Math.max(r.a,.01) <= P.soil.sigZul) ? "Zemin gerilmesi uygun" : "σ aşıldı — genişlet";
    } else {
      var Nf = colLoad(pnum(r.ax,0), pnum(r.ay,0));
      var sg = Nf/Math.max(r.a*r.b,.01);
      out.push(row("Ölçü", fmt(r.a,2)+" × "+fmt(r.b,2)+" × "+fmt(r.d,2)+" m"));
      out.push(row("Konum", "aks "+AX[pnum(r.ax,0)]+(pnum(r.ay,0)+1)));
      out.push(row("Yük alanı", fmt(tribArea(pnum(r.ax,0),pnum(r.ay,0)).A,2)+" m²"));
      out.push(row("N_Ed ≈", fmt(Nf,0)+" kN"));
      out.push(row("σ", fmt(sg,0)+" / "+fmt(P.soil.sigZul,0)+" kN/m²"));
      out.push(row("Derinlik", fmt(r.t,2)+" m"));
      if (r.kind === "pfahl"){
        out.push(row("Kazık", r.nPiles+" × Ø"+fmt(r.pileD*100,0)+" cm"));
        out.push(row("Kazık boyu", fmt(r.pileL,2)+" m"));
      }
      out.push(row("Beton", fmt(r.a*r.b*r.d,2)+" m³"));
      foot = (sg <= P.soil.sigZul) ? "Zemin gerilmesi uygun" : "σ aşıldı — büyüt";
    }
  }
  return head + out.join("") + (foot ? '<div class="tf">'+esc(foot)+'</div>' : "");
}
var TIPID = null;
document.addEventListener("mousemove", function(ev){
  var tip = document.getElementById("tip");
  if (!tip) return;
  if (DDRAG || CMD || CTX){ tip.style.display = "none"; TIPID = null; return; }
  var host = ev.target.closest ? ev.target.closest("[data-el]") : null;
  var id = host ? host.getAttribute("data-el") : null;
  /* şeffaf yerleştirme katmanı üstteyse geometrik olarak bul */
  if (!id && ev.target.closest && ev.target.closest("[data-perdeplace],[data-furnplace]")){
    var ptT = evtToSvg(ev);
    if (ptT && LASTG) id = pickAt(ptT.x, ptT.y);
  }
  if (!id){ if (TIPID){ TIPID = null; tip.style.display = "none"; } return; }
  if (id !== TIPID){
    var html = tipHTML(id);
    if (!html){ TIPID = null; tip.style.display = "none"; return; }
    TIPID = id; tip.innerHTML = html; tip.style.display = "block";
  }
  var w = tip.offsetWidth || 280, h = tip.offsetHeight || 160;
  var x = ev.clientX + 16, y = ev.clientY + 16;
  if (x + w > window.innerWidth - 8)  x = ev.clientX - w - 16;
  if (y + h > window.innerHeight - 8) y = Math.max(8, ev.clientY - h - 16);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

    var fr = freeze(MDRAG.list, MDRAG.row, LASTG.G);

            start:MDRAG.start, m0:MDRAG.m0, moved:true };
